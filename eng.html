<script>
const DATA = {"chapters": [{"id": "e-c1", "title": "第一章 Lesson 1-24：入门核心（be 动词 · 冠词 · 代词）", "sections": [{"id": "e-c1-s1", "title": "第一节 Lesson 1-6：be 动词 · 一般疑问句 · 物主代词 · 国籍", "notes": [{"point": "be 动词三兄弟 am / is / are 怎么选", "explain": "be 动词跟着主语走：主语是 I 用 am；主语是 he / she / it 或单数名词用 is；主语是 you / we / they 或复数名词用 are。口诀：“我用 am，你用 are，is 连着他她它，单数 is，复数 are。”", "examples": [{"tag": "基础", "text": "I <b>am<\/b> a student. / This <b>is<\/b> my pen. / These <b>are<\/b> my books. —— 三种人称各对应一个 be 动词，一一对上就不会错。"}, {"tag": "进阶", "text": "两个人并列作主语算复数：Tom and I <b>are<\/b> late.（不是 am）。但不可数名词算单数：The water <b>is<\/b> cold. / The news <b>is<\/b> good.（news 看着像复数，其实是不可数名词）"}, {"tag": "易错", "text": "“My trousers <u>is<\/u> blue.” ✗ —— trousers（裤子）、glasses（眼镜）、shoes（鞋）这类成对出现的东西天生是复数，必须用 are：My trousers <b>are<\/b> blue. ✓ 判断 be 动词要看主语的“数”，不要被中文的“一条裤子”带偏。"}], "think": "课本第一课是 “Excuse me, is this your handbag?” —— 如果把 handbag 换成 shoes，整句话有几个地方要改？为什么改一个词会牵动这么多地方？"}, {"point": "一般疑问句：把 be 动词提到句首", "explain": "含 be 动词的陈述句变一般疑问句，只要把 be 动词提到主语前面，句末改问号，首字母大写。回答用 Yes, 主语 + be. / No, 主语 + be + not.", "examples": [{"tag": "基础", "text": "This is your book. → <b>Is<\/b> this your book? ／ You are Chinese. → <b>Are<\/b> you Chinese?"}, {"tag": "进阶", "text": "简答时主语要换成代词：Is this your coat? → Yes, <b>it<\/b> is.（不说 Yes, this is.）；Are you a teacher? → Yes, <b>I<\/b> am.（不说 Yes, you are.）—— 对方问“你”，你要答“我”。"}, {"tag": "易错", "text": "肯定简答里的 be 动词<b>不能缩写<\/b>：Yes, it is. ✓ ／ Yes, it’s. ✗ ／ Yes, I am. ✓ ／ Yes, I’m. ✗ 但否定简答两种缩写都行：No, it isn’t. ＝ No, it’s not."}], "think": "为什么 “Yes, I’m.” 是错的，“Yes, I am.” 就对？（提示：想想这句话说出来时，重音落在哪个词上，缩写以后那个词还能重读吗？）"}, {"point": "形容词性物主代词 my / your —— 名词前的“谁的”", "explain": "my / your / his / her / its / our / their 叫形容词性物主代词，作用相当于形容词，后面<b>必须跟名词<\/b>，不能单独站着。", "examples": [{"tag": "基础", "text": "my book（我的书）、your pen（你的笔）、her bag（她的包）—— 后面都拖着一个名词。"}, {"tag": "进阶", "text": "物主代词和冠词 a / an / the 不能同时出现在一个名词前面：“<u>a my<\/u> book” ✗ → my book ✓，如果一定要表达“我的一本书”，要说 <b>a book of mine<\/b>。"}, {"tag": "易错", "text": "your（你的）和 you’re（you are）读音一模一样，写的时候最容易混。“<u>Your<\/u> late again!” ✗ 这里要表达“你迟到了”，是 you are 的缩写 → <b>You’re<\/b> late again! ✓ 判断方法：能还原成 you are 的就写 you’re。"}], "think": "中文里“我的书”和“书是我的”用的都是“我的”这两个字，英语却要分成 my book 和 It’s mine，你觉得英语这样分有什么好处？"}, {"point": "国籍形容词与国名不是一回事", "explain": "国名是名词（China），国籍形容词表示“……国的 / ……国人”（Chinese）。说国籍用 I’m + 国籍形容词；说来自哪里用 I’m from + 国名。两者不能混用。", "examples": [{"tag": "基础", "text": "China→Chinese，France→French，Germany→German，Japan→Japanese，Italy→Italian，America→American，England→English，Korea→Korean，Russia→Russian，Sweden→Swedish。"}, {"tag": "进阶", "text": "国名和国籍形容词的首字母<b>永远大写<\/b>，哪怕它出现在句子中间：He is a <b>Japanese<\/b> student.（不能写成 japanese）"}, {"tag": "易错", "text": "两个方向都会错：“I’m from <u>Chinese<\/u>.” ✗（from 后面要跟国名 China）；“I’m <u>China<\/u>.” ✗（是“我是中国”的意思，要跟国籍形容词 Chinese）。记法：<b>from 后面跟地方，be 后面跟身份<\/b>。"}], "think": "Lesson 5 里 Robert 说 “I’m Italian.”，Sophie 说 “I’m French.” —— 如果要把 Robert 那句改成“我来自意大利”，句子里有几个词要变？"}, {"point": "This is... 介绍句型与 Nice to meet you", "explain": "把第三个人介绍给别人时，英语的固定说法是 <b>This is + 姓名<\/b>，不用 He is / She is。对方回应 Nice to meet you.，你答 Nice to meet you, too.", "examples": [{"tag": "基础", "text": "在班上介绍新同学：<b>This is<\/b> Lucy. — Nice to meet you, Lucy. — Nice to meet you, too."}, {"tag": "进阶", "text": "打电话报自己名字，英语也用 This is，不用 I am：“Hello, <b>this is<\/b> Tom speaking.” 问对方是谁则用 “Who’s <b>that<\/b>?”（近处的自己用 this，远处的对方用 that）"}, {"tag": "易错", "text": "“He is my friend Tom.” 这句<b>语法完全正确<\/b>，但作为“当面介绍”不地道 —— 当着 Tom 的面用 he 指他，听起来像在背后谈论他。正式介绍固定用 This is Tom. 这是习惯问题，不是对错问题，别把它当成语法错误。"}], "think": "打电话时中文说“我是小明”，英语却说 “This is Xiaoming.” —— 你觉得英语在这里为什么不用 I am？（提示：想想对方此刻看不见你，他需要先确认的是“哪个人在说话”还是“你是谁”？）"}], "quiz": [{"id": 1, "type": "multi", "point": "be 动词与主语的数（想一想·刁钻）", "stem": "下列句子中，be 动词用得<b>正确<\/b>的有（　）【多选】", "options": ["A. My trousers are new.", "B. Tom and I am students.", "C. The news are good.", "D. These shoes are yours.", "E. My family is big."], "answer": ["A", "D", "E"], "explain": "A 对：trousers 天生复数用 are。B 错：Tom and I 是两个人，是复数，要用 are。C 错：news 看起来带 s，其实是<b>不可数名词<\/b>，当单数用 is。D 对：shoes 是复数。E 对：family 作为“一个整体”时当单数，用 is。这题专门测“看起来像复数”和“真的是复数”的区别。"}, {"id": 2, "type": "choice", "point": "一般疑问句的简答", "stem": "—Is this your umbrella?　—____", "options": ["A. Yes, this is.", "B. Yes, it is.", "C. Yes, it’s.", "D. Yes, that is."], "answer": "B", "explain": "简答时主语要换成代词 it，不能重复 this / that，所以 A、D 排除；肯定简答的 be 动词不能缩写，所以 C 错。正确答案是 Yes, it is."}, {"id": 3, "type": "multi", "point": "简答的缩写规则（想一想·辨析）", "stem": "关于 be 动词的简略回答，下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. 肯定简答里的 be 动词不能缩写", "B. No, it isn’t. 和 No, it’s not. 都是正确的", "C. Is this your book? 应答 Yes, this is.", "D. Are you students? 应答 Yes, we are.", "E. 肯定简答不能缩写，是因为句末的 be 动词要重读"], "answer": ["A", "B", "D", "E"], "explain": "C 错：简答要用代词 it，不能用 this。其余都对 —— 特别是 E，这正是不能缩写的真正原因：缩写形式（’m / ’s / ’re）读音很轻，没法承担句末的重音。"}, {"id": 4, "type": "fill", "point": "陈述句变一般疑问句", "stem": "把 These are my books. 改成一般疑问句：______ these your books?（填一个词）", "answer": ["Are"], "explain": "含 be 动词的句子变疑问句，把 be 动词提到句首即可。主语 these 是复数，所以用 Are。"}, {"id": 5, "type": "choice", "point": "your 与 you’re 辨析（易错）", "stem": "____ late again! ____ homework is still on my desk.", "options": ["A. You’re; Your", "B. Your; You’re", "C. You’re; You’re", "D. Your; Your"], "answer": "A", "explain": "第一空要表达“你迟到了”，能还原成 You are，所以用 You’re；第二空后面跟着名词 homework，要用形容词性物主代词 Your。判断诀窍：<b>能还原成 you are 的写 you’re，后面跟名词的写 your<\/b>。"}, {"id": 6, "type": "multi", "point": "my 与 mine 的分工（想一想·辨析）", "stem": "关于 my 和 mine，下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. my 后面必须跟名词", "B. mine 后面不能再跟名词", "C. “a my book”是错误的说法", "D. This book is mine. 和 This is my book. 意思相同", "E. mine 可以放在名词前面作定语"], "answer": ["A", "B", "C", "D"], "explain": "E 错：mine 是名词性物主代词，本身已经等于“我的+名词”，不能再放到名词前面（mine book ✗）。A、B、C、D 都对，其中 C 是因为冠词和物主代词不能同时修饰一个名词，要说 a book of mine。"}, {"id": 7, "type": "choice", "point": "国名与国籍形容词", "stem": "—Where are you from?　—I’m from ____ . I’m ____ .", "options": ["A. Japanese; Japan", "B. Japanese; Japanese", "C. Japan; Japan", "D. Japan; Japanese"], "answer": "D", "explain": "from 后面跟<b>国名<\/b>（Japan），be 后面跟<b>国籍形容词<\/b>（Japanese）。记法：from 后面跟地方，be 后面跟身份。"}, {"id": 8, "type": "judge", "point": "国籍形容词大小写", "stem": "国籍形容词（如 chinese、french）只要不在句首，首字母就可以小写。", "answer": "错", "explain": "错。国名和国籍形容词属于专有名词，<b>无论出现在句子什么位置，首字母都必须大写<\/b>：He is a Chinese student. 这是英语里少数“位置不影响大小写”的词类之一。"}, {"id": 9, "type": "fill", "point": "国籍形容词拼写", "stem": "France 对应的国籍形容词是 ______", "answer": ["French"], "explain": "France（法国，国名）→ French（法国的／法国人）。注意它不是在国名后面加后缀，而是整个换了一个词，属于要单独记的一类。"}, {"id": 10, "type": "multi", "point": "自我介绍的正误（想一想·刁钻）", "stem": "下列自我介绍中，<b>没有语病<\/b>的有（　）【多选】", "options": ["A. I’m China.", "B. I’m Chinese.", "C. I come from China.", "D. I’m from Chinese.", "E. I’m a Chinese student."], "answer": ["B", "C", "E"], "explain": "A 错：意思变成“我是中国（这个国家）”。D 错：from 后面要跟国名 China。B、C 都对，是最常见的两种说法；E 对，Chinese 在这里作定语修饰 student。这题的陷阱在于 A 和 D 分别踩了“该用形容词却用国名”和“该用国名却用形容词”两个相反的坑。"}, {"id": 11, "type": "choice", "point": "This is 介绍句型", "stem": "在班上把新同学 Lucy 介绍给大家，最合适的说法是（　）", "options": ["A. She is Lucy.", "B. This is Lucy.", "C. That is Lucy.", "D. It is Lucy."], "answer": "B", "explain": "当面介绍第三个人，英语的固定说法是 This is + 姓名。A 语法没错但当着本人的面用 she 不礼貌；C 的 that 指远处，介绍身边的人不合适；D 的 it 不能指人。"}, {"id": 12, "type": "multi", "point": "This is 的用法边界（想一想·刁钻）", "stem": "关于 This is... 这个句型，下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. 当面介绍别人时用 This is + 姓名", "B. 打电话报自己的名字用 This is..., 不用 I am...", "C. This is 只能指物，不能指人", "D. 接电话问对方是谁可以说 Who’s that?", "E. 介绍别人时说 He is my friend Tom. 是语法错误"], "answer": ["A", "B", "D"], "explain": "C 错：This is 完全可以指人，介绍句型正是最典型的用法。E 是这题最容易上当的选项 —— He is my friend Tom. <b>语法上完全正确<\/b>，只是当面介绍时不够礼貌、不地道，属于“习惯用法”问题，不能说成“语法错误”。要能分清<b>语法错误<\/b>和<b>不地道<\/b>是两回事。"}]}, {"id": "e-c1-s2", "title": "第二节 Lesson 7-12：冠词 a/an · 职业 · Whose 与名词所有格", "notes": [{"point": "不定冠词 a / an —— 看读音，不看字母", "explain": "a 用在<b>辅音音素<\/b>开头的单词前，an 用在<b>元音音素<\/b>开头的单词前。判断标准是这个词<b>读起来<\/b>的第一个音，不是拼写的第一个字母。", "examples": [{"tag": "基础", "text": "a book / a pen / a car（辅音开头）　an apple / an egg / an orange / an umbrella（元音开头）"}, {"tag": "进阶", "text": "两类“表里不一”的词要单独记：<b>an<\/b> hour、<b>an<\/b> honest man（h 不发音，实际以元音开头）；<b>a<\/b> university、<b>a<\/b> useful book、<b>a<\/b> European country（拼写是 u，但读音是 /j/，是辅音）。"}, {"tag": "易错", "text": "“<u>an<\/u> useful tool” ✗ —— useful 读作 /ˈjuːsfl/，开头的 /j/ 是辅音，要用 a useful tool ✓。反过来 “<u>a<\/u> hour” ✗ —— hour 读 /ˈaʊə/，h 完全不发音，要用 an hour ✓。<b>凡是 u 和 h 开头的词，都要多想一秒读音。<\/b>"}], "think": "a 和 an 的区别到底是为了什么？试着连着快读 “a apple” 和 “an apple”，哪个更顺口？这能不能解释英语为什么要多造一个 an 出来？"}, {"point": "说职业，单数名词前必须加冠词", "explain": "表示某人的职业，单数可数名词前一定要加 a / an：I’m <b>a<\/b> teacher.（不能说 I’m teacher.）主语是复数时不加冠词：We are teachers.", "examples": [{"tag": "基础", "text": "He is <b>an<\/b> engineer. ／ She is <b>a<\/b> nurse. ／ They are <b>students<\/b>.（复数不加）"}, {"tag": "进阶", "text": "问职业的固定说法有两个：<b>What’s your job?<\/b> 和 <b>What do you do?<\/b>，回答都用 I’m a + 职业。"}, {"tag": "易错", "text": "“I am <u>teacher<\/u>.” ✗ 是最典型的中式英语 —— 中文说“我是老师”不用量词，直译过来就漏了冠词。英语规定：<b>单数可数名词前面不能光秃秃<\/b>，必须有 a / an / the / my 之类的限定词。"}], "think": "为什么英语非要说 “a teacher”（一个老师），中文却不用说“一个老师”？如果英语允许说 I’m teacher，会不会产生歧义？"}, {"point": "Whose 提问“谁的” + 名词所有格 ’s", "explain": "Whose 用来问东西属于谁，有两种语序：<b>Whose is this shirt?<\/b> ＝ <b>Whose shirt is this?<\/b> 回答用名词所有格：It’s Tim’s. 单数名词加 ’s；以 s 结尾的复数名词只加一个撇号。", "examples": [{"tag": "基础", "text": "Tim’s coat（蒂姆的外套）、my mother’s bag（我妈妈的包）、the dog’s tail（那条狗的尾巴）"}, {"tag": "进阶", "text": "复数所有格看结尾：the students<b>’<\/b> books（学生们的书，本来就有 s，只加撇号）；不规则复数没有 s，还是加 ’s：the children<b>’s<\/b> toys、the men<b>’s<\/b> room。"}, {"tag": "易错", "text": "whose（谁的）和 who’s（who is 的缩写）读音<b>完全相同<\/b>，是英语里最经典的同音陷阱。“<u>Who’s<\/u> book is this?” ✗ → <b>Whose<\/b> book is this? ✓ 判断方法：能还原成 who is 的才写 who’s。"}], "think": "the teacher’s books（一个老师的书）和 the teachers’ books（多个老师的书）读音一模一样，那么说话的时候，英语母语者要怎么让别人听懂到底是几个老师？"}, {"point": "形容词性 vs 名词性物主代词", "explain": "形容词性（my / your / his / her / its / our / their）后面<b>必须跟名词<\/b>；名词性（mine / yours / his / hers / ours / theirs）<b>单独使用<\/b>，本身等于“物主代词 + 名词”。", "examples": [{"tag": "基础", "text": "This is <b>my<\/b> pen. ＝ This pen is <b>mine<\/b>. 两句意思相同，但 my 后面拖着名词，mine 后面什么都不跟。"}, {"tag": "进阶", "text": "his 是个特例，<b>两种词性长得一样<\/b>：his book（形容词性）／ It’s his.（名词性）。而 its 几乎从不单独使用，实际上没有常用的名词性形式。"}, {"tag": "易错", "text": "her 和 hers 最容易混：“This bag is <u>her<\/u>.” ✗ —— 后面没有名词了，要用名词性的 <b>hers<\/b>：This bag is hers. ✓ 或者改写成 This is <b>her<\/b> bag. ✓ 两种都对，但不能混着用。"}], "think": "英语里 he 变成 his、she 变成 hers，那为什么 his 不用再变成 “hiss”？这会不会造成理解上的麻烦？"}, {"point": "职业词汇与它们的复数", "explain": "新概念第一册的核心职业词：engineer（工程师）、nurse（护士）、mechanic（机械师）、keyboard operator（键盘操作员）、policeman / policewoman（警察）、taxi driver（出租车司机）、air hostess（空姐）、hairdresser（理发师）、housewife（家庭主妇）、milkman（送奶工）、postman（邮递员）、shop assistant（店员）。", "examples": [{"tag": "基础", "text": "—What’s your job?　—I’m <b>a nurse<\/b>.　—What’s his job?　—He’s <b>a mechanic<\/b>."}, {"tag": "进阶", "text": "复数变化要注意：policeman→police<b>men<\/b>、postman→post<b>men<\/b>（man 变 men）；housewife→housewi<b>ves<\/b>（fe 变 ves）；air hostess→air hostess<b>es<\/b>（ss 结尾加 es）。"}, {"tag": "易错", "text": "由 man / woman 构成的复合职业名词，变复数时<b>前后两个词都要变<\/b>：woman doctor → <b>women doctors<\/b>（不是 woman doctors）；man teacher → <b>men teachers<\/b>。这是英语里唯一“一个名词变两处”的情况。"}], "think": "课本里的 air hostess（空姐）现在更常说成 flight attendant（乘务员）。你能想到这个变化是为了解决什么问题吗？policeman 是不是也有同样的处境？"}], "quiz": [{"id": 1, "type": "choice", "point": "a / an 看读音（易错）", "stem": "____ hour later, ____ honest man came in with ____ umbrella.", "options": ["A. An; a; an", "B. A; an; a", "C. An; an; an", "D. A; a; an"], "answer": "C", "explain": "三个词都以元音音素开头，所以全部用 an：hour 的 h 不发音（/ˈaʊə/）、honest 的 h 也不发音（/ˈɒnɪst/）、umbrella 本身就是元音开头。这题专门测“不看字母看读音”。"}, {"id": 2, "type": "multi", "point": "a / an 的判断标准（想一想·刁钻）", "stem": "下列 a / an 的用法<b>正确<\/b>的有（　）【多选】", "options": ["A. an hour", "B. a university", "C. an useful tool", "D. a European country", "E. an honest boy"], "answer": ["A", "B", "D", "E"], "explain": "C 错：useful 读作 /ˈjuːsfl/，开头的 /j/ 是<b>辅音<\/b>，要用 a useful tool。B、D 同理，university 和 European 都读 /j/ 开头，用 a。A、E 的 h 都不发音，实际是元音开头，用 an。记住：<b>u 开头常常是辅音，h 开头有时是元音<\/b>，正好都跟直觉相反。"}, {"id": 3, "type": "fill", "point": "冠词选择", "stem": "填 a 或 an：She is ______ engineer.", "answer": ["an"], "explain": "engineer 读作 /ˌendʒɪˈnɪə/，以元音音素 /e/ 开头，所以用 an。"}, {"id": 4, "type": "choice", "point": "职业前的冠词（中式英语陷阱）", "stem": "—What’s your job?　—____", "options": ["A. I’m teacher.", "B. I’m a teacher.", "C. I teacher.", "D. My job is teacher."], "answer": "B", "explain": "单数可数名词前不能光秃秃，必须加冠词，所以 A、D 都缺 a；C 连 be 动词都漏了。正确说法是 I’m a teacher."}, {"id": 5, "type": "multi", "point": "职业表达（想一想·辨析）", "stem": "关于用英语说职业，下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. 单数职业名词前要加 a / an", "B. 复数职业名词前不加 a / an", "C. “I’m teacher.” 是正确的英语", "D. What’s your job? 可以换成 What do you do?", "E. “我们是学生”应该说 We are students."], "answer": ["A", "B", "D", "E"], "explain": "C 错：漏了冠词，是最典型的中式英语。其余都对。特别注意 B 和 E 的呼应：单数要加冠词，复数反而不能加。"}, {"id": 6, "type": "choice", "point": "Whose 与 who’s 辨析（同音陷阱）", "stem": "____ bag is this? — It’s ____.", "options": ["A. Whose; Tom’s", "B. Who’s; Tom", "C. Who’s; Tom’s", "D. Whose; Tom"], "answer": "A", "explain": "第一空问“谁的包”，用 Whose（who’s 是 who is，代进去变成 “Who is bag is this?”，明显不通）；第二空回答“是汤姆的”，要用名词所有格 Tom’s，光说 Tom 意思变成“它是汤姆”。两个空一个测同音陷阱，一个测所有格。"}, {"id": 7, "type": "fill", "point": "形容词性变名词性物主代词", "stem": "把 It is her bag. 改成同义句：The bag is ______.", "answer": ["hers"], "explain": "改写后 bag 已经作主语，物主代词后面没有名词了，必须用名词性物主代词 hers。写成 her 是最常见的错误。"}, {"id": 8, "type": "judge", "point": "同音词的书面区分", "stem": "whose 和 who’s 读音相同，所以在书面语里可以互相替换。", "answer": "错", "explain": "错。读音相同不等于意思相同：whose 是“谁的”（疑问词／限定词），who’s 是 who is 的缩写。书面语中<b>绝对不能互换<\/b>。检验方法：能还原成 who is 就写 who’s，否则写 whose。"}, {"id": 9, "type": "multi", "point": "名词所有格规则（想一想·刁钻）", "stem": "关于名词所有格，下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. 单数名词加 ’s", "B. 以 s 结尾的复数名词只加一个撇号", "C. children 是不规则复数，所有格写成 children’s", "D. the teacher’s book 和 the teachers’ book 读音不同", "E. Whose book is this? 和 Whose is this book? 都正确"], "answer": ["A", "B", "C", "E"], "explain": "D 错，而且这正是这一节最值得注意的地方：the teacher’s 和 the teachers’ <b>读音完全相同<\/b>，只能靠上下文或改说 the book of the teachers 来区分。C 对：不规则复数没有 s 结尾，所以照常加 ’s。"}, {"id": 10, "type": "choice", "point": "her 与 hers", "stem": "This coat isn’t ____. ____ coat is blue.", "options": ["A. her; Hers", "B. her; Her", "C. hers; Hers", "D. hers; Her"], "answer": "D", "explain": "第一空后面没有名词（句子已经结束），用名词性的 hers；第二空后面跟着名词 coat，用形容词性的 Her。<b>看后面有没有名词<\/b>是唯一的判断依据。"}, {"id": 11, "type": "multi", "point": "物主代词两种词性（想一想·辨析）", "stem": "关于物主代词，下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. his 既可以放在名词前，也可以单独使用", "B. its 一般不单独使用", "C. “This is hers book.” 是正确的", "D. mine 相当于 my + 名词", "E. 形容词性物主代词后面必须跟名词"], "answer": ["A", "B", "D", "E"], "explain": "C 错：hers 已经含有名词的意思，后面不能再跟 book，应说 her book 或 It’s hers。A 对，his 是唯一两种词性同形的物主代词，这也是它容易被忽略的原因。"}, {"id": 12, "type": "multi", "point": "职业名词的复数（想一想·刁钻）", "stem": "下列职业名词的复数形式<b>正确<\/b>的有（　）【多选】", "options": ["A. policeman → policemen", "B. housewife → housewives", "C. woman doctor → woman doctors", "D. woman doctor → women doctors", "E. air hostess → air hostesses"], "answer": ["A", "B", "D", "E"], "explain": "C 错、D 对：由 man / woman 构成的复合名词变复数时，<b>前后两个词都要变<\/b>，所以是 women doctors。这是英语里独一份的规则，C 和 D 摆在一起就是为了让你必须想清楚才能选。"}]}, {"id": "e-c1-s3", "title": "第三节 Lesson 13-18：What colour · 名词单复数 · 复数句与形容词", "notes": [{"point": "What colour 问颜色", "explain": "问颜色的固定句型是 <b>What colour + be + 主语?<\/b> 主语单数用 is，复数用 are。回答 It’s blue. / They’re blue. colour 是英式拼写，美式写作 color，新概念用英式。", "examples": [{"tag": "基础", "text": "What colour <b>is<\/b> your car? — It’s red. ／ What colour <b>are<\/b> your shoes? — They’re black."}, {"tag": "进阶", "text": "同义说法：What’s <b>the colour of<\/b> your bag? 意思一样，但语序完全不同 —— 这时 colour 前面要加 the，后面用 of 连接。"}, {"tag": "易错", "text": "“What colour <u>your dress is<\/u>?” ✗ —— 特殊疑问句里，be 动词必须提到主语<b>前面<\/b>：What colour <b>is your dress<\/b>? ✓ 中文“你的裙子什么颜色”是“主语在前”，英语是“be 在前”，这个语序差别是所有特殊疑问句的通病。"}], "think": "中文问“你的裙子什么颜色？”，疑问词“什么颜色”跑到了句子中间；英语 What colour is your dress? 疑问词却一定在句首。你能总结出英语疑问词位置的规律吗？这条规律对 Whose、Which 也成立吗？"}, {"point": "名词复数的变化规则", "explain": "① 一般加 -s；② 以 s / x / ch / sh 结尾加 -es；③ 辅音字母 + y 结尾，变 y 为 i 再加 -es；④ 以 f / fe 结尾，多数变 f / fe 为 v 再加 -es；⑤ 一批不规则变化要单独记。", "examples": [{"tag": "基础", "text": "book→books、bus→bus<b>es<\/b>、box→box<b>es<\/b>、watch→watch<b>es<\/b>、dish→dish<b>es<\/b>"}, {"tag": "进阶", "text": "看 y 前面是什么：bab<b>y<\/b>→bab<b>ies<\/b>（辅音 b + y）但 bo<b>y<\/b>→bo<b>ys<\/b>（元音 o + y）。f/fe 类：knife→kni<b>ves<\/b>、wife→wi<b>ves<\/b>、leaf→lea<b>ves<\/b>。不规则：man→men、woman→women、child→children、foot→feet、tooth→teeth、mouse→mice。"}, {"tag": "易错", "text": "以 o 结尾的名词<b>不是一律加 es<\/b>：photo→photo<b>s<\/b>、piano→piano<b>s<\/b>、radio→radio<b>s<\/b>（加 s），但 tomato→tomato<b>es<\/b>、potato→potato<b>es<\/b>、hero→hero<b>es<\/b>（加 es）。口诀：“<b>英雄爱吃土豆西红柿<\/b>”（hero、potato、tomato 加 es），剩下的多半加 s。"}], "think": "sheep（绵羊）、fish（鱼）、Chinese（中国人）的单数和复数长得一模一样。你能想到这类词还有哪些？它们有什么共同点？（提示：想想它们在句子里靠什么来表示“几个”）"}, {"point": "复数句的 be 动词与简答", "explain": "主语是复数，be 动词用 are，简答用 <b>Yes, they are. / No, they aren’t.<\/b> 如果对方问的是 you（你们），要用 <b>we<\/b> 来回答。", "examples": [{"tag": "基础", "text": "Are these your books? — Yes, <b>they<\/b> are. ／ Are those your keys? — No, <b>they<\/b> aren’t."}, {"tag": "进阶", "text": "英语的 you 既是“你”也是“你们”，全靠上下文判断：Are you a student?（你）→ Yes, <b>I<\/b> am. ／ Are you students?（你们）→ Yes, <b>we<\/b> are. <b>看名词的单复数，就能反推 you 指几个人。<\/b>"}, {"tag": "易错", "text": "“Are these your keys? — Yes, <u>these<\/u> are.” ✗ —— 简答一律用人称代词，不能重复 this / that / these / those，要说 Yes, <b>they<\/b> are. ✓ 这跟单数时不能说 Yes, this is. 是同一条规则。"}], "think": "英语的 you 既是“你”又是“你们”，那么当有人对你说 “Are you ready?” 时，你怎么判断他是在问你一个人，还是在问你们全组？"}, {"point": "形容词的位置：定语在名词前，表语在 be 后", "explain": "形容词有两个位置：修饰名词时放在名词<b>前面<\/b>（作定语），描述主语状态时放在 be 动词<b>后面<\/b>（作表语）。英语的形容词<b>永远不变复数<\/b>。", "examples": [{"tag": "基础", "text": "a <b>red<\/b> car（定语，在名词前）／ The car is <b>red<\/b>.（表语，在 be 后）—— 同一个形容词，两个位置，意思相通。"}, {"tag": "进阶", "text": "有冠词时的固定语序是 <b>冠词 + 形容词 + 名词<\/b>：a beautiful girl ✓（不是 beautiful a girl）。变复数时冠词要去掉：a new dress → new dress<b>es<\/b>。"}, {"tag": "易错", "text": "“The dresses are <u>news<\/u>.” ✗ —— 形容词不跟着名词变复数，也不加 s：The dresses are <b>new<\/b>. ✓（顺便一提，news 是另一个词，意思是“新闻”，加了 s 意思就变了。）"}], "think": "英语的形容词不随名词变复数，但法语、西班牙语的形容词要跟着名词变。对学英语的人来说，这算是省事还是麻烦？如果英语也要变，你觉得会多出多少要背的东西？"}, {"point": "表示状态的形容词：tired / thirsty / hungry / hot / cold", "explain": "表达“我累了 / 渴了 / 饿了”，英语用 <b>be + 形容词<\/b>，不用动词。中文的“了”在英语里没有对应的词，状态本身就由 be + 形容词表示。", "examples": [{"tag": "基础", "text": "I’m <b>tired<\/b>.（我累了）／ I’m <b>thirsty<\/b>.（我渴了）／ She’s <b>cold<\/b>.（她冷）"}, {"tag": "进阶", "text": "加强语气用 very / so 放在形容词前：I’m <b>very<\/b> tired. ／ I’m <b>so<\/b> hungry. 注意 very 修饰的是形容词，不能修饰动词。"}, {"tag": "易错", "text": "两个方向都会错：“I <u>very<\/u> tired.” ✗ 漏了 be 动词 → I’m very tired. ✓；“I <u>have<\/u> hungry.” ✗ 用错了动词 → I’m hungry. ✓ 只要形容词作表语，前面就一定要有 be。"}], "think": "中文说“我热”和“天气热”都用同一个“热”字，英语却是 I’m hot. 和 It’s hot. —— 这两句在英语里的含义差别有多大？如果想说“天气很热”却说成 I’m hot.，别人会理解成什么？"}], "quiz": [{"id": 1, "type": "choice", "point": "What colour 的语序", "stem": "____ your new shoes? — They’re white.", "options": ["A. What colour is", "B. What colour are", "C. What is colour", "D. What are colour"], "answer": "B", "explain": "主语 shoes 是复数，be 动词用 are；疑问词 What colour 作为一个整体放句首，后面紧跟 be。C、D 把 colour 拆开了，语序错误。"}, {"id": 2, "type": "multi", "point": "特殊疑问句语序（想一想·刁钻）", "stem": "下列问句中<b>正确<\/b>的有（　）【多选】", "options": ["A. What colour is your bag?", "B. What colour your bag is?", "C. What colour are these socks?", "D. What’s the colour of your bag?", "E. What colour do your bag?"], "answer": ["A", "C", "D"], "explain": "B 错：特殊疑问句里 be 动词必须提到主语前面。E 错：句中有 be 动词就不能再用助动词 do。D 是另一种正确说法，注意它的结构完全不同：What’s <b>the colour of<\/b> + 名词，colour 前面要加 the。"}, {"id": 3, "type": "fill", "point": "以 o 结尾的名词复数", "stem": "photo 的复数形式是 ______", "answer": ["photos"], "explain": "photo 属于“加 s”的那一类（photos、pianos、radios）。只有 hero、potato、tomato 这几个常用词加 es，口诀是“英雄爱吃土豆西红柿”。"}, {"id": 4, "type": "choice", "point": "复数拼写综合（刁钻）", "stem": "下列复数形式<b>全部正确<\/b>的一组是（　）", "options": ["A. tomatos, knifes, childs", "B. tomatos, knives, children", "C. tomatoes, knifes, childrens", "D. tomatoes, knives, children"], "answer": "D", "explain": "tomato→tomato<b>es<\/b>（英雄爱吃土豆西红柿）；knife→kni<b>ves<\/b>（fe 变 ves）；child→child<b>ren<\/b>（不规则，且 children 本身已是复数，不能再加 s）。这题三个词各考一条规则，错一个就全错。"}, {"id": 5, "type": "multi", "point": "单复数同形的名词（想一想·辨析）", "stem": "关于名词的单复数，下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. sheep 单复数同形", "B. fish 表示“鱼的种类”时可以用 fishes", "C. Chinese 单复数同形", "D. baby 的复数是 babys", "E. Japanese 单复数同形"], "answer": ["A", "B", "C", "E"], "explain": "D 错：baby 是“辅音字母 b + y”结尾，要变 y 为 i 再加 es，写成 bab<b>ies<\/b>；boy 是“元音 o + y”，才直接加 s 写成 boys。B 是个容易被误判的知识点：fish 一般单复数同形，但强调“不同种类的鱼”时确实可以说 fishes。"}, {"id": 6, "type": "judge", "point": "以 o 结尾的复数规则", "stem": "以字母 o 结尾的名词，变复数时一律加 -es。", "answer": "错", "explain": "错。photo→photos、piano→pianos、radio→radios 都只加 s。只有 hero、potato、tomato 这一小批加 es。“一律”“都”“永远”这类绝对化的说法，在语法题里往往是错的信号。"}, {"id": 7, "type": "choice", "point": "you 的单复数与简答", "stem": "—Are you teachers?　—____", "options": ["A. Yes, you are.", "B. Yes, we are.", "C. Yes, they are.", "D. Yes, I am."], "answer": "B", "explain": "teachers 是复数，说明这里的 you 是“你们”，所以回答要用 we。如果问的是 Are you a teacher?（单数），才答 Yes, I am. <b>看名词的单复数就能判断 you 指几个人<\/b>，这是这一节最实用的技巧。"}, {"id": 8, "type": "multi", "point": "be 动词简答规则（想一想·辨析）", "stem": "关于 be 动词的简略回答，下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. Are these your books? 答 Yes, they are.", "B. Are these your books? 答 Yes, these are.", "C. Are you students? 可以答 Yes, we are.", "D. Are you a student? 答 Yes, I am.", "E. 简答的肯定形式不能缩写"], "answer": ["A", "C", "D", "E"], "explain": "B 错：简答一律用人称代词 they，不能重复指示代词 these。A 与 B 是一对，专门测这条规则；C 与 D 是一对，测 you 的单复数判断。"}, {"id": 9, "type": "fill", "point": "形容词作定语时的冠词", "stem": "补全“一条新裙子”：______ new dress（填一个词）", "answer": ["a"], "explain": "语序是<b>冠词 + 形容词 + 名词<\/b>，new 以辅音音素 /n/ 开头，所以用 a。注意冠词放在最前面，不能说 new a dress。"}, {"id": 10, "type": "choice", "point": "形容词位置与形态（易错）", "stem": "下列句子<b>没有错误<\/b>的是（　）", "options": ["A. The dresses are news.", "B. They are new dresses.", "C. They are dresses new.", "D. The dress is a new."], "answer": "B", "explain": "A 错：形容词不变复数，new 不能加 s（news 是“新闻”，另一个词）。C 错：形容词作定语要放名词<b>前面<\/b>。D 错：形容词作表语时前面不加冠词。只有 B 完全正确。"}, {"id": 11, "type": "multi", "point": "英语形容词的特点（想一想·辨析）", "stem": "关于英语的形容词，下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. 作定语时放在名词前面", "B. 作表语时放在 be 动词后面", "C. 形容词要像名词一样变复数", "D. a beautiful girl 的语序是正确的", "E. 形容词前面可以加 very 加强语气"], "answer": ["A", "B", "D", "E"], "explain": "C 错：这正是英语比法语、西班牙语省事的地方 —— 英语形容词<b>永远不变形<\/b>，不管前面的名词是单数还是复数。这也是中国学生反而容易多加一个 s 的原因。"}, {"id": 12, "type": "multi", "point": "be + 形容词表状态（想一想·刁钻）", "stem": "关于 “I’m hot.” 这句话，下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. 它表示“我觉得热”", "B. 描述天气热应该说 It’s hot.", "C. 表示“我累了”是 I’m tired.，不能说 I very tired.", "D. 表示“我渴了”可以说 I have thirsty.", "E. 中文的“了”在这类句子里，英语没有对应的词"], "answer": ["A", "B", "C", "E"], "explain": "D 错：have 是实义动词，后面不能直接跟形容词，应该说 I’m thirsty. 这题的关键是 A 和 B 的对比 —— 主语是人就是“人觉得热”，主语是 it 才是“天气热”，说错了含义会完全跑偏。"}]}, {"id": "e-c1-s4", "title": "第四节 Lesson 19-24：指示代词 · 人称代词宾格 · give sb sth · 祈使句", "notes": [{"point": "指示代词 this / that / these / those", "explain": "this（这个，近）的复数是 these（这些）；that（那个，远）的复数是 those（那些）。<b>近用 this/these，远用 that/those；单数用 this/that，复数用 these/those。<\/b>", "examples": [{"tag": "基础", "text": "This is a book. → <b>These are books.<\/b> ／ That is a car. → <b>Those are cars.<\/b>"}, {"tag": "进阶", "text": "由单数改复数要<b>三处同时改<\/b>：① 指示代词 this→these ② be 动词 is→are ③ 名词加复数，同时<b>去掉冠词 a / an<\/b>。例：This is a box. → These are boxes.（a 消失了，box 变 boxes）"}, {"tag": "易错", "text": "改复数最常见的是“只改一半”：“<u>These is<\/u> my books.” ✗（be 没改）／“These are <u>book<\/u>.” ✗（名词没改）／“These are <u>a<\/u> books.” ✗（冠词没去掉）。改一个词要牵动三个地方，动手前先在心里点一遍。"}], "think": "打电话时说 “This is Tom.” 用的也是 this，可是电话那头的人明明离你很远 —— 英语为什么不用 that？（提示：this 指的到底是“离听话人近”还是“离说话人近”？）"}, {"point": "Which 提问“哪一个”", "explain": "Which 用在<b>有限的、已知的范围<\/b>里做选择；What 用在<b>开放的、无限的范围<\/b>里提问。Which 后面可以直接跟名词，中间不加冠词。", "examples": [{"tag": "基础", "text": "<b>Which<\/b> is your coat? — The blue one. ／ <b>Which book<\/b> do you want? — The big one."}, {"tag": "进阶", "text": "回答 Which 的问句时，常用 <b>one / ones<\/b> 代替重复的名词：the red <b>one<\/b>（单数）／ the big <b>ones<\/b>（复数），避免把名词再说一遍。"}, {"tag": "易错", "text": "“<u>Which the book<\/u> do you want?” ✗ —— Which 本身已经起限定作用，后面跟名词时<b>不能再加冠词<\/b>：Which book ✓。另外别把 Which 和 What 混用：桌上摆着三本书问“要哪本”，用 Which；完全没有范围问“你想看什么书”，用 What。"}], "think": "问“你想喝什么？”和“你想喝哪一杯？”，英语要分别用 What 和 Which，中文却都可以说“哪个”。这说明英语在提问时比中文更在意什么？"}, {"point": "人称代词的主格与宾格", "explain": "<b>主格<\/b>（I / you / he / she / it / we / they）作主语，放在动词前面；<b>宾格<\/b>（me / you / him / her / it / us / them）作宾语，放在动词或介词后面。", "examples": [{"tag": "基础", "text": "<b>I<\/b> love <b>him<\/b>.（我爱他）／ <b>He<\/b> loves <b>me<\/b>.（他爱我）—— 同样两个人，位置一换，形式就跟着换。"}, {"tag": "进阶", "text": "<b>介词后面一律用宾格<\/b>：Look at <b>them<\/b>! ／ Give it to <b>her<\/b>. ／ between you and <b>me<\/b>. 只有 you 和 it 的主格宾格长得一样，其余六个都要变。"}, {"tag": "易错", "text": "“Look at <u>they<\/u>!” ✗ → Look at <b>them<\/b>! ✓ 还有一个连很多英语母语者都说错的：“between you and <u>I<\/u>” ✗ → between you and <b>me<\/b> ✓（between 是介词，后面必须跟宾格，哪怕中间夹着 you and 也一样）。"}], "think": "中文里的“我”在“我打他”和“他打我”里长得一模一样，全靠位置区分；英语却要变成 I 和 me。你觉得英语这样做，对理解长句子有什么帮助？"}, {"point": "双宾语句型 give sb sth", "explain": "give 后面可以带两个宾语：<b>give + 人 + 物<\/b>（Give me a book.），也可以换成 <b>give + 物 + to + 人<\/b>（Give a book to me.）。两种说法意思相同。", "examples": [{"tag": "基础", "text": "Give <b>me a book<\/b>. ＝ Give <b>a book to me<\/b>. ／ Give <b>him the pen<\/b>. ＝ Give <b>the pen to him<\/b>."}, {"tag": "进阶", "text": "有一条硬限制：当“物”是代词 it / them 时，<b>只能用 give it to me 这种形式<\/b>，不能说 give me it。原因是英语不喜欢把两个短代词硬挤在一起。"}, {"tag": "易错", "text": "“Give <u>to me<\/u> a book.” ✗ —— 用了 to 就必须把“物”放中间：Give a book to me. ✓ 或者干脆不用 to：Give me a book. ✓ <b>to 和“人在前”这两种结构不能混着用。<\/b>"}], "think": "课本 Lesson 22 反复练 “Give me / him / her / them a ...” —— 为什么这一串人称代词全都是宾格形式？如果这里用了主格会怎么样？"}, {"point": "祈使句：动词原形开头", "explain": "祈使句表示命令、请求或建议，主语 you 被省略，直接用<b>动词原形<\/b>开头。否定形式是 <b>Don’t + 动词原形<\/b>。加 please 可以让语气更客气。", "examples": [{"tag": "基础", "text": "Come in. ／ Sit down, please. ／ Look at the blackboard. ／ <b>Don’t<\/b> run in the corridor."}, {"tag": "进阶", "text": "be 动词的祈使句要用原形 <b>Be<\/b>：Be quiet!（安静点！）／ Be careful! ／ 否定说 <b>Don’t be<\/b> late!（不能说 Aren’t late 或 Are quiet）"}, {"tag": "易错", "text": "“<u>Don’t late<\/u>.” ✗ 漏了 be —— late 是形容词，前面必须有动词：Don’t <b>be<\/b> late. ✓ 另一个：“<u>Please to come in<\/u>.” ✗ —— please 后面直接跟动词原形：Please <b>come<\/b> in. ✓"}], "think": "课本里的 “Come along, Dan.” 和 “Look at them!” 都没有主语，直接命令 —— 这样说会不会显得没礼貌？如果想客气一点，有哪几种办法可以软化祈使句的语气？"}], "quiz": [{"id": 1, "type": "choice", "point": "单数句改复数（三处同改）", "stem": "把 This is an old car. 变成复数形式，正确的是（　）", "options": ["A. These is old cars.", "B. These are old cars.", "C. These are an old cars.", "D. This are old cars."], "answer": "B", "explain": "要同时改三处：this→these、is→are、car→cars，并且<b>去掉冠词 an<\/b>。A 漏改 be 动词，C 没去掉冠词，D 没改指示代词。只有 B 三处齐全。"}, {"id": 2, "type": "multi", "point": "指示代词用法（想一想·辨析）", "stem": "关于 this / that / these / those，下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. this 的复数形式是 these", "B. that 的复数形式是 those", "C. 由单数改复数时 be 动词也要跟着改", "D. 打电话自我介绍用 This is...", "E. “These are book.” 是正确的"], "answer": ["A", "B", "C", "D"], "explain": "E 错：these 是复数，后面的名词必须也变复数，应为 These are books. D 对，这也是 this 的一个特殊用法 —— 打电话时说话人指的是“靠近自己的这个声音”，所以用 this 而不是 that。"}, {"id": 3, "type": "fill", "point": "不规则复数拼写", "stem": "That is a knife. 改成复数：Those are ______.", "answer": ["knives"], "explain": "knife 以 fe 结尾，变复数要把 fe 改成 v 再加 es，写成 knives。同类词还有 wife→wives、leaf→leaves。"}, {"id": 4, "type": "choice", "point": "Which 与 one", "stem": "____ is your umbrella? — The black ____.", "options": ["A. What; one", "B. Which; one", "C. Which; it", "D. What; ones"], "answer": "B", "explain": "在几把伞里选一把，范围有限，用 Which；回答时用 one 代替已经出现过的名词 umbrella。C 的 it 特指“那一把”，不能跟形容词 black 连用；D 的 ones 是复数，跟单数问句不匹配。"}, {"id": 5, "type": "multi", "point": "Which 与 What 的分工（想一想·辨析）", "stem": "关于 Which 和 What，下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. Which 用于在有限范围内选择", "B. What 用于开放范围提问", "C. Which 后面可以直接跟名词", "D. 回答 Which 的问句常用 one / ones 代替名词", "E. “Which the book do you want?” 语序正确"], "answer": ["A", "B", "C", "D"], "explain": "E 错：Which 本身已经有限定作用，后面跟名词时不能再加冠词 the，应为 Which book do you want?"}, {"id": 6, "type": "choice", "point": "主格与宾格", "stem": "Look at ____! ____ are my friends.", "options": ["A. them; They", "B. they; Them", "C. them; Them", "D. they; They"], "answer": "A", "explain": "第一空在介词 at 后面，必须用宾格 them；第二空作句子的主语，必须用主格 They。<b>介词后面用宾格、作主语用主格<\/b>，两条规则在同一题里各考一次。"}, {"id": 7, "type": "judge", "point": "介词后的代词形式", "stem": "介词后面的人称代词要用主格。", "answer": "错", "explain": "错，正好相反：<b>介词后面一律用宾格<\/b>。Look at them. ✓ ／ Give it to her. ✓ ／ between you and me. ✓ 最后一个连很多母语者都会说成 between you and I，那是错的。"}, {"id": 8, "type": "multi", "point": "人称代词规则（想一想·辨析）", "stem": "关于人称代词，下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. 主格作句子的主语", "B. 宾格作动词或介词的宾语", "C. “Look at they!” 是正确的", "D. between you and me 是正确的", "E. it 的主格和宾格形式相同"], "answer": ["A", "B", "D", "E"], "explain": "C 错：介词 at 后面要用宾格 them。E 对，这是个容易被忽略的点 —— 八个人称代词里，只有 <b>you 和 it<\/b> 的主格宾格长得一样，其余六个都要变形。"}, {"id": 9, "type": "fill", "point": "双宾语的两种结构互换", "stem": "Give the book to me. 改成同义句：Give ______ the book.", "answer": ["me"], "explain": "去掉 to 之后，“人”要挪到 give 的正后面，且必须用宾格 me。两种结构：give + 人 + 物 ＝ give + 物 + to + 人。"}, {"id": 10, "type": "multi", "point": "give 的双宾语限制（想一想·刁钻）", "stem": "关于 give 的双宾语用法，下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. Give me a pen. 是正确的", "B. Give a pen to me. 是正确的", "C. Give it to me. 是正确的", "D. Give me it. 是最地道的说法", "E. Give to me a pen. 是正确的"], "answer": ["A", "B", "C"], "explain": "D 错：当“物”是代词 it / them 时，英语<b>只用 give it to me<\/b>，Give me it. 虽然偶尔听得到，但绝不是“最地道”的说法。E 错：用了 to 就必须把物放中间。D 是本题最有迷惑性的选项，因为它看起来只是 A 的代词版。"}, {"id": 11, "type": "choice", "point": "祈使句的否定与 be", "stem": "下列祈使句<b>正确<\/b>的是（　）", "options": ["A. Don’t late.", "B. Don’t be late.", "C. Are quiet!", "D. Please to sit down."], "answer": "B", "explain": "A 漏了 be（late 是形容词，不能直接跟在 don’t 后面）；C 错，be 动词的祈使句用原形 Be quiet!，不用 Are；D 错，please 后面直接跟动词原形，不加 to。"}, {"id": 12, "type": "multi", "point": "祈使句的构成与语气（想一想·刁钻）", "stem": "关于祈使句，下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. 用动词原形开头，省略主语 you", "B. 否定形式是 Don’t + 动词原形", "C. be 动词的祈使句写作 Be quiet!", "D. 句首或句末加 please 可以让语气更礼貌", "E. 祈使句一定不礼貌，正式场合绝对不能用"], "answer": ["A", "B", "C", "D"], "explain": "E 错：祈使句本身<b>不带感情色彩<\/b>，礼貌与否取决于语气、please 和上下文。“Please have a seat.”“Enjoy your meal.” 都是正式又礼貌的祈使句。把语法结构和礼貌程度画等号，是这题要破除的误解。"}]}, {"id": "e-c1-s5", "title": "第五节 单词总复习（一）：物品衣着 · 国籍 · 职业 · 家庭人物", "notes": [{"point": "日常物品与衣着（Lesson 1-4、11-14）", "explain": "handbag 手提包　pencil 铅笔　book 书　watch 手表　coat 外套　dress 连衣裙　skirt 裙子　shirt 衬衫　blouse 女式衬衫　tie 领带　suit 西装　hat 帽子　car 汽车　house 房子　umbrella 伞　ticket 票　number 号码　cloakroom 衣帽间　school 学校　case 箱子　carpet 地毯　boat 船", "examples": [{"tag": "基础", "text": "先按“穿在身上的”和“拿在手里的”分两堆记：<b>衣着类<\/b> coat / dress / skirt / shirt / blouse / tie / suit / hat；<b>随身物品类<\/b> handbag / umbrella / ticket / watch / pencil / book。分堆记比一条一条背快得多。"}, {"tag": "进阶", "text": "几个容易搞反的中文对应：<b>dress<\/b> 是连衣裙（一件式），<b>skirt<\/b> 是半身裙；<b>shirt<\/b> 是男式衬衫，<b>blouse<\/b> 是女式衬衫；<b>watch<\/b> 是手表（挂钟是 clock）。"}, {"tag": "易错", "text": "拼写陷阱三个：<b>umbrella<\/b> 中间是双 <b>ll<\/b>（不是 umbrela）；<b>handbag<\/b> 是一个词，中间不空格也不加连字符；<b>cloakroom<\/b> 同理是一个词。写的时候慢一秒，别凭读音猜。"}], "think": "handbag 拆开是 hand（手）+ bag（包），cloakroom 拆开是 cloak（斗篷）+ room（房间）。你还能在这张表里找出几个由两个熟词拼起来的单词？找到规律后，这类词还需要死记吗？"}, {"point": "国家与国籍（Lesson 5-6、15）", "explain": "China 中国 → Chinese　France 法国 → French　Germany 德国 → German　Japan 日本 → Japanese　Korea 韩国 → Korean　Italy 意大利 → Italian　Sweden 瑞典 → Swedish　America 美国 → American　Russia 俄罗斯 → Russian　England 英国 → English　Norway 挪威 → Norwegian　Denmark 丹麦 → Danish", "examples": [{"tag": "基础", "text": "多数国籍词是在国名上加后缀：Italy→Ital<b>ian<\/b>、America→Americ<b>an<\/b>、Russia→Russi<b>an<\/b>、Norway→Norweg<b>ian<\/b>、Korea→Kore<b>an<\/b>、Japan→Japan<b>ese<\/b>、China→Chin<b>ese<\/b>。"}, {"tag": "进阶", "text": "有四个是“整个换样子”的，必须单独记：France→<b>French<\/b>、Germany→<b>German<\/b>、Sweden→<b>Swedish<\/b>、Denmark→<b>Danish<\/b>、England→<b>English<\/b>。它们不是简单加后缀，看不出规律就直接背。"}, {"tag": "易错", "text": "最容易错的两个拼写：<b>Germany<\/b>（国名，结尾 -any）和 <b>German<\/b>（国籍，结尾 -an，少一个 y）—— 差一个字母，词性就变了。还有 <b>Norwegian<\/b> 中间是 <b>weg<\/b> 不是 <b>way<\/b>（虽然国名是 Norway）。"}], "think": "为什么 Japan、China 都加 -ese，Italy、Russia、Korea 都加 -an，France、Germany 却完全变样？（提示：想想哪些国名是英语很早就接触到的，哪些是后来才传进来的）"}, {"point": "职业（Lesson 7-8、17-18）", "explain": "engineer 工程师　nurse 护士　mechanic 机械师　keyboard operator 键盘操作员　policeman 男警察　policewoman 女警察　taxi driver 出租车司机　air hostess 空姐　postman 邮递员　hairdresser 理发师　housewife 家庭主妇　milkman 送奶工　teacher 教师　student 学生　manager 经理　assistant 助理　employee 雇员　customs officer 海关官员", "examples": [{"tag": "基础", "text": "问答固定搭配：What is your <b>job<\/b>? — I am <b>a<\/b> nurse.（别忘了那个 a）复数则不加：We are nurses."}, {"tag": "进阶", "text": "很多职业词是“动词/名词 + er / or / ist”构成的：teach→teach<b>er<\/b>、drive→driv<b>er<\/b>、hairdress→hairdress<b>er<\/b>、operate→operat<b>or<\/b>、manage→manag<b>er<\/b>。认出词根，一半的职业词就不用死记。"}, {"tag": "易错", "text": "三个拼写坑：<b>engineer<\/b> 结尾是 <b>-eer<\/b>（三个 e，不是 -eer 写成 -ear）；<b>mechanic<\/b> 开头是 <b>mech<\/b>（不是 mach）；<b>hairdresser<\/b> 中间是双 <b>ss<\/b>。这三个是新概念第一册里最常拼错的职业词。"}], "think": "policeman 的复数是 policemen，housewife 的复数是 housewives —— 这两个词变复数的方式完全不同。你能只看单词的<b>结尾<\/b>，就判断出一个职业词该怎么变复数吗？"}, {"point": "家庭与人物（Lesson 4、11-12、15）", "explain": "father 父亲　mother 母亲　brother 兄弟　sister 姐妹　son 儿子　daughter 女儿　man 男人（复数 men）　woman 女人（复数 women）　child 孩子（复数 children）　boy 男孩　girl 女孩　friend 朋友　tourist 游客", "examples": [{"tag": "基础", "text": "成对记最省力：father / mother、brother / sister、son / daughter、boy / girl、man / woman。一对里记住一个，另一个就带出来了。"}, {"tag": "进阶", "text": "这一组集中了英语最重要的三个<b>不规则复数<\/b>：man→<b>men<\/b>、woman→<b>women<\/b>、child→<b>children<\/b>。注意 women 的拼写变了但读音变化更大（/ˈwʊmən/ → /ˈwɪmɪn/），是靠读音记不出来的。"}, {"tag": "易错", "text": "<b>daughter<\/b> 里的 <b>gh<\/b> 完全不发音，最容易漏写；<b>friend<\/b> 是 <b>i 在 e 前面<\/b>（fri-end，不是 freind）。这两个都是“听不出来、只能靠眼睛记”的拼写。"}], "think": "man→men 只改了一个字母，child→children 却多出了三个字母。这些不规则复数看起来毫无道理 —— 但它们恰恰都是英语里<b>最常用<\/b>的词。你觉得“最常用”和“最不规则”之间，会不会有什么联系？"}], "quiz": [{"id": 1, "type": "fill", "point": "拼写：伞", "stem": "根据中文写出英文单词：伞 → ______", "answer": ["umbrella"], "explain": "umbrella，注意中间是双 l。这是新概念第一册最常拼错的名词之一。"}, {"id": 2, "type": "fill", "point": "拼写：手提包", "stem": "根据中文写出英文单词：手提包 → ______", "answer": ["handbag"], "explain": "handbag ＝ hand（手）+ bag（包），是一个词，中间不空格、不加连字符。"}, {"id": 3, "type": "multi", "point": "衣物词义辨析（想一想·辨析）", "stem": "关于衣物类单词，下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. dress 指连衣裙", "B. skirt 指半身裙", "C. blouse 指女式衬衫", "D. watch 指挂在墙上的钟", "E. suit 指西装、套装"], "answer": ["A", "B", "C", "E"], "explain": "D 错：watch 是<b>手表<\/b>，挂钟是 clock。其余都对。dress 和 skirt 的区别（一件式 vs 半身）是这组词最常混的地方。"}, {"id": 4, "type": "fill", "point": "拼写：国籍形容词（德国）", "stem": "Germany 对应的国籍形容词是 ______", "answer": ["German"], "explain": "German —— 比国名 Germany 少了结尾的 y。差一个字母词性就变了，是这一节的头号拼写坑。⚠️ 本站判分不区分大小写，但<b>正式书写时国籍形容词首字母必须大写<\/b>：German ✓ / german ✗。"}, {"id": 5, "type": "fill", "point": "拼写：国籍形容词（瑞典）", "stem": "Sweden 对应的国籍形容词是 ______", "answer": ["Swedish"], "explain": "Swedish。它和 Danish（Denmark→丹麦的）一样，属于“整个换样子”的一类，看不出规律只能单独记。⚠️ 本站判分不区分大小写，但<b>正式书写时首字母必须大写<\/b>：Swedish ✓ / swedish ✗。"}, {"id": 6, "type": "multi", "point": "国名与国籍配对（想一想·刁钻）", "stem": "下列“国名 → 国籍形容词”的配对<b>正确<\/b>的有（　）【多选】", "options": ["A. France → French", "B. Germany → Germany", "C. Norway → Norwegian", "D. Denmark → Danish", "E. Japan → Japanese"], "answer": ["A", "C", "D", "E"], "explain": "B 错：Germany 是国名本身，国籍形容词是 German（去掉 y）。C 要特别注意拼写 —— 国名是 Nor<b>way<\/b>，国籍却是 Nor<b>weg<\/b>ian，中间那段变了。"}, {"id": 7, "type": "fill", "point": "拼写：工程师", "stem": "根据中文写出英文单词：工程师 → ______", "answer": ["engineer"], "explain": "engineer，结尾是 -eer（en-gi-neer）。写成 enginear 或 engineere 都是常见错误。"}, {"id": 8, "type": "fill", "point": "拼写：机械师", "stem": "根据中文写出英文单词：机械师 → ______", "answer": ["mechanic"], "explain": "mechanic，开头是 mech- 不是 mach-。它和 machine（机器）同源，但拼写不同，别互相带偏。"}, {"id": 9, "type": "choice", "point": "职业问答的固定搭配", "stem": "—What is your job?　—____", "options": ["A. I am nurse.", "B. I am a nurse.", "C. I nurse.", "D. My job nurse."], "answer": "B", "explain": "单数职业名词前必须加冠词 a/an，所以是 I am a nurse. A 漏了 a，是最典型的中式英语。"}, {"id": 10, "type": "multi", "point": "职业词的构成与复数（想一想·辨析）", "stem": "关于职业类单词，下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. teacher 由 teach + er 构成", "B. operator 由 operate + or 构成", "C. policeman 的复数是 policemans", "D. housewife 的复数是 housewives", "E. hairdresser 中间是双写的 ss"], "answer": ["A", "B", "D", "E"], "explain": "C 错：policeman 以 man 结尾，变复数要把 man 改成 men，写作 policemen，不能直接加 s。看结尾就能判断怎么变复数，这是这组词最省力的记法。"}, {"id": 11, "type": "fill", "point": "拼写：女儿", "stem": "根据中文写出英文单词：女儿 → ______", "answer": ["daughter"], "explain": "daughter，中间的 gh 完全不发音，读音里听不到，只能靠眼睛记。漏写 gh 是最常见的错误。"}, {"id": 12, "type": "fill", "point": "不规则复数：孩子", "stem": "child 的复数形式是 ______", "answer": ["children"], "explain": "children，不是 childs 也不是 childrens（children 本身已经是复数，不能再加 s）。"}, {"id": 13, "type": "multi", "point": "不规则复数与拼写（想一想·刁钻）", "stem": "关于家庭与人物类单词，下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. man 的复数是 men", "B. woman 的复数是 womans", "C. child 的复数是 children", "D. friend 的正确拼写是 i 在 e 前面", "E. daughter 里的 gh 不发音"], "answer": ["A", "C", "D", "E"], "explain": "B 错：woman 的复数是 <b>women<\/b>，而且读音从 /ˈwʊmən/ 变成 /ˈwɪmɪn/，变化比拼写还大，光靠读是记不住的。"}, {"id": 14, "type": "choice", "point": "复数形式综合（刁钻）", "stem": "下列复数形式<b>全部正确<\/b>的一组是（　）", "options": ["A. men, women, children", "B. mans, womans, childs", "C. men, womens, childrens", "D. mans, women, children"], "answer": "A", "explain": "man→men、woman→women、child→children，三个都是不规则变化，而且都不能再额外加 s。这三个词是英语里出现频率最高的不规则复数，必须一次记牢。"}]}, {"id": "e-c1-s6", "title": "第六节 单词总复习（二）：形容词 · 颜色 · 餐具容器", "notes": [{"point": "描述人和物的形容词（Lesson 9-12、17-19、21）", "explain": "fat 胖的 ↔ thin 瘦的　tall 高的 ↔ short 矮的／短的　old 老的／旧的 ↔ young 年轻的／new 新的　clean 干净的 ↔ dirty 脏的　hot 热的 ↔ cold 冷的　busy 忙的 ↔ lazy 懒的　empty 空的 ↔ full 满的　big 大的 ↔ small 小的　hard-working 勤奋的　tired 累的　thirsty 渴的　hungry 饿的　smart 时髦的／漂亮的　lovely 可爱的", "examples": [{"tag": "基础", "text": "形容词最好<b>成对记<\/b>：fat/thin、tall/short、clean/dirty、hot/cold、busy/lazy、empty/full。一次记一对，等于一次记两个词。"}, {"tag": "进阶", "text": "old 有两个反义词，看它修饰什么：形容<b>人<\/b>时 old ↔ young（老的↔年轻的）；形容<b>东西<\/b>时 old ↔ new（旧的↔新的）。short 也是双意思：形容人是“矮”，形容东西是“短”。"}, {"tag": "易错", "text": "三个拼写坑：<b>hungry<\/b> / <b>thirsty<\/b> / <b>busy<\/b> 都以 y 结尾但没有 e；<b>tired<\/b> 结尾是 <b>-ed<\/b>（很多人写成 tird）；<b>hard-working<\/b> 中间必须有<b>连字符<\/b>，写成两个词就不对了。"}], "think": "old 既可以是“老的”也可以是“旧的”，short 既可以是“矮的”也可以是“短的”。中文却要用两个不同的字。你觉得这对学英语的中国学生是省事还是容易出错？"}, {"point": "颜色（Lesson 13-14）", "explain": "blue 蓝色　white 白色　black 黑色　red 红色　green 绿色　yellow 黄色　orange 橙色　brown 棕色　grey 灰色（美式 gray）　pink 粉色。深浅表达：dark blue 深蓝　light blue 浅蓝。", "examples": [{"tag": "基础", "text": "问答固定句型：What <b>colour<\/b> is your car? — It is red. ／ What colour <b>are<\/b> your shoes? — They are black."}, {"tag": "进阶", "text": "颜色前加 <b>dark<\/b>（深）或 <b>light<\/b>（浅）就能表达深浅：dark green 深绿、light grey 浅灰。这比再背一堆新词省事得多。"}, {"tag": "易错", "text": "<b>colour<\/b> 是英式拼写（新概念用英式），美式写作 <b>color<\/b>，考试跟课本走用 colour。另外 <b>grey<\/b>（英式）和 <b>gray<\/b>（美式）也是同一个颜色的两种拼法，别当成两个词。"}], "think": "orange 既是“橙色”也是“橙子”，pink 既是“粉色”也是一种花（石竹）。英语里还有哪些颜色词本来是某样东西的名字？（提示：想想 gold、silver）"}, {"point": "餐具与容器（Lesson 21-24）", "explain": "cup 杯子（有把的）　glass 玻璃杯　bottle 瓶子　dish 盘、碟　plate 盘子　box 盒子　knife 刀（复数 knives）　fork 叉子　spoon 勺子　teapot 茶壶　tin 罐头　jug 罐、壶　bowl 碗　table 桌子　cupboard 碗柜　sugar 糖　milk 牛奶　tea 茶　coffee 咖啡　water 水", "examples": [{"tag": "基础", "text": "刀叉勺一起记：<b>knife<\/b>（刀）／ <b>fork<\/b>（叉）／ <b>spoon<\/b>（勺），这三个总是同时出现在餐桌上，也总是同时出现在考题里。"}, {"tag": "进阶", "text": "这一组的复数变化正好覆盖三条规则：box→box<b>es<\/b>（x 结尾加 es）、dish→dish<b>es<\/b>（sh 结尾加 es）、knife→kni<b>ves<\/b>（fe 变 ves）、glass→glass<b>es<\/b>（ss 结尾加 es）。背单词的同时把复数规则一起过一遍。"}, {"tag": "易错", "text": "两个大坑：<b>knife<\/b> 开头的 <b>k 不发音<\/b>，听写时最容易漏掉；<b>cupboard<\/b> 里的 <b>p 也不发音<\/b>（读作 /ˈkʌbəd/），但拼写时那个 p 必须写出来。这两个都是“听不出、只能背”的词。"}], "think": "knife 的 k 不发音，cupboard 的 p 不发音，daughter 的 gh 不发音 —— 英语里为什么会有这么多“写出来却不读”的字母？（提示：这些字母在几百年前是发音的，是读音变了、拼写没跟着变）"}], "quiz": [{"id": 1, "type": "fill", "point": "拼写：饿的", "stem": "根据中文写出英文单词：饿的 → ______", "answer": ["hungry"], "explain": "hungry，结尾是 -gry，没有 e。和 thirsty（渴的）、busy（忙的）一样都以 y 结尾。"}, {"id": 2, "type": "fill", "point": "拼写：渴的", "stem": "根据中文写出英文单词：渴的 → ______", "answer": ["thirsty"], "explain": "thirsty。开头是 thir-（和 third 第三 同一段拼写），不是 thur-。"}, {"id": 3, "type": "fill", "point": "拼写：累的", "stem": "根据中文写出英文单词：累的 → ______", "answer": ["tired"], "explain": "tired，结尾是 -ed。写成 tird 或 tierd 都是常见错误。"}, {"id": 4, "type": "multi", "point": "形容词的一词多义（想一想·刁钻）", "stem": "关于这些形容词，下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. 形容人时 old 的反义词是 young", "B. 形容东西时 old 的反义词是 new", "C. short 既可以指“矮”也可以指“短”", "D. hard-working 中间不需要连字符", "E. empty 的反义词是 full"], "answer": ["A", "B", "C", "E"], "explain": "D 错：hard-working（勤奋的）中间必须有连字符，它是一个合成形容词。A 和 B 放在一起，是为了让你注意 old 有<b>两个<\/b>反义词，取决于它形容的是人还是物。"}, {"id": 5, "type": "fill", "point": "拼写：颜色（英式）", "stem": "“颜色”的英式拼写是 ______（新概念课本用的这一种）", "answer": ["colour"], "explain": "colour 是英式拼写，美式是 color。新概念英语是英式教材，跟课本走写 colour。"}, {"id": 6, "type": "choice", "point": "深浅颜色的表达", "stem": "“浅蓝色”的正确说法是（　）", "options": ["A. small blue", "B. white blue", "C. thin blue", "D. light blue"], "answer": "D", "explain": "深浅用 dark（深）和 light（浅）：dark blue 深蓝、light blue 浅蓝。small / thin 是形容大小和厚薄的，不能用来说颜色。"}, {"id": 7, "type": "multi", "point": "颜色词的用法（想一想·辨析）", "stem": "关于颜色类单词，下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. colour 是英式拼写，color 是美式拼写", "B. grey 和 gray 是同一个颜色的两种拼法", "C. orange 既表示橙色也表示橙子", "D. dark green 表示深绿色", "E. 问复数东西的颜色要说 What colour is your shoes?"], "answer": ["A", "B", "C", "D"], "explain": "E 错：shoes 是复数，be 动词要用 are —— What colour <b>are<\/b> your shoes? 这题把拼写知识和上一节的语法考点串在了一起。"}, {"id": 8, "type": "fill", "point": "拼写：刀（不发音的字母）", "stem": "根据中文写出英文单词：刀 → ______", "answer": ["knife"], "explain": "knife，开头的 k <b>不发音<\/b>但必须写出来。听写时最容易漏掉这个 k。"}, {"id": 9, "type": "fill", "point": "不规则复数：刀", "stem": "knife 的复数形式是 ______", "answer": ["knives"], "explain": "knives，以 fe 结尾要变成 ves。同类词还有 wife→wives、life→lives、leaf→leaves。"}, {"id": 10, "type": "fill", "point": "拼写：碗柜（不发音的字母）", "stem": "根据中文写出英文单词：碗柜 → ______", "answer": ["cupboard"], "explain": "cupboard，中间的 p <b>不发音<\/b>（读作 /ˈkʌbəd/），但拼写时必须写出来。它由 cup + board 组成，从构词上看就不会漏掉 p 了。"}, {"id": 11, "type": "judge", "point": "不发音字母的拼写", "stem": "knife 的 k 不发音，所以书写时可以省略，写成 nife。", "answer": "错", "explain": "错。<b>不发音不等于不用写<\/b>。knife、cupboard、daughter 里的不发音字母都必须完整写出来 —— 这正是这类词只能靠眼睛记、不能靠耳朵记的原因。"}, {"id": 12, "type": "multi", "point": "餐具容器的复数（想一想·刁钻）", "stem": "下列复数形式<b>正确<\/b>的有（　）【多选】", "options": ["A. box → boxes", "B. dish → dishes", "C. knife → knifes", "D. glass → glasses", "E. spoon → spoons"], "answer": ["A", "B", "D", "E"], "explain": "C 错：knife 以 fe 结尾，要变成 kni<b>ves<\/b>。这一题把四条复数规则（x 结尾、sh 结尾、fe 结尾、直接加 s）放在一起考，只要有一条没记牢就会错。"}]}]}, {"id": "e-c2", "title": "第二章 Lesson 25-48：There be · 现在进行时 · be going to · 情态动词", "sections": [{"id": "e-c2-s1", "title": "第一节 Lesson 25-30：There be 句型 · some 与 any · 方位介词", "notes": [{"point": "There be 句型：谁在前面就跟谁一致", "explain": "There is / There are 表示“某处有某物”。be 动词跟着<b>紧跟其后的第一个名词<\/b>走，不看后面还有多少东西——这叫“就近原则”。单数或不可数用 is，复数用 are。", "examples": [{"tag": "基础", "text": "There <b>is<\/b> a book on the desk.（有一本书）／ There <b>are<\/b> some books on the desk.（有一些书）—— 后面名词单复数决定 be 动词。"}, {"tag": "进阶", "text": "多样东西并列时看<b>最靠前<\/b>的那个：There <b>is<\/b> a pen and two books on the desk.（pen 单数 → is）／ There <b>are<\/b> two books and a pen on the desk.（books 复数 → are）。同一堆东西，换个顺序 be 动词就变了。"}, {"tag": "易错", "text": "“There are some <u>water<\/u> in the glass.” ✗ —— water 是不可数名词，永远当单数看：There <b>is<\/b> some water in the glass. ✓ 不可数名词（water、milk、bread、rice、meat）不管“有多少”，be 动词一律用 is。"}], "think": "There is a book. 和 The book is there. 都在说“书在那里”，你觉得这两句话的重点有什么不同？（提示：哪一句是在告诉对方“存在一本书”，哪一句是在告诉对方“位置”？）"}, {"point": "There be 与 have 不能混用", "explain": "中文的“有”对应英语两个词：表示<b>某地存在某物<\/b>用 There be；表示<b>某人拥有某物<\/b>用 have / has。判断方法：句子开头是“地方”就用 There be，是“人”就用 have。", "examples": [{"tag": "基础", "text": "教室里有 50 个学生 → <b>There are<\/b> fifty students in the classroom.（地方）／ 我有一个哥哥 → <b>I have<\/b> a brother.（人）"}, {"tag": "进阶", "text": "同一件事可以两种说法：桌上有本书 → There is a book on the desk.（强调存在）＝ The desk has a book on it.（少用，英语更爱前者）。写作时优先用 There be。"}, {"tag": "易错", "text": "“<u>Our class have<\/u> fifty students.” 中式英语 ✗ → 应该说 <b>There are<\/b> fifty students in our class. ✓ 中文说“我们班有50人”，主语看着像“班”，但英语把“班”看成地点，要用 There be。"}], "think": "“我家有三口人”这句话，用 There be 和用 have 各写一遍，你觉得哪一句更像英语母语者会说的？"}, {"point": "some 与 any：不只是“肯定用 some、否定疑问用 any”", "explain": "一般规律：some 用于肯定句，any 用于否定句和疑问句。但有一个重要例外——<b>表示请求或建议、希望对方回答 Yes 的疑问句用 some<\/b>。", "examples": [{"tag": "基础", "text": "There are <b>some<\/b> apples.（肯定）／ There aren’t <b>any<\/b> apples.（否定）／ Are there <b>any<\/b> apples?（疑问）"}, {"tag": "进阶", "text": "请求和邀请用 some：Would you like <b>some<\/b> coffee?（要来点咖啡吗？——期待对方说 Yes）／ Can I have <b>some<\/b> water?（能给我点水吗？）这两句用 any 语法上没错，但听起来冷淡、不像邀请。"}, {"tag": "易错", "text": "“There is <u>not some<\/u> milk.” ✗ —— 否定句必须换成 any：There is <b>not any<\/b> milk. ✓ 也可以说 There is <b>no<\/b> milk.（no ＝ not any，更简洁）。记住：not 和 some 不能做邻居。"}], "think": "服务员问你 “Would you like some tea?” 和 “Would you like any tea?”，同样是问要不要茶，为什么第一句听起来更热情？"}, {"point": "方位介词：in / on / under / near / between / behind", "explain": "in ＝ 在……里面（有包围感）；on ＝ 在……上面（有接触）；under ＝ 在……正下方；near ＝ 在……附近；between A and B ＝ 在两者之间；behind ＝ 在……后面；in front of ＝ 在……前面（外部）。", "examples": [{"tag": "基础", "text": "The pen is <b>in<\/b> the box.（在盒子里）／ <b>on<\/b> the box.（在盒子上）／ <b>under<\/b> the box.（在盒子下）—— 同一支笔，三个位置。"}, {"tag": "进阶", "text": "on 强调“接触”，不一定是上面：There is a picture <b>on<\/b> the wall.（画贴在墙上，是竖直的）／ The fly is <b>on<\/b> the ceiling.（苍蝇在天花板上，其实是倒着的）。只要贴着就用 on。"}, {"tag": "易错", "text": "between 和 among 不同：between 用于<b>两者<\/b>之间，among 用于<b>三者以上<\/b>。“He sits <u>between<\/u> the students.”（学生很多）✗ → He sits <b>among<\/b> the students. ✓ 另外 between 必须配 and：between the desk <b>and<\/b> the chair。"}], "think": "“杯子在桌子上” 和 “画在墙上” 中文都用“上”，英语都用 on —— 那 “灯在天花板上” 为什么也用 on 而不是 under？"}, {"point": "There be 的否定句与疑问句怎么变", "explain": "There be 句型变否定：在 be 动词后面加 not（is not ＝ isn’t，are not ＝ aren’t）。变疑问句：把 be 动词提到 there 前面。简答用 Yes, there is. / No, there isn’t.", "examples": [{"tag": "基础", "text": "There is a cat. → There <b>isn’t<\/b> a cat. → <b>Is there<\/b> a cat? → Yes, there is. / No, there isn’t."}, {"tag": "进阶", "text": "问“有多少”用 How many + 复数名词 + are there：<b>How many<\/b> students <b>are there<\/b> in your class? 回答 There are forty. 注意 are there 的顺序不能写成 there are。"}, {"tag": "易错", "text": "简答里的 there 不能换成 it：“Is there a book on the desk?”—“Yes, <u>it is<\/u>.” ✗ → “Yes, <b>there is<\/b>.” ✓ 这和前面学的 Is this your book?—Yes, it is. 不一样，别串台。"}], "think": "Is this a book? 简答说 Yes, it is.；Is there a book? 简答却说 Yes, there is. —— 为什么后者不能用 it？（提示：there 在句子里充当什么成分？）"}], "quiz": [{"id": 1, "type": "multi", "point": "There be 就近原则（想一想·刁钻）", "stem": "下列句子 be 动词用得<b>正确<\/b>的有（　）【多选】", "options": ["A. There is a pen and two books on the desk.", "B. There are two books and a pen on the desk.", "C. There are some water in the glass.", "D. There is some bread on the plate.", "E. There are a boy and a girl in the room."], "answer": ["A", "B", "D"], "explain": "There be 看<b>紧跟其后的第一个名词<\/b>。A 对：a pen 单数 → is。B 对：two books 复数 → are。C 错：water 不可数 → 应该是 is。D 对：bread 不可数 → is。E 错：a boy 单数在前 → 应该是 There <b>is<\/b> a boy and a girl。这题专治“凭感觉数东西总数”。"}, {"id": 2, "type": "multi", "point": "There be 与 have 的分工（想一想·刁钻）", "stem": "下列表达“有”的句子，<b>正确<\/b>的有（　）【多选】", "options": ["A. There are fifty students in our class.", "B. Our class has fifty students.", "C. Our class have fifty students.", "D. I have a new bike.", "E. There is a new bike of me."], "answer": ["A", "B", "D"], "explain": "A 对：地点 + There be，最地道。B 语法可以但英语中少用，仍算正确。C 错：class 作整体是单数，不能用 have。D 对：人拥有东西用 have。E 错：不能说 of me，要说 I have a new bike. 或 There is a new bike of <b>mine<\/b>。"}, {"id": 3, "type": "multi", "point": "some 与 any 的选择（想一想·刁钻）", "stem": "下列句子中，<b>应该<\/b>填 some 的有（　）【多选】", "options": ["A. Would you like ______ coffee?", "B. There aren’t ______ apples in the basket.", "C. Can I have ______ water, please?", "D. Are there ______ books on the shelf?", "E. There are ______ flowers in the garden."], "answer": ["A", "C", "E"], "explain": "A、C 虽是疑问句，但表示<b>邀请和请求<\/b>，期待对方回答 Yes，用 some 才礼貌。E 是肯定句用 some。B 是否定句、D 是单纯询问事实的疑问句，都用 any。这题考的是“疑问句一律用 any”这条口诀的<b>例外<\/b>。"}, {"id": 4, "type": "multi", "point": "方位介词辨析（想一想·刁钻）", "stem": "下列介词用得<b>正确<\/b>的有（　）【多选】", "options": ["A. There is a picture on the wall.", "B. The cat is under the table.", "C. He sits between the students.", "D. The bank is between the shop and the school.", "E. There is a light on the ceiling."], "answer": ["A", "B", "D", "E"], "explain": "A 对：贴着墙就用 on，不管方向。B 对：桌子正下方用 under。C 错：students 是很多人，两者之间才用 between，三者以上要用 <b>among<\/b>。D 对：between A <b>and<\/b> B。E 对：灯贴在天花板上，接触就用 on（哪怕是倒着的）。"}, {"id": 5, "type": "multi", "point": "There be 的简答（想一想·刁钻）", "stem": "关于 There be 句型的疑问与简答，说法<b>正确<\/b>的有（　）【多选】", "options": ["A. Is there a book on the desk? 的简答是 Yes, there is.", "B. Is there a book on the desk? 的简答是 Yes, it is.", "C. 问数量用 How many books are there...?", "D. 问数量用 How many books there are...?", "E. There be 变否定是在 be 后面加 not。"], "answer": ["A", "C", "E"], "explain": "A 对、B 错：There be 的简答保留 there，不换成 it。C 对、D 错：疑问句里 are 必须提到 there 前面。E 对：is not ＝ isn’t。"}, {"id": 6, "type": "choice", "point": "There be 就近原则", "stem": "There ______ a teacher and twenty students in the room.", "options": ["A. is", "B. are", "C. am", "D. be"], "answer": "A", "explain": "紧跟 There 的第一个名词是 a teacher（单数），所以用 is。不要去数“一共 21 个人”，就近原则只看最靠前的那个。"}, {"id": 7, "type": "choice", "point": "some 与 any", "stem": "There isn’t ______ milk in the bottle.", "options": ["A. any", "B. some", "C. a", "D. many"], "answer": "A", "explain": "否定句用 any。milk 不可数，不能用 a，也不能用修饰可数名词的 many（要用 much）。"}, {"id": 8, "type": "choice", "point": "between 的搭配", "stem": "The post office is between the bank ______ the hospital.", "options": ["A. or", "B. with", "C. and", "D. to"], "answer": "C", "explain": "between 是固定搭配 between A <b>and<\/b> B，中间必须用 and，不能换成 or 或 with。"}, {"id": 9, "type": "fill", "point": "There be 变疑问句", "stem": "把 There are some books on the desk. 改成一般疑问句：______ there ______ books on the desk?（依次填两个词）", "answer": ["Are any"], "explain": "两处都要变：be 动词 are 提到 there 前面；肯定句的 some 在疑问句里改成 any。答案是 Are / any。很多人只记得提 be 动词，忘了改 some。"}, {"id": 10, "type": "fill", "point": "There be 与 have", "stem": "翻译：我们学校有一个大操场。______ is a big playground in our school.（填一个词）", "answer": ["There"], "explain": "“某地有某物”用 There be，不能说 Our school has。填 There。"}, {"id": 11, "type": "judge", "point": "不可数名词的 be 动词", "stem": "There are some bread on the table. 这句话是正确的。", "answer": "错", "explain": "错。bread（面包）是<b>不可数名词<\/b>，永远当单数看，应该是 There <b>is<\/b> some bread on the table. 类似的还有 water、milk、rice、meat、news。"}, {"id": 12, "type": "judge", "point": "some 在疑问句中的例外", "stem": "Would you like some tea? 这句话虽然是疑问句，但用 some 是正确的。", "answer": "对", "explain": "对。表示<b>邀请、请求<\/b>并期待对方回答 Yes 的疑问句用 some，这是“疑问句用 any”的重要例外。用 any 语法不算错，但听起来生硬，不像在邀请人。"}]}, {"id": "e-c2-s2", "title": "第二节 Lesson 31-36：现在进行时（正在做什么）", "notes": [{"point": "现在进行时的构成：be + 动词-ing，两半缺一不可", "explain": "现在进行时表示“此刻正在进行的动作”，结构是 <b>am / is / are + 动词ing<\/b>。be 动词跟主语走，ing 表示“正在”，两个部分必须同时出现。", "examples": [{"tag": "基础", "text": "I <b>am reading<\/b> a book. / He <b>is playing<\/b> football. / They <b>are running<\/b>. —— be 动词随主语变，动词一律加 ing。"}, {"tag": "进阶", "text": "常见的时间标志词：now（现在）、at the moment（此刻）、Look!（看！）、Listen!（听！）。看到 Look! / Listen! 开头，后面几乎一定是现在进行时：<b>Look!<\/b> The baby <b>is crying<\/b>."}, {"tag": "易错", "text": "最常见的两种残缺：“He <u>reading<\/u> a book.” ✗（丢了 be）／ “He <u>is read<\/u> a book.” ✗（动词没加 ing）。正确是 He <b>is reading<\/b> a book. ✓ 检查现在进行时，先数够不够两半。"}], "think": "为什么现在进行时非要用两个词（is + reading）才能表达，而一般现在时一个 reads 就够了？（提示：is 负责什么信息，reading 负责什么信息？）"}, {"point": "动词加 ing 的四条规则", "explain": "① 一般直接加 ing：read→reading；② 以不发音的 e 结尾，<b>去 e<\/b> 加 ing：write→writing, make→making；③ 重读闭音节（辅音+元音+辅音）结尾，<b>双写<\/b>末尾辅音字母：run→running, sit→sitting, swim→swimming；④ 以 ie 结尾，<b>ie 变 y<\/b> 加 ing：lie→lying, die→dying。", "examples": [{"tag": "基础", "text": "play→playing（直接加）／ come→coming（去 e）／ get→getting（双写）／ tie→tying（ie 变 y）"}, {"tag": "进阶", "text": "双写有个前提是“<b>重读<\/b>闭音节”：begin→beginning（重音在 gin，双写）但 open→opening（重音在 o，不双写）；listen→listening（不双写）。同样是三个字母结尾，重音位置决定要不要双写。"}, {"tag": "易错", "text": "“He is <u>writting<\/u>.” ✗ —— write 以不发音的 e 结尾，规则是去 e 加 ing，不是双写：<b>writing<\/b> ✓。反过来 “He is <u>runing<\/u>.” ✗ —— run 是重读闭音节，必须双写：<b>running<\/b> ✓。这两个词经常被写反。"}], "think": "run 要双写成 running，rain 却直接写成 raining（不是 rainning）—— 同样是 n 结尾，为什么处理不一样？"}, {"point": "现在进行时的否定句与疑问句", "explain": "否定：在 be 动词后加 not（is not reading ＝ isn’t reading）。疑问：把 be 动词提到句首。简答用 Yes, 主语 + be. / No, 主语 + be + not. —— 注意 <b>ing 部分不参与变化<\/b>，动手的永远是 be。", "examples": [{"tag": "基础", "text": "He is reading. → He <b>isn’t<\/b> reading. → <b>Is<\/b> he reading? → Yes, he is. / No, he isn’t."}, {"tag": "进阶", "text": "特殊疑问句：疑问词 + be + 主语 + ing？<b>What are you doing?<\/b>（你在做什么？）回答 I’m doing my homework. 注意问句用 doing，答句也用具体的 ing 动词，时态要对齐。"}, {"tag": "易错", "text": "“<u>Does<\/u> he reading?” ✗ —— 句子里已经有 be 动词了，不需要借助 do / does。正确是 <b>Is<\/b> he reading? ✓ 口诀：<b>有 be 用 be，无 be 才用 do<\/b>。"}], "think": "Is he reading? 和 Does he read? 都在问“他读书吗”，这两个问题问的其实是完全不同的两件事——差别在哪？"}, {"point": "现在进行时 vs 一般现在时：一个说“此刻”，一个说“经常”", "explain": "现在进行时说的是<b>此时此刻正在发生<\/b>的动作（有开始有结束）；一般现在时说的是<b>经常性、习惯性<\/b>的动作或客观事实。两者的时间标志词不同。", "examples": [{"tag": "基础", "text": "I <b>am watching<\/b> TV <u>now<\/u>.（此刻正在看）／ I <b>watch<\/b> TV <u>every evening<\/u>.（每天晚上都看，是习惯）"}, {"tag": "进阶", "text": "标志词对照——进行时：now, at the moment, Look!, Listen!；一般现在时：always, usually, often, sometimes, every day, on Sundays。看到标志词基本就能定时态。"}, {"tag": "易错", "text": "“I <u>am going<\/u> to school every day.” ✗ —— every day 表示习惯，要用一般现在时：I <b>go<\/b> to school every day. ✓ 反过来 “Look! It <u>rains<\/u>.” ✗ → Look! It <b>is raining<\/b>. ✓ 时间标志词和时态必须配对。"}], "think": "“他住在北京”应该用 He lives in Beijing. 还是 He is living in Beijing.？如果他只是来北京出差三个月，答案会变吗？"}, {"point": "有些动词不用进行时", "explain": "表示<b>状态<\/b>而非<b>动作<\/b>的动词，通常不用现在进行时。常见的有：like（喜欢）、love、want（想要）、know（知道）、have（拥有）、see（看见）、hear（听见）、be。", "examples": [{"tag": "基础", "text": "I <b>like<\/b> apples.（不说 I am liking）／ I <b>know<\/b> him.（不说 I am knowing）／ I <b>want<\/b> a cake.（不说 I am wanting）"}, {"tag": "进阶", "text": "have 表示“拥有”不用进行时，但表示“吃、进行”时可以：I <b>have<\/b> a car.（拥有，不用进行时）／ I <b>am having<\/b> lunch.（正在吃午饭，可以用）。同一个词，意思变了规则就变了。"}, {"tag": "易错", "text": "“I <u>am liking<\/u> this book.” ✗ → I <b>like<\/b> this book. ✓ 中文说“我正喜欢着”很别扭，英语同理——喜欢是一种持续的状态，不是一个正在进行的动作。"}], "think": "为什么 I am having lunch. 可以说，I am having a car. 却不行？（提示：这两个 have 是同一个意思吗？）"}], "quiz": [{"id": 1, "type": "multi", "point": "现在进行时的结构（想一想·刁钻）", "stem": "下列句子结构<b>完整正确<\/b>的有（　）【多选】", "options": ["A. He is reading a book.", "B. He reading a book.", "C. He is read a book.", "D. They are playing football.", "E. I am doing my homework."], "answer": ["A", "D", "E"], "explain": "现在进行时必须是 <b>be + 动词ing<\/b> 两半齐全。B 缺 be 动词；C 动词没加 ing。A、D、E 都完整。检查这类题就数两样东西：有没有 be、动词有没有 ing。"}, {"id": 2, "type": "multi", "point": "动词加 ing 的规则（想一想·刁钻）", "stem": "下列 ing 形式<b>拼写正确<\/b>的有（　）【多选】", "options": ["A. writing", "B. runing", "C. swimming", "D. coming", "E. lieing"], "answer": ["A", "C", "D"], "explain": "A 对：write 去 e 加 ing。B 错：run 是重读闭音节要双写 → running。C 对：swim 双写 → swimming。D 对：come 去 e。E 错：lie 以 ie 结尾要 ie 变 y → <b>lying<\/b>。这四条规则各考一次，错一条就丢分。"}, {"id": 3, "type": "multi", "point": "进行时的疑问与否定（想一想·刁钻）", "stem": "下列变形<b>正确<\/b>的有（　）【多选】", "options": ["A. He is reading. → Is he reading?", "B. He is reading. → Does he reading?", "C. He is reading. → He isn’t reading.", "D. He is reading. → He doesn’t reading.", "E. What are you doing?"], "answer": ["A", "C", "E"], "explain": "句子里有 be 动词，变疑问和否定都动 be，<b>不借助 do / does<\/b>。所以 B、D 错。口诀：有 be 用 be，无 be 才用 do。"}, {"id": 4, "type": "multi", "point": "两种现在时的区分（想一想·刁钻）", "stem": "下列句子时态用得<b>正确<\/b>的有（　）【多选】", "options": ["A. Look! The baby is crying.", "B. I am going to school every day.", "C. I watch TV every evening.", "D. Listen! Someone is singing.", "E. It rains now."], "answer": ["A", "C", "D"], "explain": "A、D 有 Look! / Listen! 提示此刻正在发生，用进行时。C 有 every evening 表示习惯，用一般现在时。B 错：every day 是习惯 → I <b>go<\/b> to school every day. E 错：now 表示此刻 → It <b>is raining<\/b> now."}, {"id": 5, "type": "multi", "point": "不用进行时的动词（想一想·刁钻）", "stem": "下列句子中，<b>不应该<\/b>用现在进行时的有（　）【多选】", "options": ["A. I am liking this book.", "B. I am having lunch.", "C. I am knowing him.", "D. I am wanting a cake.", "E. I am reading a book."], "answer": ["A", "C", "D"], "explain": "like、know、want 表示<b>状态<\/b>，不用进行时，应改成 I like / I know / I want。B 的 have 意思是“吃”，是动作，可以用进行时。E 完全正常。这题专治“所有动词都能加 ing”的误解。"}, {"id": 6, "type": "choice", "point": "ing 拼写", "stem": "Look! The children ______ in the river.", "options": ["A. swim", "B. swiming", "C. are swimming", "D. is swimming"], "answer": "C", "explain": "Look! 提示用现在进行时；children 是复数用 are；swim 是重读闭音节，双写 m → swimming。四个条件都满足的只有 C。"}, {"id": 7, "type": "choice", "point": "有 be 用 be", "stem": "______ your father watching TV now?", "options": ["A. Does", "B. Do", "C. Is", "D. Are"], "answer": "C", "explain": "句中有 watching，是现在进行时，疑问句提 be 动词。主语 your father 是单数第三人称，用 Is。"}, {"id": 8, "type": "choice", "point": "状态动词", "stem": "I ______ him very well. We are old friends.", "options": ["A. am knowing", "B. know", "C. knows", "D. is knowing"], "answer": "B", "explain": "know 表示状态，不用进行时，排除 A、D。主语 I 不用第三人称单数 knows，排除 C。答案 B。"}, {"id": 9, "type": "fill", "point": "动词 ing 形式", "stem": "写出 write 的现在分词形式：______", "answer": ["writing"], "explain": "write 以不发音的 e 结尾，<b>去 e 加 ing<\/b> → writing。注意不是 writting（那是把 e 结尾误当成重读闭音节双写了）。"}, {"id": 10, "type": "fill", "point": "现在进行时造句", "stem": "用现在进行时填空：Listen! Someone ______ ______ in the next room.（依次填 be 动词和 sing 的正确形式）", "answer": ["is singing"], "explain": "Listen! 提示现在进行时；someone 当单数用 is；sing 直接加 ing → singing。答案 is singing。"}, {"id": 11, "type": "judge", "point": "双写规则的前提", "stem": "所有以“辅音字母结尾”的动词，加 ing 时都要双写最后一个字母。", "answer": "错", "explain": "错。双写有两个前提：<b>重读闭音节<\/b>（辅音+元音+辅音）。run→running ✓ 但 rain→raining（rain 结尾是 ai+n，不是单个元音）；open→opening（重音在前面）。不能一刀切。"}, {"id": 12, "type": "judge", "point": "have 的两种用法", "stem": "I am having lunch. 这句话是正确的。", "answer": "对", "explain": "对。have 表示“拥有”时不用进行时（不能说 I am having a car），但表示“吃、喝、进行”时是动作动词，可以用进行时：have lunch（吃午饭）、have a meeting（开会）、have a bath（洗澡）。"}]}, {"id": "e-c2-s3", "title": "第三节 Lesson 37-42：be going to · 祈使句 · 名词性物主代词", "notes": [{"point": "be going to：打算做某事", "explain": "结构是 <b>am / is / are + going to + 动词原形<\/b>，表示“打算、计划做某事”，也可以表示“根据现有迹象即将发生”。注意 to 后面永远跟<b>动词原形<\/b>。", "examples": [{"tag": "基础", "text": "I <b>am going to<\/b> buy a book.（我打算买本书）／ She <b>is going to<\/b> visit her aunt.（她打算去看姑姑）"}, {"tag": "进阶", "text": "还能表示“看迹象要发生了”：Look at the clouds! It <b>is going to<\/b> rain.（乌云密布，要下雨了）—— 这时不是“计划”，是根据眼前证据做的判断。"}, {"tag": "易错", "text": "“I am going to <u>buying<\/u> a book.” ✗ —— going 已经带 ing 了，后面的 to 是不定式符号，必须跟原形：I am going to <b>buy<\/b> a book. ✓ 一个句子里不能有两个 ing 挤在一起。"}], "think": "I am going to school. 和 I am going to swim. 这两句里的 going to 是同一个东西吗？（提示：一个后面跟名词，一个后面跟动词，意思一样吗？）"}, {"point": "be going to 的否定与疑问", "explain": "和现在进行时一样，动手的是 <b>be 动词<\/b>：否定在 be 后加 not，疑问把 be 提到句首。going to 整块不动。", "examples": [{"tag": "基础", "text": "He is going to swim. → He <b>isn’t<\/b> going to swim. → <b>Is<\/b> he going to swim? → Yes, he is."}, {"tag": "进阶", "text": "问计划用特殊疑问句：<b>What are you going to do<\/b> tomorrow?（你明天打算做什么？）回答 I’m going to play basketball. 这是问计划的标准句型，非常常用。"}, {"tag": "易错", "text": "“<u>Do<\/u> you going to swim?” ✗ —— 句中有 be 动词（are），不需要 do：<b>Are<\/b> you going to swim? ✓ 又是那条口诀：有 be 用 be。"}], "think": "What are you doing? 和 What are you going to do? 只差三个词，问的时间却完全不同——差在哪里？"}, {"point": "祈使句：没有主语的命令句", "explain": "祈使句用来表示<b>命令、请求、建议<\/b>，句子开头直接用<b>动词原形<\/b>，主语 you 省略不写。加 please 会更礼貌（放句首或句末都行）。", "examples": [{"tag": "基础", "text": "<b>Come<\/b> in.（进来）／ <b>Sit<\/b> down, please.（请坐）／ <b>Open<\/b> the door.（开门）—— 开头都是光秃秃的动词原形。"}, {"tag": "进阶", "text": "Let’s + 动词原形 表示“咱们一起做吧”，是提建议：<b>Let’s go<\/b> to the park.（我们去公园吧）注意 Let’s 是 Let us 的缩写，后面同样跟原形。"}, {"tag": "易错", "text": "“<u>Comes<\/u> here.” ✗（祈使句不变形，不用第三人称单数）／ “<u>To come<\/u> here.” ✗（动词前不能加 to）。正确就是 <b>Come<\/b> here. ✓ 另外“You come here!”<b>语法上成立<\/b>（强调式祈使句），但加了 you 语气很冲、像在责备，日常不这么说——这是<b>语气<\/b>问题，不是语法错误，两者要分清。"}], "think": "中文说“你过来”很正常，英语说 You come here! 却显得凶，为什么加一个 you 语气就变了？"}, {"point": "否定祈使句：Don’t 开头", "explain": "祈使句变否定，在句首加 <b>Don’t<\/b>（Do not 的缩写），后面照样跟动词原形。表示“别做某事”。Let’s 的否定是 Let’s not 或 Don’t let’s。", "examples": [{"tag": "基础", "text": "<b>Don’t<\/b> run in the classroom.（别在教室跑）／ <b>Don’t<\/b> be late.（别迟到）／ <b>Don’t<\/b> drop it!（别把它摔了）"}, {"tag": "进阶", "text": "be 动词的祈使句也用 Don’t：肯定是 <b>Be<\/b> quiet.（安静），否定是 <b>Don’t be<\/b> quiet. / <b>Don’t be<\/b> afraid.（别害怕）—— be 在祈使句里也算动词原形，一样归 Don’t 管。"}, {"tag": "易错", "text": "“<u>Not<\/u> run here.” ✗ 或 “<u>Don’t to<\/u> run.” ✗ —— 正确是 <b>Don’t run<\/b> here. ✓ 祈使句的否定只有一种写法：Don’t + 动词原形，既不能光用 not，也不能加 to。"}], "think": "Be quiet. 的否定为什么是 Don’t be quiet. 而不是 Aren’t quiet.？（提示：祈使句里的 be 算什么词性？）"}, {"point": "名词性物主代词：mine / yours / his / hers / ours / theirs", "explain": "名词性物主代词等于“<b>形容词性物主代词 + 名词<\/b>”，它本身就代表了那样东西，<b>后面不能再跟名词<\/b>。my book ＝ mine，your pen ＝ yours。", "examples": [{"tag": "基础", "text": "This is <b>my<\/b> book. ＝ This book is <b>mine<\/b>. ／ That is <b>her<\/b> bag. ＝ That bag is <b>hers<\/b>."}, {"tag": "进阶", "text": "全套对照要背熟：my→mine，your→yours，his→<b>his<\/b>（不变），her→hers，its→its，our→ours，their→theirs。只有 his 和 its 两个形式相同，其余都要加 s 或变形。"}, {"tag": "易错", "text": "“This is <u>mine book<\/u>.” ✗ —— mine 已经包含了“书”的意思，后面不能再跟名词：This is <b>my<\/b> book. ✓ 或 This book is <b>mine<\/b>. ✓ 判断方法：<b>后面有名词用 my，后面没名词用 mine<\/b>。"}], "think": "Whose bag is this? 可以答 It’s mine. 也可以答 It’s my bag. —— 英语为什么要留两种说法？哪一种在对话里更常用？"}], "quiz": [{"id": 1, "type": "multi", "point": "be going to 的结构（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. I am going to buy a book.", "B. I am going to buying a book.", "C. She is going to visit her aunt.", "D. They going to play football.", "E. It is going to rain."], "answer": ["A", "C", "E"], "explain": "be going to 后面必须跟<b>动词原形<\/b>，所以 B 错（buying 应为 buy）。D 缺 be 动词，应为 They <b>are<\/b> going to play. A、C、E 都正确，其中 E 表示“看迹象要下雨了”。"}, {"id": 2, "type": "multi", "point": "be going to 的疑问否定（想一想·刁钻）", "stem": "下列变形<b>正确<\/b>的有（　）【多选】", "options": ["A. Are you going to swim?", "B. Do you going to swim?", "C. He isn’t going to swim.", "D. He doesn’t going to swim.", "E. What are you going to do tomorrow?"], "answer": ["A", "C", "E"], "explain": "句中有 be 动词（are / is），疑问和否定都动 be，不用 do / does。B、D 错。E 是问计划的标准句型。"}, {"id": 3, "type": "multi", "point": "祈使句的形式（想一想·刁钻）", "stem": "下列祈使句<b>正确<\/b>的有（　）【多选】", "options": ["A. Come in, please.", "B. To come in, please.", "C. Comes here.", "D. Let’s go to the park.", "E. Sit down, please."], "answer": ["A", "D", "E"], "explain": "祈使句<b>省略主语、直接用动词原形开头<\/b>。B 错：动词前不能加 to。C 错：祈使句不变形，不用第三人称单数 comes。A、D、E 都是标准写法。<br>补充一个容易混的点：“<b>You come here!<\/b>”其实<b>语法上是成立的<\/b>（叫强调式祈使句），只是加了 you 语气变得很冲、像在责备，日常不会这么说——这属于<b>语气问题<\/b>，和 B、C 的<b>语法错误<\/b>不是一回事，别混为一谈。"}, {"id": 4, "type": "multi", "point": "否定祈使句（想一想·刁钻）", "stem": "下列否定祈使句<b>正确<\/b>的有（　）【多选】", "options": ["A. Don’t run in the classroom.", "B. Not run here.", "C. Don’t be late.", "D. Aren’t late.", "E. Don’t drop it!"], "answer": ["A", "C", "E"], "explain": "否定祈使句只有一种写法：<b>Don’t + 动词原形<\/b>。B 光用 not 不行。D 错在 be 动词的祈使句否定也要用 Don’t：Don’t be late.，不能说 Aren’t late."}, {"id": 5, "type": "multi", "point": "两类物主代词（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. This is my book.", "B. This is mine book.", "C. This book is mine.", "D. That bag is hers.", "E. That is hers bag."], "answer": ["A", "C", "D"], "explain": "判断标准：<b>后面有名词用 my / her，后面没名词用 mine / hers<\/b>。B 错（mine 后不能跟 book），E 错（hers 后不能跟 bag，应为 her bag）。"}, {"id": 6, "type": "choice", "point": "be going to 后跟原形", "stem": "Look at the clouds! It ______ rain.", "options": ["A. is going to", "B. going to", "C. is going", "D. are going to"], "answer": "A", "explain": "主语 It 用 is；结构是 is going to + 动词原形 rain。B 缺 be，C 缺 to，D 的 are 与 It 不匹配。"}, {"id": 7, "type": "choice", "point": "名词性物主代词", "stem": "—Whose pen is this?　—It’s ______.", "options": ["A. her", "B. hers", "C. she", "D. her pen is"], "answer": "B", "explain": "回答里后面<b>没有名词<\/b>，所以要用名词性物主代词 hers（＝ her pen）。her 后面必须跟名词，she 是主格，都不对。"}, {"id": 8, "type": "choice", "point": "否定祈使句", "stem": "______ afraid. The dog is very friendly.", "options": ["A. Not be", "B. Don’t", "C. Don’t be", "D. Aren’t"], "answer": "C", "explain": "afraid 是形容词，需要 be 动词连接；祈使句的否定用 Don’t + 动词原形，be 在这里就是原形，所以是 Don’t be afraid."}, {"id": 9, "type": "choice", "point": "祈使句改否定", "stem": "把 Open the window. 改成否定祈使句，正确的是（　）", "options": ["A. Not open the window.", "B. Don’t open the window.", "C. Doesn’t open the window.", "D. Don’t to open the window."], "answer": "B", "explain": "否定祈使句只有一种写法：<b>Don’t + 动词原形<\/b>（＝ Do not open the window）。A 光用 not 不行；C 祈使句不分人称，不用 doesn’t；D 多加了 to。"}, {"id": 10, "type": "fill", "point": "名词性物主代词转换", "stem": "同义句改写：This is my bag. → This bag is ______.（填一个词）", "answer": ["mine"], "explain": "my bag ＝ mine。改写后 is 的后面没有名词，必须用名词性物主代词 mine。"}, {"id": 11, "type": "judge", "point": "be going to 后的动词形式", "stem": "be going to 后面可以跟动词的 ing 形式，比如 I am going to buying a book.", "answer": "错", "explain": "错。be going to 里的 to 是<b>不定式符号<\/b>，后面必须跟动词原形：I am going to <b>buy<\/b> a book. 一个结构里不会连着出现两个 ing。"}, {"id": 12, "type": "judge", "point": "his 的特殊性", "stem": "形容词性物主代词和名词性物主代词中，只有 his 和 its 两组形式完全相同。", "answer": "对", "explain": "对。my→mine、your→yours、her→hers、our→ours、their→theirs 都要变形，唯独 <b>his→his<\/b>、<b>its→its<\/b> 保持不变。所以 This is his book. 和 This book is his. 里的 his 长得一样但词性不同。"}]}, {"id": "e-c2-s4", "title": "第四节 Lesson 43-48：情态动词 can / must · Do you like...?", "notes": [{"point": "情态动词 can：会、能、可以", "explain": "can 表示<b>能力<\/b>（会做某事）、<b>许可<\/b>（可以做某事）。它后面永远跟<b>动词原形<\/b>，而且 can 本身<b>不随主语变化<\/b>——第三人称也不加 s。", "examples": [{"tag": "基础", "text": "I <b>can<\/b> swim.（我会游泳）／ He <b>can<\/b> speak English.（他会说英语）／ <b>Can<\/b> I use your pen?（我能用你的笔吗）"}, {"tag": "进阶", "text": "否定是 cannot（连写）＝ can’t：I <b>can’t<\/b> swim. 疑问把 can 提到句首：<b>Can<\/b> you swim? 简答 Yes, I can. / No, I can’t. —— 简答里保留 can，不用 do。"}, {"tag": "易错", "text": "“He <u>cans<\/u> swim.” ✗ 或 “He can <u>swims<\/u>.” ✗ —— 情态动词自己不加 s，后面的动词也保持原形：He <b>can swim<\/b>. ✓ 一个句子里只能有一个动词带时态标记，can 已经占了这个位置。"}], "think": "为什么 He speaks English. 要加 s，He can speak English. 就不加 s 了？（提示：加 s 是给谁加的？句子里现在有几个动词？）"}, {"point": "情态动词 must：必须", "explain": "must 表示<b>必须、应该<\/b>，语气比较强，常用于规定和忠告。和 can 一样，后面跟动词原形，本身不变形。", "examples": [{"tag": "基础", "text": "You <b>must<\/b> go to bed now.（你必须去睡觉了）／ We <b>must<\/b> be quiet in the library.（图书馆里必须安静）"}, {"tag": "进阶", "text": "问“我该做什么”用 <b>What must I do?<\/b> 这是课本 Lesson 28 的标题句型。回答常用 You must... 或祈使句：You must wash it. / Wash it."}, {"tag": "易错", "text": "mustn’t 不是“不必”，是<b>“绝对不可以”<\/b>：You <b>mustn’t<\/b> smoke here.（这里禁止吸烟）。要表达“不必”得用 don’t have to：You <b>don’t have to<\/b> come.（你不用来）。这两个意思差得很远，千万别混。"}], "think": "“You mustn’t go.” 和 “You don’t have to go.” 都带否定，一句是“不准走”，一句是“不用走”—— 如果你是老板对员工说，用错了会造成什么误会？"}, {"point": "一般现在时的一般疑问句：Do / Does 出场", "explain": "句子里<b>没有 be 动词、也没有情态动词<\/b>时，变疑问句要借助助动词 do / does。主语是三单（he / she / it / 单数名词）用 <b>Does<\/b>，其余用 <b>Do<\/b>。关键：<b>Does 出现后，主要动词变回原形<\/b>。", "examples": [{"tag": "基础", "text": "You like coffee. → <b>Do<\/b> you like coffee? ／ He likes coffee. → <b>Does<\/b> he <b>like<\/b> coffee?（likes 变回 like）"}, {"tag": "进阶", "text": "简答用 Yes, 主语 + do / does. / No, 主语 + don’t / doesn’t.：Do you like tea? — Yes, I do. / Does she like tea? — No, she doesn’t. 简答里保留 do / does，不重复动词。"}, {"tag": "易错", "text": "“<u>Does he likes<\/u> coffee?” ✗ —— <b>一个句子只需要一个三单标记<\/b>，Does 已经带走了 s，后面的动词必须还原：Does he <b>like<\/b> coffee? ✓ 这是初学阶段最高频的错误之一。"}], "think": "He likes coffee. 变疑问句时，为什么 s 会从 likes 上“搬家”到 Does 上？英语为什么不允许两处都带 s？"}, {"point": "一般现在时的否定句：don’t / doesn’t", "explain": "否定同样借助 do / does：<b>主语 + don’t / doesn’t + 动词原形<\/b>。三单用 doesn’t，其余用 don’t。同样规则：doesn’t 后面的动词还原。", "examples": [{"tag": "基础", "text": "I <b>don’t<\/b> like coffee. ／ He <b>doesn’t<\/b> like coffee.（不是 doesn’t likes）"}, {"tag": "进阶", "text": "有 be 动词的句子否定<b>不用<\/b> do：He is a teacher. → He <b>isn’t<\/b> a teacher.（不是 He doesn’t be）。判断顺序：先找句中有没有 be 或情态动词，有就动它，没有才请 do 出场。"}, {"tag": "易错", "text": "“He <u>doesn’t is<\/u> a teacher.” ✗ 或 “He <u>don’t<\/u> like coffee.” ✗ —— 前者句中已有 be，后者三单要用 doesn’t。正确：He <b>isn’t<\/b> a teacher. ✓ / He <b>doesn’t<\/b> like coffee. ✓"}], "think": "英语里有 be 就动 be、没 be 才用 do —— 你能用这一条规则，把“他不高”和“他不喜欢跑步”两句都翻译对吗？"}, {"point": "like 的常用搭配：like doing / like to do", "explain": "like 后面跟名词或动词都可以。跟动词时有两种形式：<b>like doing<\/b>（一般性地喜欢做某事，是爱好）和 <b>like to do<\/b>（这一次想做某事）。初学阶段两者常可互换，但 like doing 更常用来说爱好。", "examples": [{"tag": "基础", "text": "I like <b>apples<\/b>.（跟名词）／ I like <b>swimming<\/b>.（跟 ing，表示爱好）／ I’d like <b>to swim<\/b>.（此刻想游）"}, {"tag": "进阶", "text": "注意 <b>would like ＝ want<\/b>（想要），后面跟 to do：I <b>would like to<\/b> have a cup of tea.（我想来杯茶）。缩写是 I’d like to...，这是点餐、提要求的高频句型。"}, {"tag": "易错", "text": "“I like <u>swim<\/u>.” ✗ —— like 后面跟动词必须变形，不能用光秃秃的原形：I like <b>swimming<\/b>. ✓ 或 I like <b>to swim<\/b>. ✓ 两条路任选一条，但不能都不走。"}], "think": "I like swimming. 和 I would like to swim. 中文都能翻成“我想游泳”，实际意思差在哪？（提示：一个说的是长期爱好，一个说的是此刻的念头。）"}], "quiz": [{"id": 1, "type": "multi", "point": "情态动词 can 的用法（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. He can swim.", "B. He cans swim.", "C. He can swims.", "D. Can you speak English?", "E. I can’t swim."], "answer": ["A", "D", "E"], "explain": "情态动词 can <b>自己不加 s，后面动词也用原形<\/b>。B 错在 cans，C 错在 swims。A、D、E 都是标准用法。"}, {"id": 2, "type": "multi", "point": "must 与 mustn’t（想一想·刁钻）", "stem": "关于 must 的说法，<b>正确<\/b>的有（　）【多选】", "options": ["A. must 后面跟动词原形。", "B. mustn’t 的意思是“不必”。", "C. mustn’t 的意思是“绝对不可以”。", "D. 表示“不必”应该用 don’t have to。", "E. must 有第三人称单数形式 musts。"], "answer": ["A", "C", "D"], "explain": "B 错、C 对：mustn’t 是<b>禁止<\/b>，不是“不必”。D 对：“不必”用 don’t have to。E 错：情态动词没有三单形式。这题专治 mustn’t 的误解，实际交流中用错会造成大误会。"}, {"id": 3, "type": "multi", "point": "Does 出场后动词还原（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. Does he like coffee?", "B. Does he likes coffee?", "C. Do you like coffee?", "D. He doesn’t like coffee.", "E. He doesn’t likes coffee."], "answer": ["A", "C", "D"], "explain": "<b>一个句子只需要一个三单标记<\/b>：Does / doesn’t 已经带走了 s，后面的动词必须还原成原形。B、E 都犯了“两处都带 s”的错。"}, {"id": 4, "type": "multi", "point": "有 be 用 be，无 be 才用 do（想一想·刁钻）", "stem": "下列否定句<b>正确<\/b>的有（　）【多选】", "options": ["A. He isn’t a teacher.", "B. He doesn’t be a teacher.", "C. He doesn’t like coffee.", "D. He don’t like coffee.", "E. They aren’t students."], "answer": ["A", "C", "E"], "explain": "B 错：句中有 be 动词就动 be，不请 do 出场。D 错：主语 He 是三单，要用 doesn’t。判断顺序永远是：先找 be 或情态动词，找不到才用 do。"}, {"id": 5, "type": "multi", "point": "like 的搭配（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. I like swimming.", "B. I like swim.", "C. I like to swim.", "D. I would like to have a cup of tea.", "E. I would like having tea."], "answer": ["A", "C", "D"], "explain": "like 后跟动词要么用 ing，要么用 to do，<b>不能用光原形<\/b>（B 错）。would like 固定搭配 to do，不跟 ing（E 错）。"}, {"id": 6, "type": "choice", "point": "Does 后动词还原", "stem": "______ your sister ______ English?", "options": ["A. Does, likes", "B. Do, like", "C. Does, like", "D. Is, like"], "answer": "C", "explain": "主语 your sister 是三单 → Does；Does 后面动词还原 → like。A 犯了“两处带 s”的错，B 主语不匹配，D 句中不需要 be。"}, {"id": 7, "type": "choice", "point": "mustn’t 的含义", "stem": "You ______ play football in the street. It’s dangerous.", "options": ["A. mustn’t", "B. don’t have to", "C. can", "D. must"], "answer": "A", "explain": "后半句说“很危险”，所以是<b>禁止<\/b>，用 mustn’t。B 是“不必”，语气完全不对；C、D 意思相反。"}, {"id": 8, "type": "choice", "point": "can 的简答", "stem": "—Can you ride a bike?　—Yes, ______.", "options": ["A. I do", "B. I can ride", "C. I am", "D. I can"], "explain": "问句用什么助动词，简答就用什么。问句是 Can，简答就是 Yes, I can. 不能换成 do 或 am，也不需要重复整个动词。", "answer": "D"}, {"id": 9, "type": "fill", "point": "三单疑问句", "stem": "把 He likes tea. 改成一般疑问句：______ he ______ tea?（依次填两个词）", "answer": ["Does like"], "explain": "主语三单用 Does 开头，同时把 likes 还原成 like。答案 Does / like。这是本节最重要的考点。"}, {"id": 10, "type": "fill", "point": "like 的搭配", "stem": "用 swim 的正确形式填空：I like ______ in the river in summer.（填一个词）", "answer": ["swimming", "to swim"], "explain": "like 后跟动词有两条路：like <b>swimming<\/b>（爱好，更常用）或 like <b>to swim<\/b>。两个答案都算对，但不能填光秃秃的 swim。"}, {"id": 11, "type": "judge", "point": "情态动词不变形", "stem": "主语是第三人称单数时，can 要变成 cans。", "answer": "错", "explain": "错。情态动词（can、must、may 等）<b>没有第三人称单数形式<\/b>，也没有 ing 和过去分词。He can swim. 里的 can 和 I can swim. 里的完全一样。"}, {"id": 12, "type": "judge", "point": "would like 的搭配", "stem": "I would like to have a cup of tea. 中的 would like 相当于 want。", "answer": "对", "explain": "对。would like ＝ want（想要），但语气更委婉客气，所以点餐、提要求时更常用。后面固定跟 <b>to do<\/b>：I’d like to have... / I’d like to go..."}]}, {"id": "e-c2-s5", "title": "第五节 单词总复习（三）：房间家具 · 方位 · 日常动作", "notes": [{"point": "房间与家具类单词", "explain": "Lesson 25-30 集中出现的居家词汇。按“房间”和“家具”两组记，比一个个背高效得多。", "examples": [{"tag": "基础", "text": "房间：kitchen 厨房、living room 客厅、bedroom 卧室、bathroom 浴室、dining room 餐厅、study 书房。"}, {"tag": "进阶", "text": "家具：table 桌子、desk 书桌、chair 椅子、bed 床、sofa 沙发、cupboard 橱柜、fridge 冰箱、stove 炉子、shelf 架子（复数 shelves）、bookcase 书架。"}, {"tag": "易错", "text": "study 有两个意思：作动词是“学习”，作名词是“<b>书房<\/b>”。“He is in the study.” 不是“他在学习中”，而是“他在书房里”。类似的还有 kitchen 不要拼成 kitchin。"}], "think": "living room（客厅）字面是“生活的房间”，bedroom 是“床的房间”—— 英语的房间名几乎都在描述“这个屋子干什么用”，你能照这个思路猜出 washing room 大概是什么吗？"}, {"point": "方位与介词短语", "explain": "描述东西在哪里的高频词组，务必连着介词一起记，别只背单词。", "examples": [{"tag": "基础", "text": "in the box 在盒子里、on the table 在桌上、under the bed 在床下、near the window 在窗边、behind the door 在门后。"}, {"tag": "进阶", "text": "词组要整块记：<b>in front of<\/b> 在……前面（外部）、<b>at the back of<\/b> 在……后部（内部）、<b>next to<\/b> 紧挨着、<b>between...and...<\/b> 在两者之间、<b>in the middle of<\/b> 在……中间。"}, {"tag": "易错", "text": "in front of 和 in the front of 不一样：in front of ＝ 在（某物外面的）前方；in <b>the<\/b> front of ＝ 在（某物内部的）前部。“司机坐在车前排”是 in <b>the<\/b> front of the car；“一棵树在车前面”是 in front of the car。差一个 the，位置差在车里车外。"}], "think": "老师站在教室前面，如果说 in front of the classroom，老师其实站在哪里？想让老师站在讲台上，句子该怎么改？"}, {"point": "日常动作动词", "explain": "现在进行时练习中反复出现的动作动词，背的时候连 ing 形式一起记，省一遍功夫。", "examples": [{"tag": "基础", "text": "read→reading 读、write→writing 写、run→running 跑、swim→swimming 游泳、sit→sitting 坐、eat→eating 吃、drink→drinking 喝、sleep→sleeping 睡。"}, {"tag": "进阶", "text": "带介词的动作短语：<b>look at<\/b> 看（着）、<b>listen to<\/b> 听、<b>look for<\/b> 寻找、<b>put on<\/b> 穿上、<b>take off<\/b> 脱下、<b>get up<\/b> 起床、<b>sit down<\/b> 坐下。介词不能丢：不能说 listen music，必须 listen <b>to<\/b> music。"}, {"tag": "易错", "text": "look / see / watch 三个“看”不一样：<b>look at<\/b> 强调看的动作（有意去看）、<b>see<\/b> 强调看的结果（看见了）、<b>watch<\/b> 强调持续观看（看电视、看比赛）。“看电视”只能用 watch TV，不能说 look at TV 或 see TV。"}], "think": "I look at the blackboard but I can’t see anything. 这句话有没有自相矛盾？（提示：look 和 see 一个说动作，一个说结果。）"}, {"point": "容器与量词表达", "explain": "不可数名词要“论份”才能数，靠的是 <b>a + 容器/单位 + of + 名词<\/b> 这个结构。", "examples": [{"tag": "基础", "text": "a cup of tea 一杯茶、a glass of water 一杯水（玻璃杯）、a bottle of milk 一瓶奶、a piece of bread 一片面包、a bowl of rice 一碗饭。"}, {"tag": "进阶", "text": "变复数时<b>变的是容器不是内容<\/b>：two <b>cups<\/b> of tea（两杯茶，不是 two cup of teas）、three <b>pieces<\/b> of paper（三张纸）。因为被数的是“杯”和“张”。"}, {"tag": "易错", "text": "cup 和 glass 要分清：<b>cup<\/b> 是有把的杯子（喝热饮），<b>glass<\/b> 是玻璃杯（喝冷饮）。“一杯茶”是 a cup of tea，“一杯水”一般是 a glass of water。另外 glass 加 es 变 glasses 还有“眼镜”的意思。"}], "think": "two cups of tea 里加 s 的是 cup 不是 tea —— 如果写成 two cup of teas，字面意思会变成什么奇怪的东西？"}], "quiz": [{"id": 1, "type": "multi", "point": "房间与家具（想一想·刁钻）", "stem": "下列中英对应<b>正确<\/b>的有（　）【多选】", "options": ["A. kitchen — 厨房", "B. study — 书房", "C. study — 楼梯", "D. living room — 客厅", "E. cupboard — 橱柜"], "answer": ["A", "B", "D", "E"], "explain": "C 错：study 作名词是<b>书房<\/b>，作动词才是“学习”，和“楼梯”（stairs）无关。其余对应都正确。"}, {"id": 2, "type": "multi", "point": "方位短语（想一想·刁钻）", "stem": "关于 in front of 与 in the front of，说法<b>正确<\/b>的有（　）【多选】", "options": ["A. in front of the car 指在车外面的前方。", "B. in the front of the car 指在车内部的前排。", "C. 两个短语意思完全一样。", "D. 司机坐的位置应该用 in the front of the car。", "E. 车前面有棵树，应该用 in front of the car。"], "answer": ["A", "B", "D", "E"], "explain": "只有 C 错。多一个 the，位置就从“外面”变到“里面”。这是英语里靠冠词区分意思的经典例子。"}, {"id": 3, "type": "multi", "point": "三个“看”的区别（想一想·刁钻）", "stem": "下列搭配<b>正确<\/b>的有（　）【多选】", "options": ["A. watch TV", "B. look at TV", "C. look at the blackboard", "D. see a film", "E. listen to music"], "answer": ["A", "C", "D", "E"], "explain": "B 错：“看电视”固定用 <b>watch<\/b> TV。look at 强调看的动作、see 强调看见的结果、watch 强调持续观看。E 提醒 listen 后面必须带 to。"}, {"id": 4, "type": "multi", "point": "容器量词的复数（想一想·刁钻）", "stem": "下列表达<b>正确<\/b>的有（　）【多选】", "options": ["A. two cups of tea", "B. two cup of teas", "C. three pieces of paper", "D. three piece of papers", "E. a glass of water"], "answer": ["A", "C", "E"], "explain": "<b>变复数变的是容器，不是内容<\/b>：cups / pieces 加 s，tea / paper 不变（它们是不可数名词）。B、D 把 s 加错了地方。"}, {"id": 5, "type": "choice", "point": "study 的名词义", "stem": "Father is in the ______. He is reading a book.", "options": ["A. study", "B. kitchen", "C. bathroom", "D. bed"], "answer": "A", "explain": "后半句说“在看书”，最合适的房间是 study（书房）。注意这里 study 是名词，不是动词“学习”。"}, {"id": 6, "type": "choice", "point": "listen 的介词", "stem": "Listen ______ me, please.", "options": ["A. at", "B. to", "C. for", "D. 不填"], "answer": "B", "explain": "listen 是不及
