物动词，接宾语必须加介词 <b>to<\/b>：listen to me / listen to music。这个 to 不能省。"}, {"id": 7, "type": "choice", "point": "容器搭配", "stem": "Would you like a ______ of tea?", "options": ["A. glass", "B. piece", "C. cup", "D. bottle"], "answer": "C", "explain": "茶是热饮，装在有把的杯子里，用 <b>cup<\/b>。glass 是玻璃杯（装冷饮），piece 用于面包纸张，bottle 是瓶子。"}, {"id": 8, "type": "fill", "point": "动词 ing 形式", "stem": "写出 sit 的现在分词：______", "answer": ["sitting"], "explain": "sit 是重读闭音节（s-i-t，辅音+元音+辅音），加 ing 要<b>双写<\/b>最后的 t → sitting。"}, {"id": 9, "type": "fill", "point": "方位介词", "stem": "The cat is sleeping ______ the bed. 猫在床<b>底下<\/b>睡觉。（填一个介词）", "answer": ["under"], "explain": "“在……正下方”用 under。in 是在里面，on 是在上面，都不对。"}, {"id": 10, "type": "fill", "point": "看的三个词", "stem": "填空：Every evening my father ______ TV in the living room.（填一个词，表示“看电视”）", "answer": ["watches"], "explain": "“看电视”固定搭配 watch TV；主语 my father 是三单，一般现在时要加 es → watches。这题同时考搭配和三单。"}, {"id": 11, "type": "judge", "point": "study 的词性", "stem": "He is in the study. 这句话的意思是“他正在学习”。", "answer": "错", "explain": "错。in the study 里的 study 是<b>名词“书房”<\/b>，整句是“他在书房里”。“他正在学习”应该说 He is studying."}, {"id": 12, "type": "judge", "point": "cup 与 glass", "stem": "glass 加 es 变成 glasses 后，除了“玻璃杯（复数）”还有“眼镜”的意思。", "answer": "对", "explain": "对。glasses 既可以是 glass 的复数，也可以表示<b>眼镜<\/b>（眼镜有两片镜片，所以天生是复数，和 trousers、shoes 一样）。My glasses <b>are<\/b> new."}]}, {"id": "e-c2-s6", "title": "第六节 单词总复习（四）：食物饮料 · 数字时间 · 常用形容词", "notes": [{"point": "食物与饮料（重点：可数还是不可数）", "explain": "食物类单词最大的考点不是拼写，而是<b>可数不可数<\/b>——它直接决定 be 动词、some/any、how many/how much 怎么用。", "examples": [{"tag": "基础", "text": "可数：apple 苹果、egg 鸡蛋、banana 香蕉、potato 土豆（复数 potatoes）、tomato 西红柿（复数 tomatoes）、biscuit 饼干。"}, {"tag": "进阶", "text": "不可数：bread 面包、milk 牛奶、water 水、tea 茶、coffee 咖啡、rice 米饭、meat 肉、sugar 糖、butter 黄油、cheese 奶酪。它们<b>没有复数形式，永远配单数动词<\/b>。"}, {"tag": "易错", "text": "chicken 有两副面孔：表示“<b>鸡（活的）<\/b>”时可数（two chickens 两只鸡），表示“<b>鸡肉<\/b>”时不可数（some chicken 一些鸡肉）。“I ate two chickens.” 是“我吃了两只整鸡”，说的人可能只是想说吃了点鸡肉。"}], "think": "为什么英语把 bread（面包）算作不可数，却把 biscuit（饼干）算作可数？（提示：想想面包是怎么切出来的，饼干是怎么出现的。）"}, {"point": "how many 与 how much", "explain": "问数量时：<b>How many + 可数名词复数<\/b>；<b>How much + 不可数名词<\/b>。另外 how much 还可以单独用来问价钱。", "examples": [{"tag": "基础", "text": "<b>How many<\/b> apples are there?（几个苹果）／ <b>How much<\/b> milk is there?（多少牛奶）"}, {"tag": "进阶", "text": "问价钱固定用 how much：<b>How much<\/b> is it?（多少钱？）／ <b>How much<\/b> are these shoes? 这里的 how much 后面不跟名词，是固定问法。"}, {"tag": "易错", "text": "“<u>How many<\/u> water do you want?” ✗ —— water 不可数，要用 how much：<b>How much<\/b> water do you want? ✓ 判断只有一步：这个名词能不能加 s，能就用 many，不能就用 much。"}], "think": "How much is it? 这句问价钱的话里，how much 后面省略了什么词？（提示：钱本身可数还是不可数？）"}, {"point": "常用形容词与反义词配对", "explain": "形容词成对记效率最高，做题时看到一个就能想起另一个。", "examples": [{"tag": "基础", "text": "big 大 / small 小、long 长 / short 短、new 新 / old 旧、hot 热 / cold 冷、clean 干净 / dirty 脏、easy 容易 / difficult 难。"}, {"tag": "进阶", "text": "描述人的：young 年轻 / old 年老、tall 高 / short 矮、fat 胖 / thin 瘦、busy 忙 / free 空闲、tired 累的、thirsty 渴的、hungry 饿的、happy 高兴 / sad 难过。"}, {"tag": "易错", "text": "short 有两个反义词：说长度时 short ↔ long（短 / 长），说身高时 short ↔ tall（矮 / 高）。“He is short.” 是“他矮”，“The rope is short.” 是“绳子短”。同一个词，配对对象不同意思就不同。"}], "think": "old 既可以是 new 的反义词，也可以是 young 的反义词 —— an old man 和 an old book 里的 old 是同一个意思吗？"}, {"point": "基数词与序数词", "explain": "基数词表示<b>数量<\/b>（one, two, three），序数词表示<b>顺序<\/b>（first, second, third）。序数词前面通常要加 the。", "examples": [{"tag": "基础", "text": "1-10：one, two, three, four, five, six, seven, eight, nine, ten。序数：first, second, third, fourth, fifth, sixth, seventh, eighth, ninth, tenth。"}, {"tag": "进阶", "text": "一般规律是基数词加 th，但有四个特殊的必须单独记：one→<b>first<\/b>、two→<b>second<\/b>、three→<b>third<\/b>、five→<b>fifth<\/b>（去 e 加 fth）、nine→<b>ninth<\/b>（去 e）、twelve→<b>twelfth<\/b>（ve 变 f）。"}, {"tag": "易错", "text": "整十的数字变序数要<b>把 y 变成 ie 再加 th<\/b>：twenty→<b>twentieth<\/b>、thirty→<b>thirtieth<\/b>。写成 twentyth ✗ 是常见错误。另外 8 的序数是 eighth（只加一个 h，不是 eightth）。"}], "think": "序数词前面几乎总要加 the（the first, the second），你觉得为什么？（提示：说“第一”的时候，是不是全世界只有一个“第一”？）"}], "quiz": [{"id": 1, "type": "multi", "point": "可数与不可数（想一想·刁钻）", "stem": "下列名词属于<b>不可数名词<\/b>的有（　）【多选】", "options": ["A. bread", "B. apple", "C. milk", "D. rice", "E. egg"], "answer": ["A", "C", "D"], "explain": "bread、milk、rice 都是不可数名词，没有复数形式，配单数 be 动词。apple 和 egg 可数，能说 two apples / three eggs。判断诀窍：能不能直接加 s。"}, {"id": 2, "type": "multi", "point": "how many 与 how much（想一想·刁钻）", "stem": "下列问法<b>正确<\/b>的有（　）【多选】", "options": ["A. How many apples are there?", "B. How much water do you want?", "C. How many water do you want?", "D. How much is it?", "E. How many milk is there?"], "answer": ["A", "B", "D"], "explain": "C、E 都把不可数名词（water、milk）配了 how many。规则只有一条：<b>可数复数用 many，不可数用 much<\/b>。D 是问价钱的固定说法。"}, {"id": 3, "type": "multi", "point": "形容词反义词（想一想·刁钻）", "stem": "关于 short 的反义词，说法<b>正确<\/b>的有（　）【多选】", "options": ["A. 说身高时 short 的反义词是 tall。", "B. 说长度时 short 的反义词是 long。", "C. short 只有一个反义词。", "D. He is short. 意思是他个子矮。", "E. The rope is short. 意思是绳子短。"], "answer": ["A", "B", "D", "E"], "explain": "只有 C 错。short 有<b>两个<\/b>反义词，看它在描述什么：描述人的身高配 tall，描述物体长度配 long。这类“一词两配”的形容词还有 old（↔new / ↔young）。"}, {"id": 4, "type": "multi", "point": "序数词的特殊变化（想一想·刁钻）", "stem": "下列序数词<b>拼写正确<\/b>的有（　）【多选】", "options": ["A. first", "B. fifth", "C. ninth", "D. twentyth", "E. eighth"], "answer": ["A", "B", "C", "E"], "explain": "D 错：整十数变序数要<b>把 y 变 ie 再加 th<\/b> → twentieth。其余都对，注意 fifth（five 去 e 加 fth）、ninth（nine 去 e）、eighth（只加一个 h）都是必须单独记的特殊形式。"}, {"id": 5, "type": "choice", "point": "chicken 的两种词性", "stem": "There are two ______ in the garden. 花园里有两只鸡。", "options": ["A. chicken", "B. chickens", "C. chicken meat", "D. some chicken"], "answer": "B", "explain": "这里指“两只活鸡”，chicken 作<b>可数名词<\/b>，复数加 s → chickens。如果说 some chicken，意思会变成“一些鸡肉”。"}, {"id": 6, "type": "choice", "point": "不可数名词的谓语", "stem": "There ______ some bread on the plate.", "options": ["A. are", "B. is", "C. am", "D. have"], "answer": "B", "explain": "bread 是不可数名词，永远当单数看，用 is。不要被 some 迷惑——some 后面既可以跟复数也可以跟不可数。"}, {"id": 7, "type": "choice", "point": "问价钱", "stem": "—______ are these shoes?　—They are 200 yuan.", "options": ["A. How many", "B. How long", "C. How old", "D. How much"], "answer": "D", "explain": "回答是价钱，问价钱固定用 <b>How much<\/b>，不管商品本身可数不可数。这是 how much 的第二种用法。"}, {"id": 8, "type": "fill", "point": "名词复数", "stem": "写出 potato 的复数形式：______", "answer": ["potatoes"], "explain": "以 o 结尾的名词，有生命的加 <b>es<\/b>：potato→potatoes、tomato→tomatoes、hero→heroes；无生命的加 s：photo→photos、piano→pianos。口诀“英雄爱吃西红柿土豆”。"}, {"id": 9, "type": "fill", "point": "序数词", "stem": "写出 five 对应的序数词：______", "answer": ["fifth"], "explain": "five 变序数词要<b>去掉 e，把 v 改成 f，再加 th<\/b> → fifth。同类特殊变化：twelve→twelfth。"}, {"id": 10, "type": "fill", "point": "how much 与 how many", "stem": "填空：______ ______ milk do you want?（依次填两个词，问“要多少牛奶”）", "answer": ["How much"], "explain": "milk 是不可数名词，问数量用 How much。如果换成 apples 就要用 How many。"}, {"id": 11, "type": "judge", "point": "不可数名词的复数", "stem": "bread 可以加 s 变成 breads，表示“很多面包”。", "answer": "错", "explain": "错。bread 是<b>不可数名词，没有复数形式<\/b>。要表达“很多面包”，可以说 much bread、a lot of bread，或者论份数：three <b>pieces<\/b> of bread（三片面包）。"}, {"id": 12, "type": "judge", "point": "chicken 的可数性", "stem": "chicken 表示“鸡肉”时不可数，表示“鸡（这种动物）”时可数。", "answer": "对", "explain": "对。这类“一词两性”的名词还有：fish（鱼／鱼肉）、hair（一根头发可数／整头头发不可数）、paper（纸不可数／报纸可数）。做题时要先看句子说的是哪个意思。"}]}]}, {"id": "e-c3", "title": "第三章 Lesson 49-72：一般现在时 · 第三人称单数 · 时间天气", "sections": [{"id": "e-c3-s1", "title": "第一节 Lesson 49-54：一般现在时与第三人称单数", "notes": [{"point": "一般现在时表示什么", "explain": "一般现在时用来说三件事：<b>经常性、习惯性的动作<\/b>（我每天跑步）、<b>客观事实和真理<\/b>（地球是圆的）、<b>目前的状态<\/b>（他住在北京）。它不描述“此刻正在发生”，那是现在进行时的活。", "examples": [{"tag": "基础", "text": "I <b>get up<\/b> at six every day.（习惯）／ The sun <b>rises<\/b> in the east.（真理）／ He <b>lives<\/b> in London.（状态）"}, {"tag": "进阶", "text": "标志词是判断的关键：<b>always<\/b>（总是）、<b>usually<\/b>（通常）、<b>often<\/b>（经常）、<b>sometimes<\/b>（有时）、<b>never<\/b>（从不）、<b>every day / week / year<\/b>、<b>on Sundays<\/b>。看到它们基本就是一般现在时。"}, {"tag": "易错", "text": "“Look! He <u>reads<\/u> a book.” ✗ —— Look! 指的是此刻，要用进行时：Look! He <b>is reading<\/b> a book. ✓ 反过来 “He <u>is going<\/u> to school every day.” ✗ → He <b>goes<\/b> to school every day. ✓ 时间标志和时态必须配对。"}], "think": "“他会游泳”和“他正在游泳”，一个用 He swims well.，一个用 He is swimming. —— 你能再想出三对这样的中文句子，看看英语会怎么分吗？"}, {"point": "第三人称单数加 s 的规则", "explain": "主语是 he / she / it 或<b>单数名词<\/b>时，一般现在时的动词要加 s 或 es。规则和名词变复数几乎一样：① 一般加 s；② 以 s, x, sh, ch, o 结尾加 es；③ 辅音字母 + y 结尾，<b>变 y 为 i 再加 es<\/b>。", "examples": [{"tag": "基础", "text": "read→read<b>s<\/b>、play→play<b>s<\/b>（元音+y 直接加 s）／ watch→watch<b>es<\/b>、go→go<b>es<\/b>、teach→teach<b>es<\/b>／ study→stud<b>ies<\/b>、fly→fl<b>ies<\/b>、carry→carr<b>ies<\/b>。"}, {"tag": "进阶", "text": "两个特殊的必须单独背：have→<b>has<\/b>、be→<b>is<\/b>。它们不按规则走。另外 do→<b>does<\/b>（读音也变），go→<b>goes<\/b>。"}, {"tag": "易错", "text": "play 和 study 都以 y 结尾，处理却不同：play 的 y 前面是元音 a，<b>直接加 s<\/b> → plays；study 的 y 前面是辅音 d，<b>变 y 为 i 加 es<\/b> → studies。看 y 前面那个字母是元音还是辅音，这是唯一的判断依据。"}], "think": "boy 变复数是 boys，study 变三单是 studies —— 同样是 y 结尾，为什么一个直接加 s 一个要变 i？"}, {"point": "什么时候主语算“第三人称单数”", "explain": "第三人称单数不只是 he / she / it，还包括：<b>单数名词<\/b>（Tom、my father、the dog）、<b>不可数名词<\/b>（water、news）、<b>动名词或不定式作主语<\/b>（Swimming is fun.）、<b>this / that + 单数名词<\/b>。", "examples": [{"tag": "基础", "text": "<b>Tom<\/b> likes music. ／ <b>My father<\/b> works in a bank. ／ <b>The dog<\/b> runs fast. —— 都是单数名词，动词都加 s。"}, {"tag": "进阶", "text": "容易被忽略的三单：<b>Everyone<\/b> likes him.（everyone、somebody、nobody 都当单数）／ <b>Swimming<\/b> is good for health.（动名词作主语当单数）／ <b>The news<\/b> is good.（news 看着像复数其实不可数）。"}, {"tag": "易错", "text": "“Tom and Jane <u>likes<\/u> music.” ✗ —— 两个人并列是复数，不加 s：Tom and Jane <b>like<\/b> music. ✓ 但 “My father and mother” 是两个人（复数），“My friend Tom” 是一个人（单数），要看清 and 连的是几个人。"}], "think": "everyone 字面上是“每一个人”，感觉人很多，为什么英语把它当单数？（提示：重点在 every 还是 one？）"}, {"point": "一般现在时的否定与疑问：do / does 全套", "explain": "没有 be 动词、没有情态动词时，否定用 <b>don’t / doesn’t + 动词原形<\/b>，疑问用 <b>Do / Does + 主语 + 动词原形<\/b>。铁律：<b>do / does 一出现，主要动词立刻还原<\/b>。", "examples": [{"tag": "基础", "text": "He likes tea. → He <b>doesn’t like<\/b> tea. → <b>Does<\/b> he <b>like<\/b> tea? → Yes, he does. / No, he doesn’t."}, {"tag": "进阶", "text": "特殊疑问句同样要用助动词：<b>What does<\/b> he <b>do<\/b>?（他做什么工作？）／ <b>Where does<\/b> she <b>live<\/b>?（她住哪儿？）／ <b>When do<\/b> you <b>get up<\/b>?（你几点起床？）注意后面的动词一律原形。"}, {"tag": "易错", "text": "三处最容易错：① “Does he <u>likes<\/u>?” ✗ 动词没还原；② “He <u>don’t<\/u> like.” ✗ 三单要用 doesn’t；③ “<u>Do<\/u> he like?” ✗ 三单要用 Does。三个错各占一个位置，做题时逐个检查。"}], "think": "He likes tea. 一共只有一个 s，但变成疑问句后 s 跑到了 Does 上 —— 英语为什么坚持“全句只能有一个 s”？"}, {"point": "What do you do? 问职业", "explain": "问职业有几种常用问法，含义略有区别：<b>What do you do?<\/b>（你做什么工作？最口语）／ <b>What is your job?<\/b>（你的工作是什么？）／ <b>What are you?<\/b>（你是干什么的？稍旧式）。回答用 I’m a / an + 职业。", "examples": [{"tag": "基础", "text": "—What do you do? —I’m a teacher. ／ —What does your father do? —He’s a doctor."}, {"tag": "进阶", "text": "问“在哪里工作”用 Where do you work? 回答 I work in a hospital. 问“为谁工作”用 Who do you work for? 三个问题问的角度不同，别混着答。"}, {"tag": "易错", "text": "职业名词前面<b>必须加冠词<\/b>：“I’m <u>teacher<\/u>.” ✗ → I’m <b>a<\/b> teacher. ✓ 元音音素开头的加 an：I’m <b>an<\/b> engineer. / <b>an<\/b> actor. 这条规则中文里没有，最容易漏。"}], "think": "What do you do? 这句话里出现了两个 do，它们的作用一样吗？哪一个是助动词，哪一个是实义动词？"}], "quiz": [{"id": 1, "type": "multi", "point": "一般现在时与进行时的选择（想一想·刁钻）", "stem": "下列句子时态<b>正确<\/b>的有（　）【多选】", "options": ["A. He goes to school every day.", "B. He is going to school every day.", "C. Look! He is reading a book.", "D. Look! He reads a book.", "E. The sun rises in the east."], "answer": ["A", "C", "E"], "explain": "B 错：every day 表习惯，用一般现在时 goes。D 错：Look! 指此刻，用进行时 is reading。E 是客观真理，永远用一般现在时。<b>先找时间标志词，再定时态<\/b>。"}, {"id": 2, "type": "multi", "point": "三单加 s 的规则（想一想·刁钻）", "stem": "下列第三人称单数形式<b>正确<\/b>的有（　）【多选】", "options": ["A. plays", "B. studys", "C. studies", "D. goes", "E. haves"], "answer": ["A", "C", "D"], "explain": "B 错：study 的 y 前面是辅音 d，要变 y 为 i 加 es → studies（C 对）。E 错：have 的三单是特殊形式 <b>has<\/b>。A 对：play 的 y 前是元音 a，直接加 s。"}, {"id": 3, "type": "multi", "point": "哪些主语算三单（想一想·刁钻）", "stem": "下列句子中，<b>动词应该加 s<\/b> 的有（　）【多选】", "options": ["A. Tom ______ music.（like）", "B. Tom and Jane ______ music.（like）", "C. Everyone ______ him.（like）", "D. They ______ music.（like）", "E. Swimming ______ good for health.（be）"], "answer": ["A", "C", "E"], "explain": "A 单数名词、C everyone 当单数、E 动名词作主语当单数，都要三单形式（likes / likes / is）。B 两个人并列是复数，D 的 they 是复数，都用原形。"}, {"id": 4, "type": "multi", "point": "do/does 疑问否定（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. Does he like tea?", "B. Does he likes tea?", "C. He doesn’t like tea.", "D. He don’t like tea.", "E. Where does she live?"], "answer": ["A", "C", "E"], "explain": "B 错：Does 出现后动词还原成 like。D 错：主语 He 是三单要用 doesn’t。E 对：特殊疑问句同样是 does + 原形。三个高频错点这题占了两个。"}, {"id": 5, "type": "multi", "point": "问职业的说法（想一想·刁钻）", "stem": "下列问职业或回答的说法<b>正确<\/b>的有（　）【多选】", "options": ["A. What do you do?", "B. What is your job?", "C. I’m teacher.", "D. I’m a teacher.", "E. I’m an engineer."], "answer": ["A", "B", "D", "E"], "explain": "只有 C 错：职业名词前<b>必须加冠词<\/b>，I’m <b>a<\/b> teacher. 元音音素开头用 an（an engineer / an actor / an artist）。中文没有冠词，这条最容易漏。"}, {"id": 6, "type": "choice", "point": "三单拼写", "stem": "My sister ______ English every evening.", "options": ["A. study", "B. studys", "C. studies", "D. studying"], "answer": "C", "explain": "主语 My sister 是三单；study 的 y 前面是辅音字母 d，要<b>变 y 为 i 再加 es<\/b> → studies。"}, {"id": 7, "type": "choice", "point": "does 后动词还原", "stem": "—What ______ your father ______?　—He’s a doctor.", "options": ["A. does, do", "B. does, does", "C. do, do", "D. is, do"], "answer": "A", "explain": "第一个 do 是<b>助动词<\/b>，随主语 your father（三单）变成 does；第二个 do 是<b>实义动词<\/b>“做（工作）”，跟在 does 后面必须用原形。"}, {"id": 8, "type": "choice", "point": "everyone 的数", "stem": "Everyone in our class ______ English.", "options": ["A. like", "B. do like", "C. are liking", "D. likes"], "answer": "D", "explain": "everyone（以及 somebody、nobody、anyone）都当<b>第三人称单数<\/b>看，动词加 s。别被后面的 in our class 干扰——那只是修饰语，不是主语。"}, {"id": 9, "type": "fill", "point": "三单形式", "stem": "写出 have 的第三人称单数形式：______", "answer": ["has"], "explain": "have 的三单是特殊形式 <b>has<\/b>，不加 s 也不加 es。这是必须单独背的两个不规则之一（另一个是 be→is）。"}, {"id": 10, "type": "fill", "point": "一般现在时否定", "stem": "把 She likes coffee. 改成否定句：She doesn’t ______ coffee.（填一个词）", "answer": ["like"], "explain": "三单否定用 doesn’t，而且 <b>doesn’t 一出现，动词必须还原成原形<\/b>：likes → <b>like<\/b>。写成 doesn’t likes 就犯了「一个句子出现两个三单标记」的错。"}, {"id": 11, "type": "judge", "point": "并列主语的数", "stem": "Tom and Jane 作主语时是复数，动词不加 s，应该说 Tom and Jane like music。", "answer": "对", "explain": "对。<b>and 连接两个人是复数<\/b>，动词用原形。但如果 and 连接的是<b>同一个人的两个身份<\/b>，就当单数看：The writer and teacher <b>is<\/b> here.（同一人既是作家又是老师）。"}, {"id": 12, "type": "judge", "point": "y 结尾的处理", "stem": "所有以 y 结尾的动词，变第三人称单数时都要把 y 变成 i 再加 es。", "answer": "错", "explain": "错。要看 <b>y 前面是元音还是辅音<\/b>：辅音+y 才变 i 加 es（study→studies、fly→flies）；元音+y 直接加 s（play→plays、say→says、buy→buys）。一刀切就会错。"}]}, {"id": "e-c3-s2", "title": "第二节 Lesson 55-60：频度副词 · 时间表达 · 介词 in/on/at", "notes": [{"point": "频度副词的位置", "explain": "always（总是）、usually（通常）、often（经常）、sometimes（有时）、seldom（很少）、never（从不）表示动作发生的频率。位置规律：<b>在 be 动词和情态动词之后，在实义动词之前<\/b>。", "examples": [{"tag": "基础", "text": "He is <b>always<\/b> late.（be 之后）／ He <b>often<\/b> goes to school by bike.（实义动词之前）／ I can <b>never<\/b> understand him.（情态动词之后）"}, {"tag": "进阶", "text": "sometimes 比较自由，可以放句首或句末：<b>Sometimes<\/b> I go swimming. ＝ I <b>sometimes<\/b> go swimming. ＝ I go swimming <b>sometimes<\/b>. 但 always 和 never 一般不放句首。"}, {"tag": "易错", "text": "“He <u>goes often<\/u> to school.” ✗ —— 频度副词要放在实义动词<b>前面<\/b>：He <b>often goes<\/b> to school. ✓ 记法：<b>助动词、be 动词后面站，实义动词前面站<\/b>。"}], "think": "He is always late. 和 He always is late. 只差一个词的位置，为什么第二句英语母语者听着别扭？"}, {"point": "never 本身就是否定", "explain": "never（从不）已经包含否定意思，句子里<b>不能再出现 not<\/b>，也不需要 don’t。这类词还有 seldom（很少）、hardly（几乎不）、no、nothing、nobody。", "examples": [{"tag": "基础", "text": "I <b>never<\/b> go there.（我从不去那儿）—— 不说 I don’t never go there."}, {"tag": "进阶", "text": "含 never 的句子变反义疑问句时要用<b>肯定<\/b>形式：He never comes late, <b>does he<\/b>?（因为 never 已经让句子是否定的了）"}, {"tag": "易错", "text": "“I <u>don’t never<\/u> go there.” ✗ —— 英语<b>不允许双重否定<\/b>（中文的“我从来不去”只有一个否定词也够了）。正确：I <b>never<\/b> go there. ✓ 或 I <b>don’t<\/b> go there. ✓ 二选一。"}], "think": "中文可以说“我一次都没有不去过”（双重否定表肯定），英语的 I don’t never go 却直接被判错——你觉得英语为什么禁止这种说法？"}, {"point": "时间介词 in / on / at 三分法", "explain": "<b>at<\/b> 用于<b>具体时刻<\/b>（at six o’clock）；<b>on<\/b> 用于<b>具体某一天<\/b>（on Monday, on May 1st）；<b>in<\/b> 用于<b>较长时段<\/b>（in the morning, in May, in 2026）。口诀：<b>点用 at，天用 on，长段用 in<\/b>。", "examples": [{"tag": "基础", "text": "<b>at<\/b> 7 o’clock、<b>at<\/b> noon、<b>at<\/b> night ／ <b>on<\/b> Monday、<b>on<\/b> Sunday morning ／ <b>in<\/b> the morning、<b>in<\/b> summer、<b>in<\/b> 2026"}, {"tag": "进阶", "text": "有一个重要交叉：一般说 <b>in<\/b> the morning，但如果morning前面有<b>具体某一天<\/b>作限定，就要改用 on：<b>on<\/b> Sunday morning、<b>on<\/b> the morning of May 1st。“天”的属性压过“时段”的属性。"}, {"tag": "易错", "text": "at night（在夜里）不用 in，这是固定搭配；但 in the night 也存在，指“在那个夜晚过程中”。初学阶段记 <b>at night<\/b> ✓ 就够了。另外 “<u>in<\/u> Monday” ✗ → <b>on<\/b> Monday ✓。"}], "think": "in the morning 用 in，on Sunday morning 却用 on —— 同一个 morning，为什么加了 Sunday 介词就变了？"}, {"point": "怎么说时间（几点几分）", "explain": "两种说法：① <b>直接读数字<\/b>（最简单）：7:15 → seven fifteen；② <b>分钟 + past / to + 小时<\/b>：<b>past<\/b> 用于 30 分及以内（“几点过几分”），<b>to<\/b> 用于 30 分以上（“差几分到几点”）。", "examples": [{"tag": "基础", "text": "7:00 → seven o’clock ／ 7:15 → a quarter <b>past<\/b> seven ／ 7:30 → half <b>past<\/b> seven ／ 7:45 → a quarter <b>to<\/b> eight（差一刻到八点）"}, {"tag": "进阶", "text": "quarter ＝ 一刻（15分），half ＝ 半（30分）。用 to 的时候<b>小时数要加一<\/b>：7:45 说的是“差 15 分到 8 点”，所以是 to eight 不是 to seven。这是最容易错的一步。"}, {"tag": "易错", "text": "“7:45 → a quarter <u>to seven<\/u>” ✗ —— to 表示“还差多少到下一个整点”，7:45 差 15 分到 <b>8<\/b> 点：a quarter <b>to eight<\/b> ✓ 判断口诀：<b>看到 to，小时加一<\/b>。"}], "think": "为什么英语要发明 to 这种“倒着数”的说法？（提示：想想你等公交时是想知道“已经过了几分”，还是“还有几分”？）"}, {"point": "问时间与问日期", "explain": "问时刻：<b>What time is it?<\/b> ＝ <b>What’s the time?<\/b> 回答 It’s seven o’clock. 问星期：<b>What day is it today?<\/b> 回答 It’s Monday. 问日期：<b>What’s the date today?<\/b> 回答 It’s May 1st.", "examples": [{"tag": "基础", "text": "—What time is it? —It’s half past eight. ／ —What day is it today? —It’s Friday."}, {"tag": "进阶", "text": "三个问题问的东西完全不同，别答串：day 问<b>星期<\/b>，date 问<b>日期<\/b>，time 问<b>时刻<\/b>。另外回答时间的句子主语一律用 <b>It<\/b>（It’s eight o’clock.），这个 it 指时间，不能省。"}, {"tag": "易错", "text": "“—What day is it today? —<u>It’s May 1st.<\/u>” ✗ —— 问的是星期，该答 It’s Monday.；问日期才用 What’s the <b>date<\/b>? 一个词之差，答案完全不同。"}], "think": "英语回答时间、天气、距离时都要用 It 开头（It’s eight o’clock. / It’s cold. / It’s five kilometres.）—— 这个 it 到底指什么？"}], "quiz": [{"id": 1, "type": "multi", "point": "频度副词的位置（想一想·刁钻）", "stem": "下列句子中频度副词位置<b>正确<\/b>的有（　）【多选】", "options": ["A. He is always late.", "B. He always is late.", "C. He often goes to school by bike.", "D. He goes often to school by bike.", "E. I can never understand him."], "answer": ["A", "C", "E"], "explain": "规律是<b>be 动词和情态动词之后、实义动词之前<\/b>。B 把副词放到 be 前面了，D 放到实义动词后面了。A（be 后）、C（实义动词前）、E（情态动词后）都正确。"}, {"id": 2, "type": "multi", "point": "英语禁止双重否定（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. I never go there.", "B. I don’t never go there.", "C. I don’t go there.", "D. He never comes late, does he?", "E. He seldom doesn’t come."], "answer": ["A", "C", "D"], "explain": "never、seldom 本身就是否定词，句中<b>不能再加 not / don’t<\/b>，所以 B、E 错。D 对：含 never 的句子已经是否定的，反义疑问句要用肯定形式 does he。"}, {"id": 3, "type": "multi", "point": "时间介词三分法（想一想·刁钻）", "stem": "下列时间介词用得<b>正确<\/b>的有（　）【多选】", "options": ["A. at seven o’clock", "B. in Monday", "C. on Monday", "D. in the morning", "E. on Sunday morning"], "answer": ["A", "C", "D", "E"], "explain": "只有 B 错：具体某一天用 <b>on<\/b>。E 是重要交叉点——morning 本来配 in，但被 Sunday 限定成“具体某一天的早上”后，要改用 on。“天”的属性压过“时段”的属性。"}, {"id": 4, "type": "multi", "point": "past 与 to 的时间读法（想一想·刁钻）", "stem": "下列时间读法<b>正确<\/b>的有（　）【多选】", "options": ["A. 7:15 — a quarter past seven", "B. 7:30 — half past seven", "C. 7:45 — a quarter to seven", "D. 7:45 — a quarter to eight", "E. 8:00 — eight o’clock"], "answer": ["A", "B", "D", "E"], "explain": "只有 C 错。to 表示“还差多少到<b>下一个<\/b>整点”，7:45 是差 15 分到 8 点，所以是 a quarter to <b>eight<\/b>。口诀：<b>看到 to，小时加一<\/b>。"}, {"id": 5, "type": "multi", "point": "三种问时间的说法（想一想·刁钻）", "stem": "下列问答配对<b>正确<\/b>的有（　）【多选】", "options": ["A. What time is it? — It’s eight o’clock.", "B. What day is it today? — It’s Monday.", "C. What day is it today? — It’s May 1st.", "D. What’s the date today? — It’s May 1st.", "E. What’s the time? — It’s half past six."], "answer": ["A", "B", "D", "E"], "explain": "只有 C 错配：<b>day 问星期，date 问日期，time 问时刻<\/b>。问 What day 要答星期（Monday），问日期才答 May 1st。"}, {"id": 6, "type": "choice", "point": "频度副词位置", "stem": "My father ______ goes to work by car.", "options": ["A. is usually", "B. does usually", "C. usually is", "D. usually"], "answer": "D", "explain": "goes 是实义动词，频度副词放在它<b>前面<\/b>：usually goes。句中没有 be 动词，也不需要 does。"}, {"id": 7, "type": "choice", "point": "时间介词", "stem": "We have a meeting ______ Monday afternoon.", "options": ["A. in", "B. at", "C. on", "D. for"], "answer": "C", "explain": "afternoon 本来配 in，但这里被 Monday 限定成“具体某一天的下午”，要改用 <b>on<\/b>。同理 on Sunday morning、on the evening of May 1st。"}, {"id": 8, "type": "choice", "point": "时刻读法", "stem": "9:40 的正确读法是：", "options": ["A. twenty to nine", "B. twenty to ten", "C. forty past nine", "D. twenty past ten"], "answer": "B", "explain": "9:40 距离 10:00 还差 20 分钟，所以是 twenty <b>to ten<\/b>（小时加一）。C 的说法不地道——超过 30 分就该改用 to。"}, {"id": 9, "type": "fill", "point": "时间介词", "stem": "填空：I get up ______ six o’clock every day.（填一个介词）", "answer": ["at"], "explain": "six o’clock 是<b>具体时刻<\/b>，用 at。口诀：点用 at，天用 on，长段用 in。"}, {"id": 10, "type": "fill", "point": "频度副词", "stem": "填空（表示“从不”）：He ______ eats breakfast. He always gets up late.（填一个词）", "answer": ["never"], "explain": "“从不”用 never，放在实义动词 eats 前面。注意 never 本身是否定词，不能再加 doesn’t。"}, {"id": 11, "type": "judge", "point": "双重否定", "stem": "I don’t never go there. 这句话表示“我从不去那儿”，是正确的英语。", "answer": "错", "explain": "错。英语<b>不允许双重否定<\/b>。never 已经是否定词，不能再配 don’t。正确说法二选一：I <b>never<\/b> go there. 或 I <b>don’t<\/b> go there."}, {"id": 12, "type": "judge", "point": "past 与 to 的分界", "stem": "读时间时，分钟数超过 30 就要改用 to，并且小时数要加一。", "answer": "对", "explain": "对。30 分及以内用 past（几点过几分），超过 30 分用 to（差几分到下一点），且<b>小时加一<\/b>。例如 7:50 → ten to eight（差 10 分到 8 点）。"}]}, {"id": "e-c3-s3", "title": "第三节 Lesson 61-66：天气 · What's the matter · 身体不适", "notes": [{"point": "用 It 说天气", "explain": "描述天气、时间、温度、距离时，英语必须用 <b>It<\/b> 作主语，这个 it 不指任何具体东西，叫“非人称主语”。中文不需要主语，英语必须有。", "examples": [{"tag": "基础", "text": "<b>It’s<\/b> sunny today.（今天晴）／ <b>It’s<\/b> raining.（正在下雨）／ <b>It’s<\/b> cold.（很冷）／ <b>It’s<\/b> five kilometres from here.（离这五公里）"}, {"tag": "进阶", "text": "问天气用 <b>What’s the weather like<\/b> (today)? 或 <b>How’s the weather<\/b> (today)? 回答 It’s fine. / It’s cloudy. 注意 like 在这里是介词“像”，不能省。"}, {"tag": "易错", "text": "“<u>Today is rain.<\/u>” ✗ 中式英语 —— rain 是名词/动词，不能直接当表语。正确说法：<b>It’s raining.<\/b>（正在下雨）或 <b>It’s rainy.<\/b>（是雨天，rainy 是形容词）。天气句一律用 It 开头。"}], "think": "中文说“下雨了”不需要主语，英语却必须说 It’s raining. —— 这个 it 到底指的是什么？如果去掉会怎样？"}, {"point": "天气词的名词与形容词形式", "explain": "很多天气词有名词和形容词两种形式，用法不同：<b>名词<\/b>跟在 There is 后或作主语，<b>形容词<\/b>跟在 be 动词后。规律是名词加 y 变形容词。", "examples": [{"tag": "基础", "text": "rain→rainy（雨/多雨的）、sun→sunny（太阳/晴朗的）、cloud→cloudy（云/多云的）、wind→windy（风/有风的）、snow→snowy（雪/下雪的）、fog→foggy（雾/有雾的）。"}, {"tag": "进阶", "text": "注意双写：sun→su<b>nn<\/b>y、fog→fo<b>gg<\/b>y（重读闭音节双写辅音）；但 cloud→cloudy、wind→windy 不双写（结尾是两个辅音或长元音）。和动词加 ing 的规则同源。"}, {"tag": "易错", "text": "“It’s <u>rain<\/u> today.” ✗ —— be 动词后面要跟形容词：It’s <b>rainy<\/b> today. ✓ 或者用进行时 It’s <b>raining<\/b>. ✓ 三种形式（rain / rainy / raining）各有各的位置，别用混。"}], "think": "It’s rainy. 和 It’s raining. 都能翻译成“下雨”，你觉得哪一句更强调“此刻正在下”？"}, {"point": "What’s the matter? 问怎么了", "explain": "<b>What’s the matter (with you)?<\/b> ＝ <b>What’s wrong (with you)?<\/b> ＝ 你怎么了？用来问对方遇到什么问题或哪里不舒服。回答常用 I have a... 说明症状。", "examples": [{"tag": "基础", "text": "—What’s the matter <b>with<\/b> you? —I <b>have<\/b> a headache.（我头疼）／ —What’s wrong with him? —He has a cold.（他感冒了）"}, {"tag": "进阶", "text": "注意介词是 <b>with<\/b>，不是 to 或 of：What’s the matter <b>with<\/b> your car?（你的车怎么了？）这个句型也能问东西，不只问人。"}, {"tag": "易错", "text": "回答症状时<b>要用 have，不用 be<\/b>：“I <u>am<\/u> a headache.” ✗ → I <b>have<\/b> a headache. ✓ 但形容词症状用 be：I <b>am<\/b> tired.（累）／ I <b>am<\/b> ill.（病了）。判断标准：<b>名词症状配 have，形容词症状配 be<\/b>。"}], "think": "I have a cold.（我感冒了）和 I am cold.（我很冷）只差一个词，意思却天差地别——你能说出这两句里 cold 的词性各是什么吗？"}, {"point": "身体不适的常用表达", "explain": "看病、说症状是新概念第一册的高频场景，配套表达要整块记。", "examples": [{"tag": "基础", "text": "have a cold 感冒、have a headache 头疼、have a toothache 牙疼、have a stomachache 胃疼、have a fever 发烧、have a cough 咳嗽、have a sore throat 嗓子疼。"}, {"tag": "进阶", "text": "医生常说的话：<b>Open your mouth.<\/b>（张嘴）／ <b>Take this medicine three times a day.<\/b>（一天吃三次药）／ <b>Stay in bed.<\/b>（卧床休息）／ <b>You’ll be all right soon.<\/b>（很快就好了）"}, {"tag": "易错", "text": "ache 类词都是<b>可数名词，前面要加 a<\/b>：have <b>a<\/b> headache ✓ / have <b>a<\/b> toothache ✓。但 have a fever 里的 fever 也加 a。唯独 have 一些不可数症状不加：have flu（流感）。初学阶段记“ache 类都加 a”即可。"}], "think": "英语说 have a headache（拥有一个头疼），中文说“我头疼”—— 英语为什么把“疼”当成一个可以“拥有”的东西？"}, {"point": "must 与 should 给建议", "explain": "给别人建议时，<b>should<\/b>（应该）语气比 <b>must<\/b>（必须）温和得多。两者后面都跟动词原形，都不随主语变化。", "examples": [{"tag": "基础", "text": "You <b>should<\/b> see a doctor.（你应该看医生——建议）／ You <b>must<\/b> see a doctor.（你必须看医生——强制）"}, {"tag": "进阶", "text": "否定：shouldn’t（不应该，建议别做）／ mustn’t（绝对不可以，禁止）。语气强度：must > should。医生对病人多用 must（专业指示），朋友之间多用 should（友善建议）。"}, {"tag": "易错", "text": "“You should <u>to<\/u> see a doctor.” ✗ —— 情态动词后面直接跟动词原形，<b>不加 to<\/b>：You should <b>see<\/b> a doctor. ✓ 这条规则对 can / must / should / may 全部适用。"}], "think": "医生说 You must stay in bed. 朋友说 You should stay in bed. —— 同一句建议，为什么身份不同用词就不同？"}], "quiz": [{"id": 1, "type": "multi", "point": "It 作非人称主语（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. It’s sunny today.", "B. Today is rain.", "C. It’s raining.", "D. It’s five kilometres from here.", "E. It’s cold in winter."], "answer": ["A", "C", "D", "E"], "explain": "只有 B 错。说天气、时间、温度、距离，英语必须用 <b>It<\/b> 作主语，且 be 后要跟形容词或 ing 形式。B 应改成 It’s <b>rainy<\/b> today. 或 It’s <b>raining<\/b>."}, {"id": 2, "type": "multi", "point": "天气词的形容词形式（想一想·刁钻）", "stem": "下列形容词<b>拼写正确<\/b>的有（　）【多选】", "options": ["A. sunny", "B. suny", "C. cloudy", "D. windy", "E. foggy"], "answer": ["A", "C", "D", "E"], "explain": "只有 B 错：sun 是重读闭音节，加 y 要<b>双写 n<\/b> → sunny。fog→foggy 同理。而 cloud、wind 结尾是两个辅音，不双写。规则和动词加 ing 同源。"}, {"id": 3, "type": "multi", "point": "症状用 have 还是 be（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. I have a headache.", "B. I am a headache.", "C. I have a cold.", "D. I am tired.", "E. I am ill."], "answer": ["A", "C", "D", "E"], "explain": "只有 B 错。判断标准：<b>名词症状配 have<\/b>（a headache、a cold、a fever），<b>形容词症状配 be<\/b>（tired、ill、hungry、thirsty）。看后面那个词的词性就能定。"}, {"id": 4, "type": "multi", "point": "What's the matter 的搭配（想一想·刁钻）", "stem": "下列问法<b>正确<\/b>的有（　）【多选】", "options": ["A. What’s the matter with you?", "B. What’s the matter to you?", "C. What’s wrong with you?", "D. What’s the matter with your car?", "E. What’s the matter of you?"], "answer": ["A", "C", "D"], "explain": "介词固定用 <b>with<\/b>，不能换成 to 或 of。D 说明这个句型不只能问人，也能问东西（你的车怎么了）。"}, {"id": 5, "type": "multi", "point": "情态动词后不加 to（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. You should see a doctor.", "B. You should to see a doctor.", "C. You must stay in bed.", "D. You mustn’t smoke here.", "E. You should to stay in bed."], "answer": ["A", "C", "D"], "explain": "情态动词（can / must / should / may）后面<b>直接跟动词原形，不加 to<\/b>，所以 B、E 错。D 提醒 mustn’t 是“禁止”不是“不必”。"}, {"id": 6, "type": "choice", "point": "问天气", "stem": "—______ the weather like today?　—It’s cloudy.", "options": ["A. What’s", "B. How’s", "C. What", "D. How"], "answer": "A", "explain": "问天气有两种固定说法：<b>What’s the weather like?<\/b>（有 like）或 <b>How’s the weather?<\/b>（没有 like）。这里句末有 like，所以开头用 What’s。"}, {"id": 7, "type": "choice", "point": "症状表达", "stem": "—What’s the matter with Tom?　—He ______ a bad cold.", "options": ["A. is", "B. are", "C. has", "D. have"], "answer": "C", "explain": "a cold 是名词症状，要用 have；主语 He 是三单，所以是 <b>has<\/b>。这题同时考“名词症状配 have”和“三单变形”两个点。"}, {"id": 8, "type": "choice", "point": "天气词词性", "stem": "It’s very ______ today. We can fly kites.", "options": ["A. wind", "B. winding", "C. winds", "D. windy"], "answer": "D", "explain": "It’s 后面要跟<b>形容词<\/b>，wind（名词“风”）要变成 windy（形容词“有风的”）。后半句说“可以放风筝”，语义也对得上。"}, {"id": 9, "type": "fill", "point": "天气形容词", "stem": "写出 sun 对应的形容词形式：______", "answer": ["sunny"], "explain": "sun 是重读闭音节，加 y 前要<b>双写 n<\/b> → sunny（晴朗的）。同理 fog→foggy。"}, {"id": 10, "type": "fill", "point": "症状表达", "stem": "填空：I can’t go to school today. I ______ a headache.（填一个词）", "answer": ["have"], "explain": "a headache 是名词症状，用 <b>have<\/b>，不能用 am。主语 I 不用 has。"}, {"id": 11, "type": "judge", "point": "非人称主语 it", "stem": "Today is rainy. 和 It’s rainy today. 都是正确的英语。", "answer": "对", "explain": "对。这两句都对——Today is rainy. 把 today 当主语，语法成立；It’s rainy today. 是更常用的说法。但 “Today is <b>rain<\/b>.” 就错了，因为 rain 是名词不是形容词。"}, {"id": 12, "type": "judge", "point": "must 与 should 的语气", "stem": "must 和 should 都表示建议，语气强度完全一样。", "answer": "错", "explain": "错。<b>must 语气强<\/b>（必须、强制，常用于规定和医嘱），<b>should 语气温和<\/b>（应该、建议，常用于朋友间劝告）。否定差别更大：mustn’t 是“绝对禁止”，shouldn’t 只是“不建议”。"}]}, {"id": "e-c3-s4", "title": "第四节 Lesson 67-72：介词 · 交通方式 · 人物描写", "notes": [{"point": "交通方式的表达：by 与 on/in", "explain": "说“乘某种交通工具”有两种结构：<b>by + 交通工具（不加冠词，不加复数）<\/b>，或 <b>on / in + 限定词 + 交通工具<\/b>。前者更常用也更简洁。", "examples": [{"tag": "基础", "text": "by bus 坐公交、by bike 骑车、by car 开车、by train 坐火车、by plane 坐飞机、by ship 坐船、by subway 坐地铁。"}, {"tag": "进阶", "text": "“步行”是特例：<b>on foot<\/b>（不是 by foot）。另一种说法用动词：I <b>walk<\/b> to school. ＝ I go to school <b>on foot<\/b>. 两种都对。"}, {"tag": "易错", "text": "by 后面的交通工具<b>光秃秃的，什么都不加<\/b>：“by <u>a<\/u> bus” ✗ / “by <u>buses<\/u>” ✗ → <b>by bus<\/b> ✓。但如果要说“坐我的车”，就得换结构：<b>in my car<\/b>（不能说 by my car）。"}], "think": "by bus 里 bus 前面什么都不加，in my car 却要加 my —— 你觉得 by 后面的名词在英语里更像“具体的一辆车”还是“一种方式”？"}, {"point": "地点介词 in / at / to 的分工", "explain": "<b>in<\/b> ＝ 在（大地方）里面；<b>at<\/b> ＝ 在（小地点、某一点）；<b>to<\/b> ＝ 到（表示方向）。搭配动词时：live <b>in<\/b>、arrive <b>at/in<\/b>、go <b>to<\/b>。", "examples": [{"tag": "基础", "text": "I live <b>in<\/b> Beijing.（大城市用 in）／ He is <b>at<\/b> the bus stop.（小地点用 at）／ We go <b>to<\/b> school.（方向用 to）"}, {"tag": "进阶", "text": "arrive 的搭配要分大小：arrive <b>in<\/b> + 大地方（arrive in Shanghai）／ arrive <b>at<\/b> + 小地点（arrive at the station）。而 reach 后面<b>直接跟宾语<\/b>，不要介词：reach Shanghai ✓。"}, {"tag": "易错", "text": "home、here、there 前面<b>不加 to<\/b>：“go <u>to<\/u> home” ✗ → <b>go home<\/b> ✓；“come <u>to<\/u> here” ✗ → <b>come here<\/b> ✓。因为这三个词本身就是副词，已经含了“到……去”的意思。"}], "think": "go to school 要加 to，go home 却不用 —— 如果告诉你 home 在这里不是名词而是副词，这个区别就说得通了吗？"}, {"point": "描写人物外貌与性格", "explain": "描写人常用 <b>be + 形容词<\/b>（说性格状态）或 <b>have + 名词<\/b>（说身体特征）。两种结构不能混用。", "examples": [{"tag": "基础", "text": "外貌：He <b>is<\/b> tall / short / fat / thin / handsome. ／ She <b>has<\/b> long hair / big eyes / a round face."}, {"tag": "进阶", "text": "性格：kind 善良、friendly 友好、clever 聪明、lazy 懒、hard-working 勤奋、shy 害羞、quiet 安静、funny 有趣。注意 hard-working 中间有连字符，是一个词。"}, {"tag": "易错", "text": "“She <u>is<\/u> long hair.” ✗ —— long hair 是名词短语，要用 have：She <b>has<\/b> long hair. ✓ 或者改成形容词结构：Her hair <b>is<\/b> long. ✓ 判断只看一步：<b>后面跟形容词用 be，跟名词用 have<\/b>。"}], "think": "“她有一头长发”可以说成 She has long hair. 也可以说成 Her hair is long. —— 这两句在强调的重点上有什么不同？"}, {"point": "形容词的位置与顺序", "explain": "形容词有两个位置：① <b>名词前面<\/b>作定语（a <u>big<\/u> house）；② <b>be 动词后面<\/b>作表语（The house <u>is<\/u> big）。多个形容词并列时有固定顺序：<b>限定词 → 大小 → 新旧 → 颜色 → 材料 → 名词<\/b>。", "examples": [{"tag": "基础", "text": "a <b>big new<\/b> house（大的新房子）／ a <b>small red<\/b> car（小红车）／ a <b>beautiful young<\/b> girl"}, {"tag": "进阶", "text": "顺序口诀：<b>大小新旧颜色料<\/b>。例如 a big old brown wooden table（大的、旧的、棕色的、木头的桌子）—— 顺序反了母语者会觉得别扭，虽然能听懂。"}, {"tag": "易错", "text": "形容词<b>没有复数形式<\/b>：“two <u>news<\/u> books” ✗ → two <b>new<\/b> books ✓。形容词不管修饰几个东西都不变。中文的“新的”也不变，这一点两种语言是一致的，但学生常被名词的 s 带跑。"}], "think": "英语说 a big red ball，如果说成 a red big ball，母语者能听懂但会觉得怪 —— 你觉得为什么形容词的顺序会形成固定习惯？"}, {"point": "and / but / or 连接句子", "explain": "<b>and<\/b> 表示并列（而且）、<b>but<\/b> 表示转折（但是）、<b>or<\/b> 表示选择（或者）。它们连接两个地位平等的成分，两边的结构要对称。", "examples": [{"tag": "基础", "text": "He is tall <b>and<\/b> strong.（并列）／ He is old <b>but<\/b> strong.（转折）／ Is it black <b>or<\/b> white?（选择）"}, {"tag": "进阶", "text": "or 在否定句里表示“也不”：I don’t like tea <b>or<\/b> coffee.（茶和咖啡我都不喜欢）—— 这里不能用 and。而肯定句说“都喜欢”用 and：I like tea <b>and<\/b> coffee."}, {"tag": "易错", "text": "中文说“虽然……但是……”会两个词都用，英语<b>只能用一个<\/b>：“<u>Although<\/u> he is old, <u>but<\/u> he is strong.” ✗ → <b>Although<\/b> he is old, he is strong. ✓ 或 He is old, <b>but<\/b> he is strong. ✓ 二选一。"}], "think": "英语不许 although 和 but 同时出现，中文“虽然……但是……”却是标准搭配 —— 两种语言在这里的逻辑差在哪？"}], "quiz": [{"id": 1, "type": "multi", "point": "交通方式的表达（想一想·刁钻）", "stem": "下列表达<b>正确<\/b>的有（　）【多选】", "options": ["A. by bus", "B. by a bus", "C. on foot", "D. by foot", "E. in my car"], "answer": ["A", "C", "E"], "explain": "by 后面的交通工具<b>不加冠词不加复数<\/b>，所以 B 错。“步行”是特例用 <b>on foot<\/b>，不能说 by foot（D 错）。要说“坐我的车”得换结构 in my car（E 对）。"}, {"id": 2, "type": "multi", "point": "地点介词（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. I live in Beijing.", "B. We go to school.", "C. He goes to home.", "D. Come here, please.", "E. They arrive at the station."], "answer": ["A", "B", "D", "E"], "explain": "只有 C 错：home、here、there 都是<b>副词<\/b>，前面不加 to → go <b>home<\/b>。E 对：小地点用 arrive at，大地方用 arrive in。"}, {"id": 3, "type": "multi", "point": "描写人物用 be 还是 have（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. She has long hair.", "B. She is long hair.", "C. Her hair is long.", "D. He is tall and thin.", "E. He has big eyes."], "answer": ["A", "C", "D", "E"], "explain": "只有 B 错。规则一句话：<b>后面跟形容词用 be，跟名词用 have<\/b>。long hair 是名词短语要配 has（A）；把它改写成形容词作表语就用 is（C）。"}, {"id": 4, "type": "multi", "point": "形容词的形态与顺序（想一想·刁钻）", "stem": "下列表达<b>正确<\/b>的有（　）【多选】", "options": ["A. two new books", "B. two news books", "C. a big new house", "D. a small red car", "E. a beautiful young girl"], "answer": ["A", "C", "D", "E"], "explain": "只有 B 错：<b>形容词没有复数形式<\/b>，不管修饰几个东西都不变（new 不能写成 news）。C、D、E 的顺序都符合“大小新旧颜色料”的习惯。"}, {"id": 5, "type": "multi", "point": "连词的使用（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. He is old but strong.", "B. Although he is old, but he is strong.", "C. Although he is old, he is strong.", "D. I don’t like tea or coffee.", "E. Is it black or white?"], "answer": ["A", "C", "D", "E"], "explain": "只有 B 错：英语里 <b>although 和 but 不能同时出现<\/b>，必须二选一。D 提醒：否定句里“也不”用 or，不用 and。"}, {"id": 6, "type": "choice", "point": "交通方式", "stem": "My home is near the school, so I go there ______.", "options": ["A. by foot", "B. on foot", "C. by a bike", "D. on bike"], "answer": "B", "explain": "“步行”固定说法是 <b>on foot<\/b>，不能说 by foot。C 错在 by 后不加冠词，D 错在骑车应说 by bike。"}, {"id": 7, "type": "choice", "point": "home 不加 to", "stem": "It’s late. Let’s go ______.", "options": ["A. home", "B. to home", "C. to the home", "D. at home"], "answer": "A", "explain": "home 在这里是<b>副词<\/b>，本身含“回家去”的意思，前面不加介词：go home。at home 是“在家”（状态），和“回家”（方向）不同。"}, {"id": 8, "type": "choice", "point": "描写外貌", "stem": "My sister ______ big eyes and a small nose.", "options": ["A. is", "B. are", "C. has", "D. have"], "answer": "C", "explain": "big eyes 和 a small nose 都是<b>名词短语<\/b>，要用 have；主语 My sister 是三单，所以用 has。"}, {"id": 9, "type": "fill", "point": "交通方式", "stem": "填空：I usually go to school ______ bike.（填一个介词）", "answer": ["by"], "explain": "“骑自行车”用 <b>by bike<\/b>，by 后面直接跟交通工具，不加冠词。"}, {"id": 10, "type": "fill", "point": "连词", "stem": "填空（表示转折）：He is old ______ he is very strong.（填一个词）", "answer": ["but"], "explain": "前后是转折关系（老但强壮），用 <b>but<\/b>。注意如果句首用了 Although，这里就不能再用 but。"}, {"id": 11, "type": "judge", "point": "by 后不加冠词", "stem": "by 表示交通方式时，后面的名词既不加冠词也不用复数，只能说 by bus。", "answer": "对", "explain": "对。<b>by + 交通工具，光秃秃什么都不加<\/b>：by bus / by bike / by train。要加限定词就得换结构：in <b>my<\/b> car、on <b>the<\/b> bus。"}, {"id": 12, "type": "judge", "point": "although 与 but", "stem": "Although he is old, but he is strong. 这句话符合英语语法。", "answer": "错", "explain": "错。英语里 <b>although 和 but 不能同时出现<\/b>，因为两个词都表示转折，功能重复。正确写法二选一：Although he is old, he is strong. 或 He is old, but he is strong."}]}, {"id": "e-c3-s5", "title": "第五节 单词总复习（五）：职业 · 家庭 · 星期月份", "notes": [{"point": "职业类单词", "explain": "Lesson 49-60 出现的职业词，注意每个前面都要加冠词 a / an。", "examples": [{"tag": "基础", "text": "teacher 教师、doctor 医生、nurse 护士、driver 司机、worker 工人、farmer 农民、cook 厨师、waiter 服务员、shop assistant 店员、policeman 警察。"}, {"tag": "进阶", "text": "以元音音素开头要用 an：<b>an<\/b> engineer 工程师、<b>an<\/b> actor 演员、<b>an<\/b> artist 艺术家、<b>an<\/b> office worker 办公室职员。注意判断依据是<b>读音<\/b>不是字母。"}, {"tag": "易错", "text": "policeman（男警察）的复数是 police<b>men<\/b>，不是 policemans；同类的 postman→postmen、woman→women、man→men。这类词变复数是<b>词中间的 a 变 e<\/b>，不在词尾加 s。"}], "think": "英语的很多职业词是“动词 + er”构成的（teach→teacher, work→worker, drive→driver），你能照这个规律猜出 write→? sing→? paint→? 吗？"}, {"point": "家庭成员称谓", "explain": "英语的亲属称谓比中文简单得多——不分父系母系、不分长幼。", "examples": [{"tag": "基础", "text": "father 父亲、mother 母亲、son 儿子、daughter 女儿、brother 兄弟、sister 姐妹、grandfather 祖父、grandmother 祖母。"}, {"tag": "进阶", "text": "uncle ＝ 伯伯/叔叔/舅舅/姑父/姨父（全包）／ aunt ＝ 姑姑/姨妈/婶婶/舅妈／ cousin ＝ 堂/表兄弟姐妹（男女都用这一个词）。中文要分十几个词，英语只用三个。"}, {"tag": "易错", "text": "parents ＝ 父母<b>两个人<\/b>（复数），不能用来指一个人。“My parent is a doctor.” 语法没错但很少这么说，通常要么说 My father is... 要么说 My <b>parents are<\/b> both doctors."}], "think": "中文要用“堂哥、表妹、堂姐、表弟”四个词，英语只用一个 cousin —— 这说明两种文化在看待亲属关系上有什么不同？"}, {"point": "星期与月份（首字母必须大写）", "explain": "星期和月份都是<b>专有名词，首字母永远大写<\/b>，无论在句子什么位置。", "examples": [{"tag": "基础", "text": "星期：Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday。月份：January, February, March, April, May, June, July, August, September, October, November, December。"}, {"tag": "进阶", "text": "介词搭配：<b>on<\/b> Monday（星期用 on）／ <b>in<\/b> May（月份用 in）／ <b>in<\/b> 2026（年份用 in）。“在星期天”是 on Sunday；“在五月”是 in May。"}, {"tag": "易错", "text": "Wednesday 拼写最容易错（中间有个不发音的 d），February 也常漏掉第一个 r。另外“星期天”不能写成 sunday —— 哪怕在句子中间也必须大写：I go there on <b>Sunday<\/b>."}], "think": "英语的星期和月份为什么要大写？（提示：它们的名字大多来自古代的神名和皇帝名，属于什么类型的名词？）"}, {"point": "日常活动动词短语", "explain": "描述一天作息的高频短语，考试和写作都用得上，成组记最有效。", "examples": [{"tag": "基础", "text": "get up 起床、have breakfast 吃早饭、go to school 上学、have lunch 吃午饭、do homework 做作业、watch TV 看电视、go to bed 睡觉。"}, {"tag": "进阶", "text": "三餐前面<b>不加冠词<\/b>：have <b>breakfast<\/b> ✓（不说 have a breakfast）。但如果前面有形容词修饰就要加：have <b>a big<\/b> breakfast（吃了顿丰盛早餐）。"}, {"tag": "易错", "text": "“go to bed”（去睡觉）和“go to the bed”（走到床边）不一样：不加 the 表示<b>做这件事<\/b>，加 the 表示<b>去那个地方<\/b>。同理 go to school（上学）vs go to the school（去学校这栋楼，比如家长去开会）。"}], "think": "go to school 是“上学”，go to the school 是“去学校这个地方”—— 你能想出还有哪些词加不加 the 意思会变？（提示：hospital、church、prison。）"}], "quiz": [{"id": 1, "type": "multi", "point": "职业词与冠词（想一想·刁钻）", "stem": "下列表达<b>正确<\/b>的有（　）【多选】", "options": ["A. a teacher", "B. an engineer", "C. a engineer", "D. an actor", "E. a doctor"], "answer": ["A", "B", "D", "E"], "explain": "只有 C 错：engineer 以元音音素 /e/ 开头，要用 <b>an<\/b>。判断依据是<b>读音<\/b>不是字母——比如 a university（读音以 /j/ 开头，用 a）就是反例。"}, {"id": 2, "type": "multi", "point": "特殊复数（想一想·刁钻）", "stem": "下列复数形式<b>正确<\/b>的有（　）【多选】", "options": ["A. policemen", "B. policemans", "C. women", "D. mans", "E. postmen"], "answer": ["A", "C", "E"], "explain": "man 类词变复数是<b>词中的 a 变成 e<\/b>：man→men、woman→women、policeman→policemen、postman→postmen。不在词尾加 s，所以 B、D 错。"}, {"id": 3, "type": "multi", "point": "亲属称谓的覆盖范围（想一想·刁钻）", "stem": "关于英语亲属称谓，说法<b>正确<\/b>的有（　）【多选】", "options": ["A. uncle 可以指叔叔、舅舅、姑父。", "B. aunt 可以指姑姑、姨妈、婶婶。", "C. cousin 只能指男性堂兄弟。", "D. cousin 男女都可以用。", "E. parents 指父母两个人。"], "answer": ["A", "B", "D", "E"], "explain": "只有 C 错：<b>cousin 不分男女<\/b>，堂表兄弟姐妹全用这一个词。英语的亲属称谓不分父系母系、不分长幼，比中文简单得多。"}, {"id": 4, "type": "multi", "point": "星期月份的大写与介词（想一想·刁钻）", "stem": "下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. 星期和月份的首字母必须大写。", "B. 在句子中间可以小写 sunday。", "C. 星期前面用介词 on。", "D. 月份前面用介词 in。", "E. Wednesday 中间有一个不发音的 d。"], "answer": ["A", "C", "D", "E"], "explain": "只有 B 错：星期月份是<b>专有名词<\/b>，不管在句子什么位置都必须大写。介词口诀：<b>星期用 on，月份年份用 in<\/b>。"}, {"id": 5, "type": "multi", "point": "加不加 the 意思会变（想一想·刁钻）", "stem": "关于 go to school 与 go to the school，说法<b>正确<\/b>的有（　）【多选】", "options": ["A. go to school 表示“上学”这件事。", "B. go to the school 表示“去学校这个地方”。", "C. 两者意思完全一样。", "D. go to bed 表示“睡觉”。", "E. have breakfast 前面不加冠词。"], "answer": ["A", "B", "D", "E"], "explain": "只有 C 错。<b>不加 the 表示做这件事的目的，加 the 表示去那个建筑物<\/b>。同类的还有 go to hospital（去看病）vs go to the hospital（去医院这栋楼）。"}, {"id": 6, "type": "choice", "point": "冠词的读音判断", "stem": "My uncle is ______ engineer.", "options": ["A. a", "B. an", "C. the", "D. 不填"], "answer": "B", "explain": "engineer 以元音音素开头，用 <b>an<\/b>。职业名词前面必须有冠词，不能不填。"}, {"id": 7, "type": "choice", "point": "时间介词", "stem": "My birthday is ______ May.", "options": ["A. on", "B. at", "C. in", "D. for"], "answer": "C", "explain": "月份前面用 <b>in<\/b>（in May、in 2026）。如果是具体某一天才用 on（on May 1st）。"}, {"id": 8, "type": "choice", "point": "三餐不加冠词", "stem": "I have ______ breakfast at seven every morning.", "options": ["A. a", "B. an", "C. the", "D. 不填"], "answer": "D", "explain": "三餐名词（breakfast、lunch、supper、dinner）前面<b>不加冠词<\/b>。只有当前面有形容词修饰时才加：have a big breakfast。"}, {"id": 9, "type": "fill", "point": "特殊复数", "stem": "写出 policeman 的复数形式：______", "answer": ["policemen"], "explain": "man 结尾的词变复数是<b>把 a 变成 e<\/b>：policeman→policemen。不是加 s。"}, {"id": 10, "type": "fill", "point": "星期的介词", "stem": "填空：We don’t go to school ______ Sunday.（填一个介词）", "answer": ["on"], "explain": "具体某一天（包括星期）用 <b>on<\/b>：on Sunday、on Monday、on May 1st。"}, {"id": 11, "type": "judge", "point": "cousin 的性别", "stem": "cousin 既可以指男性堂表兄弟，也可以指女性堂表姐妹。", "answer": "对", "explain": "对。英语的 cousin <b>不分性别、不分父系母系、不分长幼<\/b>，中文要用堂哥、表妹、堂姐、表弟等十几个词才能表达清楚的关系，英语只用这一个词。"}, {"id": 12, "type": "judge", "point": "专有名词大写", "stem": "星期和月份只有在句首才需要大写首字母。", "answer": "错", "explain": "错。星期和月份是<b>专有名词，任何位置都必须大写<\/b>：I go there on <b>Sunday<\/b>. / My birthday is in <b>May<\/b>. 这一点和国名、国籍形容词相同。"}]}, {"id": "e-c3-s6", "title": "第六节 单词总复习（六）：动词三单形式 · 反义词 · 高频短语", "notes": [{"point": "常用动词的三单形式速查", "explain": "把最常用的动词三单形式一次记牢，做题时不用现推规则。", "examples": [{"tag": "基础", "text": "直接加 s：like→likes、work→works、live→lives、read→reads、run→runs、come→comes、know→knows。"}, {"tag": "进阶", "text": "加 es：go→goes、do→does、watch→watches、teach→teaches、wash→washes、fix→fixes、pass→passes。变 y 为 i 加 es：study→studies、fly→flies、carry→carries、try→tries。"}, {"tag": "易错", "text": "两个必须单独背的不规则：<b>have→has<\/b>、<b>be→is<\/b>。另外 do→does 的读音也变了（读 /dʌz/ 不是 /duːz/），say→says 读音同样变了（/sez/ 不是 /seiz/）。"}], "think": "go→goes、do→does、watch→watches 都加了 es，如果只加 s 会怎么样？试着读一读 gos、dos、watchs，你发现问题了吗？"}, {"point": "高频反义词配对（第二组）", "explain": "在第一册中后段出现的形容词与副词反义词，成对背最省力。", "examples": [{"tag": "基础", "text": "open 开 / closed 关、right 对 / wrong 错、early 早 / late 晚、fast 快 / slow 慢、near 近 / far 远、cheap 便宜 / expensive 贵。"}, {"tag": "进阶", "text": "副词形式：quickly 快速地、slowly 慢慢地、carefully 仔细地、loudly 大声地。规律是<b>形容词加 ly 变副词<\/b>，但 fast、hard、late 三个词<b>形容词和副词同形<\/b>（不能说 fastly）。"}, {"tag": "易错", "text": "hard 和 hardly 不是一回事：<b>hard<\/b> ＝ 努力地／困难的；<b>hardly<\/b> ＝ 几乎不（否定词！）。“He works <u>hardly<\/u>.” 意思变成“他几乎不工作”，和想说的“他工作努力”（He works <b>hard<\/b>.）刚好相反。"}], "think": "He works hard. 和 He hardly works. 只差一个 ly 和词序，意思却完全相反——如果这是给老板写的评语，写错会有什么后果？"}, {"point": "高频动词短语", "explain": "第一册常考的动词 + 介词/副词搭配，必须整块记，拆开就不是原来的意思了。", "examples": [{"tag": "基础", "text": "look at 看、look for 寻找、look after 照顾、listen to 听、wait for 等待、ask for 请求、come from 来自、arrive in/at 到达。"}, {"tag": "进阶", "text": "同一个 look 配不同介词，意思完全不同：look <b>at<\/b>（看）／ look <b>for<\/b>（找）／ look <b>after<\/b>（照顾）／ look <b>like<\/b>（看起来像）。介词才是意思的关键，不是动词。"}, {"tag": "易错", "text": "“I’m looking <u>at<\/u> my keys.” 如果你在找钥匙，这句就错了 —— 应该是 looking <b>for<\/b> my keys（寻找）。look at 是“盯着看”，找不到的东西没法盯着看。"}], "think": "look at / look for / look after / look like 四个短语，动词都是 look，为什么换个介词意思就完全变了？"}, {"point": "there / their / they're 与 its / it's", "explain": "这几组词读音相同或相近，是英语写作中最高频的拼写陷阱，必须靠意思区分。", "examples": [{"tag": "基础", "text": "<b>there<\/b> ＝ 那里（There is a book.）／ <b>their<\/b> ＝ 他们的（their books）／ <b>they’re<\/b> ＝ they are（They’re students.）"}, {"tag": "进阶", "text": "<b>its<\/b> ＝ 它的（The dog wags its tail.）／ <b>it’s<\/b> ＝ it is 或 it has（It’s cold today.）。判断方法：<b>能还原成 it is 就写 it’s，否则写 its<\/b>。注意 its 没有撇号——这一点和名词所有格（Tom’s）相反。"}, {"tag": "易错", "text": "“The cat is licking <u>it’s<\/u> paw.” ✗ —— 这里是“它的爪子”，要用 <b>its<\/b>（无撇号）。反过来 “<u>Its<\/u> raining.” ✗ → <b>It’s<\/b> raining.（＝ It is raining）。带撇号的永远是缩写，不是所有格。"}], "think": "名词所有格要加撇号（Tom’s book），代词所有格却不能加（its、yours、hers）—— 这个规则听起来自相矛盾，你能想出一个记住它的办法吗？"}], "quiz": [{"id": 1, "type": "multi", "point": "三单形式速查（想一想·刁钻）", "stem": "下列三单形式<b>正确<\/b>的有（　）【多选】", "options": ["A. goes", "B. watchs", "C. watches", "D. flies", "E. haves"], "answer": ["A", "C", "D"], "explain": "B 错：ch 结尾加 es → watches。E 错：have 的三单是不规则形式 <b>has<\/b>。D 对：fly 的 y 前是辅音 l，变 i 加 es。"}, {"id": 2, "type": "multi", "point": "hard 与 hardly（想一想·刁钻）", "stem": "关于 hard 和 hardly，说法<b>正确<\/b>的有（　）【多选】", "options": ["A. hard 可以表示“努力地”。", "B. hardly 表示“非常努力地”。", "C. hardly 表示“几乎不”，是否定词。", "D. He works hard. 意思是他工作努力。", "E. He hardly works. 意思是他几乎不工作。"], "answer": ["A", "C", "D", "E"], "explain": "只有 B 错。<b>hardly 是否定词<\/b>，意思是“几乎不”，和 hard（努力地）意思相反。这是英语里最坑的一对形近词之一，写评语时用错后果很严重。"}, {"id": 3, "type": "multi", "point": "look 系列短语（想一想·刁钻）", "stem": "下列搭配与含义配对<b>正确<\/b>的有（　）【多选】", "options": ["A. look at — 看", "B. look for — 寻找", "C. look after — 照顾", "D. look like — 看起来像", "E. look for — 看一眼"], "answer": ["A", "B", "C", "D"], "explain": "只有 E 错配：look for 是<b>寻找<\/b>，不是看一眼。这组短语动词都是 look，<b>意思由介词决定<\/b>，必须整块记。"}, {"id": 4, "type": "multi", "point": "its 与 it's（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. It’s raining outside.", "B. Its raining outside.", "C. The dog wags its tail.", "D. The dog wags it’s tail.", "E. It’s cold today."], "answer": ["A", "C", "E"], "explain": "<b>带撇号的 it’s 永远是缩写<\/b>（it is / it has），<b>不带撇号的 its 才是“它的”<\/b>。B 少了撇号，D 多了撇号。判断方法：能还原成 it is 就写 it’s。"}, {"id": 5, "type": "multi", "point": "形容词与副词同形（想一想·刁钻）", "stem": "下列词中，<b>形容词和副词形式相同<\/b>（不加 ly）的有（　）【多选】", "options": ["A. fast", "B. quick", "C. hard", "D. late", "E. slow"], "answer": ["A", "C", "D"], "explain": "fast、hard、late 三个词<b>形容词副词同形<\/b>，不能说 fastly、lately（lately 存在但意思是“最近”，不是“晚地”）。quick 和 slow 要加 ly 变成 quickly、slowly。"}, {"id": 6, "type": "choice", "point": "look 系列", "stem": "I can’t find my keys. I’m ______ them.", "options": ["A. looking at", "B. looking for", "C. looking after", "D. looking like"], "answer": "B", "explain": "前半句说“找不到钥匙”，所以是<b>寻找<\/b> → look for。look at 是盯着看，找不到的东西没法盯着看。"}, {"id": 7, "type": "choice", "point": "hard 与 hardly", "stem": "He is a good student. He always works ______.", "options": ["A. hardly", "B. harder", "C. hardly ever", "D. hard"], "answer": "D", "explain": "前半句夸他是好学生，所以要说“工作努力”用 <b>hard<\/b>。hardly 意思是“几乎不”，会让整句话自相矛盾。"}, {"id": 8, "type": "choice", "point": "its 的用法", "stem": "The cat is licking ______ paw.", "options": ["A. it’s", "B. its’", "C. it is", "D. its"], "answer": "D", "explain": "这里表示“<b>它的<\/b>爪子”，用 its（<b>不带撇号<\/b>）。it’s 是 it is 的缩写，代入后变成 “the cat is licking it is paw”，明显不通。"}, {"id": 9, "type": "fill", "point": "三单形式", "stem": "写出 fly 的第三人称单数形式：______", "answer": ["flies"], "explain": "fly 的 y 前面是辅音字母 l，要<b>变 y 为 i 再加 es<\/b> → flies。同类：study→studies、carry→carries、try→tries。"}, {"id": 10, "type": "fill", "point": "动词短语", "stem": "填空：Please look ______ my baby while I am out.（照顾，填一个词）", "answer": ["after"], "explain": "“照顾”是 <b>look after<\/b>。同组还有 look at（看）、look for（找）、look like（看起来像），介词决定意思。"}, {"id": 11, "type": "judge", "point": "副词构成规律", "stem": "所有形容词加 ly 都能变成副词，比如 fast 变成 fastly。", "answer": "错", "explain": "错。<b>fast、hard、late、early 等词形容词和副词同形<\/b>，不加 ly。fastly 根本不是英语单词。而且有些加了 ly 意思会变：hard→hardly（几乎不）、late→lately（最近）。"}, {"id": 12, "type": "judge", "point": "代词所有格无撇号", "stem": "名词所有格要加撇号（Tom’s book），但代词所有格不加撇号（its、yours、hers）。", "answer": "对", "explain": "对。这是英语拼写最容易混的一条：<b>Tom’s / the dog’s 要撇号，its / yours / hers / ours / theirs 一律不要<\/b>。凡是代词里带撇号的（it’s、you’re、they’re）都是<b>缩写<\/b>，不是所有格。"}]}]}, {"id": "e-c4", "title": "第四章 Lesson 73-96：一般过去时 · 现在完成时", "sections": [{"id": "e-c4-s1", "title": "第一节 Lesson 73-78：一般过去时（be 动词与规则动词）", "notes": [{"point": "be 动词的过去式：was 与 were", "explain": "一般过去时表示<b>过去发生的动作或存在的状态<\/b>。be 动词的过去式只有两个：<b>was<\/b>（对应 am / is）和 <b>were<\/b>（对应 are）。主语是 I / he / she / it / 单数名词用 was，you / we / they / 复数名词用 were。", "examples": [{"tag": "基础", "text": "I <b>was<\/b> at home yesterday. ／ He <b>was<\/b> ill last week. ／ They <b>were<\/b> in Beijing last year."}, {"tag": "进阶", "text": "否定和疑问都动 be，不借 did：He <b>wasn’t<\/b> at home. ／ <b>Were<\/b> you at school yesterday? — Yes, I was. / No, I wasn’t. 规则和现在时完全一样，只是 be 换成了过去式。"}, {"tag": "易错", "text": "注意 <b>you 永远配 were<\/b>，哪怕只指一个人：“<u>You was<\/u> late.” ✗ → <b>You were<\/b> late. ✓ 这是 was/were 最高频的错误，因为中文的“你”是单数，容易误配单数形式。"}], "think": "现在时 I am / you are 两个不同的形式，到了过去时变成 I was / you were 还是两个形式 —— 但 he is 和 she is 到过去时都成了 was。你发现英语在过去时里“简化”了多少？"}, {"point": "规则动词加 ed 的四条规则", "explain": "① 一般直接加 ed：work→worked；② 以 e 结尾只加 d：live→lived；③ 辅音字母 + y 结尾，<b>变 y 为 i 加 ed<\/b>：study→studied；④ 重读闭音节结尾，<b>双写<\/b>末尾辅音再加 ed：stop→stopped。", "examples": [{"tag": "基础", "text": "work→worked、play→played（元音+y 直接加 ed）／ like→liked、live→lived（e 结尾加 d）／ study→studied、carry→carried／ stop→stopped、plan→planned。"}, {"tag": "进阶", "text": "ed 的三种读音要分清：清辅音后读 /t/（worked、liked）；浊辅音和元音后读 /d/（played、lived）；<b>t / d 结尾后读 /ɪd/<\/b>（wanted、needed、visited）。读音会影响听力理解。"}, {"tag": "易错", "text": "play 和 study 的处理不同，规则和三单加 s 完全一致：<b>元音+y 直接加 ed<\/b>（played），<b>辅音+y 变 i 加 ed<\/b>（studied）。另外 “stop→<u>stoped<\/u>” ✗ → <b>stopped<\/b> ✓（重读闭音节要双写）。"}], "think": "动词加 ed（过去式）、加 ing（进行时）、加 s（三单）三套规则里，“变 y 为 i”和“双写辅音”反复出现——你觉得英语为什么在不同场合用同一套拼写调整？"}, {"point": "过去时的时间标志词", "explain": "看到这些词，基本可以断定要用一般过去时：<b>yesterday<\/b>（昨天）、<b>last + 时间<\/b>（last week / month / year / night）、<b>… ago<\/b>（three days ago）、<b>in + 过去年份<\/b>（in 2020）、<b>just now<\/b>（刚才）、<b>then / at that time<\/b>（那时）。", "examples": [{"tag": "基础", "text": "I <b>went<\/b> to the park <u>yesterday<\/u>. ／ She <b>bought<\/b> a book <u>last week<\/u>. ／ He <b>came<\/b> here <u>three days ago<\/u>."}, {"tag": "进阶", "text": "ago 和 before 不同：<b>ago<\/b> 从“现在”往回数，配一般过去时（two days ago）；<b>before<\/b> 从“过去某点”往回数，常配过去完成时。初学阶段记住 <b>ago 配过去时<\/b> 即可。"}, {"tag": "易错", "text": "just now（刚才）配<b>过去时<\/b>，just（刚刚）配<b>现在完成时<\/b>：I saw him <b>just now<\/b>.（过去时）／ I have <b>just<\/b> seen him.（完成时）。两个词长得像，配的时态完全不同。"}], "think": "“三天前”是 three days ago，为什么 ago 要放在时间后面，而中文的“前”也放在后面？这两种语言在这里为什么碰巧一致？"}, {"point": "过去时的否定与疑问：did 出场", "explain": "实义动词的过去时，否定用 <b>didn’t + 动词原形<\/b>，疑问用 <b>Did + 主语 + 动词原形<\/b>。铁律和现在时一样：<b>did 一出现，主要动词立刻还原<\/b>。", "examples": [{"tag": "基础", "text": "He went to school. → He <b>didn’t go<\/b> to school. → <b>Did<\/b> he <b>go<\/b> to school? → Yes, he did. / No, he didn’t."}, {"tag": "进阶", "text": "特殊疑问句：<b>What did<\/b> you <b>do<\/b> yesterday?（你昨天做了什么？）／ <b>Where did<\/b> she <b>go<\/b>?（她去哪了？）注意 did 已经表示过去，后面的动词一律用原形。"}, {"tag": "易错", "text": "“<u>Did he went<\/u>?” ✗ 或 “He <u>didn’t went<\/u>.” ✗ —— did / didn’t 已经带走了过去的标记，动词必须还原：Did he <b>go<\/b>? ✓ / He didn’t <b>go<\/b>. ✓ 这和 “Does he likes” 是同一类错误，本质都是“一个句子只能有一个时态标记”。"}], "think": "现在时是 Does he like?，过去时是 Did he like? —— 助动词换了，后面的动词却都保持原形。英语为什么把“时态”这个信息全部交给助动词承担？"}, {"point": "There was / There were", "explain": "There be 句型的过去式：<b>There was<\/b>（单数或不可数）／ <b>There were<\/b>（复数）。就近原则和现在时完全一样，看紧跟其后的第一个名词。", "examples": [{"tag": "基础", "text": "<b>There was<\/b> a book on the desk. ／ <b>There were<\/b> some students in the room."}, {"tag": "进阶", "text": "否定和疑问同样动 be：<b>There wasn’t<\/b> any water. ／ <b>Were there<\/b> any people? — Yes, there were. / No, there weren’t. 简答里保留 there，不换成 it。"}, {"tag": "易错", "text": "“<u>There were<\/u> a book and two pens.” ✗ —— 就近原则看 a book（单数）：<b>There was<\/b> a book and two pens. ✓ 别去数总数。"}], "think": "There was a book and two pens. 听起来像“只有一本书”，但其实一共有三样东西 —— 英语的就近原则会不会造成误解？母语者为什么不觉得别扭？"}], "quiz": [{"id": 1, "type": "multi", "point": "was 与 were 的搭配（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. I was at home yesterday.", "B. You was late.", "C. You were late.", "D. They were in Beijing.", "E. He were ill."], "answer": ["A", "C", "D"], "explain": "B、E 错。<b>you 永远配 were<\/b>（哪怕只指一个人），he / she / it / I 配 was。这是 was/were 最高频的错误。"}, {"id": 2, "type": "multi", "point": "规则动词加 ed（想一想·刁钻）", "stem": "下列过去式<b>拼写正确<\/b>的有（　）【多选】", "options": ["A. played", "B. studyed", "C. studied", "D. stoped", "E. stopped"], "answer": ["A", "C", "E"], "explain": "B 错：study 的 y 前是辅音 d，要变 i 加 ed → studied。D 错：stop 是重读闭音节，要双写 p → stopped。A 对：play 的 y 前是元音 a，直接加 ed。"}, {"id": 3, "type": "multi", "point": "过去时的时间标志（想一想·刁钻）", "stem": "下列时间词中，<b>提示使用一般过去时<\/b>的有（　）【多选】", "options": ["A. yesterday", "B. last week", "C. every day", "D. three days ago", "E. just now"], "answer": ["A", "B", "D", "E"], "explain": "C 是 every day（每天），提示一般现在时。其余四个都指<b>明确的过去时间<\/b>，配一般过去时。注意 just now（刚才）配过去时，而 just（刚刚）配现在完成时。"}, {"id": 4, "type": "multi", "point": "did 后动词还原（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. Did he go to school?", "B. Did he went to school?", "C. He didn’t go to school.", "D. He didn’t went to school.", "E. What did you do yesterday?"], "answer": ["A", "C", "E"], "explain": "B、D 错：<b>did / didn’t 已经带走了过去时标记，动词必须还原成原形<\/b>。这和 “Does he likes” 是同一类错误——一个句子只能有一个时态标记。"}, {"id": 5, "type": "multi", "point": "There was/were 的就近原则（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. There was a book on the desk.", "B. There were some students in the room.", "C. There were a book and two pens.", "D. There was a book and two pens.", "E. There wasn’t any water in the glass."], "answer": ["A", "B", "D", "E"], "explain": "只有 C 错。<b>就近原则<\/b>：看紧跟 There 的第一个名词 a book（单数），所以用 was。不要去数东西的总数。"}, {"id": 6, "type": "choice", "point": "be 动词过去式", "stem": "Where ______ you last night? I called you but nobody answered.", "options": ["A. was", "B. are", "C. did", "D. were"], "answer": "D", "explain": "主语 you <b>永远配 were<\/b>；句中没有实义动词，不需要 did；last night 提示过去时，排除 are。"}, {"id": 7, "type": "choice", "point": "did 后动词还原", "stem": "—______ you ______ your homework last night?　—Yes, I did.", "options": ["A. Did, do", "B. Did, did", "C. Do, do", "D. Did, done"], "answer": "A", "explain": "last night 提示过去时用 Did 开头；Did 后面的实义动词 do 必须用<b>原形<\/b>。这题里两个 do 词性不同：第一个是助动词，第二个是实义动词“做”。"}, {"id": 8, "type": "choice", "point": "过去式拼写", "stem": "The bus ______ suddenly and everyone fell forward.", "options": ["A. stopped", "B. stoped", "C. stopt", "D. stopping"], "answer": "A", "explain": "stop 是<b>重读闭音节<\/b>（s-t-o-p，辅音+元音+辅音），加 ed 要双写 p → stopped。"}, {"id": 9, "type": "fill", "point": "规则动词过去式", "stem": "写出 study 的过去式：______", "answer": ["studied"], "explain": "study 的 y 前面是辅音字母 d，要<b>变 y 为 i 再加 ed<\/b> → studied。规则和变三单（studies）完全一样。"}, {"id": 10, "type": "fill", "point": "过去时否定句", "stem": "把 He went to the park. 改成否定句：He didn’t ______ to the park.（填一个词）", "answer": ["go"], "explain": "过去时否定用 didn’t，而且 <b>didn’t 一出现，动词必须还原成原形<\/b>：went → <b>go<\/b>。写成 didn’t went 就犯了「一个句子出现两个时态标记」的错。"}, {"id": 11, "type": "judge", "point": "ed 的读音", "stem": "以 t 或 d 结尾的动词，加 ed 后这个 ed 读作 /ɪd/，比如 wanted、needed。", "answer": "对", "explain": "对。ed 有三种读音：<b>清辅音后读 /t/<\/b>（worked、liked）、<b>浊辅音和元音后读 /d/<\/b>（played、lived）、<b>t/d 结尾后读 /ɪd/<\/b>（wanted、needed、visited）。这直接影响听力辨认。"}, {"id": 12, "type": "judge", "point": "did 与动词形式", "stem": "Did he went to school? 这句话是正确的，因为句子说的是过去的事。", "answer": "错", "explain": "错。did 已经承担了“过去”这个信息，后面的动词必须还原成<b>原形<\/b>：Did he <b>go<\/b> to school? 一个句子只能有一个时态标记，不能重复表达。"}]}, {"id": "e-c4-s2", "title": "第二节 Lesson 79-84：不规则动词过去式 · 过去时综合", "notes": [{"point": "常见不规则动词过去式（第一组：形变）", "explain": "不规则动词的过去式不加 ed，必须逐个记忆。第一组是<b>元音改变<\/b>型，是数量最多的一类。", "examples": [{"tag": "基础", "text": "go→<b>went<\/b>、come→<b>came<\/b>、see→<b>saw<\/b>、do→<b>did<\/b>、get→<b>got<\/b>、give→<b>gave<\/b>、take→<b>took<\/b>、eat→<b>ate<\/b>、drink→<b>drank<\/b>、write→<b>wrote<\/b>。"}, {"tag": "进阶", "text": "有规律可循的几组：i→a（sit→sat, drink→drank, begin→began）／ i→o（write→wrote, drive→drove, ride→rode）／ ee→e（meet→met, feed→fed, keep→kept）。归类记比一个个背快得多。"}, {"tag": "易错", "text": "go 的过去式是 <b>went<\/b>，不是 goed；see 的过去式是 <b>saw<\/b>，不是 seed 或 seen（seen 是过去分词，用在完成时里）。<b>过去式和过去分词是两个不同的形式<\/b>，这个区分在学完成时时至关重要。"}], "think": "英语最常用的那些动词（go、be、have、do、see）几乎全是不规则的，反而生僻词大多规则 —— 你觉得这是巧合吗？（提示：哪些词被使用得最频繁、最不容易被“规整”掉？）"}, {"point": "常见不规则动词过去式（第二组：不变或小变）", "explain": "第二组是<b>原形和过去式相同<\/b>，或只加 t / 变尾音的类型。", "examples": [{"tag": "基础", "text": "不变：put→<b>put<\/b>、cut→<b>cut<\/b>、let→<b>let<\/b>、read→<b>read<\/b>（拼写不变，但读音从 /riːd/ 变成 /red/）、cost→<b>cost<\/b>、hurt→<b>hurt<\/b>。"}, {"tag": "进阶", "text": "变尾音：make→<b>made<\/b>、have→<b>had<\/b>、say→<b>said<\/b>、pay→<b>paid<\/b>、buy→<b>bought<\/b>、bring→<b>brought<\/b>、think→<b>thought<\/b>、teach→<b>taught<\/b>、catch→<b>caught<\/b>。注意 ought / aught 这一串读音相同。"}, {"tag": "易错", "text": "read 的过去式拼写完全不变，但<b>读音变了<\/b>：I read (/riːd/) books every day. ／ I read (/red/) a book yesterday. 只能靠句子里的时间词判断这个 read 是现在还是过去。"}], "think": "read 的过去式拼写不变、读音变，那在写作里怎么让读者知道你说的是现在还是过去？（提示：句子里还有什么东西能提供线索？）"}, {"point": "过去时的完整句型体系", "explain": "把过去时的四种句型串起来记：肯定、否定、一般疑问、特殊疑问。关键是分清句子里是 <b>be 动词<\/b>还是<b>实义动词<\/b>——前者动 be，后者请 did。", "examples": [{"tag": "基础", "text": "有 be：He <b>was<\/b> here. → He <b>wasn’t<\/b> here. → <b>Was<\/b> he here? → <b>Where was<\/b> he? ／ 无 be：He <b>went<\/b> home. → He <b>didn’t go<\/b> home. → <b>Did<\/b> he <b>go<\/b> home? → <b>Where did<\/b> he <b>go<\/b>?"}, {"tag": "进阶", "text": "特殊疑问句问主语时<b>不用助动词，语序不变<\/b>：<b>Who broke<\/b> the window?（谁打破了窗户？）—— 因为 who 本身就是主语，不需要再倒装。对比 <b>What did<\/b> you <b>break<\/b>?（问的是宾语，要用助动词）。"}, {"tag": "易错", "text": "“<u>Who did break<\/u> the window?” 在普通疑问时是多余的 ✗ → <b>Who broke<\/b> the window? ✓ 判断方法：<b>疑问词本身就是主语时，直接用陈述语序<\/b>。"}], "think": "Who broke the window? 和 What did you break? 一个不用 did，一个要用 —— 你能用“疑问词问的是主语还是宾语”这条规则解释清楚吗？"}, {"point": "过去进行时：was/were + doing", "explain": "表示<b>过去某个时刻正在进行<\/b>的动作，结构是 <b>was / were + 动词ing<\/b>。常和 when / while 引导的从句连用。", "examples": [{"tag": "基础", "text": "I <b>was watching<\/b> TV at eight last night.（昨晚八点我正在看电视）／ They <b>were playing<\/b> football when it began to rain."}, {"tag": "进阶", "text": "典型搭配：<b>短动作用过去时，长动作用过去进行时<\/b>。When I <b>came<\/b> in, he <b>was reading<\/b>.（我进来时他正在读书）—— “进来”是瞬间动作，“读书”是持续背景。"}, {"tag": "易错", "text": "“When I <u>was coming<\/u> in, he <u>read<\/u>.” 主次颠倒了 ✗ —— 应该是 When I <b>came<\/b> in, he <b>was reading<\/b>. ✓ 判断口诀：<b>背景用进行，插入用过去<\/b>。"}], "think": "“我进门时他正在看书”这句话里，两个动作哪个先开始、哪个先结束？英语用两种不同时态来表达这层关系，中文靠什么表达？"}, {"point": "过去时常用副词与连接词", "explain": "叙述过去的事情时，用这些词把动作的先后顺序串起来，作文会立刻变流畅。", "examples": [{"tag": "基础", "text": "first 首先、then 然后、after that 之后、later 后来、finally / at last 最后、suddenly 突然、at first 起初。"}, {"tag": "进阶", "text": "when 与 while 的区别：<b>when<\/b> 后面可跟短动作或长动作；<b>while<\/b> 后面<b>必须是持续性动作<\/b>（常用进行时）。While I <b>was cooking<\/b>, he came in. ✓ / While he <u>came<\/u> in ✗。"}, {"tag": "易错", "text": "at last 和 at first 意思相反：<b>at first<\/b> ＝ 起初、一开始；<b>at last<\/b> ＝ 最后、终于。两个词组只差一个词，方向完全相反，做阅读题时看错就全盘错。"}], "think": "如果让你用 first、then、finally 三个词讲一件昨天发生的事，你觉得为什么英语作文特别强调这类“顺序词”？"}], "quiz": [{"id": 1, "type": "multi", "point": "不规则动词过去式（想一想·刁钻）", "stem": "下列过去式<b>正确<\/b>的有（　）【多选】", "options": ["A. go — went", "B. go — goed", "C. see — saw", "D. see — seen", "E. eat — ate"], "answer": ["A", "C", "E"], "explain": "B 错：go 是不规则动词，过去式是 went 不是 goed。D 错：<b>seen 是过去分词<\/b>（用在完成时里），过去式是 saw。过去式和过去分词是两个不同的形式，学完成时时这个区分至关重要。"}, {"id": 2, "type": "multi", "point": "原形与过去式同形（想一想·刁钻）", "stem": "下列动词中，<b>过去式与原形拼写相同<\/b>的有（　）【多选】", "options": ["A. put", "B. cut", "C. read", "D. make", "E. cost"], "answer": ["A", "B", "C", "E"], "explain": "D 错：make 的过去式是 made。A、B、C、E 拼写都不变，但 <b>read 的读音要变<\/b>：现在时读 /riːd/，过去式读 /red/。"}, {"id": 3, "type": "multi", "point": "有 be 动 be，无 be 用 did（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. He wasn’t here yesterday.", "B. He didn’t be here yesterday.", "C. He didn’t go home.", "D. Was he here yesterday?", "E. Did he went home?"], "answer": ["A", "C", "D"], "explain": "B 错：句中有 be 动词就动 be，不请 did 出场。E 错：did 后动词要还原成 go。判断顺序永远是：<b>先找 be 或情态动词，找不到才用 did<\/b>。"}, {"id": 4, "type": "multi", "point": "疑问词作主语（想一想·刁钻）", "stem": "下列疑问句<b>正确<\/b>的有（　）【多选】", "options": ["A. Who broke the window?", "B. Who did break the window?", "C. What did you break?", "D. What you broke?", "E. Who came here yesterday?"], "answer": ["A", "C", "E"], "explain": "<b>疑问词本身就是主语时，用陈述语序，不加助动词<\/b>（A、E）。疑问词问宾语时才要用助动词并倒装（C）。B 多加了 did，D 少了助动词。"}, {"id": 5, "type": "multi", "point": "过去进行时与过去时的搭配（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. When I came in, he was reading.", "B. When I was coming in, he read.", "C. While I was cooking, he came in.", "D. While he came in, I was cooking.", "E. I was watching TV at eight last night."], "answer": ["A", "C", "E"], "explain": "口诀<b>“背景用进行，插入用过去”<\/b>：持续的背景动作用过去进行时，瞬间插入的动作用一般过去时。B 主次颠倒；D 错在 while 后面<b>必须跟持续性动作<\/b>，不能跟 came in。"}, {"id": 6, "type": "choice", "point": "不规则过去式", "stem": "She ______ a beautiful dress at the shop yesterday.", "options": ["A. buys", "B. buyed", "C. bought", "D. buying"], "answer": "C", "explain": "yesterday 提示过去时；buy 是不规则动词，过去式是 <b>bought<\/b>（不是 buyed）。同组还有 bring→brought、think→thought、teach→taught。"}, {"id": 7, "type": "choice", "point": "疑问词作主语", "stem": "______ told you the news? It’s a secret!", "options": ["A. Who did", "B. What did", "C. Whom did", "D. Who"], "answer": "D", "explain": "who 在这里<b>本身就是主语<\/b>（是“谁”做了 tell 这个动作），所以用陈述语序，动词直接用过去式 told，不需要助动词。"}, {"id": 8, "type": "choice", "point": "过去进行时", "stem": "It ______ heavily when I left the office.", "options": ["A. rains", "B. rained", "C. was raining", "D. is raining"], "answer": "C", "explain": "“我离开办公室”是<b>瞬间动作<\/b>（用过去时 left），“下雨”是<b>持续的背景<\/b>，用过去进行时 was raining。这就是“背景用进行，插入用过去”。"}, {"id": 9, "type": "fill", "point": "不规则动词", "stem": "写出 see 的过去式：______", "answer": ["saw"], "explain": "see 的过去式是 <b>saw<\/b>，过去分词是 seen。两个形式不能混用：I saw him yesterday.（过去式）／ I have seen him.（过去分词）。"}, {"id": 10, "type": "fill", "point": "过去进行时", "stem": "填空：When I came in, my mother ______ ______ dinner.（依次填 be 动词过去式和 cook 的正确形式）", "answer": ["was cooking"], "explain": "“做饭”是持续背景，用过去进行时；主语 my mother 是单数，be 动词过去式用 was；cook 加 ing。答案 was cooking。"}, {"id": 11, "type": "judge", "point": "read 的读音变化", "stem": "read 的过去式拼写和原形完全相同，但读音不同。", "answer": "对", "explain": "对。read 的原形读 /riːd/，过去式和过去分词都拼作 read 但读 /red/。判断句中的 read 是什么时态，只能靠<b>句子里的时间词<\/b>或上下文。"}, {"id": 12, "type": "judge", "point": "while 后接持续动作", "stem": "While he came in, I was cooking. 这句话语法正确。", "answer": "错", "explain": "错。<b>while 后面必须跟持续性动作<\/b>（通常用进行时），came in 是瞬间动作。正确写法：<b>When<\/b> he came in, I was cooking. 或 <b>While<\/b> I <b>was cooking<\/b>, he came in."}]}, {"id": "e-c4-s3", "title": "第三节 Lesson 85-90：现在完成时入门（have/has done）", "notes": [{"point": "现在完成时的构成与含义", "explain": "结构是 <b>have / has + 过去分词<\/b>。它表达的不是“过去发生了什么”，而是<b>过去的动作对现在造成的影响或结果<\/b>。主语三单用 has，其余用 have。", "examples": [{"tag": "基础", "text": "I <b>have finished<\/b> my homework.（作业做完了——所以现在我有空了）／ He <b>has gone<\/b> to Beijing.（他去北京了——所以现在人不在这儿）"}, {"tag": "进阶", "text": "对比感受一下：I <b>lost<\/b> my key.（过去时——只说丢了这件事）／ I <b>have lost<\/b> my key.（完成时——丢了，<b>而且现在还没找到<\/b>，所以我进不了门）。完成时永远带着“对现在的影响”。"}, {"tag": "易错", "text": "“He <u>has went<\/u> to Beijing.” ✗ —— 完成时用的是<b>过去分词<\/b>不是过去式：go 的过去式是 went，过去分词是 <b>gone<\/b>：He has <b>gone<\/b> to Beijing. ✓ 这是完成时的头号错误。"}], "think": "I lost my key. 和 I have lost my key. 中文都翻成“我钥匙丢了”，但第二句还额外告诉你一个信息——是什么？"}, {"point": "过去分词：动词的第三个形式", "explain": "每个动词有三个形式：<b>原形 - 过去式 - 过去分词<\/b>。规则动词后两个形式相同（work-worked-worked）；不规则动词要分别记。", "examples": [{"tag": "基础", "text": "三个都不同：go-went-<b>gone<\/b>、see-saw-<b>seen<\/b>、do-did-<b>done<\/b>、write-wrote-<b>written<\/b>、eat-ate-<b>eaten<\/b>、take-took-<b>taken<\/b>、give-gave-<b>given<\/b>。"}, {"tag": "进阶", "text": "后两个相同：buy-bought-<b>bought<\/b>、make-made-<b>made<\/b>、have-had-<b>had<\/b>、say-said-<b>said<\/b>、bring-brought-<b>brought<\/b>。三个全相同：put-put-<b>put<\/b>、cut-cut-<b>cut<\/b>、let-let-<b>let<\/b>。"}, {"tag": "易错", "text": "过去分词绝不能单独作谓语：“I <u>seen<\/u> him.” ✗ —— 过去分词必须和 have / has / had 或 be 连用：I <b>have seen<\/b> him. ✓ 或 I <b>saw<\/b> him. ✓ 光秃秃的 seen、gone、done 不能当动词用。"}], "think": "规则动词的过去式和过去分词长得一模一样（worked / worked），那怎么判断句子里那个 worked 是哪一个？（提示：看它前面有没有 have。）"}, {"point": "already / yet / just 的用法", "explain": "这三个词是现在完成时的“标配”：<b>already<\/b>（已经，用于肯定句，放句中）；<b>yet<\/b>（还，用于否定和疑问句，放句末）；<b>just<\/b>（刚刚，放句中）。", "examples": [{"tag": "基础", "text": "I have <b>already<\/b> finished it.（已经完成了）／ I haven’t finished it <b>yet<\/b>.（还没完成）／ Have you finished <b>yet<\/b>?（完成了吗？）／ He has <b>just<\/b> left.（他刚走）"}, {"tag": "进阶", "text": "already 偶尔出现在疑问句里，表示<b>惊讶<\/b>：Have you finished it <b>already<\/b>?（你这么快就做完了？）—— 语气和 yet 完全不同，一个是“惊讶”，一个是中性询问。"}, {"tag": "易错", "text": "位置不能互换：already / just 放<b>助动词和过去分词之间<\/b>，yet 放<b>句末<\/b>。“I have finished it <u>yet<\/u>.” ✗（肯定句不用 yet）／ “I haven’t <u>already<\/u> finished.” ✗（否定句不用 already）。"}], "think": "Have you finished yet? 和 Have you finished already? 都是问“做完了吗”，为什么后者听起来像在惊讶？"}, {"point": "have been to 与 have gone to", "explain": "这是完成时最经典的一对：<b>have been to<\/b> ＝ 去过（人<b>已经回来了<\/b>）；<b>have gone to<\/b> ＝ 去了（人<b>还在那里或路上，不在这儿<\/b>）。", "examples": [{"tag": "基础", "text": "He <b>has been to<\/b> Beijing.（他去过北京——现在人在这儿）／ He <b>has gone to<\/b> Beijing.（他去北京了——现在人不在这儿）"}, {"tag": "进阶", "text": "所以 have gone to <b>不能用于第一、二人称<\/b>：“I have gone to Beijing.” 逻辑上说不通（你人在这儿说话，怎么会“不在这儿”？）。要说 I <b>have been to<\/b> Beijing."}, {"tag": "易错", "text": "看到 “—Where is Tom? —He <u>has been to<\/u> the library.” ✗ —— 问的是他人在哪，说明他不在这儿，要用 <b>has gone to<\/b>。判断方法：<b>人回来了用 been，人还没回来用 gone<\/b>。"}], "think": "如果同事问你“Tom 在吗？”，你答 He has been to the library.，同事会怎么理解你的话？这和你想表达的一样吗？"}, {"point": "现在完成时的否定与疑问", "explain": "完成时里 have / has 是<b>助动词<\/b>，所以否定在它后面加 not，疑问把它提到句首。<b>不用 do / did<\/b>。", "examples": [{"tag": "基础", "text": "He has finished. → He <b>hasn’t<\/b> finished. → <b>Has<\/b> he finished? → Yes, he has. / No, he hasn’t."}, {"tag": "进阶", "text": "缩写：have not ＝ haven’t，has not ＝ hasn’t。简答里保留 have / has：Have you seen him? — Yes, I <b>have<\/b>.（不说 Yes, I did.）"}, {"tag": "易错", "text": "“<u>Did<\/u> he has finished?” ✗ 或 “He <u>doesn’t have<\/u> finished.” ✗ —— 完成时的 have / has 是助动词，自己就能变疑问和否定：<b>Has<\/b> he finished? ✓ / He <b>hasn’t<\/b> finished. ✓"}], "think": "I have a book.（我有本书）里的 have 变疑问要说 Do you have a book?，但 I have finished. 里的 have 变疑问却说 Have you finished? —— 同一个 have，为什么规则不一样？"}], "quiz": [{"id": 1, "type": "multi", "point": "完成时用过去分词（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. He has gone to Beijing.", "B. He has went to Beijing.", "C. I have seen him.", "D. I have saw him.", "E. I have finished my homework."], "answer": ["A", "C", "E"], "explain": "完成时用的是<b>过去分词<\/b>不是过去式：go-went-<b>gone<\/b>、see-saw-<b>seen<\/b>。B、D 都误用了过去式。这是现在完成时的头号错误。"}, {"id": 2, "type": "multi", "point": "动词三个形式（想一想·刁钻）", "stem": "下列“原形-过去式-过去分词”配对<b>正确<\/b>的有（　）【多选】", "options": ["A. go - went - gone", "B. see - saw - seen", "C. do - did - done", "D. write - wrote - wrote", "E. put - put - put"], "answer": ["A", "B", "C", "E"], "explain": "D 错：write 的过去分词是 <b>written<\/b>（三个形式全不同）。E 对：put 三个形式完全相同，同类还有 cut、let、cost、hurt。"}, {"id": 3, "type": "multi", "point": "already / yet / just（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. I have already finished it.", "B. I haven’t finished it yet.", "C. I have finished it yet.", "D. He has just left.", "E. I haven’t already finished it."], "answer": ["A", "B", "D"], "explain": "<b>already 用于肯定句放句中，yet 用于否定疑问句放句末<\/b>。C 在肯定句里用了 yet，E 在否定句里用了 already，位置和句型都配错了。"}, {"id": 4, "type": "multi", "point": "been to 与 gone to（想一想·刁钻）", "stem": "下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. have been to 表示去过，人已经回来了。", "B. have gone to 表示去了，人还没回来。", "C. I have gone to Beijing. 是合逻辑的句子。", "D. —Where is Tom? —He has gone to the library. 是正确的回答。", "E. I have been to Beijing twice."], "answer": ["A", "B", "D", "E"], "explain": "只有 C 错：have gone to <b>不能用于第一、二人称<\/b>——你正在这儿说话，不可能“人不在这儿”。要说 I have <b>been<\/b> to Beijing."}, {"id": 5, "type": "multi", "point": "完成时的疑问否定（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. Has he finished?", "B. Did he has finished?", "C. He hasn’t finished.", "D. He doesn’t have finished.", "E. Have you seen him? — Yes, I have."], "answer": ["A", "C", "E"], "explain": "完成时里的 have / has 是<b>助动词<\/b>，自己就能变疑问否定，<b>不借 do / did<\/b>。B、D 都多请了一个助动词。E 提醒简答要用 have，不能用 did。"}, {"id": 6, "type": "choice", "point": "过去分词", "stem": "I have ______ my key. I can’t open the door.", "options": ["A. lose", "B. lost", "C. losing", "D. loses"], "answer": "B", "explain": "现在完成时用<b>过去分词<\/b>，lose 的过去分词是 lost。后半句“开不了门”正好体现了完成时的核心——<b>过去的动作对现在的影响<\/b>。"}, {"id": 7, "type": "choice", "point": "been to 与 gone to", "stem": "—Where is your father?　—He ______ Shanghai. He will come back next week.", "options": ["A. has been to", "B. goes to", "C. went to", "D. has gone to"], "answer": "D", "explain": "问“人在哪”，而且下周才回来，说明<b>人还没回来<\/b>，用 has gone to。has been to 表示去过并且已经回来了。"}, {"id": 8, "type": "choice", "point": "yet 的位置", "stem": "—Have you finished your homework ______?　—Not yet.", "options": ["A. already", "B. just", "C. yet", "D. ever"], "answer": "C", "explain": "疑问句中表示“还、已经”用 <b>yet<\/b>，放在<b>句末<\/b>。回答 Not yet.（还没）也印证了这一点。如果用 already 会带上“惊讶”的语气。"}, {"id": 9, "type": "fill", "point": "过去分词", "stem": "写出 write 的过去分词：______", "answer": ["written"], "explain": "write 的三个形式是 write - wrote - <b>written<\/b>，三个全不同。别把过去式 wrote 当成过去分词用。"}, {"id": 10, "type": "fill", "point": "现在完成时造句", "stem": "填空：He ______ ______ his homework already.（依次填助动词和 finish 的正确形式，主语是 He）", "answer": ["has finished"], "explain": "主语 He 是三单，助动词用 has；finish 是规则动词，过去分词是 finished。答案 has finished。"}, {"id": 11, "type": "judge", "point": "过去分词不能单独作谓语", "stem": "过去分词不能单独作谓语，必须和 have / has / had 或 be 连用。", "answer": "对", "explain": "对。所以 “I <u>seen<\/u> him.” ✗ 是错的，要么写成 I <b>saw<\/b> him.（过去式独立作谓语），要么写成 I <b>have seen<\/b> him.（过去分词配 have）。光秃秃的 seen、gone、done 不能当动词用。"}, {"id": 12, "type": "judge", "point": "完成时与过去时的区别", "stem": "I lost my key. 和 I have lost my key. 表达的意思完全一样。", "answer": "错", "explain": "错。<b>过去时只陈述过去发生的事<\/b>（可能后来找到了）；<b>现在完成时强调对现在的影响<\/b>——钥匙丢了，而且<b>现在还没找到<\/b>，所以我进不了门。这是完成时存在的全部理由。"}]}, {"id": "e-c4-s4", "title": "第四节 Lesson 91-96：完成时 vs 过去时 · ever/never/for/since", "notes": [{"point": "现在完成时不能和确切的过去时间连用", "explain": "这是区分两种时态最硬的一条规则：<b>句子里出现 yesterday、last week、in 2020、three days ago 等确切过去时间时，只能用一般过去时<\/b>，不能用现在完成时。", "examples": [{"tag": "基础", "text": "I <b>saw<\/b> him yesterday. ✓ ／ I <u>have seen<\/u> him yesterday. ✗ ／ I <b>have seen<\/b> him.（没说具体时间，可以用完成时）✓"}, {"tag": "进阶", "text": "原因：完成时关注的是“<b>到现在为止<\/b>”的结果，而 yesterday 把时间钉死在过去，两者的时间视角冲突。所以完成时只能配 already、just、yet、ever、never、before、recently 这类<b>模糊时间<\/b>。"}, {"tag": "易错", "text": "“He <u>has come<\/u> here last week.” ✗ → He <b>came<\/b> here last week. ✓ 做题技巧：<b>先在句子里找有没有确切过去时间，找到就直接用过去时<\/b>，这一步能解决大半的时态选择题。"}], "think": "为什么“我昨天见过他”不能用完成时，“我见过他”就可以？（提示：完成时想强调的是“到现在为止的经历”，一旦钉死时间，还需要强调“到现在”吗？）"}, {"point": "ever 与 never：问经历", "explain": "<b>ever<\/b>（曾经）用于疑问句，问对方有没有这个经历；<b>never<\/b>（从未）用于否定，表示没有过。两者都放在 <b>have / has 和过去分词之间<\/b>。", "examples": [{"tag": "基础", "text": "<b>Have<\/b> you <b>ever been<\/b> to Beijing?（你去过北京吗？）— Yes, I have. / No, I <b>have never been<\/b> there."}, {"tag": "进阶", "text": "回答“去过几次”用 <b>times<\/b>：I have been there <b>twice<\/b>.（两次）／ <b>three times<\/b>（三次）。“一次”是 once，“两次”是 twice，三次以上才用数字 + times。"}, {"tag": "易错", "text": "never 本身是否定词，不能再加 not：“I <u>haven’t never<\/u> been there.” ✗ → I <b>have never<\/b> been there. ✓ 或 I <b>haven’t<\/b> been there. ✓ 又是英语禁止双重否定的例子。"}], "think": "“一次”是 once，“两次”是 twice，为什么“三次”不是一个专门的词而要说 three times？英语在数量表达上到几就“放弃”造新词了？"}, {"point": "for 与 since：表示持续多久", "explain": "现在完成时可以表示“<b>从过去某时一直持续到现在<\/b>”。<b>for + 一段时间<\/b>（for two years，持续了多久）；<b>since + 过去的时间点<\/b>（since 2020，从什么时候开始）。", "examples": [{"tag": "基础", "text": "I have lived here <b>for<\/b> ten years.（住了十年）／ I have lived here <b>since<\/b> 2016.（从 2016 年起就住这儿）"}, {"tag": "进阶", "text": "since 后面也可以跟<b>一个过去时的句子<\/b>：I have lived here <b>since I was born<\/b>.（从我出生起）。注意 since 从句用<b>过去时<\/b>，主句用<b>完成时<\/b>，两个时态搭配出现。"}, {"tag": "易错", "text": "for 和 since 后面跟的东西完全不同：“for 2016” ✗、“since ten years” ✗。判断方法：<b>后面是“多长”用 for，是“哪一天/哪一年”用 since<\/b>。"}], "think": "I have lived here for ten years. 和 I have lived here since 2016. 说的是同一件事，为什么英语要留两种说法？哪一种在时间过去后需要改数字？"}, {"point": "延续性动词与非延续性动词", "explain": "和 for / since 连用的必须是<b>能持续的动词<\/b>（live、stay、work、learn、be）。像 come、go、buy、die、begin 这类<b>瞬间动词<\/b>不能直接和一段时间连用，要换成对应的持续说法。", "examples": [{"tag": "基础", "text": "✓ I have <b>lived<\/b> here for ten years.（live 可持续）／ ✗ I have <u>come<\/u> here for ten years.（come 是瞬间动作）"}, {"tag": "进阶", "text": "常见转换：come→<b>be here<\/b>、go→<b>be away<\/b>、buy→<b>have<\/b>、die→<b>be dead<\/b>、begin→<b>be on<\/b>、join→<b>be in / be a member of<\/b>。例如 He has <b>been in<\/b> the army for three years.（不说 has joined the army for three years）"}, {"tag": "易错", "text": "“He has <u>died<\/u> for three years.” ✗ —— die 是瞬间动作，不能持续三年。正确：He has <b>been dead<\/b> for three years. ✓ 或 He <b>died<\/b> three years ago. ✓ 这是完成时里最精细的一个考点。"}], "think": "“他去世三年了”这句中文很自然，直译成 He has died for three years. 却错了 —— 中文的“了”和英语的完成时，在处理“瞬间动作 + 一段时间”时差在哪？"}, {"point": "时态选择的判断流程", "explain": "遇到时态选择题，按这个顺序走，正确率最高：① 找<b>确切过去时间<\/b>（yesterday、last…、…ago）→ 有就用<b>一般过去时<\/b>；② 找 already / just / yet / ever / never / for / since → 有就用<b>现在完成时<\/b>；③ 找 now / Look! / Listen! → <b>现在进行时<\/b>；④ 找 every day / always / usually → <b>一般现在时<\/b>；⑤ 找 tomorrow / next… → <b>将来时<\/b>。", "examples": [{"tag": "基础", "text": "He ______ (go) to Beijing last week. → <u>last week<\/u> → 一般过去时 → <b>went<\/b>"}, {"tag": "进阶", "text": "He ______ (be) here <u>since<\/u> 2020. → since → 现在完成时 → <b>has been<\/b>。注意这里 be 的过去分词是 been，主语三单用 has。"}, {"tag": "易错", "text": "有些句子<b>两个标志词都出现<\/b>，要看哪个管着这个动词：I <b>came<\/b> here in 2016 and I <b>have lived<\/b> here <b>since then<\/b>.（前半句配 in 2016 用过去时，后半句配 since 用完成时）。别看到一个词就套整句。"}], "think": "如果一道题里既没有时间标志词，也没有 Look!/Listen!，你还能用什么线索判断时态？（提示：看看句子的其他部分——上下文的动词是什么时态？）"}], "quiz": [{"id": 1, "type": "multi", "point": "完成时与确切过去时间（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. I saw him yesterday.", "B. I have seen him yesterday.", "C. I have seen him.", "D. He came here last week.", "E. He has come here last week."], "answer": ["A", "C", "D"], "explain": "<b>现在完成时不能和确切的过去时间连用<\/b>（yesterday、last week、…ago），因为完成时关注“到现在为止”，而这些词把时间钉死在过去，视角冲突。B、E 都犯了这个错。"}, {"id": 2, "type": "multi", "point": "ever 与 never（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. Have you ever been to Beijing?", "B. I have never been there.", "C. I haven’t never been there.", "D. I have been there twice.", "E. I have been to there twice."], "answer": ["A", "B", "D"], "explain": "C 错：<b>never 本身是否定词<\/b>，不能再加 haven’t（英语禁止双重否定）。E 错：<b>there 是副词，前面不加 to<\/b>，应说 I have been <b>there<\/b> twice.（同理 go home、come here 都不加介词）。<br>顺带一提：“两次”习惯说 <b>twice<\/b>，说 two times 语法不算错，只是不如 twice 自然；三次以上就用 three times 这种说法。"}, {"id": 3, "type": "multi", "point": "for 与 since（想一想·刁钻）", "stem": "下列搭配<b>正确<\/b>的有（　）【多选】", "options": ["A. for ten years", "B. since ten years", "C. since 2016", "D. for 2016", "E. since I was born"], "answer": ["A", "C", "E"], "explain": "<b>for + 一段时间<\/b>（多长），<b>since + 时间点<\/b>（从何时起）。B、D 把两者搭反了。E 对：since 后面也可以跟一个过去时的句子。"}, {"id": 4, "type": "multi", "point": "瞬间动词不能配一段时间（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. I have lived here for ten years.", "B. I have come here for ten years.", "C. He has been dead for three years.", "D. He has died for three years.", "E. He has been in the army for three years."], "answer": ["A", "C", "E"], "explain": "come、die、join 都是<b>瞬间动词<\/b>，不能和一段时间连用，要换成持续说法：come→be here、die→<b>be dead<\/b>、join→<b>be in<\/b>。B、D 都是直译中文造成的错误。"}, {"id": 5, "type": "multi", "point": "时态判断流程（想一想·刁钻）", "stem": "关于时态判断，说法<b>正确<\/b>的有（　）【多选】", "options": ["A. 看到 yesterday、last week 用一般过去时。", "B. 看到 since、for 用现在完成时。", "C. 看到 Look!、Listen! 用现在进行时。", "D. 看到 every day 用现在完成时。", "E. 一个句子里可能同时出现两种时态。"], "answer": ["A", "B", "C", "E"], "explain": "D 错：every day 表示习惯，用<b>一般现在时<\/b>。E 对：I came here in 2016 and have lived here since then. 前后半句各配各的标志词，不能看到一个词就套整句。"}, {"id": 6, "type": "choice", "point": "确切过去时间", "stem": "My father ______ to Shanghai on business last month.", "options": ["A. has gone", "B. went", "C. goes", "D. has been"], "answer": "B", "explain": "句中有 <b>last month<\/b>（确切过去时间），只能用一般过去时 went。完成时不能和确切过去时间连用。"}, {"id": 7, "type": "choice", "point": "for 与 since", "stem": "We ______ good friends since we were children.", "options": ["A. are", "B. were", "C. have been", "D. has been"], "answer": "C", "explain": "since 提示<b>现在完成时<\/b>；主语 We 是复数用 have；be 的过去分词是 been。注意 since 从句用过去时（were），主句用完成时，这是固定搭配。"}, {"id": 8, "type": "choice", "point": "瞬间动词转换", "stem": "His grandfather ______ for five years.", "options": ["A. has died", "B. has been dead", "C. died for", "D. is dead for"], "answer": "B", "explain": "die 是<b>瞬间动词<\/b>，不能和 for five years 连用。要换成持续状态 <b>be dead<\/b>（处于死亡状态）：has been dead for five years。"}, {"id": 9, "type": "fill", "point": "for 与 since 的选择", "stem": "填空：I have lived in this city ______ 2016.（填一个词）", "answer": ["since"], "explain": "2016 是<b>时间点<\/b>（从哪一年起），用 since。如果后面是 ten years（一段时长）才用 for。"}, {"id": 10, "type": "fill", "point": "时态选择", "stem": "用 go 的正确形式填空：He ______ to the park yesterday.（填一个词）", "answer": ["went"], "explain": "yesterday 是<b>确切过去时间<\/b>，只能用一般过去时；go 的过去式是不规则形式 went。不能填 has gone。"}, {"id": 11, "type": "judge", "point": "完成时的时间限制", "stem": "I have seen him. 这句话没有确切的过去时间状语，所以用现在完成时是正确的。", "answer": "对", "explain": "对。<b>现在完成时只能配模糊时间<\/b>（already、just、ever、never、before）或者干脆不带时间词。一旦加上 yesterday、last week 这类确切过去时间，就必须改用一般过去时：I <b>saw<\/b> him yesterday."}, {"id": 12, "type": "judge", "point": "延续性动词", "stem": "He has joined the army for three years. 这句话语法正确。", "answer": "错", "explain": "错。join（参军、加入）是<b>瞬间动词<\/b>，不能持续三年。正确说法：He has <b>been in<\/b> the army for three years.（处于军中的状态）或 He <b>joined<\/b> the army three years ago."}]}, {"id": "e-c4-s5", "title": "第五节 单词总复习（七）：不规则动词三态表 · 购物用语", "notes": [{"point": "必背不规则动词三态（第一组）", "explain": "把最高频的不规则动词按“三个形式的关系”分组，比按字母表背高效得多。", "examples": [{"tag": "基础", "text": "<b>三个全不同<\/b>：go-went-gone、see-saw-seen、do-did-done、eat-ate-eaten、drink-drank-drunk、write-wrote-written、take-took-taken、give-gave-given、speak-spoke-spoken、break-broke-broken。"}, {"tag": "进阶", "text": "<b>后两个相同<\/b>：buy-bought-bought、bring-brought-brought、think-thought-thought、teach-taught-taught、catch-caught-caught、have-had-had、make-made-made、say-said-said、find-found-found、tell-told-told。"}, {"tag": "易错", "text": "come 和 become 是<b>第一个和第三个相同<\/b>的特殊类型：come-came-<b>come<\/b>、become-became-<b>become<\/b>、run-ran-<b>run<\/b>。别看到 come 就以为是三态相同（那是 put、cut 那一类）。"}], "think": "把不规则动词按“三个形式的关系”分成四类（全同、全不同、前两同、后两同），这样分组记忆比按字母顺序背快在哪里？"}, {"point": "必背不规则动词三态（第二组）", "explain": "第二组是三态相同和更零散的形式，数量少但出现频率高。", "examples": [{"tag": "基础", "text": "<b>三个全相同<\/b>：put-put-put、cut-cut-cut、let-let-let、cost-cost-cost、hurt-hurt-hurt、read-read-read（读音变）。"}, {"tag": "进阶", "text": "<b>be 动词最特殊<\/b>：am/is-was-been、are-were-been。它有<b>两个过去式<\/b>（was / were）但只有<b>一个过去分词<\/b>（been）。所以 I have been、He has been、They have been 全都用 been。"}, {"tag": "易错",
