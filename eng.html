 "text": "be 的过去分词是 <b>been<\/b> 不是 was：“I have <u>was<\/u> to Beijing.” ✗ → I have <b>been<\/b> to Beijing. ✓ 这个错误在写 have been to 句型时特别高频。"}], "think": "be 动词有 am/is/are/was/were 五个形式，为什么过去分词只有 been 一个？（提示：过去分词跟在 have 后面，还需要区分人称吗？）"}, {"point": "购物场景用语", "explain": "第一册中后段的购物对话，句型固定，整句记下来就能直接用。", "examples": [{"tag": "基础", "text": "顾客：<b>How much is it?<\/b>（多少钱）／ <b>Can I help you?<\/b>（店员问：需要帮忙吗）／ <b>I want / I’d like...<\/b>（我要）／ <b>I’ll take it.<\/b>（我买了）"}, {"tag": "进阶", "text": "试穿和尺码：<b>Can I try it on?<\/b>（能试穿吗）／ <b>What size do you take?<\/b>（你穿多大码）／ <b>It’s too small / too big.<\/b>（太小/太大了）／ <b>Do you have a bigger one?<\/b>（有大一点的吗）"}, {"tag": "易错", "text": "try on 是<b>可分短语动词<\/b>：代词必须放中间——“try <u>on it<\/u>” ✗ → <b>try it on<\/b> ✓。但名词可放中间也可放后面：try on the coat ＝ try the coat on，两种都对。"}], "think": "try it on 不能说成 try on it，但 try on the coat 和 try the coat on 都行 —— 英语为什么单单对代词这么严格？"}, {"point": "too / enough / very 的用法", "explain": "<b>too<\/b> ＝ 太……（含贬义，表示超过了合适的程度）；<b>very<\/b> ＝ 很（中性）；<b>enough<\/b> ＝ 足够，位置特殊：<b>放在形容词/副词后面，名词前面<\/b>。", "examples": [{"tag": "基础", "text": "It’s <b>too<\/b> small.（太小了——穿不下）／ It’s <b>very<\/b> small.（很小——但可能刚好）／ It’s big <b>enough<\/b>.（够大了）／ I have <b>enough<\/b> money.（钱够了）"}, {"tag": "进阶", "text": "固定句型 <b>too ... to do<\/b> ＝ 太……以至于不能……：He is <b>too<\/b> young <b>to<\/b> go to school.（他太小，不能上学）。这个句型虽然没有 not，意思却是<b>否定的<\/b>。"}, {"tag": "易错", "text": "enough 修饰形容词时放<b>后面<\/b>：“<u>enough<\/u> big” ✗ → <b>big enough<\/b> ✓；但修饰名词时放<b>前面<\/b>：<b>enough<\/b> money ✓。这是英语里少见的“位置随词性变”的词，务必记牢。"}], "think": "He is too young to go to school. 整句没有一个否定词，为什么意思却是“不能上学”？"}], "quiz": [{"id": 1, "type": "multi", "point": "不规则动词三态（想一想·刁钻）", "stem": "下列三态配对<b>正确<\/b>的有（　）【多选】", "options": ["A. come - came - come", "B. come - came - comen", "C. run - ran - run", "D. write - wrote - written", "E. buy - bought - bought"], "answer": ["A", "C", "D", "E"], "explain": "只有 B 错（没有 comen 这个词）。come 和 run 属于<b>第一个和第三个相同<\/b>的类型：come-came-come、run-ran-run、become-became-become。"}, {"id": 2, "type": "multi", "point": "be 动词的三态（想一想·刁钻）", "stem": "关于 be 动词的形式，说法<b>正确<\/b>的有（　）【多选】", "options": ["A. be 的过去分词是 been。", "B. be 的过去分词是 was。", "C. be 有两个过去式：was 和 were。", "D. I have been to Beijing. 是正确的。", "E. I have was to Beijing. 是正确的。"], "answer": ["A", "C", "D"], "explain": "be 有<b>两个过去式<\/b>（was / were）但只有<b>一个过去分词<\/b>（been）。所以完成时里不论主语是谁，一律用 been。B、E 都误把过去式当成了过去分词。"}, {"id": 3, "type": "multi", "point": "try on 的语序（想一想·刁钻）", "stem": "下列表达<b>正确<\/b>的有（　）【多选】", "options": ["A. try it on", "B. try on it", "C. try on the coat", "D. try the coat on", "E. Can I try it on?"], "answer": ["A", "C", "D", "E"], "explain": "只有 B 错。try on 是<b>可分短语动词<\/b>：<b>代词必须放中间<\/b>（try it on），<b>名词放中间放后面都行<\/b>（try on the coat ＝ try the coat on）。"}, {"id": 4, "type": "multi", "point": "too / enough 的位置（想一想·刁钻）", "stem": "下列表达<b>正确<\/b>的有（　）【多选】", "options": ["A. big enough", "B. enough big", "C. enough money", "D. money enough", "E. too small"], "answer": ["A", "C", "E"], "explain": "<b>enough 修饰形容词放后面<\/b>（big enough），<b>修饰名词放前面<\/b>（enough money）。B、D 都放反了。这是英语里少见的“位置随词性变”的词。"}, {"id": 5, "type": "choice", "point": "过去分词", "stem": "I have ______ this book three times. It’s really good.", "options": ["A. read", "B. readed", "C. reading", "D. reads"], "answer": "A", "explain": "read 的三态完全相同（read-read-read），过去分词就是 read（但读 /red/）。read 没有 readed 这个形式。"}, {"id": 6, "type": "choice", "point": "too...to 句型", "stem": "He is ______ young ______ go to school.", "options": ["A. too, to", "B. very, to", "C. too, for", "D. enough, to"], "answer": "A", "explain": "<b>too + 形容词 + to do<\/b> ＝ 太……以至于不能……。整句没有否定词，但意思是<b>否定的<\/b>：他太小了，不能上学。"}, {"id": 7, "type": "choice", "point": "购物用语", "stem": "—Can I help you?　—Yes, I’d like ______ this coat.", "options": ["A. to try on", "B. try on", "C. trying on", "D. try"], "answer": "A", "explain": "would like 后面固定跟 <b>to do<\/b>（不定式），所以是 to try on。这里 this coat 是名词，可以放在 on 后面。"}, {"id": 8, "type": "fill", "point": "不规则动词过去分词", "stem": "写出 break 的过去分词：______", "answer": ["broken"], "explain": "break 的三态是 break - broke - <b>broken<\/b>，三个全不同。同组的还有 speak-spoke-spoken、take-took-taken。"}, {"id": 9, "type": "fill", "point": "be 的过去分词", "stem": "填空：I have ______ to Beijing twice.（填 be 的正确形式）", "answer": ["been"], "explain": "have been to（去过）里用的是 be 的<b>过去分词 been<\/b>，不是过去式 was。这是 have been to 句型的高频错点。"}, {"id": 10, "type": "fill", "point": "enough 的位置", "stem": "填空（用 enough 和 old 组成正确语序）：He is ______ ______ to go to school.（依次填两个词）", "answer": ["old enough"], "explain": "enough <b>修饰形容词时放在形容词后面<\/b> → old enough（够大了）。不能写成 enough old。"}, {"id": 11, "type": "judge", "point": "短语动词与代词", "stem": "try on 后面接代词时，代词可以放在 on 的后面，比如 try on it。", "answer": "错", "explain": "错。<b>可分短语动词后面接代词时，代词必须放中间<\/b>：try <b>it<\/b> on ✓ / try on it ✗。接名词才两种位置都行：try on the coat ＝ try the coat on。同类的还有 put it on、take it off、turn it on。"}, {"id": 12, "type": "judge", "point": "come 的三态", "stem": "come 的三个形式是 come - came - come，第一个和第三个相同。", "answer": "对", "explain": "对。come-came-come、run-ran-run、become-became-become 属于<b>第一三相同<\/b>类。要和 put-put-put（三个全同）区分开。"}]}, {"id": "e-c4-s6", "title": "第六节 单词总复习（八）：旅行度假 · 时间状语 · 高频副词", "notes": [{"point": "旅行与度假词汇", "explain": "Lesson 83-90 的度假主题词汇，配合完成时使用频率极高。", "examples": [{"tag": "基础", "text": "holiday 假期、trip 旅行、journey 旅程、ticket 票、passport 护照、luggage 行李（不可数）、suitcase 手提箱、airport 机场、station 车站、hotel 旅馆。"}, {"tag": "进阶", "text": "常用搭配：<b>go on holiday<\/b> 去度假、<b>have a good time<\/b> 玩得开心、<b>take a trip<\/b> 旅行、<b>book a ticket<\/b> 订票（book 作动词是“预订”）、<b>check in<\/b> 办理入住/登机。"}, {"tag": "易错", "text": "luggage（行李）是<b>不可数名词<\/b>，没有复数：“three <u>luggages<\/u>” ✗ → three <b>pieces of<\/b> luggage ✓。同类的不可数名词还有 furniture（家具）、information（信息）、advice（建议）、homework（作业）。"}], "think": "英语把 luggage、furniture、information 都算作不可数，中文却能说“三件行李、两条信息”—— 你觉得英语是按什么标准判断可数不可数的？"}, {"point": "时间状语的完整清单", "explain": "把各时态的时间标志词集中列一遍，做题时可以直接对照。", "examples": [{"tag": "基础", "text": "<b>过去<\/b>：yesterday, last week/month/year, … ago, just now, in 2020, at that time。<b>现在<\/b>：now, at the moment, today, these days。<b>将来<\/b>：tomorrow, next week, soon, in the future。"}, {"tag": "进阶", "text": "<b>现在完成时专用<\/b>：already, yet, just, ever, never, before, recently, so far（到目前为止）, for + 时段, since + 时间点, in the past few years。<b>频度<\/b>：always, usually, often, sometimes, seldom, never。"}, {"tag": "易错", "text": "三对最容易混：<b>just now<\/b>（刚才，过去时）vs <b>just<\/b>（刚刚，完成时）／ <b>ago<\/b>（从现在往回，过去时）vs <b>before<\/b>（从过去往回）／ <b>in + 时段<\/b>（将来，in two days ＝ 两天后）vs <b>… ago<\/b>（过去）。"}], "think": "in two days 意思是“两天后”，two days ago 是“两天前”—— 同样是 two days，一个 in 一个 ago 就把时间方向调转了。这两个词各自站在哪个时间点上看？"}, {"point": "高频副词与位置", "explain": "副词修饰动词、形容词或整句，位置比较灵活，但有几条常规。", "examples": [{"tag": "基础", "text": "方式副词（quickly, slowly, carefully, loudly, well, badly）通常放<b>动词后面<\/b>：He runs <b>quickly<\/b>. ／ She sings <b>well<\/b>."}, {"tag": "进阶", "text": "程度副词（very, quite, really, so, too）放在<b>被修饰词前面<\/b>：<b>very<\/b> good, <b>quite<\/b> nice, <b>too<\/b> small。注意 very 不能修饰动词：“I very like it.” ✗ → I like it <b>very much<\/b>. ✓"}, {"tag": "易错", "text": "good 和 well 分工不同：<b>good<\/b> 是形容词（修饰名词或作表语），<b>well<\/b> 是副词（修饰动词）。“He sings <u>good<\/u>.” ✗ → He sings <b>well<\/b>. ✓ 但 “He is a <b>good<\/b> singer.” ✓ 另外 well 还能作形容词表示“身体好”：I’m very well."}], "think": "中文说“我很喜欢它”，直译成 I very like it. 却是错的，要说 I like it very much. —— 英语为什么不许 very 直接修饰动词？"}, {"point": "序数词与日期表达", "explain": "英语的日期写法和读法与中文顺序不同，是考试和写作的常见考点。", "examples": [{"tag": "基础", "text": "美式：<b>月 + 日 + 年<\/b>（May 1st, 2026）／ 英式：<b>日 + 月 + 年<\/b>（1st May, 2026）。读的时候日要读<b>序数词<\/b>：May the first。"}, {"tag": "进阶", "text": "问日期用 <b>What’s the date today?<\/b> — It’s May 1st. 问星期用 <b>What day is it today?<\/b> — It’s Monday。另外“在几号”用 <b>on<\/b>：on May 1st、on the first of May。"}, {"tag": "易错", "text": "日期里的“日”必须用<b>序数词<\/b>：“May <u>one<\/u>” ✗ → May <b>1st<\/b>（first）✓。而年份读基数词：2026 读 twenty twenty-six 或 two thousand and twenty-six。一个序数一个基数，别搞反。"}], "think": "英式日期是 1st May（日在前），美式是 May 1st（月在前），中文是 5月1日（月在前）—— 如果看到 05/01/2026 这样的数字日期，你怎么判断它是 5 月 1 日还是 1 月 5 日？"}], "quiz": [{"id": 1, "type": "multi", "point": "不可数名词（想一想·刁钻）", "stem": "下列名词属于<b>不可数名词<\/b>（没有复数形式）的有（　）【多选】", "options": ["A. luggage", "B. suitcase", "C. information", "D. advice", "E. ticket"], "answer": ["A", "C", "D"], "explain": "luggage（行李）、information（信息）、advice（建议）都是<b>不可数名词<\/b>，要论份数：a piece of luggage / two pieces of advice。suitcase 和 ticket 可数。同类不可数还有 furniture、homework、news。"}, {"id": 2, "type": "multi", "point": "时间状语与时态（想一想·刁钻）", "stem": "下列时间词中，<b>配现在完成时<\/b>使用的有（　）【多选】", "options": ["A. already", "B. yesterday", "C. since 2020", "D. just now", "E. so far"], "answer": ["A", "C", "E"], "explain": "B（yesterday）和 D（just now）都是<b>确切的过去时间<\/b>，配一般过去时。注意区分：<b>just now ＝ 刚才（过去时）<\/b>，<b>just ＝ 刚刚（完成时）<\/b>，两个词长得像但配的时态不同。"}, {"id": 3, "type": "multi", "point": "good 与 well（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. He sings well.", "B. He sings good.", "C. He is a good singer.", "D. I like it very much.", "E. I very like it."], "answer": ["A", "C", "D"], "explain": "B 错：修饰动词 sings 要用<b>副词 well<\/b>。E 错：<b>very 不能直接修饰动词<\/b>，要说 like it very much。这两个都是中文直译造成的高频错误。"}, {"id": 4, "type": "multi", "point": "日期的读写（想一想·刁钻）", "stem": "下列日期表达<b>正确<\/b>的有（　）【多选】", "options": ["A. May 1st", "B. May one", "C. 1st May", "D. on May 1st", "E. in May 1st"], "answer": ["A", "C", "D"], "explain": "日期里的“日”必须用<b>序数词<\/b>（1st ＝ first），所以 B 错。具体某一天用介词 <b>on<\/b> 不用 in，所以 E 错。A 是美式，C 是英式，都正确。"}, {"id": 5, "type": "choice", "point": "不可数名词的量词", "stem": "I have three ______ of luggage.", "options": ["A. piece", "B. bag", "C. luggages", "D. pieces"], "answer": "D", "explain": "luggage 不可数，要用 <b>pieces of<\/b> 来数；three 是复数，所以 piece 要加 s → three pieces of luggage。"}, {"id": 6, "type": "choice", "point": "just 与 just now", "stem": "He has ______ left. You may catch him at the gate.", "options": ["A. just now", "B. ago", "C. yesterday", "D. just"], "answer": "D", "explain": "句子是现在完成时（has left），配 <b>just<\/b>（刚刚）。just now（刚才）配一般过去时：He left just now."}, {"id": 7, "type": "choice", "point": "副词的选择", "stem": "Please listen ______. This part is very important.", "options": ["A. carefully", "B. careful", "C. care", "D. more careful"], "answer": "A", "explain": "修饰动词 listen 要用<b>副词<\/b> carefully（仔细地）。careful 是形容词，只能修饰名词或作表语。"}, {"id": 8, "type": "fill", "point": "时间方向词", "stem": "填空：I will be back ______ two days.（两天后，填一个介词）", "answer": ["in"], "explain": "<b>in + 一段时间<\/b> 表示“……之后”，用于将来时（in two days ＝ 两天后）。而 two days <b>ago<\/b> 是“两天前”，用于过去时。一个 in 一个 ago，时间方向相反。"}, {"id": 9, "type": "fill", "point": "good 与 well", "stem": "填空：My sister sings very ______.（填一个词，修饰动词 sings）", "answer": ["well"], "explain": "修饰动词要用副词 <b>well<\/b>（好地）。good 是形容词，不能修饰动词。注意 well 还有“身体健康”的形容词用法：I’m very well."}, {"id": 10, "type": "fill", "point": "度假搭配", "stem": "填空：We are going ______ holiday next week.（填一个介词）", "answer": ["on"], "explain": "“去度假”固定搭配 <b>go on holiday<\/b>。类似的固定搭配还有 go on a trip、go on business（出差）。"}, {"id": 11, "type": "judge", "point": "very 修饰动词", "stem": "I very like this book. 这句话是正确的。", "answer": "错", "explain": "错。<b>very 不能直接修饰动词<\/b>，要说 I like this book <b>very much<\/b>. very 只能修饰形容词和副词（very good、very quickly）。这是中文“很喜欢”直译造成的典型错误。"}, {"id": 12, "type": "judge", "point": "日期用序数词", "stem": "日期中的“日”要用序数词，但年份要用基数词。", "answer": "对", "explain": "对。May <b>1st<\/b>（读 the first，序数词）／ <b>2026<\/b>（读 twenty twenty-six，基数词）。一个序数一个基数，写和读都不能搞反。"}]}]}, {"id": "e-c5", "title": "第五章 Lesson 97-120：一般将来时 · 比较级与最高级", "sections": [{"id": "e-c5-s1", "title": "第一节 Lesson 97-102：一般将来时 will 与 be going to", "notes": [{"point": "will + 动词原形", "explain": "一般将来时表示<b>将要发生的动作或将来的状态<\/b>。最常用的结构是 <b>will + 动词原形<\/b>，will 对<b>所有人称都一样<\/b>，不随主语变化。", "examples": [{"tag": "基础", "text": "I <b>will go<\/b> there tomorrow. ／ He <b>will come<\/b> back soon. ／ They <b>will be<\/b> happy."}, {"tag": "进阶", "text": "缩写：I will ＝ <b>I’ll<\/b>，he will ＝ he’ll，will not ＝ <b>won’t<\/b>（注意不是 willn’t）。否定：I <b>won’t<\/b> go. 疑问：<b>Will<\/b> you go? — Yes, I will. / No, I won’t."}, {"tag": "易错", "text": "“He <u>will goes<\/u>.” ✗ 或 “He <u>wills<\/u> go.” ✗ —— will 是情态助动词，<b>自己不变形，后面动词也用原形<\/b>：He <b>will go<\/b>. ✓ 这和 can、must 的规则完全一样。"}], "think": "will 对所有人称都一样，不像 be 动词要分 am/is/are —— 你觉得这对学习者是好事还是坏事？英语在哪些地方“偷懒”，哪些地方“较真”？"}, {"point": "will 与 be going to 的区别", "explain": "两者都表将来，侧重点不同：<b>be going to<\/b> 表示<b>早有打算、有迹象<\/b>；<b>will<\/b> 表示<b>临时决定、单纯预测<\/b>。", "examples": [{"tag": "基础", "text": "I <b>am going to<\/b> buy a car.（早就计划好了）／ The phone is ringing. I <b>will<\/b> answer it.（临时决定去接）"}, {"tag": "进阶", "text": "有<b>现在的迹象<\/b>时只能用 be going to：Look at the black clouds! It <b>is going to<\/b> rain.（乌云是眼前的证据）。而 I think it <b>will<\/b> rain tomorrow.（只是猜测，没有证据）用 will。"}, {"tag": "易错", "text": "“The phone is ringing. I <u>am going to<\/u> answer it.” 别扭 ✗ —— 电话刚响你才决定去接，属于<b>临时决定<\/b>，要用 <b>will<\/b>：I’ll answer it. ✓ 判断口诀：<b>早有计划用 going to，当场决定用 will<\/b>。"}], "think": "服务员问你点什么，你看了菜单说“我要牛排”——这时候用 I will have the steak. 还是 I’m going to have the steak.？为什么？"}, {"point": "将来时的时间标志词", "explain": "看到这些词，基本可以断定用将来时：<b>tomorrow<\/b>（明天）、<b>next + 时间<\/b>（next week / month / year）、<b>soon<\/b>（不久）、<b>in + 一段时间<\/b>（in two days ＝ 两天后）、<b>later<\/b>（稍后）、<b>from now on<\/b>（从今以后）。", "examples": [{"tag": "基础", "text": "I will see him <u>tomorrow<\/u>. ／ She will come back <u>next week<\/u>. ／ He will arrive <u>in two hours<\/u>."}, {"tag": "进阶", "text": "<b>in + 时段<\/b> 用于将来，意思是“……之后”：in two days ＝ 两天后。而 <b>… ago<\/b> 用于过去：two days ago ＝ 两天前。同样是 two days，介词决定了时间方向。"}, {"tag": "易错", "text": "“I will go there <u>two days ago<\/u>.” ✗ —— ago 指的是过去，不能配将来时。正确是 I will go there <b>in two days<\/b>.（两天后去）或 I <b>went<\/b> there two days ago.（两天前去了）。"}], "think": "in two days（两天后）和 two days ago（两天前）中间隔着的那个点是“现在”—— 你能画一条时间线，把 yesterday、now、tomorrow、in two days、two days ago 都标上去吗？"}, {"point": "时间和条件状语从句：主将从现", "explain": "英语有一条重要规则：在 <b>when、if、before、after、as soon as、until<\/b> 引导的从句里，<b>主句用将来时，从句要用一般现在时代替将来时<\/b>。简称“<b>主将从现<\/b>”。", "examples": [{"tag": "基础", "text": "I <b>will call<\/b> you when he <b>comes<\/b>.（不是 when he will come）／ If it <b>rains<\/b> tomorrow, we <b>won’t go<\/b>.（不是 if it will rain）"}, {"tag": "进阶", "text": "适用的连词要记全：when（当）、if（如果）、before（在……前）、after（在……后）、as soon as（一……就）、until（直到）、while（当）。这些词后面一律不用 will。"}, {"tag": "易错", "text": "“If it <u>will rain<\/u> tomorrow, we won’t go.” ✗ —— if 从句必须用一般现在时：If it <b>rains<\/b> tomorrow ✓。中文的“如果明天下雨”里“明天”会让人下意识用将来时，这是最常见的干扰。"}], "think": "英语规定 when 和 if 后面不用 will —— 明明说的是将来的事，为什么用现在时？（提示：从句的“下雨”和主句的“不去”，哪一个是条件，哪一个是结果？）"}, {"point": "there will be 与 be 的将来形式", "explain": "There be 句型的将来式是 <b>There will be<\/b>（不管单复数都一样，因为 will 后面跟原形 be）。另外“将会是”用 <b>will be<\/b>。", "examples": [{"tag": "基础", "text": "<b>There will be<\/b> a meeting tomorrow.（明天有个会）／ <b>There will be<\/b> many people.（单复数都用 will be）"}, {"tag": "进阶", "text": "另一种说法是 <b>There is going to be<\/b>，这时 be 动词要随后面的名词变：There <b>is<\/b> going to be a meeting. / There <b>are<\/b> going to be many people. 比 will 麻烦，所以 will 更常用。"}, {"tag": "易错", "text": "“There will <u>have<\/u> a meeting.” ✗ —— 中文“有”让人想用 have，但 There be 句型的将来式是 There will <b>be<\/b>：There will be a meeting. ✓ 又是“有”翻译错的老问题。"}], "think": "There will be 不管后面是单数还是复数都一样，但 There is going to be 却要变 —— 为什么 will 这条路更省事？"}], "quiz": [{"id": 1, "type": "multi", "point": "will 的结构（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. He will go there tomorrow.", "B. He will goes there tomorrow.", "C. He wills go there.", "D. I won’t go.", "E. Will you come? — Yes, I will."], "answer": ["A", "D", "E"], "explain": "will 是情态助动词，<b>自己不变形（没有 wills），后面动词用原形<\/b>。B、C 各犯一个错。注意 will not 的缩写是 <b>won’t<\/b>，不是 willn’t。"}, {"id": 2, "type": "multi", "point": "will 与 be going to（想一想·刁钻）", "stem": "下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. be going to 表示早有打算。", "B. will 常表示临时决定。", "C. 有眼前迹象时用 be going to。", "D. The phone is ringing. I will answer it. 是自然的说法。", "E. Look at the clouds! It will rain. 比 It is going to rain 更自然。"], "answer": ["A", "B", "C", "D"], "explain": "只有 E 错：<b>有眼前证据（乌云）时用 be going to<\/b> 更自然。will 用于没有证据的单纯预测：I think it will rain tomorrow. 口诀：<b>早有计划用 going to，当场决定用 will<\/b>。"}, {"id": 3, "type": "multi", "point": "时间方向词（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. I will go there in two days.", "B. I will go there two days ago.", "C. I went there two days ago.", "D. She will come back next week.", "E. He came here next week."], "answer": ["A", "C", "D"], "explain": "<b>in + 时段 ＝ 之后（将来）<\/b>，<b>… ago ＝ 之前（过去）<\/b>，<b>next … ＝ 下（将来）<\/b>。B 把过去词配了将来时，E 把将来词配了过去时，都是时间方向搞反。"}, {"id": 4, "type": "multi", "point": "主将从现（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. I will call you when he comes.", "B. I will call you when he will come.", "C. If it rains tomorrow, we won’t go.", "D. If it will rain tomorrow, we won’t go.", "E. I will tell him as soon as he arrives."], "answer": ["A", "C", "E"], "explain": "<b>主将从现<\/b>：when、if、before、after、as soon as、until 引导的从句里，<b>用一般现在时代替将来时<\/b>。B、D 都在从句里误用了 will。"}, {"id": 5, "type": "multi", "point": "There will be（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. There will be a meeting tomorrow.", "B. There will have a meeting tomorrow.", "C. There will be many people.", "D. There is going to be a meeting.", "E. There are going to be many people."], "answer": ["A", "C", "D", "E"], "explain": "只有 B 错：There be 句型的将来式是 There will <b>be<\/b>，中文的“有”不能翻成 have。注意 will 后面不管单复数都是 be，而 be going to 的 be 要随名词变（D 用 is，E 用 are）。"}, {"id": 6, "type": "choice", "point": "主将从现", "stem": "I will go swimming if it ______ fine tomorrow.", "options": ["A. is", "B. will be", "C. was", "D. be"], "answer": "A", "explain": "<b>if 引导的条件状语从句用一般现在时代替将来时<\/b>。虽然说的是明天的事，从句里也不能用 will，要用 is。"}, {"id": 7, "type": "choice", "point": "will 与 be going to", "stem": "Look at those black clouds! It ______ rain.", "options": ["A. will", "B. was", "C. is", "D. is going to"], "answer": "D", "explain": "“看那些乌云”是<b>眼前的证据<\/b>，有迹象表明马上要发生，用 <b>be going to<\/b>。will 用于没有证据的单纯预测。"}, {"id": 8, "type": "choice", "point": "时间方向", "stem": "Don’t worry. He will be back ______ two hours.", "options": ["A. after", "B. ago", "C. in", "D. for"], "answer": "C", "explain": "<b>in + 一段时间<\/b>用于将来，表示“……之后”（两小时后）。ago 用于过去；after 一般跟具体时间点（after five o’clock）。"}, {"id": 9, "type": "choice", "point": "will 的否定缩写", "stem": "will not 的正确缩写形式是（　）", "options": ["A. willn’t", "B. willnot", "C. won’t", "D. wo not"], "answer": "C", "explain": "will not 的缩写是 <b>won’t<\/b>（连读音都变了），不是 willn’t。这是英语里少数几个「不按套路缩写」的词之一（另一个是 shall not → shan’t）。这道题设计成选择题而不是填空题，是因为答案本身带撇号——在 iPad 上打字时撇号会被自动替换成弯引号，明明写对也会被判错。"}, {"id": 10, "type": "fill", "point": "主将从现", "stem": "用 come 的正确形式填空：I will tell him when he ______ back.（填一个词）", "answer": ["comes"], "explain": "when 引导的时间状语从句<b>用一般现在时代替将来时<\/b>；主语 he 是三单，所以是 comes。不能填 will come。"}, {"id": 11, "type": "judge", "point": "will 不变形", "stem": "will 对所有人称的形式都一样，第三人称单数也不加 s。", "answer": "对", "explain": "对。<b>情态助动词没有第三人称单数形式<\/b>：He will go. / They will go. / I will go. —— will 从头到尾不变，后面的动词也保持原形。can、must、should 全都一样。"}, {"id": 12, "type": "judge", "point": "if 从句的时态", "stem": "If it will rain tomorrow, we won’t go out. 这句话是正确的。", "answer": "错", "explain": "错。<b>if 引导的条件状语从句用一般现在时代替将来时<\/b>：If it <b>rains<\/b> tomorrow, we won’t go out. 主句可以用将来时，从句不行。这条规则简称“主将从现”。"}]}, {"id": "e-c5-s2", "title": "第二节 Lesson 103-108：形容词比较级", "notes": [{"point": "比较级的构成规则", "explain": "比较两个事物用比较级。<b>单音节和部分双音节词<\/b>直接加 <b>er<\/b>；<b>多音节词<\/b>在前面加 <b>more<\/b>。构成规则和加 ed 类似：① 一般加 er；② e 结尾加 r；③ 辅音+y 变 i 加 er；④ 重读闭音节双写。", "examples": [{"tag": "基础", "text": "tall→tall<b>er<\/b>、short→shorter、long→longer ／ nice→nic<b>er<\/b>（e 结尾）／ easy→eas<b>ier<\/b>、happy→happier（y 变 i）／ big→big<b>ger<\/b>、hot→hotter、thin→thinner（双写）。"}, {"tag": "进阶", "text": "三音节及以上一律用 more：beautiful→<b>more<\/b> beautiful、interesting→<b>more<\/b> interesting、difficult→<b>more<\/b> difficult、expensive→<b>more<\/b> expensive。判断方法：<b>数音节，三个及以上用 more<\/b>。"}, {"tag": "易错", "text": "<b>er 和 more 不能同时用<\/b>：“<u>more taller<\/u>” ✗ → <b>taller<\/b> ✓。这是比较级最常见的错误——学生怕自己加得不够，结果加了两遍。"}], "think": "为什么 tall 加 er 就够了，beautiful 却要在前面加一个 more？（提示：试着读一读 beautifuller，你的舌头有什么感觉？）"}, {"point": "than 的用法与比较对象", "explain": "比较级后面用 <b>than<\/b> 引出比较对象。关键要求：<b>比较的两个东西必须是同类<\/b>，否则句子逻辑不通。", "examples": [{"tag": "基础", "text": "He is <b>taller than<\/b> me.（＝ taller than I am）／ This book is <b>more interesting than<\/b> that one."}, {"tag": "进阶", "text": "than 后面用<b>宾格<\/b>（me、him、her）在口语中很常见，用<b>主格 + be<\/b>（I am、he is）更正式：He is taller than <b>me<\/b>. ＝ He is taller than <b>I am<\/b>. 两种都对。"}, {"tag": "易错", "text": "比较对象要对等：“My hair is longer than <u>you<\/u>.” ✗（把头发和人比了）→ My hair is longer than <b>yours<\/b>. ✓（＝ your hair）或 than <b>your hair<\/b> ✓。做题时先看清 than 两边比的是不是同一类东西。"}], "think": "“我的头发比你长”这句中文听起来完全正常，直译成英文却是错的 —— 中文为什么允许这种省略，英语却不行？"}, {"point": "比较级的修饰语", "explain": "想说“<b>更<\/b>……一点”或“……<b>得多<\/b>”，要在比较级<b>前面<\/b>加修饰词：<b>much<\/b>（……得多）、<b>a little<\/b>（一点）、<b>even<\/b>（甚至更）、<b>far<\/b>（远远地）。注意<b>不能用 very<\/b>。", "examples": [{"tag": "基础", "text": "He is <b>much<\/b> taller than me.（高得多）／ It’s <b>a little<\/b> colder today.（冷一点）／ This one is <b>even<\/b> better.（甚至更好）"}, {"tag": "易错", "text": "“<u>very<\/u> taller” ✗ —— very 只能修饰<b>原级<\/b>（very tall ✓），修饰比较级要用 much：<b>much<\/b> taller ✓。这是比较级第二高频的错误。"}, {"tag": "进阶", "text": "“越来越……”用 <b>比较级 + and + 比较级<\/b>：It’s getting <b>colder and colder<\/b>.（越来越冷）／ 多音节词用 <b>more and more<\/b>：<b>more and more<\/b> beautiful（越来越美）。"}], "think": "very tall 可以说，very taller 却不行 —— 你能用“very 修饰的是什么、much 修饰的是什么”来解释这个区别吗？"}, {"point": "as ... as 同级比较", "explain": "表示“<b>和……一样……<\/b>”用 <b>as + 形容词原级 + as<\/b>。注意中间必须是<b>原级<\/b>，不是比较级。否定形式 <b>not as / so ... as<\/b> 表示“不如……”。", "examples": [{"tag": "基础", "text": "He is <b>as tall as<\/b> me.（和我一样高）／ This book is <b>as interesting as<\/b> that one."}, {"tag": "进阶", "text": "否定式意思是“不如”：He is <b>not as tall as<\/b> me. ＝ He is <b>shorter than<\/b> me.（他没我高＝他比我矮）。这两句是同义句改写的高频考点。"}, {"tag": "易错", "text": "“as <u>taller<\/u> as” ✗ —— as…as 中间必须放<b>原级<\/b>：as <b>tall<\/b> as ✓。这个结构表示“一样”，既然一样就不需要“更”，所以不能用比较级。"}], "think": "He is not as tall as me. 和 He is shorter than me. 说的是同一件事，为什么英语要留两种说法？哪一种听起来更委婉？"}, {"point": "不规则比较级", "explain": "有几个高频形容词的比较级完全不按规则，必须单独背。", "examples": [{"tag": "基础", "text": "good / well → <b>better<\/b>（更好）／ bad / badly / ill → <b>worse<\/b>（更差）／ many / much → <b>more<\/b>（更多）／ little → <b>less<\/b>（更少）／ far → <b>farther / further<\/b>（更远）。"}, {"tag": "进阶", "text": "old 有两个比较级：<b>older<\/b>（一般“更老、更旧”）和 <b>elder<\/b>（专指<b>家庭内部的长幼<\/b>，如 my elder brother 我哥哥，且只能放名词前面，不能跟 than）。"}, {"tag": "易错", "text": "“<u>gooder<\/u>” ✗、“<u>badder<\/u>” ✗、“<u>more good<\/u>” ✗ —— 这四个词的比较级是完全不同的单词：good→<b>better<\/b>、bad→<b>worse<\/b>。既不加 er 也不加 more。"}], "think": "good 的比较级是 better，和 good 一个字母都不像 —— 你在中文里能想到类似的例子吗？（提示：“人、二、三”和“大、更大”的关系。）"}], "quiz": [{"id": 1, "type": "multi", "point": "比较级的构成（想一想·刁钻）", "stem": "下列比较级形式<b>正确<\/b>的有（　）【多选】", "options": ["A. taller", "B. more taller", "C. bigger", "D. more beautiful", "E. beautifuller"], "answer": ["A", "C", "D"], "explain": "B 错：<b>er 和 more 不能同时用<\/b>。E 错：beautiful 是三音节词，要用 more。C 对：big 是重读闭音节要双写 → bigger。"}, {"id": 2, "type": "multi", "point": "比较对象要对等（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. My hair is longer than yours.", "B. My hair is longer than you.", "C. My hair is longer than your hair.", "D. He is taller than me.", "E. He is taller than I am."], "answer": ["A", "C", "D", "E"], "explain": "只有 B 错：<b>than 两边比较的必须是同类事物<\/b>，B 把“头发”和“人”比了。A 用 yours（＝ your hair）、C 用 your hair 都对。D、E 是同一句的口语和正式两种写法。"}, {"id": 3, "type": "multi", "point": "比较级的修饰语（想一想·刁钻）", "stem": "下列表达<b>正确<\/b>的有（　）【多选】", "options": ["A. much taller", "B. very taller", "C. a little colder", "D. even better", "E. very tall"], "answer": ["A", "C", "D", "E"], "explain": "只有 B 错：<b>very 只能修饰原级<\/b>（very tall ✓），修饰比较级要用 much / a little / even / far。这是比较级第二高频的错误。"}, {"id": 4, "type": "multi", "point": "as...as 结构（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. He is as tall as me.", "B. He is as taller as me.", "C. He is not as tall as me.", "D. He is shorter than me.", "E. C 和 D 意思相同。"], "answer": ["A", "C", "D", "E"], "explain": "只有 B 错：<b>as…as 中间必须用原级<\/b>，不能用比较级。E 对：not as tall as（不如……高）＝ shorter than（比……矮），这是同义句改写的高频考点。"}, {"id": 5, "type": "multi", "point": "不规则比较级（想一想·刁钻）", "stem": "下列比较级<b>正确<\/b>的有（　）【多选】", "options": ["A. good — better", "B. good — gooder", "C. bad — worse", "D. bad — badder", "E. many — more"], "answer": ["A", "C", "E"], "explain": "good→<b>better<\/b>、bad→<b>worse<\/b>、many/much→<b>more<\/b>、little→<b>less<\/b>、far→farther/further，这五组必须单独背，既不加 er 也不加 more。"}, {"id": 6, "type": "choice", "point": "比较级修饰语", "stem": "This book is ______ more interesting than that one.", "options": ["A. very", "B. much", "C. so", "D. too"], "answer": "B", "explain": "修饰比较级（more interesting）要用 <b>much<\/b>（……得多），不能用 very。very 只能修饰原级。"}, {"id": 7, "type": "choice", "point": "比较对象对等", "stem": "The weather in Beijing is colder than ______ in Shanghai.", "options": ["A. that", "B. it", "C. this", "D. one"], "answer": "A", "explain": "比较的是<b>两地的天气<\/b>，要用 <b>that<\/b> 代替前面的 the weather，保证 than 两边比的是同类东西。that 用于代替<b>不可数名词<\/b>，one 用于可数名词。"}, {"id": 8, "type": "choice", "point": "as...as 的否定", "stem": "Tom is not as tall as Jack. 这句话的意思是：", "options": ["A. Tom 比 Jack 高", "B. Tom 和 Jack 一样高", "C. Tom 比 Jack 矮", "D. 无法判断"], "answer": "C", "explain": "not as … as ＝ 不如……，所以 Tom 没有 Jack 高，也就是 <b>Tom 比 Jack 矮<\/b>。可以改写成 Tom is <b>shorter than<\/b> Jack."}, {"id": 9, "type": "fill", "point": "比较级拼写", "stem": "写出 big 的比较级形式：______", "answer": ["bigger"], "explain": "big 是<b>重读闭音节<\/b>（b-i-g，辅音+元音+辅音），加 er 要双写 g → bigger。同类：hot→hotter、thin→thinner、fat→fatter。"}, {"id": 10, "type": "fill", "point": "不规则比较级", "stem": "写出 good 的比较级形式：______", "answer": ["better"], "explain": "good（和 well）的比较级是不规则形式 <b>better<\/b>，既不是 gooder 也不是 more good。最高级是 best。"}, {"id": 11, "type": "judge", "point": "er 与 more 不能并用", "stem": "为了强调程度，可以说 more taller 表示“高得多”。", "answer": "错", "explain": "错。<b>er 和 more 是两种并列的比较级构成方式，绝不能同时使用<\/b>。“高得多”要说 <b>much taller<\/b>——用 much 来加强，不是用 more。"}, {"id": 12, "type": "judge", "point": "elder 的特殊用法", "stem": "elder 只能放在名词前面，不能和 than 连用。", "answer": "对", "explain": "对。elder 专指<b>家庭内部的长幼<\/b>（my elder brother 我哥哥），<b>只能作定语放名词前，不能说 elder than<\/b>。要说“比……年长”得用 older：He is <b>older than<\/b> me."}]}, {"id": "e-c5-s3", "title": "第三节 Lesson 109-114：最高级 · 数量表达", "notes": [{"point": "最高级的构成与 the", "explain": "三者或三者以上比较用最高级。构成：<b>单音节加 est<\/b>（tallest），<b>多音节加 most<\/b>（most beautiful）。最高级<b>前面通常要加 the<\/b>。", "examples": [{"tag": "基础", "text": "tall→<b>the tallest<\/b>、big→<b>the biggest<\/b>、easy→<b>the easiest<\/b> ／ beautiful→<b>the most beautiful<\/b>、interesting→the most interesting。"}, {"tag": "进阶", "text": "常用搭配：<b>the + 最高级 + in + 范围<\/b>（在某个范围内）：He is the tallest <b>in<\/b> our class. ／ <b>the + 最高级 + of + 同类<\/b>：He is the tallest <b>of<\/b> the three. 记法：<b>in 后面跟地方或团体，of 后面跟同类事物<\/b>。"}, {"tag": "易错", "text": "“He is <u>tallest<\/u> in our class.” ✗ —— 最高级前面要加 <b>the<\/b>：the tallest ✓。但如果前面已经有物主代词，就不加 the：my <b>best<\/b> friend ✓（不说 my the best friend）。"}], "think": "最高级前面为什么几乎总要加 the？（提示：全班最高的人有几个？the 这个词是用来表示“特指”还是“泛指”的？）"}, {"point": "不规则最高级", "explain": "和比较级一样，几个高频词的最高级也是完全不同的单词。", "examples": [{"tag": "基础", "text": "good/well → better → <b>best<\/b> ／ bad/ill → worse → <b>worst<\/b> ／ many/much → more → <b>most<\/b> ／ little → less → <b>least<\/b> ／ far → farther/further → <b>farthest/furthest<\/b>。"}, {"tag": "进阶", "text": "old 的两套：older→<b>oldest<\/b>（一般）／ elder→<b>eldest<\/b>（家庭长幼，my eldest brother 我大哥）。这两套不能混用。"}, {"tag": "易错", "text": "“<u>the most best<\/u>” ✗ —— best 本身已经是最高级，前面不能再加 most。同理没有 “most worst”。三级形式（原级-比较级-最高级）必须整套记，不能拼接。"}], "think": "good-better-best 三个词长得完全不一样，中文的“好-更好-最好”却只是加了字 —— 哪种方式对初学者更友好？为什么英语没有统一？"}, {"point": "many / much / a lot of / some 的分工", "explain": "表示“许多”要分可数不可数：<b>many + 可数名词复数<\/b>；<b>much + 不可数名词<\/b>；<b>a lot of / lots of<\/b> 两者都能配（最省心）。", "examples": [{"tag": "基础", "text": "<b>many<\/b> books（许多书）／ <b>much<\/b> water（许多水）／ <b>a lot of<\/b> books ＝ <b>a lot of<\/b> water（都行）"}, {"tag": "进阶", "text": "much 和 many 在<b>否定句和疑问句<\/b>里最常用；肯定句里更常用 a lot of：I have <b>a lot of<\/b> books.（比 I have many books. 自然）／ I don’t have <b>much<\/b> money. ✓"}, {"tag": "易错", "text": "“<u>much<\/u> books” ✗ / “<u>many<\/u> water” ✗ —— 判断只有一步：<b>这个名词能不能加 s<\/b>。能就用 many，不能就用 much。拿不准的时候用 a lot of，两边都不会错。"}], "think": "a lot of 可数不可数都能用，那为什么英语还要保留 many 和 much 这两个更麻烦的词？"}, {"point": "a few / a little 与 few / little", "explain": "这两组词的差别不在数量，而在<b>语气的正负<\/b>：<b>a few / a little<\/b> ＝ 有一些（<b>肯定<\/b>语气）；<b>few / little<\/b> ＝ 几乎没有（<b>否定<\/b>语气）。搭配：a few / few 配<b>可数<\/b>，a little / little 配<b>不可数<\/b>。", "examples": [{"tag": "基础", "text": "I have <b>a few<\/b> friends.（我有几个朋友——还行）／ I have <b>few<\/b> friends.（我几乎没朋友——很惨）"}, {"tag": "进阶", "text": "不可数版本：There is <b>a little<\/b> water.（还有点水）／ There is <b>little<\/b> water.（几乎没水了）。<b>有 a 就是好消息，没 a 就是坏消息<\/b>——这是最好用的记法。"}, {"tag": "易错", "text": "“I have <u>little<\/u> friends.” 双重错误 ✗ —— little 配不可数，friends 是可数；而且语气是否定的。正确：I have <b>a few<\/b> friends. ✓ 做题两步走：<b>先看可数不可数，再看语气正负<\/b>。"}], "think": "“我有几个朋友”和“我几乎没朋友”在英语里只差一个 a —— 如果你写作文时漏写了这个 a，读者对你的印象会差多少？"}, {"point": "数量表达的综合运用", "explain": "把可数不可数这条线索贯穿到所有数量词，形成一张对照表，做题时直接查。", "examples": [{"tag": "基础", "text": "<b>只配可数<\/b>：many, a few, few, several, a number of, How many。<b>只配不可数<\/b>：much, a little, little, a great deal of, How much。<b>都能配<\/b>：some, any, a lot of, lots of, plenty of, no。"}, {"tag": "进阶", "text": "注意 <b>a number of<\/b>（许多，配可数复数，谓语用复数）和 <b>the number of<\/b>（……的数量，谓语用单数）：<b>A number of<\/b> students <b>are<\/b> here. ／ <b>The number of<\/b> students <b>is<\/b> fifty. 差一个冠词，谓语单复数就变了。"}, {"tag": "易错", "text": "some 在<b>疑问句<\/b>里表示邀请或请求（Would you like some tea?），在<b>否定句<\/b>里必须换成 any（There isn’t <b>any<\/b> water.）。这条第二章讲过，做综合题时经常和 many/much 一起考。"}], "think": "A number of students are here. 和 The number of students is fifty. 只差一个词，谓语却一个复数一个单数 —— 你能说出这两句的主语各是什么吗？"}], "quiz": [{"id": 1, "type": "multi", "point": "最高级与 the（想一想·刁钻）", "stem": "下列表达<b>正确<\/b>的有（　）【多选】", "options": ["A. the tallest", "B. tallest（前面无 the，作定语）", "C. the most beautiful", "D. my best friend", "E. my the best friend"], "answer": ["A", "C", "D"], "explain": "最高级前面通常要加 <b>the<\/b>（B 错），但如果<b>前面已经有物主代词就不再加 the<\/b>（D 对、E 错）。这是“一个名词前不能有两个限定词”的老规则。"}, {"id": 2, "type": "multi", "point": "不规则三级（想一想·刁钻）", "stem": "下列三级形式<b>正确<\/b>的有（　）【多选】", "options": ["A. good - better - best", "B. bad - worse - worst", "C. many - more - most", "D. good - gooder - goodest", "E. the most best"], "answer": ["A", "B", "C"], "explain": "D 错：good 的三级是完全不同的单词。E 错：<b>best 本身已是最高级，前面不能再加 most<\/b>。三级形式必须整套记，不能自己拼接。"}, {"id": 3, "type": "multi", "point": "many 与 much（想一想·刁钻）", "stem": "下列搭配<b>正确<\/b>的有（　）【多选】", "options": ["A. many books", "B. much books", "C. much water", "D. many water", "E. a lot of water"], "answer": ["A", "C", "E"], "explain": "<b>many 配可数复数，much 配不可数，a lot of 两者都行<\/b>。B、D 都搭反了。判断只有一步：这个名词能不能加 s。"}, {"id": 4, "type": "multi", "point": "a few 与 few 的语气（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>且语气理解<b>正确<\/b>的有（　）【多选】", "options": ["A. I have a few friends.（我有几个朋友，语气肯定）", "B. I have few friends.（我几乎没朋友，语气否定）", "C. I have little friends.（我有几个朋友）", "D. There is a little water.（还有点水）", "E. There is little water.（几乎没水了）"], "answer": ["A", "B", "D", "E"], "explain": "只有 C 错，而且错两处：<b>little 配不可数<\/b>（friends 可数应该用 few），<b>而且 little 语气是否定的<\/b>（几乎没有）。记法：<b>有 a 是好消息，没 a 是坏消息<\/b>。"}, {"id": 5, "type": "multi", "point": "a number of 与 the number of（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. A number of students are here.", "B. A number of students is here.", "C. The number of students is fifty.", "D. The number of students are fifty.", "E. A number of 后面跟可数名词复数。"], "answer": ["A", "C", "E"], "explain": "<b>a number of ＝ 许多<\/b>（主语是 students，谓语用复数 are）；<b>the number of ＝ ……的数量<\/b>（主语是 number，谓语用单数 is）。差一个冠词，主语就变了。"}, {"id": 6, "type": "choice", "point": "最高级的搭配", "stem": "He is the tallest ______ our class.", "options": ["A. of", "B. for", "C. among", "D. in"], "answer": "D", "explain": "<b>the + 最高级 + in + 地方或团体<\/b>；<b>of + 同类事物<\/b>（the tallest of the three）。our class 是团体，用 in。"}, {"id": 7, "type": "choice", "point": "few 与 a few 的语气", "stem": "He is new here, so he has ______ friends. He often feels lonely.", "options": ["A. few", "B. a few", "C. a little", "D. little"], "answer": "A", "explain": "后半句说“常感到孤独”，说明<b>朋友几乎没有<\/b>，用否定语气的 <b>few<\/b>（配可数名词 friends）。a few 是“有几个”，语气积极，和下文矛盾。"}, {"id": 8, "type": "choice", "point": "不规则最高级", "stem": "This is the ______ film I have ever seen. I really hate it.", "options": ["A. best", "B. more bad", "C. baddest", "D. worst"], "answer": "D", "explain": "后半句说“我really讨厌它”，所以是<b>最差的<\/b>。bad 的三级是 bad - worse - <b>worst<\/b>，没有 baddest。"}, {"id": 9, "type": "fill", "point": "最高级拼写", "stem": "写出 easy 的最高级形式（不含 the）：______", "answer": ["easiest"], "explain": "easy 的 y 前面是辅音字母 s，要<b>变 y 为 i 再加 est<\/b> → easiest。规则和比较级 easier 一致。"}, {"id": 10, "type": "fill", "point": "数量词选择", "stem": "填空：How ______ water do you need?（填一个词）", "answer": ["much"], "explain": "water 是<b>不可数名词<\/b>，问数量用 How much。如果换成 books 就要用 How many。"}, {"id": 11, "type": "judge", "point": "物主代词与 the", "stem": "my best friend 这个表达是正确的，不需要写成 my the best friend。", "answer": "对", "explain": "对。<b>一个名词前面不能同时有物主代词和冠词<\/b>。最高级前面通常加 the，但已经有 my / your / his 时就不再加：my best friend ✓ / his oldest son ✓。"}, {"id": 12, "type": "judge", "point": "little 的语气", "stem": "There is little water in the bottle. 这句话表示“瓶子里还有一些水”。", "answer": "错", "explain": "错。<b>little（没有 a）语气是否定的<\/b>，意思是“几乎没有水了”。要表示“还有一些水”应该说 There is <b>a little<\/b> water. 记法：<b>有 a 是好消息，没 a 是坏消息<\/b>。"}]}, {"id": "e-c5-s4", "title": "第四节 Lesson 115-120：反身代词 · every/all/both · 感叹句", "notes": [{"point": "反身代词：myself / yourself / himself...", "explain": "反身代词表示“<b>某人自己<\/b>”，形式是：myself, yourself, himself, herself, itself, ourselves, yourselves, themselves。注意单数以 <b>self<\/b> 结尾，复数以 <b>selves<\/b> 结尾。", "examples": [{"tag": "基础", "text": "I hurt <b>myself<\/b>.（我伤到自己了）／ He teaches <b>himself<\/b> English.（他自学英语）／ Help <b>yourself<\/b>!（请随便吃）"}, {"tag": "进阶", "text": "常用短语：<b>by oneself<\/b> ＝ 独自（He lives by himself.）／ <b>enjoy oneself<\/b> ＝ 玩得开心（Did you enjoy yourself?）／ <b>teach oneself<\/b> ＝ 自学／ <b>help oneself to<\/b> ＝ 随便吃（用餐时的礼貌用语）。"}, {"tag": "易错", "text": "第三人称男性是 <b>himself<\/b> 不是 hisself；复数是 <b>themselves<\/b> 不是 theirselves。规律是：<b>第一二人称用形容词性物主代词（my/your/our）+ self，第三人称用宾格（him/her/them）+ self<\/b>。"}], "think": "myself 是 my + self，himself 却是 him + self（不是 his + self）—— 英语在这里为什么不统一？（提示：语言的规则常常是历史沉淀下来的，不总是有道理。）"}, {"point": "every / each / all / both 的区别", "explain": "<b>every<\/b>（每一个，强调整体，配单数）／ <b>each<\/b>（每一个，强调个体，配单数）／ <b>all<\/b>（全部，三者以上，配复数）／ <b>both<\/b>（两者都，配复数）。", "examples": [{"tag": "基础", "text": "<b>Every<\/b> student <b>has<\/b> a book.（单数）／ <b>All<\/b> the students <b>have<\/b> books.（复数）／ <b>Both<\/b> of them <b>are<\/b> right.（两个都对）"}, {"tag": "进阶", "text": "both 只用于<b>两者<\/b>，三者以上要用 all：Both of my hands（我的两只手）／ All of my fingers（我所有的手指）。否定时：<b>both<\/b> 的否定是“不全是”（部分否定），<b>neither<\/b> 才是“两个都不”。"}, {"tag": "易错", "text": "“<u>Every<\/u> students have books.” 双重错误 ✗ —— every 后面跟<b>单数名词<\/b>，谓语也用<b>单数<\/b>：<b>Every student has<\/b> a book. ✓ 中文的“每个学生都有书”会让人误用复数。"}], "think": "Every student has a book. 明明说的是全班很多学生，为什么动词要用单数 has？（提示：every 强调的是“每一个”还是“所有人加起来”？）"}, {"point": "感叹句：What 与 How", "explain": "感叹句表示强烈情感，有两个句型：<b>What + (a/an) + 形容词 + 名词 + 主谓！<\/b>（强调名词）／ <b>How + 形容词/副词 + 主谓！<\/b>（强调形容词）。判断方法：<b>后面跟名词用 What，跟形容词用 How<\/b>。", "examples": [{"tag": "基础", "text": "<b>What<\/b> a beautiful girl she is!（多漂亮的姑娘啊）／ <b>How<\/b> beautiful she is!（她多漂亮啊）—— 同一个意思，两种句型。"}, {"tag": "进阶", "text": "What 后面跟<b>不可数名词或复数名词<\/b>时<b>不加 a/an<\/b>：<b>What<\/b> beautiful flowers they are! ／ <b>What<\/b> cold weather it is! 只有单数可数名词才需要 a/an。"}, {"tag": "易错", "text": "“<u>How<\/u> a beautiful girl she is!” ✗ —— How 后面直接跟形容词，不跟名词：<b>What<\/b> a beautiful girl she is! ✓ 或 <b>How<\/b> beautiful the girl is! ✓ 转换时要整句改写，不能只换一个词。"}], "think": "What a beautiful girl she is! 和 How beautiful she is! 表达的情绪一样，句子结构却完全不同 —— 你觉得这两句在强调的重点上有什么细微差别？"}, {"point": "one / it / that 三个替代词", "explain": "都用来避免重复，但指代对象不同：<b>one<\/b> ＝ 同类中的<b>另一个<\/b>（可数）／ <b>it<\/b> ＝ <b>同一个<\/b>东西／ <b>that<\/b> ＝ 同类中的那一个（常用于比较，可代不可数名词）。", "examples": [{"tag": "基础", "text": "I lost my pen. I need to buy <b>one<\/b>.（再买一支，不是原来那支）／ I lost my pen. I must find <b>it<\/b>.（找回原来那支）"}, {"tag": "进阶", "text": "比较句里代替不可数名词用 <b>that<\/b>：The weather in Beijing is colder than <b>that<\/b> in Shanghai.（weather 不可数，不能用 one）。可数名词才用 one：This book is better than <b>that one<\/b>."}, {"tag": "易错", "text": "“I lost my pen. I must find <u>one<\/u>.” 逻辑不对 ✗ —— 丢的是自己那支，要找回<b>同一支<\/b>，用 <b>it<\/b>。one 会变成“随便找一支”。一个词之差，意思完全不同。"}], "think": "“我笔丢了，得去买一支”和“我笔丢了，得把它找回来”——中文都用“笔”这个概念，英语却用 one 和 it 两个不同的词区分。这个区分有什么实际价值？"}, {"point": "情态动词 may / could 表示委婉", "explain": "<b>may<\/b>（可以、也许）比 can 更正式礼貌；<b>could<\/b> 是 can 的过去式，但更常用于<b>委婉请求<\/b>（这时不表示过去）。", "examples": [{"tag": "基础", "text": "<b>May<\/b> I come in?（我可以进来吗？——很礼貌）／ <b>Could<\/b> you help me?（你能帮我吗？——比 Can 更客气）"}, {"tag": "进阶", "text": "may 还表示<b>推测<\/b>“可能”：He <b>may<\/b> be at home.（他可能在家）。语气强度：must（一定）> may（可能）> might（也许）。"}, {"tag": "易错", "text": "May I…? 的否定回答不用 mustn’t（太重了），通常说 <b>I’m afraid you can’t.<\/b> 或 <b>Sorry, you can’t.<\/b>。而肯定回答是 <b>Yes, you may.<\/b> 或 <b>Of course.<\/b>"}], "think": "Can you help me? / Could you help me? / May I ask you to help me? 三句都是求助，礼貌程度依次上升 —— 你觉得英语为什么要发展出这么多层次？"}], "quiz": [{"id": 1, "type": "multi", "point": "反身代词的形式（想一想·刁钻）", "stem": "下列反身代词<b>正确<\/b>的有（　）【多选】", "options": ["A. myself", "B. himself", "C. hisself", "D. themselves", "E. theirselves"], "answer": ["A", "B", "D"], "explain": "第三人称用<b>宾格 + self<\/b>：him<b>self<\/b>、them<b>selves<\/b>，没有 hisself 和 theirselves。第一二人称才用物主代词 + self（myself、yourself、ourselves）。"}, {"id": 2, "type": "multi", "point": "every / all / both（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. Every student has a book.", "B. Every students have books.", "C. All the students have books.", "D. Both of them are right.", "E. Both of the three are right."], "answer": ["A", "C", "D"], "explain": "B 错：every 后跟<b>单数名词<\/b>，谓语也用单数。E 错：<b>both 只用于两者<\/b>，三个人要用 all。A 对：every 强调“每一个”，所以用单数。"}, {"id": 3, "type": "multi", "point": "感叹句 What 与 How（想一想·刁钻）", "stem": "下列感叹句<b>正确<\/b>的有（　）【多选】", "options": ["A. What a beautiful girl she is!", "B. How a beautiful girl she is!", "C. How beautiful she is!", "D. What beautiful flowers they are!", "E. What a beautiful flowers they are!"], "answer": ["A", "C", "D"], "explain": "<b>What 后跟名词，How 后跟形容词<\/b>（B 错）。What 后面是<b>复数或不可数名词时不加 a/an<\/b>（D 对、E 错）。判断方法：先看后面第一个实词是名词还是形容词。"}, {"id": 4, "type": "multi", "point": "one / it / that（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. I lost my pen. I need to buy one.", "B. I lost my pen. I must find it.", "C. I lost my pen. I must find one.", "D. The weather here is colder than that in Shanghai.", "E. The weather here is colder than one in Shanghai."], "answer": ["A", "B", "D"], "explain": "C 错：丢的是自己那支，要找回<b>同一支<\/b>，用 it 不用 one。E 错：weather 是<b>不可数名词<\/b>，比较时用 that 不用 one。三个词的分工：one ＝ 同类另一个，it ＝ 同一个，that ＝ 比较句里代不可数名词。"}, {"id": 5, "type": "multi", "point": "may 与 could 的礼貌层级（想一想·刁钻）", "stem": "下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. May I come in? 比 Can I come in? 更礼貌。", "B. Could you help me? 里的 could 表示过去。", "C. Could you help me? 比 Can you help me? 更客气。", "D. may 还可以表示推测“可能”。", "E. May I…? 的否定回答常说 I’m afraid you can’t."], "answer": ["A", "C", "D", "E"], "explain": "只有 B 错：<b>could 在请求句里不表示过去，只表示委婉<\/b>。这是情态动词的特殊用法——过去式形式用来表达客气，而不是过去时间。"}, {"id": 6, "type": "choice", "point": "反身代词短语", "stem": "Did you enjoy ______ at the party last night?", "options": ["A. you", "B. your", "C. yourself", "D. yours"], "answer": "C", "explain": "<b>enjoy oneself<\/b> ＝ 玩得开心，是固定搭配，必须用反身代词。同类固定搭配：by oneself（独自）、teach oneself（自学）、help oneself（随便吃）。"}, {"id": 7, "type": "choice", "point": "every 的单复数", "stem": "Every boy and girl in our class ______ a new schoolbag.", "options": ["A. have", "B. has", "C. are having", "D. having"], "answer": "B", "explain": "every 修饰的主语一律当<b>单数<\/b>看，谓语用 has。别被 boy and girl 的“并列”迷惑——被 every 管着就是单数。"}, {"id": 8, "type": "choice", "point": "感叹句句型", "stem": "______ interesting the story is!", "options": ["A. What", "B. What an", "C. How", "D. How an"], "answer": "C", "explain": "后面紧跟的是<b>形容词 interesting<\/b>，所以用 How。如果要用 What，句子得改写成 What an interesting story it is!（后面跟名词）。"}, {"id": 9, "type": "fill", "point": "反身代词", "stem": "填空：He lives by ______ in a small house.（独自，填一个词）", "answer": ["himself"], "explain": "<b>by oneself<\/b> ＝ 独自。主语是 He，反身代词用 himself（不是 hisself）。"}, {"id": 10, "type": "fill", "point": "感叹句转换", "stem": "把 How beautiful the flowers are! 改写成 What 引导的感叹句：______ beautiful flowers they are!（填一个词）", "answer": ["What"], "explain": "改写后 beautiful 后面跟的是<b>复数名词 flowers<\/b>，所以用 What，且<b>复数名词前不加 a/an<\/b>。答案就是 What。"}, {"id": 11, "type": "judge", "point": "both 的适用范围", "stem": "both 只能用于两者，三者及以上要用 all。", "answer": "对", "explain": "对。<b>both ＝ 两者都<\/b>（两只手、两个人），<b>all ＝ 三者以上都<\/b>。否定也对应：neither 是“两个都不”，none 是“三个以上都不”。"}, {"id": 12, "type": "judge", "point": "could 的委婉用法", "stem": "Could you help me? 中的 could 是 can 的过去式，所以这句话在问过去的事。", "answer": "错", "explain": "错。<b>could 在请求句里不表示过去时间，只表示语气委婉<\/b>，比 Can you 更客气。英语常用过去式形式来表达客气（同类的还有 Would you…?、I was wondering if…）。"}]}, {"id": "e-c5-s5", "title": "第五节 单词总复习（九）：身体部位 · 服装尺码 · 形状材质", "notes": [{"point": "身体部位（注意特殊复数）", "explain": "身体部位词高频出现在“What’s the matter”和描写人物的场景里，重点是几个不规则复数。", "examples": [{"tag": "基础", "text": "head 头、face 脸、eye 眼睛、nose 鼻子、mouth 嘴、ear 耳朵、hair 头发、neck 脖子、arm 胳膊、hand 手、leg 腿、foot 脚、back 背。"}, {"tag": "进阶", "text": "特殊复数：foot→<b>feet<\/b>、tooth→<b>teeth<\/b>。这两个是<b>元音变化型<\/b>（oo 变 ee），和 man→men、woman→women 同一类，不在词尾加 s。"}, {"tag": "易错", "text": "hair 通常<b>不可数<\/b>（指整头头发）：She has long <b>hair<\/b>.（不说 hairs）。但指“一根根的头发”时可数：There are two <b>hairs<\/b> in my soup.（汤里有两根头发）。这个区别在描写和抱怨两种场景里刚好相反。"}], "think": "foot→feet、tooth→teeth 都是 oo 变 ee，man→men 是 a 变 e —— 这些不加 s 的复数为什么全都是最常用的身体和人称词？"}, {"point": "服装与尺码", "explain": "购物场景的核心词汇，注意成对物品天生是复数。", "examples": [{"tag": "基础", "text": "coat 外套、shirt 衬衫、dress 连衣裙、skirt 裙子、sweater 毛衣、hat 帽子、tie 领带、jacket 夹克。"}, {"tag": "进阶", "text": "<b>天生复数<\/b>（成对出现）：trousers 裤子、shoes 鞋、socks 袜子、glasses 眼镜、gloves 手套。它们<b>永远配复数动词<\/b>：My trousers <b>are<\/b> new. 要数就用 a pair of：<b>a pair of<\/b> trousers（一条裤子）。"}, {"tag": "易错", "text": "“My trousers <u>is<\/u> new.” ✗ —— trousers 天生复数：My trousers <b>are<\/b> new. ✓ 但如果说 “A pair of trousers <b>is<\/b> on the bed.” 就用单数了，因为主语变成了 pair（一条）。<b>看主语到底是谁<\/b>。"}], "think": "英语把裤子、眼镜、剪刀都算复数（因为有两条腿、两片镜片、两片刀刃），中文却说“一条裤子、一副眼镜”—— 两种语言各自抓住了这些东西的什么特征？"}, {"point": "形状 · 材质 · 颜色", "explain": "描写物品的三类形容词，在“形容词顺序”规则里位置固定：<b>大小 → 新旧 → 颜色 → 材料<\/b>。", "examples": [{"tag": "基础", "text": "形状：round 圆的、square 方的、long 长的、short 短的、thick 厚的、thin 薄的。颜色：red, blue, green, yellow, black, white, brown, grey, orange, pink。"}, {"tag": "进阶", "text": "材质：wooden 木制的、metal 金属的、plastic 塑料的、glass 玻璃的、paper 纸的、cotton 棉的、woollen 毛的、leather 皮的。注意材质词<b>放在最靠近名词的位置<\/b>：a big black <b>leather<\/b> bag。"}, {"tag": "易错", "text": "颜色词作名词时可数：I like <b>blue<\/b>.（我喜欢蓝色，不可数指颜色本身）／ She is wearing a <b>blue<\/b> dress.（形容词）。另外“什么颜色”是 <b>What colour<\/b>，不是 What color of（除非说 What colour is it?）。"}], "think": "a big black leather bag 里三个形容词的顺序不能随便换 —— 你觉得英语为什么把“材质”排在最靠近名词的位置？（提示：哪个特征和这个包的本质关系最紧密？）"}, {"point": "购物与价格表达", "explain": "把第四章学过的购物用语和这里的数量表达串起来。", "examples": [{"tag": "基础", "text": "<b>How much is it?<\/b>（多少钱）／ <b>It’s ten yuan.<\/b>（十块）／ <b>It’s too expensive.<\/b>（太贵了）／ <b>Can you make it cheaper?<\/b>（能便宜点吗）"}, {"tag": "进阶", "text": "expensive / cheap 描述<b>物品<\/b>（贵/便宜）；high / low 描述<b>价格<\/b>（高/低）。“价格贵”要说 The price is <b>high<\/b>.（不说 The price is expensive.）—— 贵的是东西，不是价格本身。"}, {"tag": "易错", "text": "“The price is <u>expensive<\/u>.” ✗ —— 中文说“价格贵”很自然，英语里 expensive 只能形容东西：The <b>book<\/b> is expensive. ✓ 或 The <b>price<\/b> is <b>high<\/b>. ✓ 这是中英搭配习惯的典型差异。"}], "think": "中文可以说“价格很贵”，英语却必须说“价格很高”或“东西很贵”—— 你觉得哪种说法在逻辑上更严密？"}], "quiz": [{"id": 1, "type": "multi", "point": "身体部位的特殊复数（想一想·刁钻）", "stem": "下列复数形式<b>正确<\/b>的有（　）【多选】", "options": ["A. foot — feet", "B. foot — foots", "C. tooth — teeth", "D. tooth — tooths", "E. hand — hands"], "answer": ["A", "C", "E"], "explain": "foot→<b>feet<\/b>、tooth→<b>teeth<\/b> 都是<b>元音变化型<\/b>不规则复数（oo 变 ee），不在词尾加 s。hand 是规则复数直接加 s。"}, {"id": 2, "type": "multi", "point": "天生复数的服装（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. My trousers are new.", "B. My trousers is new.", "C. A pair of trousers is on the bed.", "D. My glasses are broken.", "E. My shoes is dirty."], "answer": ["A", "C", "D"], "explain": "trousers、glasses、shoes 都是<b>天生复数<\/b>，配复数动词（B、E 错）。但 C 的主语是 <b>a pair<\/b>（一条），所以用单数 is。<b>关键是看主语到底是谁<\/b>。"}, {"id": 3, "type": "multi", "point": "hair 的可数性（想一想·刁钻）", "stem": "下列说法<b>正确<\/b>的有（　）【多选】", "options": ["A. She has long hair. 中的 hair 不可数。", "B. There are two hairs in my soup. 中的 hairs 可数。", "C. hair 永远不可数。", "D. 指整头头发时 hair 不可数。", "E. 指一根根头发时 hair 可数。"], "answer": ["A", "B", "D", "E"], "explain": "只有 C 错。hair 是典型的<b>一词两性<\/b>名词：指整体（头发）不可数，指个别（几根头发）可数。同类的还有 fish、paper、chicken。"}, {"id": 4, "type": "multi", "point": "expensive 的搭配（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. The book is expensive.", "B. The price is expensive.", "C. The price is high.", "D. The price is low.", "E. This shirt is too cheap."], "answer": ["A", "C", "D", "E"], "explain": "只有 B 错。<b>expensive / cheap 形容物品<\/b>，<b>high / low 形容价格<\/b>。中文说“价格贵”很自然，英语必须说 The price is high. 或 The book is expensive."}, {"id": 5, "type": "choice", "point": "特殊复数", "stem": "The baby has only two ______ now.", "options": ["A. tooths", "B. tooth", "C. teeth", "D. teeths"], "answer": "C", "explain": "tooth 的复数是<b>元音变化<\/b>形式 teeth（oo 变 ee），不加 s，也没有 teeths 这种形式。"}, {"id": 6, "type": "choice", "point": "天生复数的谓语", "stem": "Where ______ my glasses? I can’t find them.", "options": ["A. is", "B. are", "C. am", "D. be"], "answer": "B", "explain": "glasses（眼镜）是<b>天生复数<\/b>，配复数动词 are。后半句用 them 也印证了这一点。"}, {"id": 7, "type": "choice", "point": "形容词顺序", "stem": "She bought a ______ bag yesterday.", "options": ["A. leather big black", "B. big black leather", "C. black big leather", "D. leather black big"], "answer": "B", "explain": "形容词顺序是<b>大小 → 新旧 → 颜色 → 材料<\/b>，材质词<b>最靠近名词<\/b>：big（大小）→ black（颜色）→ leather（材质）→ bag。"}, {"id": 8, "type": "fill", "point": "特殊复数", "stem": "写出 foot 的复数形式：______", "answer": ["feet"], "explain": "foot 的复数是 <b>feet<\/b>（oo 变 ee），和 tooth→teeth 同类。这类不规则复数都是最常用的日常词。"}, {"id": 9, "type": "fill", "point": "量词搭配", "stem": "填空：I bought a ______ of shoes yesterday.（一双，填一个词）", "answer": ["pair"], "explain": "成对出现的东西用 <b>a pair of<\/b>：a pair of shoes / trousers / glasses / gloves。注意主语变成 pair 后，谓语要用单数。"}, {"id": 10, "type": "fill", "point": "价格搭配", "stem": "填空：The price of this coat is too ______.（高，填一个词）", "answer": ["high"], "explain": "<b>price 配 high / low<\/b>，不能配 expensive。“这件外套太贵”才说 The coat is too <b>expensive<\/b>."}, {"id": 11, "type": "judge", "point": "成对物品的数", "stem": "trousers、glasses、scissors 这类词，即使只有一条/一副，也要用复数动词。", "answer": "对", "explain": "对。这类<b>成对出现<\/b>的东西在英语里天生是复数：My trousers <b>are<\/b> new. 要论条数得说 a pair of trousers（这时主语变成 pair，用单数动词）。"}, {"id": 12, "type": "judge", "point": "expensive 的搭配对象", "stem": "The price is expensive. 是正确的英语表达。", "answer": "错", "explain": "错。<b>expensive 只能形容物品，不能形容价格<\/b>。正确说法二选一：The <b>book<\/b> is expensive.（书贵）或 The <b>price<\/b> is <b>high<\/b>.（价格高）。这是中英搭配习惯的典型差异。"}]}, {"id": "e-c5-s6", "title": "第六节 单词总复习（十）：比较级三级表 · 高频形容词副词", "notes": [{"point": "规则变化三级表", "explain": "把原级、比较级、最高级三个形式一起记，做题时直接调用。", "examples": [{"tag": "基础", "text": "tall-taller-tallest、long-longer-longest、small-smaller-smallest、young-younger-youngest、cold-colder-coldest。"}, {"tag": "进阶", "text": "特殊拼写：nice-nic<b>er<\/b>-nic<b>est<\/b>（e 结尾加 r/st）／ easy-eas<b>ier<\/b>-eas<b>iest<\/b>（y 变 i）／ big-big<b>ger<\/b>-big<b>gest<\/b>（双写）／ hot-hotter-hottest、thin-thinner-thinnest。"}, {"tag": "易错", "text": "双写只发生在<b>重读闭音节<\/b>（辅音+元音+辅音）：big ✓、hot ✓、thin ✓，但 long → longer（不是 longger），因为 long 结尾是 ng 两个辅音字母。判断和加 ing、加 ed 用的是同一条规则。"}], "think": "加 ing、加 ed、加 er/est 三套规则里，“双写”“变 y 为 i”“去 e”反复出现 —— 你能总结出一条通用的英语拼写调整原则吗？"}, {"point": "不规则三级表（必背）", "explain": "五组不规则变化，考试必考，必须背到条件反射。", "examples": [{"tag": "基础", "text": "good / well → <b>better<\/b> → <b>best<\/b>（好）／ bad / badly / ill → <b>worse<\/b> → <b>worst<\/b>（坏）／ many / much → <b>more<\/b> → <b>most<\/b>（多）"}, {"tag": "进阶", "text": "little → <b>less<\/b> → <b>least<\/b>（少）／ far → <b>farther<\/b>（距离更远）/ <b>further<\/b>（程度更深）→ <b>farthest / furthest<\/b>／ old → older / <b>elder<\/b>（家庭长幼）→ oldest / <b>eldest<\/b>。"}, {"tag": "易错", "text": "well 有两个身份：作副词“好地”，比较级是 better；作形容词“健康的”，比较级也是 better。所以 I feel <b>better<\/b> today. 既可以理解成“感觉好些了”也是“身体好些了”，两种都对。"}], "think": "英语里最常用的几个词（good、bad、many、little）恰好全是不规则的 —— 这和不规则动词（go、be、have）的情况一样。你觉得这是什么规律？"}, {"point": "形容词与副词的转换", "explain": "大多数副词由<b>形容词 + ly<\/b> 构成，但有几条特殊规则和几个例外。", "examples": [{"tag": "基础", "text": "quick→quickly、slow→slowly、careful→carefully、loud→loudly、bad→badly、real→really、usual→usually。"}, {"tag": "进阶", "text": "特殊变化：以 <b>y 结尾变 i 加 ly<\/b>：happy→happ<b>ily<\/b>、easy→eas<b>ily<\/b>、angry→angr<b>ily<\/b>／ 以 <b>le 结尾去 e 加 y<\/b>：simple→simp<b>ly<\/b>、possible→possib<b>ly<\/b>／ true→tru<b>ly<\/b>（去 e）。"}, {"tag": "易错", "text": "<b>形副同形<\/b>的词不加 ly：fast、hard、late、early、high、long。“He runs <u>fastly<\/u>.” ✗ → He runs <b>fast<\/b>. ✓ 而 hardly（几乎不）、lately（最近）虽然存在，但意思和原词完全不同，是<b>另一个词<\/b>。"}], "think": "friendly、lovely、lonely 都以 ly 结尾，却是形容词不是副词 —— 那“友好地”这个副词该怎么说？（提示：英语在这里其实“绕道”了。）"}, {"point": "高频形容词分类速记", "explain": "按“描写什么”分类，一组一组记，比按字母表背高效得多。", "examples": [{"tag": "基础", "text": "<b>描写人<\/b>：kind, friendly, clever, lazy, busy, tired, happy, sad, angry, afraid, careful, careless。<b>描写物<\/b>：new, old, big, small, heavy, light, clean, dirty, cheap, expensive。"}, {"tag": "进阶", "text": "<b>描写感受<\/b>：interesting（有趣的，形容事物）vs interested（感兴趣的，形容人）／ exciting vs excited／ boring vs bored。规律：<b>ing 形容事物，ed 形容人<\/b>。"}, {"tag": "易错", "text": "“I am <u>interesting<\/u> in music.” ✗ —— interesting 形容事物（这本书有趣），形容人感兴趣要用 <b>interested<\/b>：I am <b>interested in<\/b> music. ✓ 说 “I am interesting.” 意思变成“我这个人很有意思”，虽然语法对但不是你想说的。"}], "think": "The film is boring. 和 I am bored. 一个说电影，一个说人 —— 如果说成 I am boring.，别人会怎么理解你？"}], "quiz": [{"id": 1, "type": "multi", "point": "规则三级变化（想一想·刁钻）", "stem": "下列三级形式<b>正确<\/b>的有（　）【多选】", "options": ["A. big - bigger - biggest", "B. long - longger - longgest", "C. easy - easier - easiest", "D. nice - nicer - nicest", "E. hot - hoter - hotest"], "answer": ["A", "C", "D"], "explain": "B 错：long 结尾是 <b>ng 两个辅音字母<\/b>，不属于重读闭音节，不双写 → longer/longest。E 错：hot 是重读闭音节，要<b>双写<\/b> → hotter/hottest。"}, {"id": 2, "type": "multi", "point": "不规则三级·终检（想一想·刁钻）", "stem": "下列三级形式<b>正确<\/b>的有（　）【多选】", "options": ["A. good - better - best", "B. bad - worse - worst", "C. little - less - least", "D. many - manier - maniest", "E. far - farther - farthest"], "answer": ["A", "B", "C", "E"], "explain": "只有 D 错：many/much 的三级是 <b>more - most<\/b>。这五组不规则变化必须背到条件反射，考试必考。"}, {"id": 3, "type": "multi", "point": "形容词变副词（想一想·刁钻）", "stem": "下列副词形式<b>正确<\/b>的有（　）【多选】", "options": ["A. happily", "B. happyly", "C. simply", "D. fastly", "E. carefully"], "answer": ["A", "C", "E"], "explain": "B 错：y 结尾要<b>变 i 加 ly<\/b> → happily。D 错：fast 是<b>形副同形<\/b>词，不加 ly。C 对：le 结尾去 e 加 y → simply。"}, {"id": 4, "type": "multi", "point": "ing 与 ed 形容词（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. I am interested in music.", "B. I am interesting in music.", "C. The film is boring.", "D. I am bored.", "E. The film is bored."], "answer": ["A", "C", "D"], "explain": "规律是 <b>ing 形容事物的性质，ed 形容人的感受<\/b>。B 错：应为 interested in。E 错：电影不会“感到”无聊，<b>ed 形式只能用在有感觉的人身上<\/b>，应说 The film is <b>boring<\/b>.<br>再提醒一个容易误会的：“<b>I am boring.<\/b>”<b>语法完全正确<\/b>，但意思是“我这个人很无趣”——不是“我觉得无聊”（那要说 I am <b>bored<\/b>.）。它不是病句，是<b>说错了意思<\/b>。"}, {"id": 5, "type": "multi", "point": "形副同形词（想一想·刁钻）", "stem": "下列词中，<b>形容词和副词同形<\/b>（不加 ly）的有（　）【多选】", "options": ["A. fast", "B. hard", "C. late", "D. slow", "E. early"], "answer": ["A", "B", "C", "E"], "explain": "fast、hard、late、early、high、long 都是<b>形副同形<\/b>。slow 要加 ly 变 slowly。注意 hardly（几乎不）和 lately（最近）虽然存在，但意思完全不同，属于另一个词。"}, {"id": 6, "type": "choice", "point": "不规则最高级", "stem": "Of the three students, Tom studies ______.", "options": ["A. hardest", "B. harder", "C. hard", "D. more hard"], "answer": "A", "explain": "三者比较用<b>最高级<\/b>；hard 是形副同形词，最高级直接加 est → hardest（注意这里说的是“学习最努力”，不是 hardly）。"}, {"id": 7, "type": "choice", "point": "ed 形容词", "stem": "The children were very ______ when they heard the good news.", "options": ["A. exciting", "B. excitement", "C. excite", "D. excited"], "answer": "D", "explain": "形容<b>人<\/b>的感受用 <b>ed<\/b> 形式 excited（激动的）。exciting 形容事物（The news is exciting.）。"}, {"id": 8, "type": "choice", "point": "副词的构成", "stem": "She smiled ______ and said hello to me.", "options": ["A. happy", "B. happyly", "C. happily", "D. happiness"], "answer": "C", "explain": "修饰动词 smiled 要用<b>副词<\/b>；happy 以 y 结尾，变副词要<b>变 i 加 ly<\/b> → happily。"}, {"id": 9, "type": "fill", "point": "不规则最高级", "stem": "写出 bad 的最高级形式：______", "answer": ["worst"], "explain": "bad 的三级是 bad - <b>worse<\/b> - <b>worst<\/b>，完全不规则，没有 badder / baddest。"}, {"id": 10, "type": "fill", "point": "副词形式", "stem": "写出 easy 对应的副词形式：______", "answer": ["easily"], "explain": "easy 以 y 结尾，变副词要<b>变 y 为 i 再加 ly<\/b> → easily。同类：happy→happily、angry→angrily。"}, {"id": 11, "type": "judge", "point": "ly 结尾不一定是副词", "stem": "friendly、lovely、lonely 都以 ly 结尾，所以它们都是副词。", "answer": "错", "explain": "错。<b>friendly、lovely、lonely、silly 都是形容词<\/b>，不是副词。判断词性不能只看词尾。要表达“友好地”，英语得绕道说 in a friendly way。"}, {"id": 12, "type": "judge", "point": "ing 与 ed 形容词", "stem": "The film is boring. 说的是电影无聊；I am bored. 说的是我觉得无聊。", "answer": "对", "explain": "对。规律是 <b>ing 形容事物本身的性质，ed 形容人的感受<\/b>。同类：interesting/interested、exciting/excited、surprising/surprised、tiring/tired。说 I am boring. 意思会变成“我这个人很无趣”。"}]}]}, {"id": "e-c6", "title": "第六章 Lesson 121-144：疑问代词 · 间接引语 · 时态综合", "sections": [{"id": "e-c6-s1", "title": "第一节 Lesson 121-126：疑问代词 who/whom/whose/which", "notes": [{"point": "who 与 whom 的分工", "explain": "<b>who<\/b> 是主格（问“谁”做了动作），<b>whom<\/b> 是宾格（问“对谁、把谁”）。判断方法：<b>能用 he 回答的用 who，能用 him 回答的用 whom<\/b>。口语里 whom 常被 who 代替，但介词后面必须用 whom。", "examples": [{"tag": "基础", "text": "<b>Who<\/b> broke the window?（谁打破的？答 He did.）／ <b>Whom<\/b> did you see?（你看见谁了？答 I saw him.）"}, {"tag": "进阶", "text": "介词后面<b>只能用 whom<\/b>：<b>To whom<\/b> did you give it?（你给谁了？）／ <b>With whom<\/b> did you go? 但口语更常把介词放句末，这时 who 也行：Who did you give it <b>to<\/b>?"}, {"tag": "易错", "text": "who 作主语时<b>不用助动词<\/b>：“<u>Who did break<\/u> the window?” 多余 ✗ → <b>Who broke<\/b> the window? ✓ 而 whom 作宾语时<b>必须用助动词<\/b>：<b>Whom did<\/b> you see? ✓ 一个不倒装，一个要倒装。"}], "think": "Who broke the window? 不用 did，Whom did you see? 却要用 —— 你能用“疑问词在句子里当主语还是宾语”这一条把它们区分开吗？"}, {"point": "whose 问“谁的”", "explain": "<b>whose<\/b> 问所有权，后面可以直接跟名词（whose book），也可以单独用（Whose is this?）。回答用名词所有格或物主代词。", "examples": [{"tag": "基础", "text": "<b>Whose<\/b> book is this? — It’s <b>Tom’s<\/b>. ／ <b>Whose<\/b> is this bag? — It’s <b>mine<\/b>."}, {"tag": "进阶", "text": "名词所有格的构成：单数加 <b>’s<\/b>（Tom’s book）；<b>复数以 s 结尾只加撇号<\/b>（the students’ books）；复数不以 s 结尾仍加 ’s（the children’s books）。"}, {"tag": "易错", "text": "whose 和 who’s 读音完全相同：<b>whose<\/b> ＝ 谁的（Whose book?）／ <b>who’s<\/b> ＝ who is（Who’s there?）。判断方法和 its / it’s 一样：<b>能还原成 who is 就写 who’s<\/b>。"}], "think": "whose / who’s、its / it’s、your / you’re 三对词都是“所有格 vs 缩写”—— 你发现规律了吗？带撇号的那个永远是什么？"}, {"point": "which 与 what 的区别", "explain": "<b>which<\/b> 用于<b>范围有限<\/b>的选择（在给定的几个里选）；<b>what<\/b> 用于<b>范围无限<\/b>的开放提问。", "examples": [{"tag": "基础", "text": "<b>Which<\/b> book do you want, this one or that one?（两本里选）／ <b>What<\/b> book do you want?（什么书都行，范围不限）"}, {"tag": "进阶", "text": "which 常配 <b>of<\/b> 表示“……中的哪个”：<b>Which of<\/b> these books is yours? ／ 也常配 or 给出选项：Which do you like, tea <b>or<\/b> coffee?"}, {"tag": "易错", "text": "“<u>What<\/u> of these two books is yours?” ✗ —— 范围已经限定成两本了，要用 <b>Which<\/b>：Which of these two books is yours? ✓ 判断方法：<b>句子里有没有给出选择范围<\/b>。"}], "think": "服务员问 What would you like to drink? 和 Which would you like, tea or coffee? —— 你从这两个问题能推测出这家店的菜单有什么不同吗？"}, {"point": "特殊疑问句的完整语序", "explain": "标准语序是 <b>疑问词 + 助动词/be + 主语 + 其余<\/b>。唯一的例外是<b>疑问词本身作主语<\/b>时，用陈述语序，不倒装。", "examples": [{"tag": "基础", "text": "<b>What did<\/b> you do yesterday? ／ <b>Where is<\/b> he? ／ <b>Why are<\/b> you late? ／ <b>How many<\/b> books <b>do<\/b> you have?"}, {"tag": "进阶", "text": "常见疑问词全表：what（什么）、who（谁）、whom（谁·宾格）、whose（谁的）、which（哪一个）、when（何时）、where（哪里）、why（为什么）、how（怎样）、how many/much（多少）、how old（多大）、how long（多久/多长）、how far（多远）、how often（多久一次）。"}, {"tag": "易错", "text": "疑问句里<b>不能保留陈述语序<\/b>：“What you did yesterday?” ✗ → <b>What did you do<\/b> yesterday? ✓ 但如果是<b>宾语从句<\/b>，反而要用陈述语序：I don’t know <b>what you did<\/b>. ✓ 两者刚好相反。"}], "think": "What did you do? 要倒装，I don’t know what you did. 却不能倒装 —— 同一串词，为什么在不同位置规则相反？"}, {"point": "how 系列疑问词", "explain": "how 加上不同的词能问出非常具体的信息，这一组必须整体记住，考试高频。", "examples": [{"tag": "基础", "text": "<b>How old<\/b>（多大年纪）／ <b>How tall<\/b>（多高·人）／ <b>How high<\/b>（多高·物）／ <b>How long<\/b>（多长/多久）／ <b>How far<\/b>（多远）／ <b>How often<\/b>（多久一次）／ <b>How soon<\/b>（多久以后）。"}, {"tag": "进阶", "text": "两组最容易混：<b>How long<\/b> 问时间长度（How long have you been here? — For two years.）／ <b>How soon<\/b> 问“还要多久”（How soon will he come? — In two hours.）；<b>How often<\/b> 问频率（Once a week.）／ <b>How many times<\/b> 问次数（Three times.）。"}, {"tag": "易错", "text": "回答要对应：How long 答 <b>for + 时段<\/b>；How soon 答 <b>in + 时段<\/b>；How often 答 <b>once/twice a week<\/b>。问 How soon 却答 for two hours 就答错了——一个问“还要多久”，一个问“持续多久”。"}], "think": "How long will you stay? 和 How soon will you come? 都在问时间，一个答 for two days，一个答 in two days —— 这两个介词的差别，正好对应了什么？"}], "quiz": [{"id": 1, "type": "multi", "point": "who 与 whom（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. Who broke the window?", "B. Who did break the window?", "C. Whom did you see?", "D. Whom did you saw?", "E. To whom did you give it?"], "answer": ["A", "C", "E"], "explain": "B 多加了助动词（who 作主语时不倒装）。D 错在 did 后动词要还原成 see。E 对：<b>介词后面只能用 whom<\/b>，不能用 who。"}, {"id": 2, "type": "multi", "point": "whose 与 who's（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. Whose book is this?", "B. Who’s book is this?", "C. Who’s there?", "D. Whose is this bag?", "E. Whose there?"], "answer": ["A", "C", "D"], "explain": "<b>whose ＝ 谁的<\/b>（问所有权），<b>who’s ＝ who is<\/b>（缩写）。B、E 用反了。判断方法和 its/it’s 一样：能还原成 who is 就写 who’s。"}, {"id": 3, "type": "multi", "point": "which 与 what（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. Which of these two books is yours?", "B. What of these two books is yours?", "C. What do you want to drink?", "D. Which do you like, tea or coffee?", "E. Which book do you want, this one or that one?"], "answer": ["A", "C", "D", "E"], "explain": "只有 B 错：句子已经限定成“这两本”，<b>范围有限用 which<\/b>。what 用于范围无限的开放提问。判断标准：句子里有没有给出选择范围。"}, {"id": 4, "type": "multi", "point": "疑问句与宾语从句的语序（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. What did you do yesterday?", "B. What you did yesterday?", "C. I don’t know what you did.", "D. I don’t know what did you do.", "E. Where is he?"], "answer": ["A", "C", "E"], "explain": "<b>特殊疑问句要倒装<\/b>（A、E），<b>宾语从句要用陈述语序<\/b>（C）。B 该倒装没倒装，D 不该倒装却倒装了。同一串词，位置不同规则相反。"}, {"id": 5, "type": "multi", "point": "how 系列的问答配对（想一想·刁钻）", "stem": "下列问答配对<b>正确<\/b>的有（　）【多选】", "options": ["A. How long have you been here? — For two years.", "B. How soon will he come? — In two hours.", "C. How often do you go there? — Once a week.", "D. How soon will he come? — For two hours.", "E. How far is it? — About two kilometres."], "answer": ["A", "B", "C", "E"], "explain": "只有 D 错配。<b>How long 答 for + 时段<\/b>（持续多久），<b>How soon 答 in + 时段<\/b>（还要多久）。两者问的是完全不同的东西。"}, {"id": 6, "type": "choice", "point": "who 作主语", "stem": "______ taught you English last year?", "options": ["A. Who did", "B. Whom did", "C. Whom", "D. Who"], "answer": "D", "explain": "who 在这里<b>本身就是主语<\/b>（是“谁”教的），用陈述语序，动词直接用过去式 taught，不需要助动词。"}, {"id": 7, "type": "choice", "point": "how 系列", "stem": "—______ do you go swimming?　—Twice a week.", "options": ["A. How long", "B. How soon", "C. How often", "D. How many"], "answer": "C", "explain": "回答是“一周两次”，问的是<b>频率<\/b>，用 How often。How long 问时长，How soon 问“还要多久”。"}, {"id": 8, "type": "choice", "point": "宾语从句语序", "stem": "Could you tell me ______?", "options": ["A. where is the station", "B. where the station is", "C. where is station", "D. the station where is"], "answer": "B", "explain": "这是<b>宾语从句<\/b>，必须用<b>陈述语序<\/b>（主语在前，谓语在后）：where the station is。虽然整句是问句，从句部分不能倒装。"}, {"id": 9, "type": "fill", "point": "whose 的用法", "stem": "填空：______ bag is this? It’s Tom’s.（填一个词）", "answer": ["Whose"], "explain": "回答是 Tom’s（汤姆的），说明问的是<b>所有权<\/b>，用 Whose。注意不能写成 Who’s（那是 who is 的缩写）。"}, {"id": 10, "type": "fill", "point": "how 系列", "stem": "填空：—How ______ is it from here to the school?　—About two kilometres.（填一个词）", "answer": ["far"], "explain": "回答是距离（两公里），问<b>多远<\/b>用 How far。How long 问长度或时间，How high 问高度。"}, {"id": 11, "type": "judge", "point": "介词后用 whom", "stem": "介词紧跟在前面时只能用 whom，但把介词移到句末就可以用 who。", "answer": "对", "explain": "对。To <b>whom<\/b> did you give it? ✓ / To <u>who<\/u> ✗；但介词后置时 who 就没问题了：<b>Who<\/b> did you give it <b>to<\/b>? ✓ 口语里后一种说法更常用。"}, {"id": 12, "type": "judge", "point": "宾语从句不倒装", "stem": "I don’t know what did you do. 这句话是正确的。", "answer": "错", "explain": "错。<b>宾语从句必须用陈述语序<\/b>：I don’t know <b>what you did<\/b>. 虽然 what 是疑问词，但它引导的是从句，不是独立的疑问句，所以不能倒装。"}]}, {"id": "e-c6-s2", "title": "第二节 Lesson 127-132：间接引语（陈述句）· 时态呼应", "notes": [{"point": "什么是直接引语和间接引语", "explain": "<b>直接引语<\/b>是原话照搬，加引号：He said, “I am busy.”／<b>间接引语<\/b>是转述，去掉引号，常加 that：He said <b>that<\/b> he <b>was<\/b> busy. 转述时要改三样东西：<b>人称、时态、时间地点词<\/b>。", "examples": [{"tag": "基础", "text": "直接：Tom said, “<b>I<\/b> like <b>this<\/b> book.” → 间接：Tom said (that) <b>he liked that<\/b> book.（人称 I→he，时态 like→liked，指示词 this→that）"}, {"tag": "进阶", "text": "that 可以省略：He said (that) he was busy. 两种都对，口语里常省略。但如果转述内容较长或有多个从句，保留 that 更清楚。"}, {"tag": "易错", "text": "转述时最容易<b>只改人称忘了改时态<\/b>：“He said that he <u>is<\/u> busy.” ✗ → He said that he <b>was<\/b> busy. ✓ 三样东西要一起改，漏一样就错。"}], "think": "转述别人的话时，为什么英语要改时态？（提示：他说“我很忙”是在过去说的，等你转述时，那个“忙”还是“现在”的事吗？）"}, {"point": "时态呼应：主句过去，从句退一步", "explain": "如果引述动词（said、told）是<b>过去时<\/b>，从句的时态要<b>整体往过去退一格<\/b>：一般现在时→一般过去时；现在进行时→过去进行时；一般过去时→过去完成时；will→would；can→could。", "examples": [{"tag": "基础", "text": "“I <b>am<\/b> busy.” → He said he <b>was<\/b> busy. ／ “I <b>am reading<\/b>.” → He said he <b>was reading<\/b>. ／ “I <b>will<\/b> come.” → He said he <b>would<\/b> come."}, {"tag": "进阶", "text": "情态动词的退格：can→<b>could<\/b>、may→<b>might<\/b>、will→<b>would<\/b>。但 <b>must、should、could 本身没有更过去的形式，保持不变<\/b>：“I must go.” → He said he <b>must<\/b> go."}, {"tag": "易错", "text": "如果引述动词是<b>现在时<\/b>（says、tells），从句时态<b>不用改<\/b>：He <b>says<\/b> he <b>is<\/b> busy. ✓ 只有 said / told 这类过去时才触发退格。做题第一步是看引述动词是什么时态。"}], "think": "“他说他很忙”在中文里不用改任何词，英语却要把 am 改成 was —— 这个改动到底给听话的人传递了什么额外信息？"}, {"point": "人称的转换", "explain": "转述时代词要<b>站在转述者的角度<\/b>重新确定。口诀：<b>一随主、二随宾、三不变<\/b>——第一人称跟着主句主语变，第二人称跟着主句宾语变，第三人称不变。", "examples": [{"tag": "基础", "text": "Tom said, “<b>I<\/b> am busy.” → Tom said <b>he<\/b> was busy.（I 跟着主语 Tom → he）"}, {"tag": "进阶", "text": "Tom said to <b>me<\/b>, “<b>You<\/b> are right.” → Tom told <b>me<\/b> that <b>I<\/b> was right.（You 跟着宾语 me → I）／ Tom said, “<b>He<\/b> is my friend.” → Tom said <b>he<\/b> was his friend.（第三人称不变，但 my 要跟着主语变成 his）"}, {"tag": "易错", "text": "漏改物主代词：“Tom said, ‘This is <u>my<\/u> book.’ → Tom said that was <u>my<\/u> book.” ✗ → Tom said that was <b>his<\/b> book. ✓ 物主代词也算人称，一起改。"}], "think": "如果 A 对 B 说“你是对的”，B 转述给 C 时说“他说我是对的”—— 同一个“你”，为什么变成了“我”？这个转换的依据是什么？"}, {"point": "时间与地点词的转换", "explain": "因为转述时说话的时间地点变了，这些词也要跟着改：<b>now→then、today→that day、tomorrow→the next day、yesterday→the day before、here→there、this→that、these→those、ago→before<\/b>。", "examples": [{"tag": "基础", "text": "“I am busy <b>today<\/b>.” → He said he was busy <b>that day<\/b>. ／ “I will come <b>tomorrow<\/b>.” → He said he would come <b>the next day<\/b>."}, {"tag": "进阶", "text": "如果<b>转述发生在同一天同一地点<\/b>，这些词可以不改：（今天早上）He said, “I’ll see you today.” → 你当天转述：He said he’ll see me <b>today<\/b>. ✓ 语言服务于沟通，不是死规则。"}, {"tag": "易错", "text": "here→there 最容易漏：“He said, ‘I like it <u>here<\/u>.’ → He said he liked it <u>here<\/u>.” ✗（如果转述地点变了）→ He said he liked it <b>there<\/b>. ✓ 三样东西（人称、时态、时间地点）要一起检查。"}], "think": "转述规则说 tomorrow 要改成 the next day，但如果你就是在他说话的当天转述，还需要改吗？这说明语法规则背后的真正标准是什么？"}, {"point": "say / tell / speak / talk 的区别", "explain": "四个“说”分工不同：<b>say<\/b>（说，强调内容，say sth / say to sb）／ <b>tell<\/b>（告诉某人，必须带人 tell sb sth）／ <b>speak<\/b>（说某种语言、发言，speak English）／ <b>talk<\/b>（交谈，talk with/to sb about sth）。", "examples": [{"tag": "基础", "text": "He <b>said<\/b> hello. ／ He <b>told<\/b> me a story. ／ He <b>speaks<\/b> English well. ／ We <b>talked<\/b> about the film."}, {"tag": "进阶", "text": "间接引语里 say 和 tell 的搭配不同：<b>say (that)…<\/b>（后面不带人）／ <b>tell sb (that)…<\/b>（必须带人）。He <b>said<\/b> that he was busy. ✓ / He <b>told me<\/b> that he was busy. ✓ / He <u>told<\/u> that he was busy. ✗"}, {"tag": "易错", "text": "“He <u>said me<\/u> a story.” ✗ —— say 后面不能直接跟人：He <b>told me<\/b> a story. ✓ 或 He <b>said to me<\/b>… ✓ 判断口诀：<b>tell 后面必须有人，say 后面直接是内容<\/b>。"}], "think": "英语用四个不同的词表达中文一个“说”字 —— 如果让你给外国人解释中文的“说、讲、告诉、聊”，你会怎么分？"}], "quiz": [{"id": 1, "type": "multi", "point": "间接引语要改三样（想一想·刁钻）", "stem": "把 Tom said, “I like this book.” 改成间接引语，<b>需要改动<\/b>的有（　）【多选】", "options": ["A. 人称 I 改成 he", "B. 时态 like 改成 liked", "C. 指示词 this 改成 that", "D. 去掉引号", "E. 把 Tom 改成 he"], "answer": ["A", "B", "C", "D"], "explain": "间接引语要改<b>人称、时态、时间地点词<\/b>三样，并去掉引号。E 错：主句的主语 Tom 不用改。正确结果：Tom said (that) he liked that book."}, {"id": 2, "type": "multi", "point": "时态退格（想一想·刁钻）", "stem": "下列时态转换<b>正确<\/b>的有（　）【多选】", "options": ["A. am → was", "B. will → would", "C. can → could", "D. must → musted", "E. am reading → was reading"], "answer": ["A", "B", "C", "E"], "explain": "D 错：<b>must 没有过去形式，保持不变<\/b>（同类的还有 should、could 本身）。其余都是标准的“退一格”转换：现在→过去，will→would，can→could。"}, {"id": 3, "type": "multi", "point": "引述动词的时态决定要不要退格（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. He said he was busy.", "B. He said he is busy.", "C. He says he is busy.", "D. He says he was busy.（转述的是过去的事）", "E. He told me that he would come."], "answer": ["A", "C", "D", "E"], "explain": "只有 B 错：引述动词是 <b>said（过去时）<\/b>就必须退格，is 要改成 was。C、D 的引述动词是 says（现在时），从句时态<b>不用退格<\/b>。<b>做题第一步永远是看引述动词的时态<\/b>。"}, {"id": 4, "type": "multi", "point": "时间地点词转换（想一想·刁钻）", "stem": "下列转换<b>正确<\/b>的有（　）【多选】", "options": ["A. today → that day", "B. tomorrow → the next day", "C. here → there", "D. now → then", "E. yesterday → tomorrow"], "answer": ["A", "B", "C", "D"], "explain": "只有 E 错（方向反了）：yesterday → <b>the day before<\/b>。这几组转换的共同逻辑是——<b>把“说话当时”的坐标换成“转述时”的坐标<\/b>。"}, {"id": 5, "type": "multi", "point": "say 与 tell 的搭配（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. He told me a story.", "B. He said me a story.", "C. He said to me that he was busy.", "D. He told that he was busy.", "E. He said that he was busy."], "answer": ["A", "C", "E"], "explain": "口诀：<b>tell 后面必须有人，say 后面直接跟内容<\/b>。B 错（say 不能直接跟人），D 错（tell 必须带人）。C 对：say 要带人得加 to。"}, {"id": 6, "type": "choice", "point": "时态退格", "stem": "“I will call you tomorrow,” he said. → He said he ______ call me the next day.", "options": ["A. will", "B. would", "C. wills", "D. is going to"], "answer": "B", "explain": "引述动词 said 是过去时，从句要<b>退一格<\/b>：will → <b>would<\/b>。同时 tomorrow 也要改成 the next day。"}, {"id": 7, "type": "choice", "point": "人称转换", "stem": "Tom said to me, “You are right.” → Tom told me that ______ right.", "options": ["A. I was", "B. you were", "C. he was", "D. I am"], "answer": "A", "explain": "口诀<b>“二随宾”<\/b>：直接引语里的 You 指的是 me（宾语），转述时变成 <b>I<\/b>；同时时态 are 要退格成 was。"}, {"id": 8, "type": "choice", "point": "say 与 tell", "stem": "He ______ me that he had lost his key.", "options": ["A. told", "B. said", "C. spoke", "D. talked"], "answer": "A", "explain": "后面紧跟人称代词 me，只有 <b>tell<\/b> 能这样用（tell sb that…）。say 要带人必须加 to（said to me）。"}, {"id": 9, "type": "fill", "point": "时态退格", "stem": "转换：“I am a student,” he said. → He said he ______ a student.（填一个词）", "answer": ["was"], "explain": "引述动词 said 是过去时，从句时态<b>退一格<\/b>：am → was。同时人称 I 也已改成 he。"}, {"id": 10, "type": "fill", "point": "时间词转换", "stem": "转换：He said, “I will come tomorrow.” → He said he would come the ______ day.（填一个词）", "answer": ["next", "following"], "explain": "间接引语里 tomorrow 要改成 <b>the next day<\/b>（或 the following day），因为转述时“明天”已经不是原来那个明天了。"}, {"id": 11, "type": "judge", "point": "引述动词决定退格", "stem": "只有当引述动词是过去时（said、told）时，间接引语的从句时态才需要退一格。", "answer": "对", "explain": "对。<b>做题第一步永远是看引述动词的时态<\/b>：He <b>said<\/b> he <b>was<\/b> busy.（退格）／ He <b>says<\/b> he <b>is<\/b> busy.（不退格）。引述动词是现在时，从句原样保留。"}, {"id": 12, "type": "judge", "point": "must 不退格", "stem": "间接引语中，must 要变成 musted。", "answer": "错", "explain": "错。<b>must 没有过去形式，在间接引语中保持不变<\/b>：“I must go.” → He said he <b>must<\/b> go. 同类不变的还有 should、ought to、could（本身已是过去式）。"}]}, {"id": "e-c6-s3", "title": "第三节 Lesson 133-138：间接引语（疑问句与祈使句）", "notes": [{"point": "一般疑问句变间接引语：用 if / whether", "explain": "转述<b>一般疑问句<\/b>（Yes/No 问题）时，用 <b>if<\/b> 或 <b>whether<\/b>（是否）引导，并把<b>疑问语序改回陈述语序<\/b>。引述动词常用 asked。", "examples": [{"tag": "基础", "text": "He asked, “<b>Are you<\/b> a student?” → He asked <b>if I was<\/b> a student.（Are you 变成 I was，语序改回陈述）"}, {"tag": "进阶", "text": "if 和 whether 大多可以互换，但<b>后面紧跟 or not 时只能用 whether<\/b>：He asked <b>whether or not<\/b> I was coming. 另外介词后面也只能用 whether。"}, {"tag": "易错", "text": "最常见的错误是<b>保留疑问语序<\/b>：“He asked if <u>was I<\/u> a student.” ✗ → He asked if <b>I was<\/b> a student. ✓ 转述以后它就不是问句了，是句子的一个成分，必须用陈述语序。"}], "think": "转述问句时要把语序改回陈述，转述陈述句时语序本来就不变 —— 你能用一句话概括“间接引语里所有从句的语序规则”吗？"}, {"point": "特殊疑问句变间接引语：疑问词照用", "explain": "转述<b>特殊疑问句<\/b>时，<b>疑问词本身就是连接词<\/b>，不需要加 if；同样要把语序改回陈述语序，时态照常退格。", "examples": [{"tag": "基础", "text": "He asked, “<b>Where do you<\/b> live?” → He asked <b>where I lived<\/b>.（where 留着，do 消失，语序改回陈述）"}, {"tag": "进阶", "text": "注意助动词 do / does / did 在转述后<b>消失<\/b>，它的时态信息转移到主要动词上：“What <b>did<\/b> you <b>do<\/b>?” → He asked what I <b>had done<\/b>. / 简单说法 what I <b>did<\/b>."}, {"tag": "易错", "text": "“He asked where <u>did I live<\/u>.” ✗ —— 这是<b>宾语从句<\/b>，必须陈述语序，助动词 did 要消失：He asked where <b>I lived<\/b>. ✓ 这和上一节“Could you tell me where the station is”是同一条规则。"}], "think": "Where do you live? 转述成 where I lived 时，do 凭空消失了 —— 它承载的信息去哪了？"}, {"point": "祈使句变间接引语：用不定式", "explain": "转述<b>祈使句<\/b>（命令、请求）时，把动词原形改成 <b>to + 动词原形<\/b>，并用 <b>tell / ask / order + sb + to do<\/b> 的结构。否定祈使句用 <b>not to do<\/b>。", "examples": [{"tag": "基础", "text": "He said, “<b>Open<\/b> the door.” → He <b>told me to open<\/b> the door. ／ He said, “<b>Please sit<\/b> down.” → He <b>asked me to sit<\/b> down."}, {"tag": "进阶", "text": "语气决定用词：命令用 <b>told / ordered<\/b>，请求（有 please）用 <b>asked<\/b>。所以 “Please help me.” → He <b>asked<\/b> me to help him.（不用 told，因为语气是请求）"}, {"tag": "易错", "text": "否定的位置：“Don’t open the door.” → He told me <b>not to open<\/b> the door. ✓（not 放在 to 前面）／ “<u>told me to not open<\/u>” ✗ 这是最容易放错位置的一个词。"}], "think": "祈使句转述时变成了不定式（to open），而陈述句转述时变成了从句（that he was busy）—— 为什么两种句型转述后的结构完全不同？"}, {"point": "间接引语的完整判断流程", "explain": "遇到转述题，按这四步走：① 看<b>原句是什么句型<\/b>（陈述/一般疑问/特殊疑问/祈使）；② 定<b>连接词<\/b>（that / if / 疑问词 / to do）；③ 改<b>人称<\/b>；④ 改<b>时态和时间地点词<\/b>。", "examples": [{"tag": "基础", "text": "陈述句 → that ／ 一般疑问句 → <b>if / whether<\/b> ／ 特殊疑问句 → <b>疑问词<\/b> ／ 祈使句 → <b>to do / not to do<\/b>。四种句型，四种连接方式。"}, {"tag": "进阶", "text": "语序永远是<b>陈述语序<\/b>（除祈使句变成不定式外）。这一条对所有从句都成立，是英语从句最核心的规则之一。"}, {"tag": "易错", "text": "四步里最容易漏的是<b>第四步的时间地点词<\/b>。做完题一定要回头检查一遍句子里有没有 today / tomorrow / here / this，有就必须改。"}], "think": "间接引语的四个步骤里，哪一步是你觉得最容易忘的？如果让你给自己编一个检查口诀，你会怎么编？"}, {"point": "常用引述动词", "explain": "除了 say / tell / ask，还有一批引述动词能更准确地表达语气，写作时用它们会更生动。", "examples": [{"tag": "基础", "text": "say（说）、tell（告诉）、ask（问/请求）、answer（回答）、reply（答复）、explain（解释）、add（补充）。"}, {"tag": "进阶", "text": "带语气的：<b>order<\/b>（命令）、<b>warn<\/b>（警告）、<b>advise<\/b>（建议）、<b>promise<\/b>（承诺）、<b>complain<\/b>（抱怨）、<b>shout<\/b>（喊）。用哪个词，读者就能感受到什么语气。"}, {"tag": "易错", "text": "explain 后面<b>不能直接跟人<\/b>：“He <u>explained me<\/u> the question.” ✗ → He <b>explained the question to me<\/b>. ✓ 这和 say 一样，要带人得加 to。tell 才是能直接跟人的那个。"}], "think": "He said I was wrong. / He complained I was wrong. / He warned me I was wrong. —— 同一件事，换三个引述动词，读者感受到的场景有什么不同？"}], "quiz": [{"id": 1, "type": "multi", "point": "一般疑问句的转述（想一想·刁钻）", "stem": "把 He asked, “Are you a student?” 改成间接引语，下列<b>正确<\/b>的有（　）【多选】", "options": ["A. He asked if I was a student.", "B. He asked whether I was a student.", "C. He asked if was I a student.", "D. He asked I was a student.", "E. He asked if you are a student."], "answer": ["A", "B"], "explain": "一般疑问句转述要用 <b>if / whether<\/b> 引导（D 缺连接词），并<b>改回陈述语序<\/b>（C 保留了疑问语序），同时改人称和时态（E 两样都没改）。"}, {"id": 2, "type": "multi", "point": "特殊疑问句的转述（想一想·刁钻）", "stem": "下列转述<b>正确<\/b>的有（　）【多选】", "options": ["A. He asked where I lived.", "B. He asked where did I live.", "C. He asked if where I lived.", "D. He asked what I wanted.", "E. He asked where I live.（引述动词是 asked）"], "answer": ["A", "D"], "explain": "特殊疑问句转述时<b>疑问词本身就是连接词<\/b>（C 多加了 if），<b>语序改回陈述、助动词消失<\/b>（B 保留了疑问语序），<b>时态要退格<\/b>（E 没退格）。"}, {"id": 3, "type": "multi", "point": "祈使句的转述（想一想·刁钻）", "stem": "下列转述<b>正确<\/b>的有（　）【多选】", "options": ["A. He told me to open the door.", "B. He told me open the door.", "C. He told me not to open the door.", "D. He told me to not open the door.", "E. He asked me to sit down."], "answer": ["A", "C", "E"], "explain": "祈使句转述用 <b>tell/ask sb to do<\/b>（B 漏了 to），否定形式是 <b>not to do<\/b>，<b>not 放在 to 前面<\/b>（D 位置错了）。E 对：有 please 的请求用 asked。"}, {"id": 4, "type": "multi", "point": "四种句型的连接词（想一想·刁钻）", "stem": "关于间接引语的连接方式，说法<b>正确<\/b>的有（　）【多选】", "options": ["A. 陈述句用 that（可省略）。", "B. 一般疑问句用 if 或 whether。", "C. 特殊疑问句用原来的疑问词。", "D. 祈使句变成 to do 结构。", "E. 所有句型都用 that 连接。"], "answer": ["A", "B", "C", "D"], "explain": "只有 E 错。<b>四种句型对应四种连接方式<\/b>，不能一律用 that。这是间接引语判断流程的第二步。"}, {"id": 5, "type": "multi", "point": "引述动词的搭配（想一想·刁钻）", "stem": "下列句子<b>正确<\/b>的有（　）【多选】", "options": ["A. He explained the question to me.", "B. He explained me the question.", "C. He told me the answer.", "D. He said to me that he was busy.", "E. He warned me not to go there."], "answer": ["A", "C", "D", "E"], "explain": "只有 B 错：<b>explain 不能直接跟人<\/b>，要说 explain sth <b>to<\/b> sb。这和 say 的规则一样。只有 tell 才能直接跟人（tell sb sth）。"}, {"id": 6, "type": "choice", "point": "祈使句转述", "stem": "“Don’t be late,” the teacher said to us. → The teacher told us ______ late.", "options": ["A. not to be", "B. to not be", "C. don’t be", "D. not be"], "answer": "A", "explain": "否定祈使句转述成 <b>not to do<\/b>，<b>not 放在 to 的前面<\/b>。原句的 be 是动词原形，转述后变成 to be。"}, {"id": 7, "type": "choice", "point": "特殊疑问句转述", "stem": "She asked me, “What are you doing?” → She asked me what ______.", "options": ["A. am I doing", "B. was I doing", "C. I was doing", "D. I am doing"], "answer": "C", "explain": "两处都要改：<b>语序改回陈述<\/b>（I was，不是 was I），<b>时态退一格<\/b>（am doing → was doing）。人称 you 也要改成 I。"}, {"id": 8, "type": "choice", "point": "一般疑问句转述", "stem": "“Do you like music?” he asked. → He asked ______ liked music.", "options": ["A. if I", "B. that I", "C. what I", "D. do I"], "answer": "A", "explain": "这是<b>一般疑问句<\/b>（Yes/No 问题），转述要用 <b>if / whether<\/b> 引导。助动词 Do 消失，时态信息转移到 liked 上。"}, {"id": 9, "type": "fill", "point": "一般疑问句连接词", "stem": "填空：He asked me ______ I could help him.（填一个词，表示“是否”）", "answer": ["if", "whether"], "explain": "转述一般疑问句用 <b>if<\/b> 或 <b>whether<\/b>（是否），两个都对。注意后面要用陈述语序 I could，不能写成 could I。"}, {"id": 10, "type": "fill", "point": "祈使句转述", "stem": "转换：He said to me, “Close the window.” → He told me ______ close the window.（填一个词）", "answer": ["to"], "explain": "祈使句转述成<b>不定式<\/b>：tell sb <b>to<\/b> do sth。动词原形 close 前面要加 to。"}, {"id": 11, "type": "judge", "point": "转述后的语序", "stem": "He asked where did I live. 这句话是正确的，因为原句是疑问句。", "answer": "错", "explain": "错。转述以后它已经<b>不是独立的疑问句<\/b>，而是句子的一个成分（宾语从句），必须用<b>陈述语序<\/b>：He asked where <b>I lived<\/b>. 助动词 did 消失，时态信息转移到 lived 上。"}, {"id": 12, "type": "judge", "point": "not 的位置", "stem": "否定祈使句转述成间接引语时，not 要放在 to 的前面，写成 not to do。", "answer": "对", "explain": "对。“Don’t open it.” → He told me <b>not to open<\/b> it. ✓ 而 “to not open” ✗ 是错的。这是不定式否定的固定位置，也是这个考点最容易失分的地方。"}]}, {"id": "e-c6-s4", "title": "第四节 Lesson 139-144：时态综合复习 · 被动语态入门", "notes": [{"point": "第一册六大时态总表", "explain": "新概念第一册出现的六个时态，每个都有自己的“形状”和“标志词”。把它们放在一张表里对照，时态题就变成了查表题。", "examples": [{"tag": "基础", "text": "<b>一般现在时<\/b>：do/does（every day）／ <b>现在进行时<\/b>：am/is/are doing（now, Look!）／ <b>一般过去时<\/b>：did（yesterday, ago）／ <b>过去进行时<\/b>：was/were doing（at 8 last night）"}, {"tag": "进阶", "text": "<b>现在完成时<\/b>：have/has done（already, just, yet, ever, never, since, for）／ <b>一般将来时<\/b>：will do / be going to do（tomorrow, next week, soon）。六个时态各有专属标志词，几乎不重叠。"}, {"tag": "易错", "text": "最容易混的是<b>现在完成时和一般过去时<\/b>：有<b>确切过去时间<\/b>（yesterday、last week、…ago）只能用过去时；只有<b>模糊时间<\/b>（already、just、ever）才用完成时。这条规则能解决大半的时态选择题。"}], "think": "六个时态里，只有现在完成时“横跨”过去和现在两个时间段 —— 这是不是它最难掌握的原因？"}, {"point": "时态判断的五步流程", "explain": "遇到时态题，按这个顺序找线索，正确率最高：① 找<b>时间状语<\/b>；② 找 <b>Look! / Listen!<\/b>；③ 看<b>从句规则<\/b>（主将从现、时态呼应）；④ 看<b>上下文其他动词<\/b>的时态；⑤ 看<b>动词本身<\/b>（状态动词不用进行时）。", "examples": [{"tag": "基础", "text": "He ______ (go) to school every day. → every day → <b>一般现在时<\/b> → goes"}, {"tag": "进阶", "text": "两个线索冲突时以<b>更具体的<\/b>为准：I <b>came<\/b> here in 2016 and <b>have lived<\/b> here since then.（前半句配 in 2016，后半句配 since then，各管各的）"}, {"tag": "易错", "text": "没有任何时间状语时，靠<b>上下文<\/b>判断：“He opened the door. A man ______ (stand) outside.” 前句是过去时，后句也应该是过去（was standing）。别因为找不到标志词就随便填现在时。"}], "think": "如果一句话里既没有时间状语，也没有上下文，你还能判断时态吗？这说明时态信息在英语里到底靠什么承载？"}, {"point": "被动语态入门：be + 过去分词", "explain": "<b>主动语态<\/b>说“谁做了什么”，<b>被动语态<\/b>说“什么被做了”。结构是 <b>be + 过去分词<\/b>，be 的时态决定整句的时态。执行者用 <b>by<\/b> 引出（常常省略）。", "examples": [{"tag": "基础", "text": "主动：Tom <b>broke<\/b> the window. → 被动：The window <b>was broken<\/b> (by Tom).（宾语提到句首当主语，动词变成 be + 过去分词）"}, {"tag": "进阶", "text": "各时态的被动：一般现在 <b>is/are done<\/b>（English is spoken here.）／ 一般过去 <b>was/were done<\/b>／ 将来 <b>will be done<\/b>／ 完成时 <b>have/has been done<\/b>。变的永远只有 be，过去分词不动。"}, {"tag": "易错", "text": "被动语态<b>必须用过去分词<\/b>：“The window was <u>break<\/u>.” ✗ / “was <u>broke<\/u>” ✗ → was <b>broken<\/b> ✓。这和完成时的要求一样——凡是跟在 be 或 have 后面的，都是过去分词。"}], "think": "“窗户被打破了”这句话里，说话人为什么不提是谁打破的？被动语态在什么场合特别有用？"}, {"point": "主动变被动的三步", "explain": "① 把<b>宾语<\/b>提到句首当主语；② 动词改成 <b>be + 过去分词<\/b>，<b>be 的时态和人称跟着新主语<\/b>；③ 原主语用 <b>by<\/b> 引出（可省略）。", "examples": [{"tag": "基础", "text": "They <b>clean<\/b> the room every day. → The room <b>is cleaned<\/b> every day. ／ They <b>cleaned<\/b> the room. → The room <b>was cleaned<\/b>."}, {"tag": "进阶", "text": "注意 be 要和<b>新主语<\/b>保持一致：They clean the <b>rooms<\/b>. → The <b>rooms are<\/b> cleaned.（新主语是复数，be 用 are）。别沿用原句的单复数。"}, {"tag": "易错", "text": "含情态动词的被动是 <b>情态动词 + be + 过去分词<\/b>：You must clean the room. → The room <b>must be cleaned<\/b>. ✓（不是 must is cleaned）。因为情态动词后面永远跟原形，be 就是原形。"}], "think": "主动变被动时，句子里的信息一个都没少，只是重新排列了 —— 那英语为什么要保留两种说法？各自适合什么场合？"}, {"point": "全册最容易混的五组词", "explain": "把整本书最容易搞混的成对概念集中清点一遍，这几
