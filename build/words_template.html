<script>
const DATA = /*__DATA__*/;

/* ========== 基础 ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const PROG_KEY = 'mathquiz_words_prog_v1';
function getProg() { try { return JSON.parse(localStorage.getItem(PROG_KEY) || '{}'); } catch (e) { return {}; } }
function setProg(sid, mode, done, total, score) {
  const p = getProg(); p[sid] = p[sid] || {};
  p[sid][mode] = Math.max((p[sid][mode] || 0), done);
  p[sid][mode + '_n'] = total;
  if (score != null) p[sid][mode + '_s'] = Math.max((p[sid][mode + '_s'] || 0), score);
  try { localStorage.setItem(PROG_KEY, JSON.stringify(p)); } catch (e) {}
}
function secDone(sid, mode) { const p = getProg()[sid] || {}; return p[mode] || 0; }
function secScore(sid, mode) { const p = getProg()[sid] || {}; return p[mode + '_s'] || 0; }
/* ⭐ 续做定位：做一半退出，回来要接着做。
   不做这件事会出两个问题：① 孩子每次回来都从第 1 个重做
   ② 进度存档是「只增不减」(Math.max)，重做前面几个不会让进度前进，看起来像卡死。 */
function modeResume(sid, mode, n) {
  const d = Math.min(secDone(sid, mode), n);
  return d >= n ? 0 : d;                 /* 已经全做完 → 开新的一轮 */
}

/* 错题本：与其他科目共用，subject 用 engword */
/* 写进错题本。⭐ 必须记下孩子当时实际写了什么——只写「未过」的话，
   复习时他看不到自己错在哪，等于白记一笔。 */
const MODE_LABEL = { card: '记忆卡拼写', recall: '背诵', make: '造句' };
function addWrong(word, sec, unit, mode, userAnswer) {
  const KEY = 'mathquiz_wrongbook_v1';
  let book = []; try { book = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
  const now = new Date().toISOString();
  const key = 'engword|' + word.w + '|' + word.zh;      /* 一个词一条，三种练法都错就累计次数 */
  /* 同一个词在三种练法里都可能错。合并成一条（一个词一条，复习时不用翻三遍），
     但要把每种练法各自写错的内容都留下——只留最后一次的话，
     孩子看不到自己在拼写上也栽过跟头。 */
  const label = MODE_LABEL[mode] || '练习';
  const said = String(userAnswer || '').trim() || '（空）';
  const render = at => Object.keys(at).map(k => MODE_LABEL[k] + '写成「' + at[k] + '」').join('　｜　');
  const ex = book.find(b => b.key === key);
  if (ex) {
    ex.wrongCount += 1; ex.lastWrongAt = now;
    ex.attempts = ex.attempts || {}; ex.attempts[mode] = said;
    ex.userAnswer = render(ex.attempts);
  }
  else book.push({ key, subject: 'engword', chapterTitle: unit.title, sectionTitle: sec.title,
    point: word.w, stem: word.pos + ' ' + word.zh,
    attempts: { [mode]: said }, userAnswer: label + '写成「' + said + '」',
    correctAnswer: word.w + '　' + word.ipa, explain: '例句：' + word.egs[0],
    wrongCount: 1, firstWrongAt: now, lastWrongAt: now });
  try { localStorage.setItem(KEY, JSON.stringify(book)); } catch (e) {}
}

/* 发音（浏览器 TTS，没有就静默） */
function speak(t) {
  try { const u = new SpeechSynthesisUtterance(String(t)); u.lang = 'en-US'; u.rate = .9;
    speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}

/* 语法引擎要用的词表（判「you book」这类错误）——从本册数据展平 */
const GRAMMAR_WORDS = (() => {
  const a = [];
  try { DATA.units.forEach(u => u.sections.forEach(x => x.words.forEach(w => a.push({ w: w.w, pos: w.pos })))); }
  catch (e) {}
  return a;
})();
/*__GRAMMAR_EN__*/

/* ========== AI 第二层：语义与地道度检查（智谱，可选） ==========
   规则层已经覆盖语法（免费、即时、不会乱判）。AI 只补规则做不到的那部分：
   句子意思通不通、词搭配对不对、有没有更地道的说法。
   ⚠️ 没设 Key 就完全跳过——规则层的结论照样有效，不影响使用。
   ⚠️ Key 只存在这台设备的 localStorage，不进代码、不进仓库、不发去别处（除了智谱本身）。 */
const AI_KEY_LS = 'mathquiz_zhipu_key';
const AI_MODEL_LS = 'mathquiz_zhipu_model';
const AI_ENDPOINT = 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
function aiGetKey() { try { return localStorage.getItem(AI_KEY_LS) || ''; } catch (e) { return ''; } }
function aiSetKey(k) {
  try { if (k && k.trim()) localStorage.setItem(AI_KEY_LS, k.trim()); else localStorage.removeItem(AI_KEY_LS); } catch (e) {}
}
function aiGetModel() { try { return localStorage.getItem(AI_MODEL_LS) || 'glm-4.7-flash'; } catch (e) { return 'glm-4.7-flash'; } }
function aiSetModel(m) { try { localStorage.setItem(AI_MODEL_LS, m); } catch (e) {} }

async function aiCheckSentence(word, sentence) {
  const key = aiGetKey();
  if (!key) return null;                       /* 没 Key → 静默跳过 */
  const prompt =
    '你是亲切的小学英语老师。一个中国孩子用指定单词造了一个句子。语法已经由程序检查过了，' +
    '你要做两件事：\n\n' +
    '【一】判断这句话**意思通不通、搭配对不对**\n' +
    '  · 意思荒谬算不通（如 "I eat a book every day."）；搭配错算错（如 open the light 应为 turn on the light）。\n' +
    '  · ⚠️ 语序/副词位置只要可接受、用词是否「最自然」、风格、大小写标点、句子简单幼稚——一律判 ok:true。\n' +
    '  · ⚠️ 拿不准或只是「可以更好」时一律 ok:true。把孩子本来对的句子判成错，' +
    '会让他把对的当错的记住，比漏掉一个错更糟。\n' +
    '  · 若真的不通，fix 给**改好的完整句子**（尽量保留孩子原来想表达的意思，只改错的地方）。\n\n' +
    '【二】⭐ 最重要：**同样这个意思、同样这个场合，英语母语者平常会怎么说**\n' +
    '  · 请**照着孩子这一句的意思去改写**，不要另起炉灶讲别的事。\n' +
    '  · 必须仍然用上这个单词，长度和难度和孩子那句差不多（小学程度，别用生僻词）。\n' +
    '  · 写进 better，中文翻译写进 betterZh。\n' +
    '  · 再用一句简体中文说清楚**差在哪里**（哪个词换了／语序变了／换了个更常用的搭配），写进 diff，' +
    '30 字内，说人话。如果孩子那句已经很地道，diff 就写「你这句已经很地道了」。\n\n' +
    '只输出 JSON：{"ok":true或false,"tip":"一句简体中文说明，30字内","fix":"若不通，给改好的完整句子；通顺则留空",' +
    '"better":"母语者在同样场合会说的一句（仍用这个单词）","betterZh":"better 的中文翻译","diff":"差在哪里，30字内"}\n\n' +
    '指定单词：' + word + '\n孩子的句子：' + sentence;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);   /* 12 秒还没回就放弃，别让孩子干等 */
  try {
    const resp = await fetch(AI_ENDPOINT, {
      method: 'POST', signal: ctrl.signal,
      headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: aiGetModel(), temperature: 0.2, max_tokens: 400,
                             response_format: { type: 'json_object' },
                             messages: [{ role: 'user', content: prompt }] })
    });
    clearTimeout(timer);
    if (resp.status === 401) return { error: 'Key 无效或已过期，请在设置里重新填写' };
    if (!resp.ok) return { error: '智谱返回 ' + resp.status + '，这次跳过 AI 检查' };
    const j = await resp.json();
    let t = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
    t = t.replace(/^```json\s*|^```\s*|```$/gm, '').trim();
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a >= 0 && b > a) t = t.slice(a, b + 1);
    const r = JSON.parse(t);
    if (typeof r.ok !== 'boolean') return { error: 'AI 返回格式不对，这次跳过' };
    /* ⭐ 安全网：AI 给的句子（改好的 fix、母语者说法 better）先过我自己的语法检查器。
       AI 会犯错，孩子看不出来——与其让他学到一句错的，不如这次不显示。
       规则层是确定性的、测过的，用它给 AI 的输出把关，比信任 AI 可靠。 */
    const clean = v => {
      const t2 = String(v || '').trim();
      if (!t2) return '';
      /* 三层挡：① 程序清洗——语法检查器过一遍，有错就丢
                 ② 聚焦二次核对——必须仍然用上这个单词，跑题的建议对这一关没用
                 ③ 程序化保底——见下面 makeCheck：判分一律以规则层为准，不让孩子裁决 AI */
      if (checkGrammar(t2).filter(x => x.level === 'error').length) return '';
      if (!hasWord(t2, word)) return '';
      if (collocHits(t2).length || senseHits(t2).length) return '';   /* AI 自己说了句中式英语／说不通的话 */
      return t2;
    };
    const fixOk = clean(r.fix), betterOk = clean(r.better);
    const dropped = (r.fix && !fixOk) || (r.better && !betterOk);
    return { ok: r.ok, tip: String(r.tip || ''), fix: fixOk,
             better: betterOk, betterZh: betterOk ? String(r.betterZh || '') : '',
             diff: betterOk ? String(r.diff || '') : '', dropped: dropped };
  } catch (e) {
    clearTimeout(timer);
    return { error: e.name === 'AbortError' ? 'AI 检查超时了，这次跳过' : '连不上智谱，这次跳过' };
  }
}

/* 家长设置面板：填 Key / 换模型 / 清除 */
function openSettings() {
  const has = !!aiGetKey();
  $('#view').innerHTML =
    '<div class="stage"><div style="font-size:17px;font-weight:600;margin-bottom:6px">⚙️ 家长设置 · AI 检查</div>' +
    '<div class="hint-box">造句这一关<b>本来就会自己判分</b>（免费、不需要联网设置），而且是三层：' +
    '<b>①语法 ②意思说不通（吃书、喝桌子这类查表能确定的）③中式说法</b>（23 条搭配表，还会直接改好整句）。<br>' +
    '这三层<b>凡是能百分之百确定的，一律不调 AI</b>——结论来自测过的规则，比概率模型可靠。<br>' +
    '这里填的 AI 只补最后一小块：三层都没话说时，看一眼<b>意思通不通、有没有更地道的说法</b>' +
    '（例如「I fly this excuse to school.」这种语法对、搭配表里也没有的怪句）。<br>' +
    '<b>不填照样能用</b>，只是那一小块查不出来。</div>' +
    '<div style="margin:14px 0 6px;font-weight:600;font-size:14px">智谱 API Key' +
      (has ? '　<span style="color:#3e8e5a;font-size:13px">（已设置 ✓）</span>' : '') + '</div>' +
    '<input class="inp" id="aiKeyIn" type="password" autocomplete="off" placeholder="' +
      (has ? '已设置，留空则保持不变' : '粘贴智谱开放平台的 API Key') + '">' +
    '<div style="margin:14px 0 6px;font-weight:600;font-size:14px">模型</div>' +
    '<div style="font-size:13px;color:#8a7fa8;margin-bottom:6px">' +
    'glm-4.7-flash 是智谱目前免费的主力模型（30B），第一册这种小学程度的句子够用。' +
    '想更稳可以换成按量计费的 glm-4-plus。<br>' +
    '⚠️ 不管用哪个，<b>AI 给的示范句都会先过一遍本地语法检查</b>，没通过就不显示给孩子。</div>' +
    '<select class="inp" id="aiModelIn">' +
      '<option value="glm-4.7-flash">glm-4.7-flash（免费 · 30B · 推荐）</option>' +
      '<option value="glm-4-flash-250414">glm-4-flash-250414（免费 · 更轻）</option>' +
      '<option value="glm-4-plus">glm-4-plus（按量计费 · 最准）</option></select>' +
    '<div class="hint-box" style="margin-top:14px">🔒 Key 只存在<b>这台设备的浏览器里</b>，' +
    '不会进代码、不会上传到 GitHub，只会发给智谱本身。换设备要重新填。<br>' +
    '⚠️ 同一台设备上任何人都能在设置里看到它，孩子的设备请用<b>额度有限的 Key</b>。</div>' +
    '<button class="btn btn-main" onclick="saveSettings()">保存</button>' +
    (has ? '<button class="btn btn-ghost" onclick="clearKey()">清除 Key</button>' : '') +
    '<button class="btn btn-ghost" onclick="renderHome()">返回</button>' +
    '<div id="setFb"></div></div>';
  const sel = $('#aiModelIn'); if (sel) sel.value = aiGetModel();
}
function saveSettings() {
  const k = ($('#aiKeyIn') || {}).value || '';
  if (k.trim()) aiSetKey(k);
  aiSetModel(($('#aiModelIn') || {}).value || 'glm-4.7-flash');
  $('#setFb').innerHTML = '<div class="fb ok">已保存。造句时会在语法检查之后再做一次 AI 检查。</div>';
}
function clearKey() { aiSetKey(''); openSettings(); }

function collocHtml(s) {
  const hits = collocHits(s);
  if (!hits.length) return '';
  return '<div class="fb tip" style="margin-top:10px">🌟 <b>这句里有中式英语的说法</b>' +
    hits.map(h => '<div style="margin-top:8px;font-size:14px">' +
      '<span style="color:#c0392b">✗ 你写的「' + esc(hitText(h, s)) + '」</span>　→　' +
      '<b style="color:#3e8e5a">✓ ' + esc(h.good) + '</b>' +
      ' <button class="btn-mini" onclick="speak(' + JSON.stringify(h.good.split(' / ')[0]) + ')">🔊</button>' +
      '<div style="color:#8a7fa8;font-size:13px;margin-top:3px">' + esc(h.zh) + '</div></div>').join('') +
    '</div>';
}
/* 从这个词的课本例句里挑一句和孩子那句最接近的：课本例句是母语者写的、
   而且建置时全部过了检查器，所以「没有 AI Key 也一定有一句地道的可给」。 */
const EG_STOP = new Set(['a','an','the','is','are','am','was','were','i','you','he','she','it','we','they',
  'my','your','his','her','its','our','their','me','him','them','to','of','in','on','at','and','or','but',
  'this','that','these','those','do','does','did','not','very','with','for','have','has','had']);
function closestEg(w, s) {
  const toks = t => new Set(String(t).toLowerCase().match(/[a-z']+/g) || []);
  const mine = toks(s); mine.delete(String(w.w).toLowerCase());
  let best = w.egs[0], score = -1;
  w.egs.forEach(e => {
    let n = 0;
    toks(e).forEach(t => { if (t !== String(w.w).toLowerCase() && !EG_STOP.has(t) && mine.has(t)) n++; });
    if (n > score) { score = n; best = e; }
  });
  return best;
}
function bookEgHtml(w, s) {
  const e = closestEg(w, s);
  return '<div class="fb tip" style="margin-top:10px">📗 <b>同样用「' + esc(w.w) + '」，母语者会这样说</b>' +
    '<div class="eg" style="margin-top:6px;background:#fff">' + esc(e) +
      ' <button class="btn-mini" onclick="speak(' + JSON.stringify(e) + ')">🔊</button></div>' +
    '<div style="margin-top:6px;font-size:13px;color:#8a7fa8">这是课本里的原句，照着它的句型换成你自己的事，就是地道的说法。</div></div>';
}
/* 造句写错时给的一整套地道说法（不需要 AI，一定给得出） */
function nativeSuggest(w, s) { const nb = nativeBlock(w); return collocHtml(s) + (nb || bookEgHtml(w, s)); }
/* AI 给的「照着孩子那句改写成母语者的说法」——写对写错都会给 */
function betterHtml(r) {
  if (!r || !r.better) return '';
  return '<div style="margin-top:10px;font-size:14px">🌟 <b>同样的意思，欧美人平常会这样说</b>' +
    '<div class="eg" style="margin-top:6px;background:#fff">' + esc(r.better) +
      ' <button class="btn-mini" onclick="speak(' + JSON.stringify(r.better) + ')">🔊</button>' +
      (r.betterZh ? '<br><span style="color:#8a7fa8;font-size:13px">' + esc(r.betterZh) + '</span>' : '') +
    '</div>' + (r.diff ? '<div style="margin-top:6px;font-size:13.5px">💡 差在哪：' + esc(r.diff) + '</div>' : '') +
    '</div>';
}

/* 「欧美人常这样说」——孩子造完句之后给他看地道说法。
   规则层判语法、这一块给用法：同一个词，母语者习惯用哪个句型、搭配什么词。
   有 AI Key 时还会针对孩子那一句再给一条量身的。 */
function nativeBlock(w) {
  const n = w.native; if (!n) return '';
  return '<div class="fb tip" style="margin-top:10px">🌟 <b>欧美人常这样用「' + esc(w.w) + '」</b>' +
    '<div style="margin-top:6px;font-size:14px">常用句型：<b>' + esc(n.pat) + '</b></div>' +
    '<div class="eg" style="margin-top:6px;background:#fff">' + esc(n.eg) +
      ' <button class="btn-mini" onclick="speak(' + JSON.stringify(n.eg) + ')">🔊</button>' +
      '<br><span style="color:#8a7fa8;font-size:13px">' + esc(n.zh) + '</span></div>' +
    (n.note ? '<div style="margin-top:6px;font-size:13.5px">💡 ' + esc(n.note) + '</div>' : '') +
    '</div>';
}
function spellDiff(user, right) {
  const a = String(user || '').toLowerCase(), b = String(right || '').toLowerCase();
  if (!a) return '<span style="color:#3e8e5a">' + esc(right) + '</span>';
  const m = a.length, n = b.length, d = [];
  for (let i = 0; i <= m; i++) { d.push(new Array(n + 1).fill(0)); d[i][0] = i; }
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = a[i-1] === b[j-1] ? d[i-1][j-1] : 1 + Math.min(d[i-1][j-1], d[i-1][j], d[i][j-1]);
  let i = m, j = n, out = [];
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && a[i-1] === b[j-1]) { out.unshift(esc(right[j-1])); i--; j--; }
    else if (i > 0 && j > 0 && d[i][j] === d[i-1][j-1] + 1) {
      out.unshift('<span style="color:#c0392b;font-weight:700">' + esc(right[j-1]) + '</span>'); i--; j--; }
    else if (j > 0 && d[i][j] === d[i][j-1] + 1) {
      out.unshift('<span style="color:#3e8e5a;font-weight:700;text-decoration:underline">' + esc(right[j-1]) + '</span>'); j--; }
    else { out.unshift('<span style="color:#c0392b;text-decoration:line-through">' + esc(a[i-1]) + '</span>'); i--; }
  }
  return out.join('');
}
/* ========== 路由 ========== */
let cur = { unit: null, sec: null, mode: null };
function goBack() {
  if (cur.mode) { cur.mode = null; renderSec(); }
  else if (cur.sec) { cur.sec = null; renderUnit(); }
  else if (cur.unit) { cur.unit = null; renderHome(); }
}
function setHead(t, s, showBack) {
  $('#hTitle').textContent = t; $('#hSub').textContent = s;
  $('#backBtn').style.display = showBack ? 'inline-block' : 'none';
  /* 首页显示「回科目选择」，进到里层换成「← 返回」——两个返回并排孩子会搞不清点哪个 */
  const hl = $('#homeLink'); if (hl) hl.style.display = showBack ? 'none' : 'inline-block';
}

function renderHome() {
  cur = { unit: null, sec: null, mode: null };
  setHead('新概念英语第一册 · 单词', '按课次分单元 · 记忆、背诵、造句三步走', false);
  $('#view').innerHTML = '<div class="card-list">' + DATA.units.map((u, i) => {
    const nw = u.sections.reduce((a, s) => a + s.words.length, 0);

}
function openUnit(i) { cur.unit = DATA.units[i]; renderUnit(); }
function renderUnit() {

function openSec(i) { cur.sec = cur.unit.sections[i]; renderSec(); }
function renderSec() {

function modeCard(mode, title, desc, total) {
  const d = Math.min(secDone(cur.sec.id, mode), total);
  return '<button class="big-card" onclick="openMode(\'' + mode + '\')">' +
    '<span><span class="big-card-title">' + title + '</span>' +
    '<span class="big-card-desc">' + desc + '</span></span>' +
    '<span class="prog">' + d + '/' + total + '</span></button>';
}
/* 「再来一轮」：全做完之后想重练，从头开始（进度存档保持不变，不会倒退） */
function restartMode(m) { openMode(m); }
function openMode(m) {
  cur.mode = m;
  if (m === 'card') startCard();
  else if (m === 'recall') startRecall();
  else startMake();
}

/* ========== ① 记忆卡：正面英文 → 翻面默写 ========== */
let cd = { i: 0, flipped: false, ok: 0 };
function startCard() {
  const st = modeResume(cur.sec.id, 'card', cur.sec.words.length);
  cd = { i: st, flipped: false, ok: st ? Math.min(secScore(cur.sec.id, 'card'), st) : 0 };
  setHead('🃏 记忆卡 · ' + cur.sec.title, '正面记住样子，翻面凭记忆拼出来', true);
  cardRender();
}
function cardRender() {
  const ws = cur.sec.words;
  if (cd.i >= ws.length) {
    setProg(cur.sec.id, 'card', ws.length, ws.length, cd.ok);
    $('#view').innerHTML = '<div class="stage done-big"><div class="done-emoji">' + (cd.ok === ws.length ? '🏆' : '🃏') +
      '</div><div style="font-size:17px;margin-top:8px">这一节 ' + ws.length + ' 个单词过完了，拼对 ' + cd.ok + ' 个</div>' +
      '<div style="margin-top:14px"><button class="btn btn-main" onclick="restartMode(\'card\')">再来一轮</button>' +
      '<button class="btn btn-ghost" onclick="openMode(\'recall\')">去背诵 →</button></div></div>';
    return;
  }
  const w = ws[cd.i];
  if (!cd.flipped) {
    $('#view').innerHTML = '<div class="stage">' + pills(cd.i, ws.length) +
      '<div class="counter">第 ' + (cd.i + 1) + ' / ' + ws.length + ' 个</div>' +
      '<div class="word-big">' + esc(w.w) + ' <button class="btn-mini" onclick="speak(' + JSON.stringify(w.w) + ')">🔊</button></div>' +
      '<div class="ipa">' + esc(w.ipa) + '</div>' +
      '<div class="hint-box">先记住它的样子和读音，翻面要凭记忆把它拼出来。</div>' +
      '<button class="btn btn-main" onclick="cardFlip()">记住了，翻面 →</button></div>';
  } else {
    $('#view').innerHTML = '<div class="stage">' + pills(cd.i, ws.length) +
      '<div class="counter">第 ' + (cd.i + 1) + ' / ' + ws.length + ' 个</div>' +
      '<div class="pos-line">' + esc(w.pos) + '</div>' +
      '<div class="zh-big">' + esc(w.zh) + '</div>' +
      '<div class="eg">' + esc(maskWord(w.egs[0], w.w)) + '</div>' +
      '<div style="margin-top:12px"><input class="inp" id="cdIn" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="把这个单词拼出来"></div>' +
      '<button class="btn btn-main" onclick="cardCheck()">检查</button>' +
      '<div id="cdFb"></div></div>';
    const el = $('#cdIn'); if (el) { el.focus(); el.onkeydown = e => { if (e.key === 'Enter') cardCheck(); }; }
  }
}
function maskWord(sent, w) {
  const re = new RegExp('\\b' + String(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'ig');
  return String(sent).replace(re, '____');
}
function cardFlip() { cd.flipped = true; cardRender(); }
function cardCheck() {
  const w = cur.sec.words[cd.i], v = ($('#cdIn') || {}).value || '';
  const ok = normalize(v) === normalize(w.w);
  if (ok) cd.ok++; else addWrong(w, cur.sec, cur.unit, 'card', v);
  $('#cdFb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'bad') + '">' +
    (ok ? '🎉 拼对了！<br><span style="font-size:13.5px">' + esc(w.egs[0]) + '</span>'
        : '💪 正确拼写是 <b>' + esc(w.w) + '</b> ' + esc(w.ipa) +
          '<br>你写的是「' + esc(v || '（空）') + '」' +
          '<div class="eg" style="margin-top:6px;background:#fff">差在这里：' + spellDiff(v, w.w) +
          '<br><span style="font-size:12.5px;color:#8a7fa8">' +
          '<span style="color:#3e8e5a;text-decoration:underline">绿色下划线</span>＝你漏掉的字母，' +
          '<span style="color:#c0392b">红色</span>＝写错或多写的</span></div>' +
          '<span style="font-size:13.5px">看一遍例句再记：' + esc(w.egs[0]) + '</span>' +
          '<br><span style="font-size:12.5px;color:#8a7fa8">这个词已经放进错题本，等下可以再练一次。</span>') +
    '</div><button class="btn btn-main" onclick="cardNext()">下一个 →</button>';
  setProg(cur.sec.id, 'card', cd.i + 1, cur.sec.words.length, cd.ok);
}
function cardNext() { cd.i++; cd.flipped = false; cardRender(); }
function pills(i, n) {
  let h = '<div class="pills">';
  for (let k = 0; k < n; k++) h += '<span class="pill ' + (k === i ? 'now' : (k < i ? 'ok' : '')) + '"></span>';
  return h + '</div>';
}

/* ========== ② 背诵：只看中文写英文 ==========
   ⚠️ 页首不能出现英文：节标题「Lesson 1-2　Excuse me!」里的课名本身就是答案
   （背 excuse 时抬头就看到 Excuse me），所以这一关只用「Lesson X-Y」这段。 */
function shortTitle(t) { return String(t).split('\u3000')[0].trim(); }

let rc = { i: 0, ok: 0 };
function startRecall() {
  const st = modeResume(cur.sec.id, 'recall', cur.sec.words.length);
  rc = { i: st, ok: st ? Math.min(secScore(cur.sec.id, 'recall'), st) : 0 };
  setHead('🧠 背诵 · ' + shortTitle(cur.sec.title), '只看中文，把英文写出来', true);
  recallRender();
}
function recallRender() {
  const ws = cur.sec.words;
  if (rc.i >= ws.length) {
    setProg(cur.sec.id, 'recall', ws.length, ws.length, rc.ok);
    $('#view').innerHTML = '<div class="stage done-big"><div class="done-emoji">' + (rc.ok === ws.length ? '🏆' : '🧠') +
      '</div><div style="font-size:17px;margin-top:8px">背完 ' + ws.length + ' 个，写对 ' + rc.ok + ' 个</div>' +
      '<div style="margin-top:14px"><button class="btn btn-main" onclick="restartMode(\'recall\')">再来一轮</button>' +

  $('#view').innerHTML = '<div class="stage">' + pills(rc.i, ws.length) +

    '<div class="pos-line">' + esc(w.pos) + '</div>' +
    '<div class="zh-big">' + esc(maskWord(w.zh, w.w)) + '</div>' +
    '<div style="margin-top:14px"><input class="inp" id="rcIn" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="写出对应的英文单词"></div>' +
    '<button class="btn btn-main" onclick="recallCheck()">检查</button>' +
    '<button class="btn btn-ghost" onclick="recallHint()">给点提示</button>' +
    '<div id="rcFb"></div></div>';
  const el = $('#rcIn'); if (el) { el.focus(); el.onkeydown = e => { if (e.key === 'Enter') recallCheck(); }; }
}
function recallHint() {
  const w = cur.sec.words[rc.i];
  const head = w.w.slice(0, Math.max(1, Math.ceil(w.w.length / 3)));
  $('#rcFb').innerHTML = '<div class="fb tip">💡 开头是 <b>' + esc(head) + '</b>…，一共 ' + w.w.replace(/\s/g, '').length +
    ' 个字母<br>例句：' + esc(maskWord(w.egs[0], w.w)) + '</div>';
}
function recallCheck() {
  const w = cur.sec.words[rc.i], v = ($('#rcIn') || {}).value || '';
  const ok = normalize(v) === normalize(w.w);
  if (ok) rc.ok++; else addWrong(w, cur.sec, cur.unit, 'recall', v);
  $('#rcFb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'bad') + '">' +
    (ok ? '🎉 写对了！<br><span style="font-size:13.5px">' + esc(w.egs[0]) + '</span>'
        : '💪 应该是 <b>' + esc(w.w) + '</b> ' + esc(w.ipa) + '<br>你写的是「' + esc(v || '（空）') + '」' +
          '<div class="eg" style="margin-top:6px;background:#fff">差在这里：' + spellDiff(v, w.w) +
          '<br><span style="font-size:12.5px;color:#8a7fa8">' +
          '<span style="color:#3e8e5a;text-decoration:underline">绿色下划线</span>＝你漏掉的字母，' +
          '<span style="color:#c0392b">红色</span>＝写错或多写的</span></div>' +
          '<span style="font-size:13.5px">看一遍例句再记：' + esc(w.egs[0]) + '</span>') +
    '</div><button class="btn btn-main" onclick="recallNext()">下一个 →</button>';
  setProg(cur.sec.id, 'recall', rc.i + 1, cur.sec.words.length, rc.ok);
}
function recallNext() { rc.i++; recallRender(); }

/* ========== ③ 造句：先看 3 例句，再自己造 3 句 ========== */
let mk = { i: 0, j: 0, sents: [], ok: 0 };
function startMake() {
  const total = cur.sec.words.length * MK_PER_WORD;
  const st = modeResume(cur.sec.id, 'make', total);
  mk = { i: Math.floor(st / MK_PER_WORD), j: st % MK_PER_WORD, sents: [],
         ok: st ? Math.min(secScore(cur.sec.id, 'make'), st) : 0 };
  setHead('🖊️ 造句 · ' + cur.sec.title, '每个词造 3 句不一样的话，每句至少 5 个单词', true);
  makeRender();
}
function makeRender() {
  const ws = cur.sec.words, total = ws.length * MK_PER_WORD;
  if (mk.i >= ws.length) {
    setProg(cur.sec.id, 'make', total, total, mk.ok);
    $('#view').innerHTML = '<div class="stage done-big"><div class="done-emoji">' + (mk.ok === total ? '🏆' : '🖊️') +
      '</div><div style="font-size:17px;margin-top:8px">' + ws.length + ' 个词、每个 3 句，一共造了 ' + mk.ok + ' / ' + total + ' 句</div>' +
      '<div style="margin-top:14px"><button class="btn btn-main" onclick="restartMode(\'make\')">再来一轮</button></div></div>';
    return;
  }
  const w = ws[mk.i], mine = (mk.sents[mk.i] || []).filter(Boolean);
  $('#view').innerHTML = '<div class="stage">' +
    '<div class="counter">第 ' + (mk.i + 1) + ' / ' + ws.length + ' 个词　·　第 ' + (mk.j + 1) + ' / ' + MK_PER_WORD + ' 句</div>' +
    '<div class="word-big" style="font-size:24px">' + esc(w.w) +
      ' <button class="btn-mini" onclick="speak(' + JSON.stringify(w.w) + ')">🔊</button></div>' +
    '<div class="pos-line" style="margin-top:4px">' + esc(w.pos) + '　' + esc(w.zh) + '</div>' +
    '<div style="margin-top:12px;font-weight:600;font-size:14px">📖 先看看别人怎么用</div>' +
    w.egs.map((e, k) => '<div class="eg">' + (k + 1) + '. ' + esc(e) +
      ' <button class="btn-mini" onclick="speak(' + JSON.stringify(e) + ')">🔊</button></div>').join('') +
    (mine.length ? '<div style="margin-top:12px;font-weight:600;font-size:14px">✍️ 你已经造的</div>' +
      mine.map((s, k) => '<div class="mine">' + (k + 1) + '. ' + esc(s) + '</div>').join('') : '') +
    '<div class="hint-box">✏️ 这句要<b>至少 5 个单词</b>、要用上「<b>' + esc(w.w) + '</b>」，而且<b>不能和自己前面那几句重复</b>。<br>写完按「检查」，系统会<b>直接告诉你哪里错了、要怎么改</b>。</div>' +
    '<textarea class="inp" id="mkIn" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="用这个词造第 ' + (mk.j + 1) + ' 句你自己的话…"></textarea>' +
    '<button class="btn btn-main" onclick="makeCheck()">✨ 检查我的句子</button>' +
    (mk.i + mk.j > 0 ? '<button class="btn btn-ghost" onclick="makePrev()">← 上一句</button>' : '') +
    '<div id="mkFb"></div></div>';
}
async function makeCheck() {
  const w = cur.sec.words[mk.i], s = (($('#mkIn') || {}).value || '').trim();
  const bad = h => { $('#mkFb').innerHTML = '<div class="fb bad">' + h + '</div>'; };
  if (!s) { bad('先写一句话再检查 🙂'); return; }
  const nw = wordCount(s);
  if (nw < MK_MIN_WORDS) {
    bad('句子要有<b>至少 ' + MK_MIN_WORDS + ' 个单词</b>，现在只有 ' + nw + ' 个。<br>' +
        '试试加上「什么时候」「在哪里」「和谁」，句子就长了：<br>' +
        '<span style="font-size:13px">例：I read. → I read a book <b>at home every evening</b>.</span>'); return;
  }
  if (!hasWord(s, w.w)) {
    bad('这句话里没有用上「<b>' + esc(w.w) + '</b>」，这一关就是要练这个词。<br>' +
        '<span style="font-size:13px">（复数 ' + esc(w.w) + 's、过去式、加 ing 这些变形都算数）</span>'); return;
  }
  const prev = (mk.sents[mk.i] || []).filter((x, k) => x && k !== mk.j);
  const dup = prev.find(p => tooSimilar(p, s));
  if (dup) {
    bad('这句和你前面造的「' + esc(dup) + '」太像了。<br>换个<b>角度</b>再想一句：换人（I→My brother）、换时间（今天→昨天）、换地方，或改成问句/否定句 💡'); return;
  }
  /* ========== 三道硬检查都过了 → 判分 ==========
     ⭐ 分层原则：**凡是规则能百分之百确定的，就由规则给结论，绝不调 AI。**
     ① 语法错（确定）   ② 意思说不通·吃书喝桌子这类（确定）  ③ 中式说法（确定，且知道怎么改）
     只有这三样都没话说时，才轮到 AI —— 它只负责规则做不到的那一小块（语义、地道度）。
     这样既省额度，更重要的是：孩子看到的结论，绝大多数来自测过的确定性规则，而不是概率模型。 */
  window.__mkS = s;
  const issues = checkGrammar(s);
  const errs = issues.filter(x => x.level === 'error');
  const warns = issues.filter(x => x.level === 'warn');
  const list = arr => '<ul class="chk">' + arr.map(x =>
      '<li>' + (x.level === 'error' ? '❌ ' : '💡 ') + x.why +
      '<br><span style="color:#c0392b;font-size:13.5px">→ ' + x.fix + '</span></li>').join('') + '</ul>';
  const cHits = collocHits(s);        /* 说法不地道，而且我们知道该怎么改 */
  const sHits = senseHits(s);         /* 意思说不通，而且我们确定 */
  const sure = cHits.length > 0 || sHits.length > 0;   /* 规则已经有确定结论 → 不必问 AI */
  const redoBtns =
    '<button class="btn btn-main" onclick="makeCheck()">改好了，再检查一次</button>' +
    '<button class="btn btn-ghost" onclick="makeGiveUp()">这句先跳过（记进错题本）</button>';
  /* 同一份内容两个抬头：语法本身就错的时候，不能写「语法没错，但…」，那句话会自相矛盾 */
  const senseList = sHits.length ? '<ul class="chk">' + sHits.map(x => '<li>❌ ' + x.why +
        '<br><span style="color:#c0392b;font-size:13.5px">→ ' + x.fix + '</span></li>').join('') + '</ul>' : '';
  const senseHtmlErr = sHits.length ?
    '<div class="fb bad">🤔 <b>另外，这句的意思也说不通</b>' + senseList + '</div>' : '';
  const senseHtmlOk = sHits.length ?
    '<div class="fb bad">🤔 <b>语法没错，但意思上说不通</b>' + senseList + '</div>' : '';

  /* ① 语法有错 */
  if (errs.length) {
    /* ⭐ 写错了也要当场给地道说法——不能让孩子「改对了才配看母语者怎么说」。
       顺序：错在哪 → 改好长这样 → 同样的意思欧美人怎么说。
       改好的句子＝语法自动改 + 中式说法一起换掉，一次给到位。 */
    const fixed = collocFix(autoFix(s, errs));
    const fixedOk = (fixed && normSent(fixed) !== normSent(s)) ? fixed : '';
    const errHtml =
      '<div class="fb bad">这句有 <b>' + errs.length + '</b> 个地方要改：' +
        '<div class="eg" style="margin:8px 0;background:#fff">' + esc(s) + '</div>' +
        list(errs) + (warns.length ? list(warns) : '') +
        (fixedOk ?
          '<div style="margin-top:10px;font-size:14px">✍️ <b>改好应该是这样</b>：' +
          '<div class="eg" style="margin-top:6px;background:#fff">' + esc(fixedOk) +
          ' <button class="btn-mini" onclick="speak(' + JSON.stringify(fixedOk) + ')">🔊</button></div>' +
          '<div style="margin-top:6px;font-size:13px;color:#8a7fa8">照着改一遍再按「检查」。' +
          '下面先看看同样的意思，欧美人平常会怎么说。</div></div>' : '') +
      '</div>';
    const natHtml = senseHtmlErr + nativeSuggest(w, s);
    $('#mkFb').innerHTML = errHtml + natHtml + redoBtns;
    /* 规则已经给出确定结论（中式说法／意思说不通）→ 不调 AI，省下的不是钱，是「让概率模型插嘴」的风险 */
    if (aiGetKey() && !sure) {
      $('#mkFb').innerHTML = errHtml + natHtml +
        '<div class="fb tip">⏳ 再让 AI 老师照着你这句，写一句欧美人会说的…</div>' + redoBtns;
      const r2 = await aiCheckSentence(w.w, fixedOk || s);
      $('#mkFb').innerHTML = errHtml + natHtml +
        (r2 && r2.better ? '<div class="fb tip">' + betterHtml(r2) + '</div>' :
         (r2 && r2.error ? '<div class="fb tip">（' + esc(r2.error) + '，上面的说法仍然有效）</div>' : '')) +
        redoBtns;
    }
    return;
  }

  const gramOkHtml =
    '<div class="fb ok">🎉 <b>语法检查通过！</b>拼写、大小写、标点、主谓一致、时态、冠词都没问题。' +
      (warns.length ? '<div style="margin-top:8px">还有一点小提醒（不算错）：</div>' + list(warns) : '') +
    '</div>';

  /* ② 语法对、但意思说不通（查表就能确定，不用问 AI） */
  if (sHits.length) {
    $('#mkFb').innerHTML = gramOkHtml + senseHtmlOk + (nativeBlock(w) || bookEgHtml(w, s)) + redoBtns;
    return;
  }

  /* ③ 语法对、但说法不地道（命中搭配表 = 我们确定该怎么说，不用问 AI） */
  if (cHits.length) {
    const fixed = collocFix(s);
    $('#mkFb').innerHTML = gramOkHtml +
      '<div class="fb bad">🌏 <b>语法对，但欧美人不这么说</b>' +
        '<ul class="chk">' + cHits.map(x => '<li>❌ 你写的「' + esc(hitText(x, s)) + '」' +
          '<br><span style="color:#3e8e5a;font-size:13.5px">→ 应该说 <b>' + esc(x.good) + '</b></span>' +
          '<br><span style="color:#8a7fa8;font-size:13px">' + esc(x.zh) + '</span></li>').join('') + '</ul>' +
        (normSent(fixed) !== normSent(s) ?
          '<div style="margin-top:10px;font-size:14px">✍️ <b>改好应该是这样</b>：' +
          '<div class="eg" style="margin-top:6px;background:#fff">' + esc(fixed) +
          ' <button class="btn-mini" onclick="speak(' + JSON.stringify(fixed) + ')">🔊</button></div></div>' : '') +
      '</div>' + (nativeBlock(w) || bookEgHtml(w, s)) + redoBtns;
    return;
  }

  /* ④ 规则全部通过 —— 到这里规则真的没话说了，才轮到 AI（可选） */
  const natHtml = nativeBlock(w);
  const acceptBtn = '<button class="btn btn-main" onclick="makeAccept()">收下这一句，写下一句 →</button>';
  if (!aiGetKey()) {
    $('#mkFb').innerHTML = gramOkHtml +
      '<div class="fb tip">系统能确定的都查过了：语法、常见中式说法、意思说不通的搭配，全都没问题 ✅</div>' +
      natHtml + acceptBtn;
    return;
  }
  $('#mkFb').innerHTML = gramOkHtml + natHtml + '<div class="fb tip">⏳ 再让 AI 老师看一眼意思通不通…</div>';
  const r = await aiCheckSentence(w.w, s);
  if (!r || r.error) {                      /* AI 出问题不能影响孩子——语法结论照样算数 */
    $('#mkFb').innerHTML = gramOkHtml + natHtml +
      (r && r.error ? '<div class="fb tip">（' + esc(r.error) + '，语法检查的结论仍然有效）</div>' : '') +
      acceptBtn;
    return;
  }
  const betterBlk = betterHtml(r);
  const dropNote = r.dropped ?
    '<div style="margin-top:8px;font-size:13px;color:#8a7fa8">（AI 这次给的示范句没通过语法检查，' +
    '已经拦下不显示——宁可少给一句，也不让你记住错的说法。）</div>' : '';
  if (r.ok) {
    $('#mkFb').innerHTML = gramOkHtml + natHtml +
      '<div class="fb ok">✅ <b>意思也没问题</b>' + (r.tip ? '：' + esc(r.tip) : '') + betterBlk + dropNote + '</div>' +
      acceptBtn;
  } else {
    /* ⭐ 程序化保底：判分永远以规则层为准。AI 说「意思怪」只降级成一条提醒——
       绝不能变成「你自己判断 AI 说得对不对」，那是把校验推给一个没有判断能力的孩子。 */
    $('#mkFb').innerHTML = gramOkHtml + natHtml +
      '<div class="fb tip">🤔 <b>AI 老师另外提了一句</b>' + (r.tip ? '：' + esc(r.tip) : '') +
        (r.fix ? '<div class="eg" style="margin-top:8px;background:#fff">它建议说：' + esc(r.fix) + '</div>' : '') +
        betterBlk + dropNote +
        '<div style="margin-top:8px;font-size:13px;color:#8a7fa8">这条只是<b>参考</b>，AI 有时会看错。' +
        '语法、常见中式说法、意思说不通的搭配，系统都已经查过了，<b>你这句是通过的</b> ✅<br>' +
        '觉得它说得有道理就改一改，不然直接收下就行 —— 不用你来判断谁对。</div>' +
      '</div>' +
      '<button class="btn btn-main" onclick="makeAccept()">收下这一句，写下一句 →</button>' +
      '<button class="btn btn-ghost" onclick="makeCheck()">我想改一改，再检查一次</button>';
  }
}
function makePass(ok) {
  const w = cur.sec.words[mk.i], s = window.__mkS || '';
  (mk.sents[mk.i] = mk.sents[mk.i] || [])[mk.j] = s;
  if (ok) mk.ok++; else addWrong(w, cur.sec, cur.unit, 'make', s);
  const total = cur.sec.words.length * MK_PER_WORD;
  const doneN = mk.i * MK_PER_WORD + mk.j + 1;
  setProg(cur.sec.id, 'make', doneN, total, mk.ok);
  /* 导航交给调用者（makeAccept / makeGiveUp），这里只记账 */
}
/* 一次点击就前进——「收下」之后还要再点一次「下一句」是多余操作 */
function makeAccept()  { makePass(true);  makeNext(); }
function makeGiveUp()  { makePass(false); makeNext(); }
function makeNext() { if (mk.j < MK_PER_WORD - 1) mk.j++; else { mk.j = 0; mk.i++; } makeRender(); }
function makePrev() { if (mk.j > 0) mk.j--; else if (mk.i > 0) { mk.i--; mk.j = MK_PER_WORD - 1; } makeRender(); }

renderHome();
</script>
<script src="assets/sync.js"></script>
</body>
