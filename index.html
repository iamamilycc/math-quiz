<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>七年级学习测验</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    color: #222;
}
.page { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
h1 { font-size: 22px; margin: 8px 0 4px; }
.subtitle { color: #777; font-size: 14px; margin: 0 0 24px; }
.subject-list { display: flex; flex-direction: column; gap: 14px; }
.subject-card {
    display: flex; justify-content: space-between; align-items: center;
    background: white; border-radius: 14px; padding: 22px 22px;
    text-decoration: none; color: #222; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.subject-emoji { font-size: 28px; margin-right: 14px; }
.subject-text { flex: 1; }
.subject-title { font-size: 18px; font-weight: 700; }
.subject-desc { font-size: 13px; color: #888; margin-top: 3px; }
.arrow { color: #bbb; font-size: 22px; }
.subject-card.math { border-left: 5px solid #3a6df0; }
.subject-card.geo { border-left: 5px solid #2ecc71; }
.subject-card.bio { border-left: 5px solid #e8a33d; }
.subject-card.wrongbook { border-left: 5px solid #9b59b6; }
</style>
</head>
<body>
<div class="page">
<h1>七年级上册学习测验</h1>
<p class="subtitle">选一个科目开始学习</p>

<div class="subject-list">
    <a class="subject-card math" href="math.html">
        <span class="subject-emoji">🔢</span>
        <span class="subject-text">
            <div class="subject-title">数学</div>
            <div class="subject-desc">北师大版 · 6章 + 强化练习，共175题</div>
        </span>
        <span class="arrow">›</span>
    </a>
    <a class="subject-card geo" href="geo.html">
        <span class="subject-emoji">🌍</span>
        <span class="subject-text">
            <div class="subject-title">地理</div>
            <div class="subject-desc">湘教版 · 知识点讲解 + 课后练习</div>
        </span>
        <span class="arrow">›</span>
    </a>
    <a class="subject-card bio" href="bio.html">
        <span class="subject-emoji">🧬</span>
        <span class="subject-text">
            <div class="subject-title">生物</div>
            <div class="subject-desc">人教版 · 知识点讲解 + 课后练习</div>
        </span>
        <span class="arrow">›</span>
    </a>
    <a class="subject-card wrongbook" href="wrongbook.html">
        <span class="subject-emoji">📓</span>
        <span class="subject-text">
            <div class="subject-title">错题本</div>
            <div class="subject-desc">自动收集三科做错的题目，方便复习</div>
        </span>
        <span class="arrow">›</span>
    </a>
</div>

</div>
</body>
</html>
