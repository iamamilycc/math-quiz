/* ========== 基础 ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalize(t) {
  if (t === null || t === undefined) return '';
  return String(t).trim().replace(/\s+/g, '').replace(/　/g, '').toLowerCase();
}
/* 造句用：保留词边界的归一 */
function normSent(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
}
function wordCount(s) { return String(s || '').trim().split(/\s+/).filter(Boolean).length; }

const PROG_KEY = 'mathquiz_words_prog_v1';
function getProg() { try { return JSON.parse(localStorage.getItem(PROG_KEY) || '{}'); } catch (e) { return {}; } }
function setProg(sid, mode, done, total, score) {
  const p = getProg(); p[sid] = p[sid] || {};
  p[sid][mode] = Math.max((p[sid][mode] || 0), done);
  p[sid][mode + '_n'] = total;
  if (score != null) p[sid][mode + '_s'] = Math.max((p[sid][mode + '_s'] || 0), score);
  try { localStorage.setItem(PROG_KEY, JSON.stringify(p)); } catch (e) {}
}
function secDone(sid, mode) { const p = getProg()[sid] || {}; return p[mode] || 0; }
function secScore(sid, mode) { const p = getProg()[sid] || {}; return p[mode + '_s'] || 0; }
/* ⭐ 续做定位：做一半退出，回来要接着做。
   不做这件事会出两个问题：① 孩子每次回来都从第 1 个重做
   ② 进度存档是「只增不减」(Math.max)，重做前面几个不会让进度前进，看起来像卡死。 */
function modeResume(sid, mode, n) {
  const d = Math.min(secDone(sid, mode), n);
  return d >= n ? 0 : d;                 /* 已经全做完 → 开新的一轮 */
}

/* 错题本：与其他科目共用，subject 用 engword */
/* 写进错题本。⭐ 必须记下孩子当时实际写了什么——只写「未过」的话，
   复习时他看不到自己错在哪，等于白记一笔。 */
const MODE_LABEL = { card: '记忆卡拼写', recall: '背诵', make: '造句' };
function addWrong(word, sec, unit, mode, userAnswer) {
  const KEY = 'mathquiz_wrongbook_v1';
  let book = []; try { book = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
  const now = new Date().toISOString();
  const key = 'engword|' + word.w + '|' + word.zh;      /* 一个词一条，三种练法都错就累计次数 */
  /* 同一个词在三种练法里都可能错。合并成一条（一个词一条，复习时不用翻三遍），
     但要把每种练法各自写错的内容都留下——只留最后一次的话，
     孩子看不到自己在拼写上也栽过跟头。 */
  const label = MODE_LABEL[mode] || '练习';
  const said = String(userAnswer || '').trim() || '（空）';
  const render = at => Object.keys(at).map(k => MODE_LABEL[k] + '写成「' + at[k] + '」').join('　｜　');
  const ex = book.find(b => b.key === key);
  if (ex) {
    ex.wrongCount += 1; ex.lastWrongAt = now;
    ex.attempts = ex.attempts || {}; ex.attempts[mode] = said;
    ex.userAnswer = render(ex.attempts);
  }
  else book.push({ key, subject: 'engword', chapterTitle: unit.title, sectionTitle: sec.title,
    point: word.w, stem: word.pos + ' ' + word.zh,
    attempts: { [mode]: said }, userAnswer: label + '写成「' + said + '」',
    correctAnswer: word.w + '　' + word.ipa, explain: '例句：' + word.egs[0],
    wrongCount: 1, firstWrongAt: now, lastWrongAt: now });
  try { localStorage.setItem(KEY, JSON.stringify(book)); } catch (e) {}
}

/* 发音（浏览器 TTS，没有就静默） */
function speak(t) {
  try { const u = new SpeechSynthesisUtterance(String(t)); u.lang = 'en-US'; u.rate = .9;
    speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}

                sweep:['swept'],sleep:['slept'],keep:['kept'],feel:['felt'],meet:['met'],leave:['left'],lose:['lost'],build:['built'],burn:['burnt', 'burned'],dream:['dreamt', 'dreamed'],smell:['smelt', 'smelled'],hang:['hung'],shine:['shone'],shoot:['shot'],sit:['sat'],stand:['stood'],wake:['woke'],wear:['wore', 'worn'],win:['won'],hide:['hid', 'hidden'],draw:['drew', 'drawn'],blow:['blew', 'blown'],know:['knew', 'known'],throw:['threw', 'thrown'],grow:['grew', 'grown'],fly:['flew', 'flown'],begin:['began', 'begun'],break:['broke', 'broken'],choose:['chose', 'chosen'],forget:['forgot', 'forgotten'],freeze:['froze', 'frozen'],steal:['stole', 'stolen'],swim:['swam', 'swum'],ride:['rode', 'ridden'],rise:['rose', 'risen'],drive:['drove', 'driven'],sell:['sold'],tell:['told'],feed:['fed'],lead:['led'],mean:['meant'],cost:['cost'],hurt:['hurt'],shut:['shut'],let:['let'],set:['set'], };

function tooSimilar(a, b) {
  const A = normSent(a), B = normSent(b);
  if (!A || !B) return false;
  if (A === B) return true;
  const ta = A.split(' '), tb = B.split(' '), sb = new Set(tb);

  return uni > 0 && inter / uni >= 0.8;
}

/* 原形和过去式同形的动词：看到 She put… 无法判断是「漏了 s」还是「过去式」，
   一律不报错——宁可漏报，不可把对的判成错。 */
const SAME_BASE_PAST = new Set(['put','cut','read','let','cost','hurt','shut','set','hit','spread']);
/* 句子里出现这些词 → 多半在讲过去的事，三单加 s 的规则就不适用了 */
const PAST_MARKERS = new Set(['yesterday','ago','last','then','just','once','before']);
/* 主语判定 */
const SUBJ_I = new Set(['i']);
const SUBJ_3S = new Set(['he','she','it','this','that','someone','somebody','everyone','everybody','nobody','nothing']);
/* ⚠️ 判「三单漏 s」时不能把 this / that 当主语——它们更常是限定词：
   「He likes this excuse very much.」里 this 修饰名词 excuse，不是「this 做主语 + excuse 做动词」。
   （这是真点击走查抓出来的误报；把对的句子判成错比漏掉一个错更伤。）*/
const SUBJ_3S_FOR_VERB = new Set(['he','she','it','someone','somebody','everyone','everybody','nobody']);
const SUBJ_PL = new Set(['we','they','you','these','those','people']);
/* 元音音素开头（用 an）与例外 */
/* 既是动词也是形容词的词：is open / very clean / the door is shut 都是对的，
   这些词在「be + 动词原形」和「very + 动词」两条规则里一律不报。
   （两条误报都是全册例句自检撞出来的。） */
/* 既是动词也是常见名词的词：the right answer / a long walk 里它们都是名词，
   判「名词主语漏 s」时不能把它们当动词。 */
const ALSO_NOUN = new Set(['answer','walk','work','watch','play','study','book','dress','ring','catch',
                           'drink','cook','show','call','name','hope','need','help','look','turn','use',
                           'visit','wish','start','end','paint','dust','sleep','jump','swim','run','shine',
                           'water','park','drop','tap','tie','post','change','rest','face','hand','light']);
const ALSO_ADJ = new Set(['clean','open','close','shut','free','warm','cool','slow','right','light',
                          'empty','dry','quiet','still','well','fine','short','long','fast','hard',
                          'busy','tired','fat','thin','tall','sharp','blunt','full','large','little']);
const AN_EXCEPT_A = new Set(['university','uniform','user','european','one','once','useful','usual']); // 读音以辅音开头 → 用 a
const A_EXCEPT_AN = new Set(['hour','honest','honour','honor','heir']);                                 // h 不发音 → 用 an

/* 从本册词表里抽出「确定是名词、且不会当动词用」的词——用来判断
   「you book」这类中文直译错误（应该是 your book）。用自己的数据判，不靠猜。 */
const PURE_NOUNS = (() => {
  const set = new Set();
  try {
    DATA.units.forEach(u => u.sections.forEach(x => x.words.forEach(w => {
      const k = String(w.w).toLowerCase();
      /* 兼形容词的词不能算「确定是名词」——the right answer 里 right 是形容词，
         把它当主语就会把 answer 误判成动词。 */
      if (String(w.pos).includes('名词') && !String(w.pos).includes('形容词') &&
          !String(w.pos).includes('动词') && k.indexOf(' ') < 0 && !BASE_VERBS.has(k) &&
          !THIRD_TO_BASE[k] && !PAST_TO_BASE[k]) set.add(k);
    })));
  } catch (e) {}
  ['book','watch','dress','name','work','play','study','answer','wish','call','show','ring','suit']
    .forEach(k => set.delete(k));   /* 这些同时也是动词，一般句型里判不准就不判 */
  return set;
})();
/* 完整名词集（含 book/watch 这类兼动词的）——只给「be + 代词 + 名词」这个窄句型用。
   在这个句型里 book 不可能是动词（is you book 只能是 is your book），所以不会误报。 */
const ALL_NOUNS = (() => {
  const set = new Set();
  try {
    DATA.units.forEach(u => u.sections.forEach(x => x.words.forEach(w => {
      const k = String(w.w).toLowerCase();
      if (String(w.pos).includes('名词') && k.indexOf(' ') < 0) set.add(k);
    })));
  } catch (e) {}
  return set;
})();
/* ⚠️ her / his / its 本身就能当物主代词（her coat 是对的），绝不能列进来，
   否则会把正确的句子判成错——这是全册例句自检抓出来的。 */
/* 不规则复数：the children come… 是对的，不能当成「名词主语漏了 s」 */
/* 限定词：判「名词主语」和「缺 be」都要用，必须放在模块层级
   （放在函数里会因为暂时性死区，让循环里先用到的规则报 ReferenceError） */
const DET = new Set(['a','an','the','my','your','his','her','its','our','their','this','that','one','two','three']);
const IRREG_PLURAL = new Set(['children','men','women','people','feet','teeth','mice','geese','police']);
/* 单数但结尾是 s 的名词：不能当成复数 */
const SINGULAR_S = new Set(['glass','dress','bus','class','address','business','news','chess','grass','glasses']);
/* 不规则动词的原形——写成「原形+ed」就是错的（goed / buyed / teached） */
const IRREG_BASES = new Set(['go','come','see','do','have','make','take','give','get','buy','bring','think',
  'teach','catch','eat','drink','write','read','run','sit','stand','meet','leave','lose','find','feel','keep',
  'sleep','speak','wear','sing','swim','say','tell','pay','send','spend','hear','hold','fly','drive','fall',
  'ring','win','cut','put','let','lend','understand','begin','break','choose','forget','grow','build','sell']);
/* 后面要跟 to do 或 doing 的动词——「I like play football」是高频中式错误 */
const NEED_TO_OR_ING = new Set(['like','likes','liked','love','loves','loved','want','wants','wanted',
  'hate','hates','hated','hope','hopes','hoped','enjoy','enjoys','enjoyed','decide','decides','decided',
  'finish','finishes','finished','begin','begins','began','learn','learns','learnt','try','tries','tried']);
const PREPS = new Set(['at','in','on','for','with','to','from','of','by','about','after','before','until','near','under','over']);
/* 明确表示复数的词：There is many books 里的 many */
const PLURAL_MARK = new Set(['many','several','both','few','two','three','four','five','six','seven','eight','nine','ten','twenty']);

const PRON_NEEDS_POSS = { i:'my', you:'your', he:'his', she:'her', it:'its', we:'our', they:'their',
                          me:'my', him:'his', us:'our', them:'their' };

/* 用 function 宣告而不是 const 箭头函数——const 有暂时性死区，
   循环里先用到的规则会报 ReferenceError（这个坑踩过两次了）。 */
function isVerbTok(x) {
  return BE_ALL.has(x) || MODALS.has(x) || AUX_DO.has(x) ||
         BASE_VERBS.has(x) || !!THIRD_TO_BASE[x] || !!PAST_TO_BASE[x];
}
/* 判「整句有没有动词」时放得更宽：连 cannot / can't 这类合写否定和 ed/ing 结尾都算。
   不能把 s 结尾也算——this / his / bus 都会被误当成动词。 */
function isVerbTok0(x) {
  return isVerbTok(x) ||
    /^(cannot|can't|won't|don't|doesn't|didn't|isn't|aren't|wasn't|weren't|shouldn't|couldn't|mustn't)$/.test(x) ||
    (x.length > 3 && /(ed|ing)$/.test(x));
}

function tokenize(s) {
  return String(s || '').trim().split(/\s+/).map(t => t.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g, ''))
    .filter(Boolean);
}
/* 记录每个词后面有没有标点——跨标点的两个词不是一个词组，规则不能跨过去套。
   （thank you, sir. 里的「you , sir」不是「你的先生」） */
function punctFlags(s) {
  const parts = String(s || '').trim().split(/\s+/).filter(Boolean);
  const flags = [];
  parts.forEach(p => { if (p.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g, '')) flags.push(/[,;:.!?—-]$/.test(p)); });
  return flags;
}
function lower(a) { return a.map(x => x.toLowerCase()); }

/* 返回 [{level:'error'|'warn', why:'错在哪', fix:'怎么改'}] */
function checkGrammar(sent) {
  const out = [];
  const raw = String(sent || '').trim();
  const T = tokenize(raw), t = lower(T), pf = punctFlags(raw);
  if (!T.length) return out;
  const add = (level, why, fix) => out.push({ level, why, fix });

  /* R1 句首大写 */
  if (!/^[A-Z]/.test(raw)) add('error', '句子开头没有大写', '英文句子第一个字母要大写：把「' + raw.charAt(0) + '」改成大写');
  /* R2 句尾标点 */
  if (!/[.!?]$/.test(raw)) add('error', '句子末尾少了标点', '陈述句结尾加句号 <b>.</b>，问句用 <b>?</b>，感叹用 <b>!</b>');

  for (let i = 0; i < t.length; i++) {
    const w = t[i], nx = t[i + 1], nx2 = t[i + 2];

    /* R3 相邻重复词 */
    if (nx && w === nx && !pf[i] && !['had','that'].includes(w))
      add('error', '「' + w + ' ' + nx + '」写重复了', '删掉多余的那个 <b>' + w + '</b>');

    /* R4 be 动词与主语不一致 */
    if (nx && BE_ALL.has(nx)) {
      if (SUBJ_I.has(w) && !['am','was'].includes(nx))
        add('error', 'I 后面不能用 <b>' + nx + '</b>', 'I 配 <b>am</b>（过去式 was）：I <b>am</b> …');
      if (SUBJ_3S.has(w) && !['is','was'].includes(nx))
        add('error', w + ' 后面不能用 <b>' + nx + '</b>', w + ' 是单数，配 <b>is</b>（过去式 was）');
      if (SUBJ_PL.has(w) && !['are','were'].includes(nx))
        add('error', w + ' 后面不能用 <b>' + nx + '</b>', w + ' 是复数（you 也算），配 <b>are</b>（过去式 were）');
    }

    /* R5 第三人称单数：he/she/it + 动词原形 → 要加 s
       ⚠️ 前面若有 do/does/did 或情态动词管着（疑问句 Does he like…／否定 He doesn't like…），
          动词本来就该用原形，这时报「漏 s」就是把对的判成错——必须先排除。 */
    const governed = t.slice(0, i + 1).some(x => AUX_DO.has(x) || MODALS.has(x) ||
      /^(don't|doesn't|didn't|dont|doesnt|didnt)$/.test(x));
    const pastCtx = t.some(x => PAST_MARKERS.has(x));
    if (!governed && !pastCtx && SUBJ_3S_FOR_VERB.has(w) && nx && BASE_VERBS.has(nx) &&
        !SAME_BASE_PAST.has(nx) && !BE_ALL.has(nx) && !MODALS.has(nx) && !AUX_DO.has(nx))
      add('error', w + ' 后面的动词 <b>' + nx + '</b> 少了 s',
          '主语是 he / she / it 时，一般现在时的动词要加 s：<b>' + (VERB_FORMS[nx][0] || nx + 's') + '</b>');
    /* R5b 复数主语 + 三单动词 */
    if (!governed && (SUBJ_PL.has(w) || SUBJ_I.has(w)) && nx && THIRD_TO_BASE[nx] && !BE_ALL.has(nx))
      add('error', w + ' 后面的动词不该加 s',
          w + ' 不是第三人称单数，用原形 <b>' + THIRD_TO_BASE[nx] + '</b>');

    /* R6 一个句子两个时态标记：do/does/did 管辖的动词必须用原形。
       疑问句里动词隔着主语（Does he like…），所以要往后扫最多 3 个词找第一个动词。 */
    if (AUX_DO.has(w)) {
      for (let k = i + 1; k < Math.min(i + 4, t.length); k++) {
        const v = t[k];
        if (v === 'not' || v === "n't" || SUBJ_I.has(v) || SUBJ_3S.has(v) || SUBJ_PL.has(v) ||
            /^(the|a|an|my|your|his|her|our|their|this|that)$/.test(v)) continue;
        if (!SAME_BASE_PAST.has(v) && (THIRD_TO_BASE[v] || PAST_TO_BASE[v])) {
          add('error', '<b>' + w + '</b> 后面的动词 <b>' + v + '</b> 要用原形',
              w + ' 已经带走了时态和人称，一个句子只能有一个时态标记，动词还原成 <b>' +
              (THIRD_TO_BASE[v] || PAST_TO_BASE[v]) + '</b>');
        }
        break;   /* 只看第一个实义动词 */
      }
    }
    /* R6b 情态动词后必须原形 */
    /* ⚠️ 原形与过去式同形的词（cost / put / cut）跟在情态动词后面本来就对：
       The repairs will cost a lot. 不能报错。 */
    if (MODALS.has(w) && nx && !SAME_BASE_PAST.has(nx) &&
        (THIRD_TO_BASE[nx] || PAST_TO_BASE[nx]) && !BE_ALL.has(nx))
      add('error', '<b>' + w + '</b> 后面的动词要用原形',
          '情态动词（can/must/will…）后面一律跟原形：<b>' + (THIRD_TO_BASE[nx] || PAST_TO_BASE[nx]) + '</b>');

    /* R7 be + 动词原形（缺 ing 或多余的 be）
       ⚠️ 排除既是形容词的词：The shop is open… / The door is shut… 都是对的 */
    if (BE_ALL.has(w) && nx && BASE_VERBS.has(nx) && !ALSO_ADJ.has(nx) &&
        !['be','been','being'].includes(nx) && !AUX_DO.has(nx))
      add('error', '<b>' + w + ' ' + nx + '</b> 连在一起不对',
          '要么去掉 <b>' + w + '</b>，要么把动词改成 ing：' + w + ' <b>' + nx.replace(/e$/, '') + 'ing</b>');

    /* R8 a / an 用错（看后面单词的读音） */
    if (w === 'a' && nx && /^[aeiou]/.test(nx) && !AN_EXCEPT_A.has(nx))
      add('error', '<b>a ' + nx + '</b> 要改成 <b>an ' + nx + '</b>', nx + ' 读音以元音开头，冠词用 <b>an</b>');
    if (w === 'an' && nx && !/^[aeiou]/.test(nx) && !A_EXCEPT_AN.has(nx))
      add('error', '<b>an ' + nx + '</b> 要改成 <b>a ' + nx + '</b>', nx + ' 读音以辅音开头，冠词用 <b>a</b>');

    /* R9 双重否定 */
    if ((w === "don't" || w === 'dont' || w === "doesn't" || w === "didn't" || w === 'not') &&
        nx && ['never','nothing','nobody','none'].includes(nx))
      add('error', '英语不能用双重否定', '把 <b>' + w + '</b> 去掉，只留 <b>' + nx + '</b>（它本身就是否定）');

    /* R10 very 不能直接修饰动词（ALSO_ADJ 里的词既是动词也是形容词，不报） */
    if (w === 'very' && nx && !ALSO_ADJ.has(nx) &&
        (BASE_VERBS.has(nx) || THIRD_TO_BASE[nx] || PAST_TO_BASE[nx]) && !BE_ALL.has(nx))
      add('error', 'very 不能直接放在动词前面',
          '改成把 <b>very much</b> 放到句子后面：I <b>' + nx + '</b> it <b>very much</b>.');

    /* R11 although…but / because…so 不能同时用 */
    if (w === 'although' || w === 'though') {
      if (t.includes('but')) add('error', 'although 和 but 不能同时出现', '两个都表示转折，只留一个');
    }
    if (w === 'because' && t.includes('so'))
      add('error', 'because 和 so 不能同时出现', '两个都表示因果，只留一个');

    /* R12 介词后面跟动词原形 → 该用 ing */
    if (['at','for','of','in','on','about','with','without','after','before'].includes(w) &&
        nx && BASE_VERBS.has(nx) && !BE_ALL.has(nx) && !MODALS.has(nx))
      add('warn', '介词 <b>' + w + '</b> 后面通常跟名词或动词 ing',
          '如果这里是动作，改成 <b>' + nx.replace(/e$/, '') + 'ing</b>');

    /* R16 名词主语的三单：My father work… → works
       ⚠️ 这条最容易误报——分不清名词和动词就会把 your watch / the long walk 判成错。
       四道保险：① 主语必须是词表里「确定是名词、不兼动词」的词（PURE_NOUNS）
                ② 不能是复数（结尾 s / children 这类）
                ③ 动词不能是原形与过去式同形的（the hairdresser cut… 判不出时态）
                ④ 动词后面那个词不能是动词（The school work is hard 里 work 是名词） */
    const nx3 = t[i + 3];
    /* ⚠️ 并列主语是复数：My uncle and his wife live here. 里的 live 是对的 */
    const compound = t.slice(0, i + 2).includes('and');
    /* ⚠️ 前面已经有 be 动词，这个名词短语就不是后面那个词的主语：
       What is the weather like today? 里 like 是介词不是动词。 */
    const beBefore = t.slice(0, i).some(x => BE_ALL.has(x));
    if (!governed && !pastCtx && !compound && !beBefore && DET.has(w) && nx && nx2 &&
        PURE_NOUNS.has(nx) && !/s$/.test(nx) && !IRREG_PLURAL.has(nx) && !SINGULAR_S.has(nx) &&
        BASE_VERBS.has(nx2) && !SAME_BASE_PAST.has(nx2) && !ALSO_ADJ.has(nx2) &&
        !BE_ALL.has(nx2) && !MODALS.has(nx2) && !AUX_DO.has(nx2) &&
        nx3 && !isVerbTok(nx3) && !pf[i] && !pf[i + 1])
      add('error', '<b>' + nx + '</b> 是单数，后面的动词 <b>' + nx2 + '</b> 少了 s',
          '主语是一个人／一样东西时，一般现在时的动词要加 s：<b>' +
          ((VERB_FORMS[nx2] && VERB_FORMS[nx2][0]) || nx2 + 's') + '</b>');

    /* R17 不规则动词写成「原形+ed」：goed / buyed / teached */
    if (w.length > 3 && /ed$/.test(w)) {
      const b1 = w.slice(0, -2), b2 = w.slice(0, -1);
      const base = IRREG_BASES.has(b1) ? b1 : (IRREG_BASES.has(b2) ? b2 : null);
      if (base && VERB_FORMS[base])
        add('error', '<b>' + w + '</b> 不是英语单词',
            '<b>' + base + '</b> 是不规则动词，过去式不能加 ed，要写成 <b>' + VERB_FORMS[base][1] + '</b>');
    }

    /* R18 There is + 复数：There is many books… → There are */
    if (w === 'there' && (nx === 'is' || nx === 'was') && nx2 && PLURAL_MARK.has(nx2))
      add('error', 'There ' + nx + ' 后面跟的是复数（' + nx2 + '…）',
          '后面是复数就要用 <b>There ' + (nx === 'is' ? 'are' : 'were') + '</b>');

    /* R19 like / want 后面直接跟动词原形：I like play football → like playing / like to play */
    if (NEED_TO_OR_ING.has(w) && nx && BASE_VERBS.has(nx) && !BE_ALL.has(nx) &&
        !ALSO_ADJ.has(nx) && !AUX_DO.has(nx) && !MODALS.has(nx) && nx2 && !PREPS.has(nx2) && !pf[i])
      add('error', '<b>' + w + '</b> 后面不能直接跟动词原形 <b>' + nx + '</b>',
          '要么加 to：' + w + ' <b>to ' + nx + '</b>，要么用 ing：' + w + ' <b>' + nx.replace(/e$/, '') + 'ing</b>');

    /* R15b be 动词 + 代词 + 名词：这个句型里名词不可能是动词，可以放心判
       （Where is you book? → your book） */
    if (BE_ALL.has(w) && nx && PRON_NEEDS_POSS[nx] && nx2 && ALL_NOUNS.has(nx2) && !pf[i + 1])
      add('error', '<b>' + nx + ' ' + nx2 + '</b> 不对，这里要用「谁的」',
          '表示「' + nx + ' 的 ' + nx2 + '」要用物主代词：<b>' + PRON_NEEDS_POSS[nx] + ' ' + nx2 + '</b>');

    /* R15 代词后面直接跟名词 → 该用物主代词（中文「你书」直译成 you book） */
    /* ⚠️ 双宾语句「taught you English / gave me a book」里 pronoun+noun 是对的，
       所以前一个词若是实义动词（不含 be）就不报。be 后面才可能是 is me handbag 这种错。 */
    const prevIsAction = i > 0 && isVerbTok(t[i - 1]) && !BE_ALL.has(t[i - 1]);
    if (!prevIsAction && PRON_NEEDS_POSS[w] && nx && PURE_NOUNS.has(nx) && !pf[i])
      add('error', '<b>' + w + ' ' + nx + '</b> 不对，这里要用「谁的」',
          '表示「' + w + ' 的 ' + nx + '」要用物主代词：<b>' + PRON_NEEDS_POSS[w] + ' ' + nx + '</b>');

    /* R13 to + 动词ing（want to / like to 后面要原形） */
    if (w === 'to' && nx && /ing$/.test(nx) && nx.length > 4 && !['nothing','something','anything','morning','evening'].includes(nx))
      add('warn', '<b>to</b> 后面通常跟动词原形', 'to 是不定式符号，后面用原形：to <b>' + nx.replace(/ing$/, '') + '</b>');
  }

  /* R14 缺 be 动词：只在把握很大的句型下报——「主语代词 + 限定词 + 名词」中间没有动词
     （I a student. / My father a doctor.）。
     ⚠️ 不能用「整句找不到动词就报」这种写法：动词表不可能穷尽，
        I share a room with my sister. 会被误判成没有动词。 */
  /* ⚠️ 只有「整句一个动词都找不到」时才可能是漏了 be。
     两个反例都是实测撞出来的：
       Is this your handbag?              be 在句首（疑问句）
       He cannot find his tie this morning. 动词是 find，cannot 也不在情态词表里
     所以保险条件要放到最宽：句中出现任何动词形式，这条规则就不启动。 */
  const hasAnyVerb = t.some(x => isVerbTok0(x));
  for (let i = 0; !hasAnyVerb && i < t.length - 2; i++) {
    const subjOK = SUBJ_I.has(t[i]) || SUBJ_3S.has(t[i]) || SUBJ_PL.has(t[i]) ||
                   (DET.has(t[i]) && t[i + 1] && !isVerbTok(t[i + 1]));
    if (!subjOK) continue;
    /* 从主语后往后看两个词：都不是动词，而且出现了「限定词 + 名词」→ 多半漏了 be */
    const a = t[i + 1], b = t[i + 2];
    if (a && b && DET.has(a) && !isVerbTok(a) && !isVerbTok(b) && !pf[i] && !pf[i + 1]) {
      add('error', '「' + t[i] + ' ' + a + ' ' + b + '」中间少了 be 动词',
          '英语句子一定要有动词，这里要补上 <b>am / is / are</b>：' +
          t[i] + ' <b>' + (SUBJ_I.has(t[i]) ? 'am' : (SUBJ_PL.has(t[i]) ? 'are' : 'is')) + '</b> ' + a + ' ' + b);
      break;
    }
    /* 另一种常见写法：「我的爸爸 一个医生」——限定词+名词 后面又跟 限定词+名词，中间没动词
       （My father a doctor.）*/
    if (DET.has(t[i]) && a && b && t[i + 3] && !isVerbTok(a) && DET.has(b) && !isVerbTok(t[i + 3]) &&
        !pf[i] && !pf[i + 1] && !pf[i + 2]) {
      add('error', '「' + a + ' ' + b + ' ' + t[i + 3] + '」中间少了 be 动词',
          '英语句子一定要有动词，这里要补上 <b>is</b>：' + t[i] + ' ' + a + ' <b>is</b> ' + b + ' ' + t[i + 3]);
      break;
    }
  }

  /* 去重（同一条只报一次） */
  const seen = new Set();
  return out.filter(o => { const k = o.level + o.why; if (seen.has(k)) return false; seen.add(k); return true; });
}

/* ========== AI 第二层：语义与地道度检查（智谱，可选） ==========
   规则层已经覆盖语法（免费、即时、不会乱判）。AI 只补规则做不到的那部分：
   句子意思通不通、词搭配对不对、有没有更地道的说法。
   ⚠️ 没设 Key 就完全跳过——规则层的结论照样有效，不影响使用。
   ⚠️ Key 只存在这台设备的 localStorage，不进代码、不进仓库、不发去别处（除了智谱本身）。 */
const AI_KEY_LS = 'mathquiz_zhipu_key';
const AI_MODEL_LS = 'mathquiz_zhipu_model';
const AI_ENDPOINT = 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
function aiGetKey() { try { return localStorage.getItem(AI_KEY_LS) || ''; } catch (e) { return ''; } }
function aiSetKey(k) {
  try { if (k && k.trim()) localStorage.setItem(AI_KEY_LS, k.trim()); else localStorage.removeItem(AI_KEY_LS); } catch (e) {}
}
function aiGetModel() { try { return localStorage.getItem(AI_MODEL_LS) || 'glm-4-flash'; } catch (e) { return 'glm-4-flash'; } }
function aiSetModel(m) { try { localStorage.setItem(AI_MODEL_LS, m); } catch (e) {} }

async function aiCheckSentence(word, sentence) {
  const key = aiGetKey();
  if (!key) return null;                       /* 没 Key → 静默跳过 */
  const prompt =
    '你是亲切的小学英语老师。孩子用指定单词造了一个句子。语法已经由程序检查过了，' +
    '你只需要判断这两点：\n' +
    '1. 句子的**意思通不通**（例如 "I eat a book every day." 语法没错但意思荒谬，算不通）。\n' +
    '2. 有没有**明显的搭配错误**（例如 open the light 应该是 turn on the light）。\n' +
    '⚠️ 下列情况一律判 ok:true，不准判错：语序/副词位置只要可以接受、用词是否「最自然」、' +
    '风格好不好、大小写标点小毛病、句子简单幼稚。\n' +
    '⚠️ 拿不准、或只是「可以更好」时，一律判 ok:true。' +
    '把孩子本来正确的句子判成错，会让他把对的当错的记住，比漏掉一个错更糟。\n' +
    '不管对不对，都用同一个单词示范一句更地道、难度相近的句子放进 better。\n' +
    '只输出 JSON：{"ok":true或false,"tip":"一句简体中文说明，30字内","fix":"若不通，给修正后的完整句子；通顺则留空","better":"用同一个单词更地道的一句","betterZh":"better 的中文翻译"}\n\n' +
    '指定单词：' + word + '\n孩子的句子：' + sentence;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);   /* 12 秒还没回就放弃，别让孩子干等 */
  try {
    const resp = await fetch(AI_ENDPOINT, {
      method: 'POST', signal: ctrl.signal,
      headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: aiGetModel(), temperature: 0.2, max_tokens: 400,
                             response_format: { type: 'json_object' },
                             messages: [{ role: 'user', content: prompt }] })
    });
    clearTimeout(timer);
    if (resp.status === 401) return { error: 'Key 无效或已过期，请在设置里重新填写' };
    if (!resp.ok) return { error: '智谱返回 ' + resp.status + '，这次跳过 AI 检查' };
    const j = await resp.json();
    let t = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
    t = t.replace(/^```json\s*|^```\s*|```$/gm, '').trim();
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a >= 0 && b > a) t = t.slice(a, b + 1);
    const r = JSON.parse(t);
    if (typeof r.ok !== 'boolean') return { error: 'AI 返回格式不对，这次跳过' };
    return { ok: r.ok, tip: String(r.tip || ''), fix: String(r.fix || ''),
             better: String(r.better || ''), betterZh: String(r.betterZh || '') };
  } catch (e) {
    clearTimeout(timer);
    return { error: e.name === 'AbortError' ? 'AI 检查超时了，这次跳过' : '连不上智谱，这次跳过' };
  }
}

/* ========== 路由 ========== */
let cur = { unit: null, sec: null, mode: null };
function goBack() {
  if (cur.mode) { cur.mode = null; renderSec(); }
  else if (cur.sec) { cur.sec = null; renderUnit(); }
  else if (cur.unit) { cur.unit = null; renderHome(); }
}
function setHead(t, s, showBack) {
  $('#hTitle').textContent = t; $('#hSub').textContent = s;
  $('#backBtn').style.display = showBack ? 'inline-block' : 'none';
  /* 首页显示「回科目选择」，进到里层换成「← 返回」——两个返回并排孩子会搞不清点哪个 */
  const hl = $('#homeLink'); if (hl) hl.style.display = showBack ? 'none' : 'inline-block';
}

function renderHome() {
  cur = { unit: null, sec: null, mode: null };
  setHead('新概念英语第一册 · 单词', '按课次分单元 · 记忆、背诵、造句三步走', false);
  $('#view').innerHTML = '<div class="card-list">' + DATA.units.map((u, i) => {
    const nw = u.sections.reduce((a, s) => a + s.words.length, 0);
    const dn = u.sections.reduce((a, s) => a + Math.min(secDone(s.id, 'card'), s.words.length), 0);
    return '<button class="big-card" onclick="openUnit(' + i + ')">' +
      '<span><span class="big-card-title">' + esc(u.title) + '</span>' +
      '<span class="big-card-desc">' + u.sections.length + ' 节 · ' + nw + ' 个单词</span></span>' +
      '<span class="prog">' + Math.round(dn * 100 / (nw || 1)) + '%</span></button>';
  }).join('') + '</div>' +
  '<button class="btn btn-ghost" style="margin-top:18px" onclick="openSettings()">⚙️ 家长设置 · AI 检查' +
    (aiGetKey() ? '（已开启）' : '（未开启）') + '</button>';
}
function openUnit(i) { cur.unit = DATA.units[i]; renderUnit(); }
function renderUnit() {
  cur.sec = null; cur.mode = null;
  const u = cur.unit;
  setHead(u.title, '选一节开始', true);
  $('#view').innerHTML = '<div class="card-list">' + u.sections.map((s, i) => {
    const c = Math.min(secDone(s.id, 'card'), s.words.length),
          r = Math.min(secDone(s.id, 'recall'), s.words.length),
          m = Math.min(secDone(s.id, 'make'), s.words.length * MK_PER_WORD);
    return '<button class="big-card" onclick="openSec(' + i + ')">' +
      '<span><span class="big-card-title">' + esc(s.title) + '</span>' +
      '<span class="big-card-desc">' + s.words.length + ' 个单词 · 记忆 ' + c + '/' + s.words.length +
      ' · 背诵 ' + r + '/' + s.words.length + ' · 造句 ' + m + '/' + (s.words.length * MK_PER_WORD) +
      '</span></span><span class="arrow">›</span></button>';
  }).join('') + '</div>';
}
function openSec(i) { cur.sec = cur.unit.sections[i]; renderSec(); }
function renderSec() {
  cur.mode = null;
  const s = cur.sec;
  setHead(s.title, s.words.length + ' 个单词 · 选一种练法', true);
  $('#view').innerHTML =
    '<div class="card-list">' +
    modeCard('card',   '🃏 记忆卡',  '看英文记拼写 → 翻面默写出来', s.words.length) +
    modeCard('recall', '🧠 背诵',    '只看中文，把英文写出来',       s.words.length) +
    modeCard('make',   '🖊️ 造句',    '先看 3 个例句，再自己造 3 句', s.words.length * MK_PER_WORD) +
    '</div>' +
    '<div class="hint-box" style="margin-top:16px">📋 <b>本节单词表</b>（先扫一眼，心里有底再开练）<br>' +
    s.words.map(w => esc(w.w) + '　<span style="color:#8a7fa8">' + esc(w.zh) + '</span>').join('<br>') + '</div>';
}
function modeCard(mode, title, desc, total) {
  const d = Math.min(secDone(cur.sec.id, mode), total);
  return '<button class="big-card" onclick="openMode(\'' + mode + '\')">' +
    '<span><span class="big-card-title">' + title + '</span>' +
    '<span class="big-card-desc">' + desc + '</span></span>' +
    '<span class="prog">' + d + '/' + total + '</span></button>';
}
/* 「再来一轮」：全做完之后想重练，从头开始（进度存档保持不变，不会倒退） */
function restartMode(m) { openMode(m); }
function openMode(m) {
  cur.mode = m;
  if (m === 'card') startCard();
  else if (m === 'recall') startRecall();
  else startMake();
}

/* ========== ① 记忆卡：正面英文 → 翻面默写 ========== */
let cd = { i: 0, flipped: false, ok: 0 };
function startCard() {
  const st = modeResume(cur.sec.id, 'card', cur.sec.words.length);
  cd = { i: st, flipped: false, ok: st ? Math.min(secScore(cur.sec.id, 'card'), st) : 0 };
  setHead('🃏 记忆卡 · ' + cur.sec.title, '正面记住样子，翻面凭记忆拼出来', true);
  cardRender();
}
function cardRender() {
  const ws = cur.sec.words;
  if (cd.i >= ws.length) {
    setProg(cur.sec.id, 'card', ws.length, ws.length, cd.ok);
    $('#view').innerHTML = '<div class="stage done-big"><div class="done-emoji">' + (cd.ok === ws.length ? '🏆' : '🃏') +
      '</div><div style="font-size:17px;margin-top:8px">这一节 ' + ws.length + ' 个单词过完了，拼对 ' + cd.ok + ' 个</div>' +
      '<div style="margin-top:14px"><button class="btn btn-main" onclick="restartMode(\'card\')">再来一轮</button>' +
      '<button class="btn btn-ghost" onclick="openMode(\'recall\')">去背诵 →</button></div></div>';
    return;
  }
  const w = ws[cd.i];
  if (!cd.flipped) {
    $('#view').innerHTML = '<div class="stage">' + pills(cd.i, ws.length) +
      '<div class="counter">第 ' + (cd.i + 1) + ' / ' + ws.length + ' 个</div>' +
      '<div class="word-big">' + esc(w.w) + ' <button class="btn-mini" onclick="speak(' + JSON.stringify(w.w) + ')">🔊</button></div>' +
      '<div class="ipa">' + esc(w.ipa) + '</div>' +
      '<div class="hint-box">先记住它的样子和读音，翻面要凭记忆把它拼出来。</div>' +
      '<button class="btn btn-main" onclick="cardFlip()">记住了，翻面 →</button></div>';
  } else {
    $('#view').innerHTML = '<div class="stage">' + pills(cd.i, ws.length) +
      '<div class="counter">第 ' + (cd.i + 1) + ' / ' + ws.length + ' 个</div>' +
      '<div class="pos-line">' + esc(w.pos) + '</div>' +
      '<div class="zh-big">' + esc(w.zh) + '</div>' +
      '<div class="eg">' + esc(maskWord(w.egs[0], w.w)) + '</div>' +
      '<div style="margin-top:12px"><input class="inp" id="cdIn" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="把这个单词拼出来"></div>' +
      '<button class="btn btn-main" onclick="cardCheck()">检查</button>' +
      '<div id="cdFb"></div></div>';
    const el = $('#cdIn'); if (el) { el.focus(); el.onkeydown = e => { if (e.key === 'Enter') cardCheck(); }; }
  }
}
function maskWord(sent, w) {
  const re = new RegExp('\\b' + String(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'ig');
  return String(sent).replace(re, '____');
}
function cardFlip() { cd.flipped = true; cardRender(); }
function cardCheck() {
  const w = cur.sec.words[cd.i], v = ($('#cdIn') || {}).value || '';
  const ok = normalize(v) === normalize(w.w);
  if (ok) cd.ok++; else addWrong(w, cur.sec, cur.unit, 'card', v);
  $('#cdFb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'bad') + '">' +
    (ok ? '🎉 拼对了！' : '💪 正确拼写是 <b>' + esc(w.w) + '</b>　（你写的是「' + esc(v || '（空）') + '」）<br>这个词已经放进错题本，等下可以再练一次。') +
    '</div><button class="btn btn-main" onclick="cardNext()">下一个 →</button>';
  setProg(cur.sec.id, 'card', cd.i + 1, cur.sec.words.length, cd.ok);
}
function cardNext() { cd.i++; cd.flipped = false; cardRender(); }
function pills(i, n) {
  let h = '<div class="pills">';
  for (let k = 0; k < n; k++) h += '<span class="pill ' + (k === i ? 'now' : (k < i ? 'ok' : '')) + '"></span>';
  return h + '</div>';
}

/* ========== ② 背诵：只看中文写英文 ==========
   ⚠️ 页首不能出现英文：节标题「Lesson 1-2　Excuse me!」里的课名本身就是答案
   （背 excuse 时抬头就看到 Excuse me），所以这一关只用「Lesson X-Y」这段。 */
function shortTitle(t) { return String(t).split('\u3000')[0].trim(); }

let rc = { i: 0, ok: 0 };
function startRecall() {
  const st = modeResume(cur.sec.id, 'recall', cur.sec.words.length);
  rc = { i: st, ok: st ? Math.min(secScore(cur.sec.id, 'recall'), st) : 0 };
  setHead('🧠 背诵 · ' + shortTitle(cur.sec.title), '只看中文，把英文写出来', true);
  recallRender();
}
function recallRender() {
  const ws = cur.sec.words;

    $('#view').innerHTML = '<div class="stage done-big"><div class="done-emoji">' + (rc.ok === ws.length ? '🏆' : '🧠') +
      '</div><div style="font-size:17px;margin-top:8px">背完 ' + ws.length + ' 个，写对 ' + rc.ok + ' 个</div>' +
      '<div style="margin-top:14px"><button class="btn btn-main" onclick="restartMode(\'recall\')">再来一轮</button>' +

    '<div class="pos-line">' + esc(w.pos) + '</div>' +

    '<div style="margin-top:14px"><input class="inp" id="rcIn" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="写出对应的英文单词"></div>' +
    '<button class="btn btn-main" onclick="recallCheck()">检查</button>' +
    '<button class="btn btn-ghost" onclick="recallHint()">给点提示</button>' +
    '<div id="rcFb"></div></div>';
  const el = $('#rcIn'); if (el) { el.focus(); el.onkeydown = e => { if (e.key === 'Enter') recallCheck(); }; }

function recallHint() {
  const w = cur.sec.words[rc.i];

function recallCheck() {
  const w = cur.sec.words[rc.i], v = ($('#rcIn') || {}).value || '';
  const ok = normalize(v) === normalize(w.w);

        : '💪 应该是 <b>' + esc(w.w) + '</b> ' + esc(w.ipa) + '<br>（你写的是「' + esc(v || '（空）') + '」）<br>' +
          '<span style="font-size:13.5px">看一遍例句再记：' + esc(w.egs[0]) + '</span>') +
    '</div><button class="btn btn-main" onclick="recallNext()">下一个 →</button>';
  setProg(cur.sec.id, 'recall', rc.i + 1, cur.sec.words.length, rc.ok);

/* ========== ③ 造句：先看 3 例句，再自己造 3 句 ========== */
let mk = { i: 0, j: 0, sents: [], ok: 0 };
function startMake() {
  const total = cur.sec.words.length * MK_PER_WORD;
  const st = modeResume(cur.sec.id, 'make', total);
  mk = { i: Math.floor(st / MK_PER_WORD), j: st % MK_PER_WORD, sents: [],
         ok: st ? Math.min(secScore(cur.sec.id, 'make'), st) : 0 };
  setHead('🖊️ 造句 · ' + cur.sec.title, '每个词造 3 句不一样的话，每句至少 5 个单词', true);
  makeRender();
}
function makeRender() {
  const ws = cur.sec.words, total = ws.length * MK_PER_WORD;
  if (mk.i >= ws.length) {
    setProg(cur.sec.id, 'make', total, total, mk.ok);
    $('#view').innerHTML = '<div class="stage done-big"><div class="done-emoji">' + (mk.ok === total ? '🏆' : '🖊️') +
      '</div><div style="font-size:17px;margin-top:8px">' + ws.length + ' 个词、每个 3 句，一共造了 ' + mk.ok + ' / ' + total + ' 句</div>' +
      '<div style="margin-top:14px"><button class="btn btn-main" onclick="restartMode(\'make\')">再来一轮</button></div></div>';
    return;
  }
  const w = ws[mk.i], mine = (mk.sents[mk.i] || []).filter(Boolean);
  $('#view').innerHTML = '<div class="stage">' +
    '<div class="counter">第 ' + (mk.i + 1) + ' / ' + ws.length + ' 个词　·　第 ' + (mk.j + 1) + ' / ' + MK_PER_WORD + ' 句</div>' +
    '<div class="word-big" style="font-size:24px">' + esc(w.w) +
      ' <button class="btn-mini" onclick="speak(' + JSON.stringify(w.w) + ')">🔊</button></div>' +
    '<div class="pos-line" style="margin-top:4px">' + esc(w.pos) + '　' + esc(w.zh) + '</div>' +
    '<div style="margin-top:12px;font-weight:600;font-size:14px">📖 先看看别人怎么用</div>' +
    w.egs.map((e, k) => '<div class="eg">' + (k + 1) + '. ' + esc(e) +
      ' <button class="btn-mini" onclick="speak(' + JSON.stringify(e) + ')">🔊</button></div>').join('') +
    (mine.length ? '<div style="margin-top:12px;font-weight:600;font-size:14px">✍️ 你已经造的</div>' +
      mine.map((s, k) => '<div class="mine">' + (k + 1) + '. ' + esc(s) + '</div>').join('') : '') +
    '<div class="hint-box">✏️ 这句要<b>至少 5 个单词</b>、要用上「<b>' + esc(w.w) + '</b>」，而且<b>不能和自己前面那几句重复</b>。<br>写完按「检查」，系统会<b>直接告诉你哪里错了、要怎么改</b>。</div>' +
    '<textarea class="inp" id="mkIn" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="用这个词造第 ' + (mk.j + 1) + ' 句你自己的话…"></textarea>' +
    '<button class="btn btn-main" onclick="makeCheck()">✨ 检查我的句子</button>' +
    (mk.i + mk.j > 0 ? '<button class="btn btn-ghost" onclick="makePrev()">← 上一句</button>' : '') +
    '<div id="mkFb"></div></div>';
}
async function makeCheck() {
  const w = cur.sec.words[mk.i], s = (($('#mkIn') || {}).value || '').trim();
  const bad = h => { $('#mkFb').innerHTML = '<div class="fb bad">' + h + '</div>'; };
  if (!s) { bad('先写一句话再检查 🙂'); return; }
  const nw = wordCount(s);
  if (nw < MK_MIN_WORDS) {
    bad('句子要有<b>至少 ' + MK_MIN_WORDS + ' 个单词</b>，现在只有 ' + nw + ' 个。<br>' +
        '试试加上「什么时候」「在哪里」「和谁」，句子就长了：<br>' +
        '<span style="font-size:13px">例：I read. → I read a book <b>at home every evening</b>.</span>'); return;
  }
  if (!hasWord(s, w.w)) {
    bad('这句话里没有用上「<b>' + esc(w.w) + '</b>」，这一关就是要练这个词。<br>' +
        '<span style="font-size:13px">（复数 ' + esc(w.w) + 's、过去式、加 ing 这些变形都算数）</span>'); return;
  }
  const prev = (mk.sents[mk.i] || []).filter((x, k) => x && k !== mk.j);
  const dup = prev.find(p => tooSimilar(p, s));
  if (dup) {
    bad('这句和你前面造的「' + esc(dup) + '」太像了。<br>换个<b>角度</b>再想一句：换人（I→My brother）、换时间（今天→昨天）、换地方，或改成问句/否定句 💡'); return;
  }
  /* 三道硬检查都过了 → 真正做语法判分（孩子没有判断能力，必须由系统给结论） */
  window.__mkS = s;
  const issues = checkGrammar(s);
  const errs = issues.filter(x => x.level === 'error');
  const warns = issues.filter(x => x.level === 'warn');
  const list = arr => '<ul class="chk">' + arr.map(x =>
      '<li>' + (x.level === 'error' ? '❌ ' : '💡 ') + x.why +
      '<br><span style="color:#c0392b;font-size:13.5px">→ ' + x.fix + '</span></li>').join('') + '</ul>';

  if (errs.length) {
    $('#mkFb').innerHTML =
      '<div class="fb bad">这句有 <b>' + errs.length + '</b> 个地方要改：' +
        '<div class="eg" style="margin:8px 0;background:#fff">' + esc(s) + '</div>' +
        list(errs) + (warns.length ? list(warns) : '') +
        '<div style="margin-top:8px;font-size:13.5px">📖 改完再按一次「检查」。也可以看看上面 3 个例句是怎么写的。</div>' +
      '</div>' +
      '<button class="btn btn-main" onclick="makeCheck()">改好了，再检查一次</button>' +
      '<button class="btn btn-ghost" onclick="makeGiveUp()">这句先跳过（记进错题本）</button>';
    return;
  }
  const passHtml =
    '<div class="fb ok">🎉 <b>语法检查通过！</b>拼写、大小写、标点、主谓一致、时态、冠词都没问题。' +
      (warns.length ? '<div style="margin-top:8px">还有一点小提醒（不算错）：</div>' + list(warns) : '') +
    '</div>';
  const acceptBtn = '<button class="btn btn-main" onclick="makeAccept()">收下这一句，写下一句 →</button>';
  if (!aiGetKey()) { $('#mkFb').innerHTML = passHtml + acceptBtn; return; }
  /* 有 Key → 再做一层：意思通不通、搭配对不对 */
  $('#mkFb').innerHTML = passHtml + '<div class="fb tip">⏳ 再让 AI 老师看一眼意思通不通…</div>';
  const r = await aiCheckSentence(w.w, s);
  if (!r || r.error) {                      /* AI 出问题不能影响孩子——语法结论照样算数 */
    $('#mkFb').innerHTML = passHtml +
      (r && r.error ? '<div class="fb tip">（' + esc(r.error) + '，语法检查的结论仍然有效）</div>' : '') +
      acceptBtn;
    return;
  }
  const betterHtml = r.better ?
    '<div class="eg" style="margin-top:8px">🌟 <b>更地道的说法</b>：' + esc(r.better) +
      (r.betterZh ? '<br><span style="color:#8a7fa8;font-size:13px">' + esc(r.betterZh) + '</span>' : '') + '</div>' : '';
  if (r.ok) {
    $('#mkFb').innerHTML = passHtml +
      '<div class="fb ok">✅ <b>意思也没问题</b>' + (r.tip ? '：' + esc(r.tip) : '') + betterHtml + '</div>' +
      acceptBtn;
  } else {
    $('#mkFb').innerHTML = passHtml +
      '<div class="fb bad">🤔 <b>语法没错，但意思上有问题</b>' + (r.tip ? '：' + esc(r.tip) : '') +
        (r.fix ? '<div class="eg" style="margin-top:8px;background:#fff">可以这样说：' + esc(r.fix) + '</div>' : '') +
        betterHtml + '</div>' +
      '<button class="btn btn-main" onclick="makeCheck()">改好了，再检查一次</button>' +
      '<button class="btn btn-ghost" onclick="makeAccept()">我觉得这句没问题，收下</button>';
  }
}
function makePass(ok) {
  const w = cur.sec.words[mk.i], s = window.__mkS || '';
  (mk.sents[mk.i] = mk.sents[mk.i] || [])[mk.j] = s;
  if (ok) mk.ok++; else addWrong(w, cur.sec, cur.unit, 'make', s);
  const total = cur.sec.words.length * MK_PER_WORD;
  const doneN = mk.i * MK_PER_WORD + mk.j + 1;
  setProg(cur.sec.id, 'make', doneN, total, mk.ok);
  /* 导航交给调用者（makeAccept / makeGiveUp），这里只记账 */
}
/* 一次点击就前进——「收下」之后还要再点一次「下一句」是多余操作 */
function makeAccept()  { makePass(true);  makeNext(); }
function makeGiveUp()  { makePass(false); makeNext(); }
function makeNext() { if (mk.j < MK_PER_WORD - 1) mk.j++; else { mk.j = 0; mk.i++; } makeRender(); }
function makePrev() { if (mk.j > 0) mk.j--; else if (mk.i > 0) { mk.i--; mk.j = MK_PER_WORD - 1; } makeRender(); }

renderHome();
</script>
<script src="assets/sync.js"></script>
</body>
