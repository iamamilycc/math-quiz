y much.", "We enjoyed the football match very much."]}, {"w": "pen", "ipa": "/pen/", "pos": "n. 名词", "zh": "钢笔", "lesson": 2, "native": {"pat": "borrow / lend a pen", "eg": "Could I borrow your pen for a second?", "zh": "能借你的笔用一下吗？"}, "egs": ["My uncle gave me a new pen.", "Is this red pen yours or mine?", "I write my homework with a pen."]}, {"w": "pencil", "ipa": "/ˈpensl/", "pos": "n. 名词", "zh": "铅笔", "lesson": 2, "native": {"pat": "sharpen a pencil", "eg": "I need to sharpen my pencil first.", "zh": "我得先把铅笔削一下。"}, "egs": ["Please lend me your pencil for a minute.", "The pencil fell down under the desk.", "She draws pictures with a soft pencil."]}, {"w": "book", "ipa": "/bʊk/", "pos": "n. 名词", "zh": "书", "lesson": 2, "native": {"pat": "read / borrow a book", "eg": "I borrowed this book from the library.", "zh": "这本书是我从图书馆借的。"}, "egs": ["This book is really interesting to read.", "I borrowed a book from the library.", "My brother reads a book every evening."]}, {"w": "watch", "ipa": "/wɒtʃ/", "pos": "n. 名词", "zh": "手表", "lesson": 2, "native": {"pat": "wear a watch", "eg": "My father wears the same watch every day.", "zh": "我爸爸每天都戴同一块表。", "note": "「戴表」是 wear a watch，不是 put a watch。"}, "egs": ["My father wears an old gold watch.", "Is this your watch on the table?", "She got a new watch for her birthday."]}, {"w": "coat", "ipa": "/kəʊt/", "pos": "n. 名词", "zh": "外套，上衣", "lesson": 2, "native": {"pat": "put on / take off your coat", "eg": "Put on your coat, it is cold outside.", "zh": "穿上外套，外面冷。"}, "egs": ["Put on your coat before you go.", "This warm coat belongs to my sister.", "He left his coat in the classroom."]}, {"w": "dress", "ipa": "/dres/", "pos": "n. 名词", "zh": "连衣裙", "lesson": 2, "native": {"pat": "wear a dress", "eg": "She wore a lovely blue dress to the party.", "zh": "她穿了一条漂亮的蓝裙子去派对。"}, "egs": ["My mother made a beautiful blue dress.", "She wore a long dress to the party.", "This dress is too small for me."]}, {"w": "skirt", "ipa": "/skɜːt/", "pos": "n. rry to his little sister."]}, {"w": "sir", "ipa": "/sɜː/", "pos": "n. 名词", "zh": "先生（对男子的尊称）", "lesson": 3, "native": {"pat": "Excuse me, sir. / Thank you, sir.", "eg": "Excuse me, sir, is this seat free?", "zh": "打扰一下先生，这个座位有人吗？", "note": "sir 用在对陌生男士或顾客的礼貌称呼。"}, "egs": ["Sorry, sir, this is not your coat.", "Good morning, sir, may I help you?", "The waiter said thank you, sir."]}, {"w": "cloakroom", "ipa": "/ˈkləʊkrʊm/", "pos": "n. 名词", "zh": "衣帽间", "lesson": 4, "native": {"pat": "leave sth in the cloakroom", "eg": "Please leave your coat in the cloakroom.", "zh": "请把外套放在衣帽间。"}, "egs": ["My coat is in the cloakroom downstairs.", "Please leave your bag in the cloakroom.", "The cloakroom is next to the main door."]}, {"w": "suit", "ipa": "/suːt/", "pos": "n. 名词", "zh": "一套衣服，西装", "lesson": 4, "native": {"pat": "wear a suit", "eg": "He wears a dark suit to work.", "zh": "他穿深色西装上班。"}, "egs": ["My father wears a dark blue suit.", "This new suit is very expensive.", "He bought a grey suit for the wedding."]}, {"w": "school", "ipa": "/skuːl/", "pos": "n. 名词", "zh": "学校", "lesson": 4, "native": {"pat": "go to school / at school", "eg": "My little brother goes to school by bus.", "zh": "我弟弟坐公交车上学。", "note": "「上学」是 go to school，不加 the。"}, "egs": ["I go to school by bike every day.", "Our school is near the small park.", "The children come home from school at four."]}, {"w": "teacher", "ipa": "/ˈtiːtʃə/", "pos": "n. 名词", "zh": "老师", "lesson": 4, "native": {"pat": "a maths / English teacher", "eg": "She is an English teacher at our school.", "zh": "她是我们学校的英语老师。"}, "egs": ["My English teacher is very kind.", "The teacher asked us a difficult question.", "She wants to be a maths teacher."]}, {"w": "son", "ipa": "/sʌn/", "pos": "n. 名词", "zh": "儿子", "lesson": 4, "native": {"pat": "their eldest son", "eg": "Their eldest son works in London.", "zh": "他们的大儿子在伦敦工作。"}, "egs": ["Their son studies at a good school.", "Mr. Green has one son and two daughters.", "My aunt's son is only six years old."]}, {"w": "daughter", "ipa": "/ˈdɔːtə/", "pos": "n. 名词", "zh": "女儿", "lesson": 4, "native": {"pat": "their youngest daughter", "eg": "Their youngest daughter is only three.", "zh": "他们最小的女儿才三岁。"}, "egs": ["Their daughter plays the piano very well.", "My neighbour has a clever little daughter.", "She is the daughter of a famous doctor."]}]}, {"id": "w-u1-s3", "title": "Lesson 5-6　Nice to meet you.　很高兴见到你", "words": [{"w": "Mr.", "ipa": "/ˈmɪstə/", "pos": "n. 名词", "zh": "先生（用在姓氏前）", "lesson": 5, "native": {"pat": "Mr. + 姓氏", "eg": "Mr. Brown will see you in a minute.", "zh": "布朗先生马上就来见您。", "note": "Mr. 后面只跟姓，不跟名字。"}, "egs": ["Mr. Green is our new English teacher.", "I met Mr. Smith at the station yesterday.", "Please give this letter to Mr. Brown."]}, {"w": "Miss", "ipa": "/mɪs/", "pos": "n. 名词", "zh": "小姐（用在未婚女子姓氏前）", "lesson": 5, "native": {"pat": "Miss + 姓氏", "eg": "Miss Green teaches us music.", "zh": "格林小姐教我们音乐。", "note": "不确定婚姻状况时，现在更常用 Ms.。"}, "egs": ["Miss Wang teaches us music every Friday.", "Good morning, Miss Green, how are you?", "Miss Brown works in a big hospital."]}, {"w": "good", "ipa": "/ɡʊd/", "pos": "adj. 形容词", "zh": "好的", "lesson": 5, "native": {"pat": "be good at / have a good time", "eg": "She is very good at playing the piano.", "zh": "她钢琴弹得很好。", "note": "「擅长做某事」是 be good at doing。"}, "egs": ["This is a very good English book.", "My brother is good at playing football.", "We had a good time at the party."]}, {"w": "morning", "ipa": "/ˈmɔːnɪŋ/", "pos": "n. 名词", "zh": "早晨，上午", "lesson": 5, "native": {"pat": "in the morning / Good morning!", "eg": "I always read in the morning.", "zh": "我总是在早上读书。"}, "egs": ["I get up at six every morning.", "Good morning, sir, may I help you?", "We have four lessons in the morning."]}, {"w": "new", "ipa": "/njuː/", "pos": "adj. 形容词", "zh": "新的", "lesson": 5, "native": {"pat": "brand new / a new one", "eg": "My old phone broke, so I bought a new one.", "zh": "旧手机坏了，我就买了个新的。"}, "egs": ["She bought a new dress last Sunday.", "Our new teacher comes from England.", "This new book is really interesting."]}, {"w": "student", "ipa": "/ˈstjuːdnt/", "pos": "n. 名词", "zh": "学生", "lesson": 5, "native": {"pat": "a first-year student", "eg": "He is a first-year student at that college.", "zh": "他是那所学院的一年级学生。"}, "egs": ["My sister is a student at that school.", "Every student in our class works hard.", "The new student comes from France."]}, {"w": "French", "ipa": "/frentʃ/", "pos": "adj./n. 形容词/名词", "zh": "法国的；法国人；法语", "lesson": 5, "native": {"pat": "speak French / French food", "eg": "She speaks French and Italian fluently.", "zh": "她法语和意大利语都很流利。", "note": "语言名前不加 the。"}, "egs": ["Sophie is French and she speaks English.", "We learn French at our school.", "This French book belongs to my aunt."]}, {"w": "German", "ipa": "/ˈdʒɜːmən/", "pos": "adj./n. 形容词/名词", "zh": "德国的；德国人；德语", "lesson": 5, "native": {"pat": "learn German", "eg": "He is learning German at evening classes.", "zh": "他在夜校学德语。"}, "egs": ["Hans is German and he lives here.", "My uncle bought a German car.", "She is learning German at night."]}, {"w": "nice", "ipa": "/naɪs/", "pos": "adj. 形容词", "zh": "美好的，令人愉快的", "lesson": 5, "native": {"pat": "It's nice to … / have a nice day", "eg": "It is nice to see you again.", "zh": "很高兴又见到你。"}, "egs": ["Nice to meet you here today.", "That is a very nice blue skirt.", "We had a nice day at the park."]}, {"w": "meet", "ipa": "/miːt/", "pos": "v. 动词", "zh": "遇见，见面", "lesson": 5, "native": {"pat": "Nice to meet you. / meet up", "eg": "Let us meet outside the library at four.", "zh": "我们四点在图书馆外面见吧。", "note": "第一次见面说 Nice to meet you，再见面说 Nice to see you。"}, "egs": ["I will meet my friend at four.", "We meet our teacher every Monday morning.", "Nice to meet you, Mr. Green."]}, {"w": "too", "ipa": "/tuː/", "pos": "adv. 副词", "zh": "也，还（用于句末）", "lesson": 5, "native": {"pat": "… too (放句尾) / me too", "eg": "My sister likes swimming, and I do too.", "zh": "我姐姐喜欢游泳，我也喜欢。", "note": "「也」放句尾用 too，放句中用 also。"}, "egs": ["My brother is a student too.", "She likes music and I like it too.", "He is Chinese and his wife is Chinese too."]}, {"w": "Japanese", "ipa": "/ˌdʒæpəˈniːz/", "pos": "adj./n. 形容词/名词", "zh": "日本的；日本人；日语", "lesson": 5, "native": {"pat": "speak Japanese / Japanese food", "eg": "We had Japanese food last night.", "zh": "我们昨晚吃了日本菜。"}, "egs": ["Naoko is Japanese and she is very kind.", "My father can speak a little Japanese.", "This Japanese car is quite expensive."]}, {"w": "Korean", "ipa": "/kəˈriːən/", "pos": "adj./n. 形容词/名词", "zh": "韩国的；韩国人；韩语", "lesson": 5, "native": {"pat": "Korean food / a Korean film", "eg": "We watched a Korean film last weekend.", "zh": "我们上周末看了一部韩国电影。"}, "egs": ["My new classmate is Korean.", "We watched a Korean film last night.", "She wants to learn Korean next year."]}, {"w": "Chinese", "ipa": "/ˌtʃaɪˈniːz/", "pos": "adj./n. 形容词/名词", "zh": "中国的；中国人；汉语", "lesson": 5, "native": {"pat": "speak Chinese / Chinese New Year", "eg": "Many people are learning Chinese now.", "zh": "现在很多人在学中文。"}, "egs": ["I am Chinese and I live in Beijing.", "He is learning Chinese at our school.", "This Chinese book is very interesting."]}, {"w": "make", "ipa": "/meɪk/", "pos": "n. 名词", "zh": "（产品的）牌子，型号", "lesson": 6, "native": {"pat": "What make is it?", "eg": "What make is that new camera?", "zh": "那台新相机是什么牌子的？", "note": "问牌子说 What make is it?，日常也常说 What brand is it?"}, "egs": ["What make is your new car?", "I do not know the make of this watch.", "This make of shoes is very popular."]}, {"w": "Sweden", "ipa": "/ˈswiːdn/", "pos": "n. 名词", "zh": "瑞典", "lesson": 6, "native": {"pat": "come from Sweden / in Sweden", "eg": "Her husband comes from Sweden.", "zh": "她丈夫来自瑞典。"}, "egs": ["My uncle works in Sweden now.", "Sweden is a country in northern Europe.", "She went to Sweden last summer."]}, {"w": "Swedish", "ipa": "/ˈswiːdɪʃ/", "pos": "adj./n. 形容词/名词", "zh": "瑞典的；瑞典人；瑞典语", "lesson": 6, "native": {"pat": "Swedish design / speak Swedish", "eg": "Swedish design is famous around the world.", "zh": "瑞典设计闻名世界。"}, "egs": ["This Swedish car is very safe.", "My friend is Swedish and speaks English well.", "He is learning Swedish in his free time."]}, {"w": "England", "ipa": "/ˈɪŋɡlənd/", "pos": "n. 名词", "zh": "英格兰，英国", "lesson": 6, "native": {"pat": "in England / go to England", "eg": "She has lived in England for ten years.", "zh": "她在英国住了十年。"}, "egs": ["My aunt has lived in England for years.", "England is famous for its rainy weather.", "They will fly to England next month."]}, {"w": "English", "ipa": "/ˈɪŋɡlɪʃ/", "pos": "adj./n. 形容词/名词", "zh": "英国的；英国人；英语", "lesson": 6, "native": {"pat": "speak English / in English", "eg": "Please say it in English, not Chinese.", "zh": "请用英语说，不要用中文。", "note": "「用英语说」是 in English，不是 use English。"}, "egs": ["We have an English lesson every day.", "My English teacher is very patient.", "She speaks English better than her brother."]}, {"w": "America", "ipa": "/əˈmerɪkə/", "pos": "n. 名词", "zh": "美国；美洲", "lesson": 6, "native": {"pat": "in America / go to America", "eg": "His cousin has worked in America for years.", "zh": "他表哥在美国工作好多年了。"}, "egs": ["His cousin studies music in America.", "America is a very large country.", "They moved to America three years ago."]}, {"w": "American", "ipa": "/əˈmerɪkən/", "pos": "adj./n. 形容词/名词", "zh": "美国的；美国人", "lesson": 6, "native": {"pat": "an American accent", "eg": "He speaks with a strong American accent.", "zh": "他说话带很重的美国口音。"}, "egs": ["My new neighbour is an American.", "This American film is really funny.", "American English sounds a little different."]}, {"w": "Italy", "ipa": "/ˈɪtəli/", "pos": "n. 名词", "zh": "意大利", "lesson": 6, "native": {"pat": "travel to Italy / in Italy", "eg": "We are travelling to Italy next month.", "zh": "我们下个月要去意大利旅行。"}, "egs": ["Italy is famous for its beautiful cities.", "We spent two weeks in Italy.", "My teacher came back from Italy yesterday."]}, {"w": "Italian", "ipa": "/ɪˈtæliən/", "pos": "adj./n. 形容词/名词", "zh": "意大利的；意大利人；意大利语", "lesson": 6, "native": {"pat": "Italian food / speak Italian", "eg": "Italian food is popular everywhere.", "zh": "意大利菜到处都受欢迎。"}, "egs": ["Robert is Italian and he lives here.", "We had a nice Italian dinner last night.", "She is learning Italian this year."]}]}, {"id": "w-u1-s4", "title": "Lesson 7-8　Are you a teacher?　你是老师吗？", "words": [{"w": "I", "ipa": "/aɪ/", "pos": "pron. 代词（主格）", "zh": "我", "lesson": 7, "native": {"pat": "I'd like … / I think …", "eg": "I would like to ask you something.", "zh": "我想问你件事。", "note": "I'd like 比 I want 客气得多。"}, "egs": ["I am a student at this school.", "Every morning I walk to the park.", "Can I use your pen for a minute?"]}, {"w": "am", "ipa": "/æm/", "pos": "v. 动词", "zh": "be 动词，跟在「我」后面用", "lesson": 7, "native": {"pat": "I'm afraid … / I'm sorry but …", "eg": "I am afraid I cannot come tonight.", "zh": "恐怕我今晚来不了。", "note": "委婉拒绝常用 I'm afraid。"}, "egs": ["I am very happy to see you.", "I am not a teacher, I am a nurse.", "Am I late for the English lesson?"]}, {"w": "are", "ipa": "/ɑː/", "pos": "v. 动词", "zh": "be 动词，跟在「你/我们/他们」后面用", "lesson": 7, "native": {"pat": "Are you free …? / You are welcome.", "eg": "Are you free this Saturday afternoon?", "zh": "你这周六下午有空吗？"}, "egs": ["You are my best friend at school.", "They are very busy this morning.", "Are you a student in this class?"]}, {"w": "name", "ipa": "/neɪm/", "pos": "n. 名词", "zh": "名字", "lesson": 7, "native": {"pat": "My name is … / What's your name?", "eg": "May I ask what your name is?", "zh": "请问您怎么称呼？"}, "egs": ["What is your full name, please?", "My name is written on the book.", "I cannot remember the name of that street."]}, {"w": "what", "ipa": "/wɒt/", "pos": "pron. 代词", "zh": "什么", "lesson": 7, "native": {"pat": "What do you do? / What's it like?", "eg": "What is the weather like in your city?", "zh": "你们那儿天气怎么样？", "note": "问「怎么样」用 What is it like?"}, "egs": ["What is your telephone number, please?", "I do not know what he wants.", "What did you do last Sunday?"]}, {"w": "nationality", "ipa": "/ˌnæʃəˈnæləti/", "pos": "n. 名词", "zh": "国籍", "lesson": 7, "native": {"pat": "What nationality are you?", "eg": "People of many nationalities live in this city.", "zh": "这座城市住着很多不同国籍的人。"}, "egs": ["What nationality is your new teacher?", "Please write your nationality on this form.", "People of every nationality live in this city."]}, {"w": "job", "ipa": "/dʒɒb/", "pos": "n. 名词", "zh": "工作，职业", "lesson": 7, "native": {"pat": "get a job / a full-time job", "eg": "She got a new job last month.", "zh": "她上个月找到了新工作。", "note": "「找工作」是 look for a job。"}, "egs": ["What is your father's job now?", "She found a new job last month.", "This job is very hard but interesting."]}, {"w": "keyboard operator", "ipa": "/ˈkiːbɔːd ˈɒpəreɪtə/", "pos": "n. 名词", "zh": "电脑打字员", "lesson": 7, "native": {"pat": "work as a keyboard operator", "eg": "She works as a keyboard operator downtown.", "zh": "她在市区做打字员。"}, "egs": ["My aunt works as a keyboard operator.", "The keyboard operator types very quickly.", "She was a keyboard operator in that office."]}, {"w": "engineer", "ipa": "/ˌendʒɪˈnɪə/", "pos": "n. 名词", "zh": "工程师", "lesson": 7, "native": {"pat": "a software / civil engineer", "eg": "My uncle is a software engineer.", "zh": "我叔叔是软件工程师。"}, "egs": ["My uncle is an engineer in Shanghai.", "The engineer fixed our old washing machine.", "He wants to be an engineer one day."]}, {"w": "policeman", "ipa": "/pəˈliːsmən/", "pos": "n. 名词", "zh": "警察（男）", "lesson": 8, "native": {"pat": "call a policeman", "eg": "A policeman helped us find the way.", "zh": "一位警察帮我们指了路。", "note": "现在更常用中性的 police officer。"}, "egs": ["A policeman helped me find the station.", "My neighbour is a policeman in this city.", "The policeman asked us many questions."]}, {"w": "policewoman", "ipa": "/pəˈliːswʊmən/", "pos": "n. 名词", "zh": "女警察", "lesson": 8, "native": {"pat": "a policewoman on duty", "eg": "A policewoman was standing at the gate.", "zh": "一位女警站在门口。"}, "egs": ["A policewoman was standing near the door.", "Her mother is a policewoman in Beijing.", "The policewoman spoke to us very kindly."]}, {"w": "taxi driver", "ipa": "/ˈtæksi ˈdraɪvə/", "pos": "n. 名词", "zh": "出租车司机", "lesson": 8, "native": {"pat": "a taxi driver / take a taxi", "eg": "The taxi driver knew every street here.", "zh": "那位出租车司机熟悉这里每条街。"}, "egs": ["The taxi driver took us to the airport.", "My cousin works as a taxi driver.", "That taxi driver knows every street here."]}, {"w": "air hostess", "ipa": "/eə ˈhəʊstəs/", "pos": "n. 名词", "zh": "空姐", "lesson": 8, "native": {"pat": "work as an air hostess", "eg": "She works as an air hostess for that airline.", "zh": "她在那家航空公司当空乘。", "note": "现在更常说 flight attendant。"}, "egs": ["The air hostess gave us some water.", "My sister wants to be an air hostess.", "An air hostess must speak good English."]}, {"w": "postman", "ipa": "/ˈpəʊstmən/", "pos": "n. 名词", "zh": "邮递员", "lesson": 8, "native": {"pat": "the postman comes", "eg": "The postman comes at eight every morning.", "zh": "邮递员每天早上八点来。"}, "egs": ["The postman comes here every morning.", "A postman brought this letter for you.", "Our postman works very hard in winter."]}, {"w": "nurse", "ipa": "/nɜːs/", "pos": "n. 名词", "zh": "护士", "lesson": 8, "native": {"pat": "a nurse looks after patients", "eg": "The nurse looked after him very well.", "zh": "护士把他照顾得很好。"}, "egs": ["My mother is a nurse in that hospital.", "The nurse looked after me very well.", "She studied hard and became a nurse."]}, {"w": "mechanic", "ipa": "/məˈkænɪk/", "pos": "n. 名词", "zh": "机械修理工", "lesson": 8, "native": {"pat": "a car mechanic", "eg": "The mechanic fixed my car in an hour.", "zh": "修车师傅一小时就修好了我的车。"}, "egs": ["The mechanic repaired my father's car.", "He works as a mechanic near our house.", "A good mechanic can fix any engine."]}, {"w": "hairdresser", "ipa": "/ˈheədresə/", "pos": "n. 名词", "zh": "理发师", "lesson": 8, "native": {"pat": "go to the hairdresser", "eg": "I go to the hairdresser once a month.", "zh": "我一个月去一次理发店。"}, "egs": ["My aunt is a hairdresser in this town.", "The hairdresser cut my hair very short.", "She goes to the hairdresser every month."]}, {"w": "housewife", "ipa": "/ˈhaʊswaɪf/", "pos": "n. 名词", "zh": "家庭主妇", "lesson": 8, "native": {"pat": "a full-time housewife", "eg": "She was a full-time housewife for years.", "zh": "她做了多年全职家庭主妇。"}, "egs": ["His mother is a busy housewife.", "A housewife works hard every single day.", "The housewife bought some bread and milk."]}, {"w": "housework", "ipa": "/ˈhaʊswɜːk/", "pos": "n. 名词", "zh": "家务", "lesson": 8, "native": {"pat": "do the housework", "eg": "I help my mother do the housework.", "zh": "我帮妈妈做家务。", "note": "「做家务」是 do housework，不是 make housework。"}, "egs": ["I help my mother with the housework.", "She finished all the housework before lunch.", "Doing housework takes a lot of time."]}, {"w": "milkman", "ipa": "/ˈmɪlkmæn/", "pos": "n. 名词", "zh": "送奶工", "lesson": 8, "native": {"pat": "the milkman delivers milk", "eg": "The milkman delivers milk every morning.", "zh": "送奶工每天早上送奶。"}, "egs": ["The milkman comes very early every morning.", "Our milkman left two bottles at the door.", "He worked as a milkman for ten years."]}]}, {"id": "w-u1-s5", "title": "Lesson 9-10　How are you today?　你今天好吗？", "words": [{"w": "hello", "ipa": "/həˈləʊ/", "pos": "int. 感叹语", "zh": "喂，你好", "lesson": 9, "native": {"pat": "Hello, this is … (打电话)", "eg": "Hello, this is Tom speaking.", "zh": "你好，我是汤姆。", "note": "打电话报名字用 This is，不用 I am。"}, "egs": ["Hello, how are you this morning?", "She said hello to me at school.", "Hello, is that Mr. Green speaking?"]}, {"w": "hi", "ipa": "/haɪ/", "pos": "int. 感叹语", "zh": "嗨（比 hello 更随便）", "lesson": 9, "native": {"pat": "Hi there! / Hi, how are you?", "eg": "Hi, how was your weekend?", "zh": "嗨，你周末过得怎么样？"}, "egs": ["Hi, are you free this afternoon?", "He just said hi and walked away.", "Hi, my name is Tom Green."]}, {"w": "how", "ipa": "/haʊ/", "pos": "adv. 副词", "zh": "怎样，如何", "lesson": 9, "native": {"pat": "How about …? / How come?", "eg": "How about going swimming this afternoon?", "zh": "今天下午去游泳怎么样？", "note": "提建议用 How about doing…?"}, "egs": ["How do you go to school every day?", "I do not know how he did it.", "How old is your little brother?"]}, {"w": "today", "ipa": "/təˈdeɪ/", "pos": "adv./n. 副词/名词", "zh": "今天", "lesson": 9, "native": {"pat": "earlier today / today's paper", "eg": "I saw him earlier today at the station.", "zh": "我今天早些时候在车站看到他了。"}, "egs": ["We have three English lessons today.", "Today is my grandmother's birthday.", "The weather is much better today."]}, {"w": "well", "ipa": "/wel/", "pos": "adj./adv. 形容词/副词", "zh": "身体好的；好地", "lesson": 9, "native": {"pat": "do well / get well soon", "eg": "She did very well in the test.", "zh": "她考试考得很好。", "note": "「考得好」是 do well，不是 do good。"}, "egs": ["I am very well, thank you.", "My sister sings very well.", "He did not feel well this morning."]}, {"w": "fine", "ipa": "/faɪn/", "pos": "adj. 形容词", "zh": "健康的；晴朗的", "lesson": 9, "native": {"pat": "I'm fine, thanks. / That's fine.", "eg": "That is fine with me, thank you.", "zh": "我没问题，谢谢。"}, "egs": ["I am fine, thanks for asking.", "It was a fine day for a picnic.", "Everything is fine at home now."]}, {"w": "thanks", "ipa": "/θæŋks/", "pos": "n. 名词", "zh": "谢谢（比 thank you 随便）", "lesson": 9, "native": {"pat": "Thanks a lot. / Thanks anyway.", "eg": "Thanks a lot for your kind help.", "zh": "非常感谢你的帮忙。"}, "egs": ["Thanks for your help this morning.", "Many thanks for the lovely present.", "He gave me a smile and said thanks."]}, {"w": "goodbye", "ipa": "/ˌɡʊdˈbaɪ/", "pos": "int. 感叹语", "zh": "再见", "lesson": 9, "native": {"pat": "Goodbye for now. / See you!", "eg": "We said goodbye and went home.", "zh": "我们道了别就回家了。", "note": "日常口语更常说 Bye 或 See you。"}, "egs": ["She said goodbye and left the room.", "Goodbye, see you again next week.", "We waved goodbye to our old teacher."]}, {"w": "see", "ipa": "/siː/", "pos": "v. 动词", "zh": "看见，见到", "lesson": 9, "native": {"pat": "See you later. / I see.", "eg": "I will see you later this evening.", "zh": "今晚晚些时候见。", "note": "「我明白了」是 I see。"}, "egs": ["See you tomorrow morning at school.", "I can see two birds in that tree.", "Did you see my brother this afternoon?"]}, {"w": "fat", "ipa": "/fæt/", "pos": "adj. 形容词", "zh": "胖的", "lesson": 10, "native": {"pat": "put on weight (委婉说法)", "eg": "Our old cat is getting rather fat.", "zh": "我们家的老猫越来越胖了。", "note": "说人胖直接用 fat 不礼貌，欧美人会说 put on weight。"}, "egs": ["Their dog is very fat and lazy.", "This fat cat sleeps all day long.", "He was quite fat when he was young."]}, {"w": "woman", "ipa": "/ˈwʊmən/", "pos": "n. 名词", "zh": "女人（复数 women）", "lesson": 10, "native": {"pat": "a young woman / women (复数)", "eg": "A young woman asked me for directions.", "zh": "一位年轻女士向我问路。"}, "egs": ["That woman is our new English teacher.", "A young woman was waiting at the door.", "The woman in the blue coat is my aunt."]}, {"w": "thin", "ipa": "/θɪn/", "pos": "adj. 形容词", "zh": "瘦的；薄的", "lesson": 10, "native": {"pat": "slim (夸人苗条)", "eg": "She is quite thin, so slim sounds kinder.", "zh": "她挺瘦的，用 slim 来形容更好听。", "note": "夸人瘦用 slim，thin 偏中性甚至有点消极。"}, "egs": ["My brother is tall and rather thin.", "This book is very thin but useful.", "She looked thin after her long illness."]}, {"w": "tall", "ipa": "/tɔːl/", "pos": "adj. 形容词", "zh": "高的（人或物）", "lesson": 10, "native": {"pat": "How tall are you?", "eg": "How tall is your younger brother?", "zh": "你弟弟多高？", "note": "问人身高用 How tall，问物体高度用 How high。"}, "egs": ["My father is taller than my uncle.", "There is a tall tree behind our house.", "He is the tallest boy in our class."]}, {"w": "short", "ipa": "/ʃɔːt/", "pos": "adj. 形容词", "zh": "矮的；短的", "lesson": 10, "native": {"pat": "a short walk / short hair", "eg": "We went for a short walk after dinner.", "zh": "晚饭后我们出去散了会儿步。"}, "egs": ["She wore a short blue skirt today.", "My little sister is still quite short.", "We had a short lesson this morning."]}, {"w": "dirty", "ipa": "/ˈdɜːti/", "pos": "adj. 形容词", "zh": "脏的", "lesson": 10, "native": {"pat": "get dirty", "eg": "His shoes got dirty in the rain.", "zh": "他的鞋在雨里弄脏了。"}, "egs": ["Your shirt is very dirty this evening.", "He washed his dirty hands before lunch.", "The floor was dirty after the party."]}, {"w": "clean", "ipa": "/kliːn/", "pos": "adj. 形容词", "zh": "干净的", "lesson": 10, "native": {"pat": "keep sth clean", "eg": "Please keep the kitchen clean and tidy.", "zh": "请保持厨房干净整洁。"}, "egs": ["Please keep your room clean and tidy.", "She put on a clean white shirt.", "The kitchen looks very clean today."]}, {"w": "hot", "ipa": "/hɒt/", "pos": "adj. 形容词", "zh": "热的", "lesson": 10, "native": {"pat": "It's boiling hot. / a hot drink", "eg": "Would you like a hot drink?", "zh": "你想喝点热的吗？"}, "egs": ["It is very hot in summer here.", "I would like a cup of hot tea.", "The soup was too hot to drink."]}, {"w": "cold", "ipa": "/kəʊld/", "pos": "adj. 形容词", "zh": "冷的", "lesson": 10, "native": {"pat": "catch a cold / It's freezing.", "eg": "Put on a coat or you will catch a cold.", "zh": "穿上外套，不然要感冒了。", "note": "「感冒」是 catch a cold。"}, "egs": ["The water in the river is cold.", "It was a cold and windy morning.", "Put on your coat, it is cold outside."]}, {"w": "old", "ipa": "/əʊld/", "pos": "adj. 形容词", "zh": "老的；旧的", "lesson": 10, "native": {"pat": "How old are you? / an old friend", "eg": "We met an old friend at the station.", "zh": "我们在车站遇到一位老朋友。"}, "egs": ["My grandfather is eighty years old.", "This old house belongs to my family.", "He gave his old bike to his brother."]}, {"w": "young", "ipa": "/jʌŋ/", "pos": "adj. 形容词", "zh": "年轻的", "lesson": 10, "native": {"pat": "young people / look young", "eg": "Young people love this kind of music.", "zh": "年轻人很喜欢这种音乐。"}, "egs": ["Our new teacher is very young.", "The young man helped an old woman.", "She looks younger than her sister."]}, {"w": "busy", "ipa": "/ˈbɪzi/", "pos": "adj. 形容词", "zh": "忙的", "lesson": 10, "native": {"pat": "be busy doing sth", "eg": "She is busy preparing for the test.", "zh": "她正忙着准备考试。", "note": "「忙着做某事」用 busy doing，不加 to。"}, "egs": ["My father is busy every weekday morning.", "She was too busy to answer the phone.", "This is a very busy street at night."]}, {"w": "lazy", "ipa": "/ˈleɪzi/", "pos": "adj. 形容词", "zh": "懒的", "lesson": 10, "native": {"pat": "a lazy afternoon", "eg": "We spent a lazy afternoon in the garden.", "zh": "我们在花园里悠闲地过了一下午。"}, "egs": ["That lazy boy never does his homework.", "Our cat is lazy on hot afternoons.", "He was lazy but he is working hard now."]}]}, {"id": "w-u1-s6", "title": "Lesson 11-12　Is this your shirt?　这是你的衬衫吗？", "words": [{"w": "whose", "ipa": "/huːz/", "pos": "pron. 代词", "zh": "谁的", "lesson": 11, "native": {"pat": "Whose is this? / Whose turn is it?", "eg": "Whose turn is it to wash the dishes?", "zh": "该谁洗碗了？"}, "egs": ["Whose umbrella is standing by the door?", "I do not know whose book this is.", "Whose turn is it to clean the room?"]}, {"w": "blue", "ipa": "/bluː/", "pos": "adj. 形容词", "zh": "蓝色的", "lesson": 11, "native": {"pat": "dark / light blue", "eg": "She was wearing a dark blue coat.", "zh": "她穿着一件深蓝色外套。"}, "egs": ["She was wearing a blue dress yesterday.", "The sky is very blue this morning.", "My favourite colour is dark blue."]}, {"w": "perhaps", "ipa": "/pəˈhæps/", "pos": "adv. 副词", "zh": "大概，也许", "lesson": 11, "native": {"pat": "Perhaps we could …", "eg": "Perhaps we could meet on Friday.", "zh": "也许我们可以周五见面。", "note": "提建议时 Perhaps 让语气更委婉。"}, "egs": ["Perhaps it will rain this afternoon.", "He is perhaps the tallest boy here.", "Perhaps you left your keys at home."]}, {"w": "white", "ipa": "/waɪt/", "pos": "adj. 形容词", "zh": "白色的", "lesson": 11, "native": {"pat": "black and white / snow white", "eg": "The old photograph is black and white.", "zh": "那张老照片是黑白的。"}, "egs": ["My father wears a white shirt today.", "They live in a small white house.", "The snow made everything white outside."]}, {"w": "catch", "ipa": "/kætʃ/", "pos": "v. 动词", "zh": "抓住，接住", "lesson": 11, "native": {"pat": "catch a bus / catch a cold", "eg": "We must run to catch the last bus.", "zh": "我们得跑起来才能赶上末班车。", "note": "「赶上车」是 catch，不是 get on time。"}, "egs": ["Try to catch the ball with both hands.", "We must run or we will not catch the bus.", "The cat caught a mouse last night."]}, {"w": "father", "ipa": "/ˈfɑːðə/", "pos": "n. 名词", "zh": "父亲", "lesson": 12, "native": {"pat": "my father / dad (口语)", "eg": "My father taught me how to swim.", "zh": "我爸爸教我游泳的。"}, "egs": ["My father works in a big factory.", "Her father teaches English at our school.", "I went to the park with my father."]}, {"w": "mother", "ipa": "/ˈmʌðə/", "pos": "n. 名词", "zh": "母亲", "lesson": 12, "native": {"pat": "my mother / mum (口语)", "eg": "My mother makes wonderful bread.", "zh": "我妈妈做的面包很棒。"}, "egs": ["My mother makes very good bread.", "His mother is a doctor in this town.", "I helped my mother with the housework."]}, {"w": "blouse", "ipa": "/blaʊz/", "pos": "n. 名词", "zh": "女式衬衫", "lesson": 12, "native": {"pat": "a silk blouse", "eg": "She bought a white silk blouse.", "zh": "她买了一件白色真丝衬衫。"}, "egs": ["She bought a white blouse last week.", "This blouse is too small for me.", "Her blouse matches her blue skirt well."]}, {"w": "sister", "ipa": "/ˈsɪstə/", "pos": "n. 名词", "zh": "姐妹", "lesson": 12, "native": {"pat": "my elder / younger sister", "eg": "My younger sister studies in London.", "zh": "我妹妹在伦敦读书。"}, "egs": ["My sister studies music at university.", "His little sister is only four years old.", "I share a room with my sister."]}, {"w": "tie", "ipa": "/taɪ/", "pos": "n. 名词", "zh": "领带", "lesson": 12, "native": {"pat": "wear a tie / do up a tie", "eg": "He never wears a tie to work.", "zh": "他上班从不打领带。"}, "egs": ["My father wears a dark blue tie.", "This tie was a present from my aunt.", "He cannot find his tie this morning."]}, {"w": "brother", "ipa": "/ˈbrʌðə/", "pos": "n. 名词", "zh": "兄弟", "lesson": 12, "native": {"pat": "my elder brother", "eg": "My elder brother works in a bank.", "zh": "我哥哥在银行工作。"}, "egs": ["My brother plays football every Saturday.", "Her brother works in a small shop.", "I have one brother and two sisters."]}, {"w": "his", "ipa": "/hɪz/", "pos": "adj./pron. 物主代词", "zh": "他的", "lesson": 12, "native": {"pat": "his own …", "eg": "He built the bookcase with his own hands.", "zh": "他亲手做了这个书架。"}, "egs": ["His coat is hanging behind the door.", "This blue pen is his, not mine.", "He forgot his homework at home again."]}]}, {"id": "w-u1-s7", "title": "Lesson 13-14　A new dress　一件新连衣裙", "words": [{"w": "colour", "ipa": "/ˈkʌlə/", "pos": "n. 名词", "zh": "颜色（美式拼作 color）", "lesson": 13, "native": {"pat": "What colour is …? / bright colours", "eg": "What colour is your new schoolbag?", "zh": "你的新书包是什么颜色的？", "note": "英式拼 colour，美式拼 color，新概念用英式。"}, "egs": ["What colour is your new schoolbag?", "Red is my favourite colour of all.", "The colour of this coat is too dark."]}, {"w": "come", "ipa": "/kʌm/", "pos": "v. 动词", "zh": "来", "lesson": 13, "native": {"pat": "come round / come along", "eg": "Why not come round for tea on Sunday?", "zh": "周日过来喝杯茶怎么样？"}, "egs": ["Please come here and look at this.", "My aunt will come to see us tomorrow.", "He came home very late last night."]}, {"w": "upstairs", "ipa": "/ˌʌpˈsteəz/", "pos": "adv. 副词", "zh": "楼上", "lesson": 13, "native": {"pat": "go upstairs / the room upstairs", "eg": "She ran upstairs to answer the phone.", "zh": "她跑到楼上去接电话。", "note": "upstairs 前面不加 to。"}, "egs": ["My bedroom is upstairs next to hers.", "Please come upstairs and see my books.", "She ran upstairs to answer the telephone."]}, {"w": "downstairs", "ipa": "/ˌdaʊnˈsteəz/", "pos": "adv. 副词", "zh": "楼下", "lesson": 13, "native": {"pat": "come downstairs", "eg": "Please come downstairs, dinner is ready.", "zh": "下楼来吧，饭好了。"}, "egs": ["The kitchen is downstairs on the left.", "He went downstairs to open the door.", "We had breakfast downstairs this morning."]}, {"w": "smart", "ipa": "/smɑːt/", "pos": "adj. 形容词", "zh": "漂亮的，时髦的", "lesson": 13, "native": {"pat": "look smart (穿得体面)", "eg": "You look very smart in that suit.", "zh": "你穿这套西装很精神。", "note": "英式 smart 指穿着体面，美式 smart 多指聪明。"}, "egs": ["You look very smart in that suit.", "She bought a smart new hat yesterday.", "That is a smart pair of black shoes."]}, {"w": "hat", "ipa": "/hæt/", "pos": "n. 名词", "zh": "帽子", "lesson": 13, "native": {"pat": "wear / take off a hat", "eg": "He took off his hat and smiled.", "zh": "他摘下帽子笑了笑。"}, "egs": ["My grandfather wears an old brown hat.", "She lost her hat on the bus.", "This hat is too big for my head."]}, {"w": "same", "ipa": "/seɪm/", "pos": "adj. 形容词", "zh": "相同的", "lesson": 13, "native": {"pat": "the same as … / all the same", "eg": "Her coat is the same as mine.", "zh": "她的外套和我的一样。", "note": "「和……一样」是 the same as。"}, "egs": ["We go to the same school every day.", "My brother and I have the same coat.", "She said the same thing to me yesterday."]}, {"w": "lovely", "ipa": "/ˈlʌvli/", "pos": "adj. 形容词", "zh": "可爱的，美好的", "lesson": 13, "native": {"pat": "a lovely day / lovely to see you", "eg": "What a lovely day it is today!", "zh": "今天天气真好啊！", "note": "英国人夸人夸东西极常用 lovely。"}, "egs": ["What a lovely dress you are wearing!", "We had a lovely time at the park.", "The garden looks lovely in the spring."]}, {"w": "case", "ipa": "/keɪs/", "pos": "n. 名词", "zh": "箱子", "lesson": 14, "native": {"pat": "pack a case", "eg": "She packed her case the night before.", "zh": "她前一晚就把箱子收拾好了。"}, "egs": ["Please put your books into this case.", "My case is too heavy to carry.", "He left his case on the train."]}, {"w": "carpet", "ipa": "/ˈkɑːpɪt/", "pos": "n. 名词", "zh": "地毯", "lesson": 14, "native": {"pat": "lay a carpet", "eg": "They laid a new carpet in the bedroom.", "zh": "他们在卧室铺了新地毯。"}, "egs": ["There is a red carpet in our living room.", "The cat is sleeping on the carpet.", "My mother cleaned the carpet this morning."]}, {"w": "blanket", "ipa": "/ˈblæŋkɪt/", "pos": "n. 名词", "zh": "毯子", "lesson": 14, "native": {"pat": "under a blanket", "eg": "The child fell asleep under a warm blanket.", "zh": "孩子盖着暖和的毯子睡着了。"}, "egs": ["Please give me another warm blanket.", "This blanket is very soft and light.", "She put a blanket over the sleeping child."]}, {"w": "dog", "ipa": "/dɒɡ/", "pos": "n. 名词", "zh": "狗", "lesson": 14, "native": {"pat": "walk the dog", "eg": "I walk the dog every evening.", "zh": "我每天晚上遛狗。", "note": "「遛狗」是 walk the dog。"}, "egs": ["Their dog barks at every stranger.", "I take my dog to the park daily.", "That black dog belongs to our neighbour."]}, {"w": "puppy", "ipa": "/ˈpʌpi/", "pos": "n. 名词", "zh": "小狗", "lesson": 14, "native": {"pat": "a playful puppy", "eg": "Their playful puppy chews everything.", "zh": "他们家顽皮的小狗什么都咬。"}, "egs": ["My uncle gave me a little puppy.", "The puppy is playing in the garden.", "That puppy follows me everywhere I go."]}, {"w": "green", "ipa": "/ɡriːn/", "pos": "adj. 形容词", "zh": "绿色的", "lesson": 14, "native": {"pat": "dark / bright green", "eg": "The hills turn bright green in spring.", "zh": "春天山变得翠绿。"}, "egs": ["The leaves turn green in the spring.", "She was wearing a green skirt today.", "There is a green door at the back."]}]}, {"id": "w-u1-s8", "title": "Lesson 15-16　Your passports, please.　请出示护照", "words": [{"w": "customs", "ipa": "/ˈkʌstəmz/", "pos": "n. 名词", "zh": "海关", "lesson": 15, "native": {"pat": "go through customs", "eg": "We went through customs very quickly.", "zh": "我们很快就过了海关。", "note": "海关一定用复数 customs。"}, "egs": ["We went through customs very quickly.", "The customs officer checked our bags.", "There was a long queue at customs."]}, {"w": "officer", "ipa": "/ˈɒfɪsə/", "pos": "n. 名词", "zh": "官员", "lesson": 15, "native": {"pat": "a customs / police officer", "eg": "A police officer showed us the way.", "zh": "一位警官给我们指了路。"}, "egs": ["The officer asked to see my passport.", "A police officer helped us find the way.", "Please show your ticket to that officer."]}, {"w": "girl", "ipa": "/ɡɜːl/", "pos": "n. 名词", "zh": "女孩", "lesson": 15, "native": {"pat": "a little girl", "eg": "A little girl was waiting at the gate.", "zh": "一个小女孩在门口等着。"}, "egs": ["That girl in the blue coat is my sister.", "A little girl was crying near the door.", "Every girl in our class likes music."]}, {"w": "passport", "ipa": "/ˈpɑːspɔːt/", "pos": "n. 名词", "zh": "护照", "lesson": 15, "native": {"pat": "show your passport", "eg": "Please show your passport at the desk.", "zh": "请在柜台出示护照。"}, "egs": ["Please show me your passport, sir.", "I left my passport in the hotel room.", "His passport is on the small table."]}, {"w": "Danish", "ipa": "/ˈdeɪnɪʃ/", "pos": "adj./n. 形容词/名词", "zh": "丹麦的；丹麦人；丹麦语", "lesson": 15, "native": {"pat": "Danish pastry / speak Danish", "eg": "We tried some Danish pastries today.", "zh": "我们今天尝了丹麦酥。"}, "egs": ["My new friend is Danish.", "We tried some Danish bread yesterday.", "This Danish film is very famous."]}, {"w": "Denmark", "ipa": "/ˈdenmɑːk/", "pos": "n. 名词", "zh": "丹麦", "lesson": 15, "native": {"pat": "in Denmark", "eg": "They spent a week in Denmark.", "zh": "他们在丹麦待了一周。"}, "egs": ["Denmark is a small country in Europe.", "My cousin studies music in Denmark.", "They travelled to Denmark last summer."]}, {"w": "friend", "ipa": "/frend/", "pos": "n. 名词", "zh": "朋友", "lesson": 15, "native": {"pat": "a close friend / make friends", "eg": "She makes friends very easily.", "zh": "她很容易交到朋友。", "note": "「交朋友」是 make friends，要用复数。"}, "egs": ["My best friend lives near our school.", "I met an old friend at the station.", "She is a good friend of my sister."]}, {"w": "Norwegian", "ipa": "/nɔːˈwiːdʒən/", "pos": "adj./n. 形容词/名词", "zh": "挪威的；挪威人；挪威语", "lesson": 15, "native": {"pat": "Norwegian salmon", "eg": "Norwegian salmon is very popular here.", "zh": "挪威三文鱼在这里很受欢迎。"}, "egs": ["Our new teacher is Norwegian.", "He is learning Norwegian this year.", "This Norwegian book is hard to read."]}, {"w": "tourist", "ipa": "/ˈtʊərɪst/", "pos": "n. 名词", "zh": "旅游者", "lesson": 15, "native": {"pat": "a tourist attraction", "eg": "This bridge is a famous tourist attraction.", "zh": "这座桥是著名的旅游景点。"}, "egs": ["A tourist asked me for directions.", "Many tourists visit this city every summer.", "The tourist took photos of the old bridge."]}, {"w": "brown", "ipa": "/braʊn/", "pos": "adj. 形容词", "zh": "棕色的", "lesson": 16, "native": {"pat": "dark brown hair", "eg": "She has long dark brown hair.", "zh": "她留着深棕色的长发。"}, "egs": ["He was wearing a brown leather coat.", "My little sister has brown eyes.", "There is a brown table in the kitchen."]}, {"w": "Russian", "ipa": "/ˈrʌʃn/", "pos": "adj./n. 形容词/名词", "zh": "俄国的；俄国人；俄语", "lesson": 16, "native": {"pat": "speak Russian", "eg": "He can read Russian quite well.", "zh": "他俄语读得不错。"}, "egs": ["My uncle can speak a little Russian.", "That Russian tourist is asking for help.", "We watched a Russian film last week."]}, {"w": "Russia", "ipa": "/ˈrʌʃə/", "pos": "n. 名词", "zh": "俄罗斯", "lesson": 16, "native": {"pat": "in Russia / travel to Russia", "eg": "They travelled across Russia by train.", "zh": "他们坐火车穿越了俄罗斯。"}, "egs": ["Russia is the largest country in the world.", "His father worked in Russia for two years.", "They flew to Russia last winter."]}, {"w": "Dutch", "ipa": "/dʌtʃ/", "pos": "adj./n. 形容词/名词", "zh": "荷兰的；荷兰人；荷兰语", "lesson": 16, "native": {"pat": "Dutch cheese", "eg": "Dutch cheese is famous around the world.", "zh": "荷兰奶酪世界闻名。"}, "egs": ["Our new neighbour is Dutch.", "This Dutch cheese tastes very good.", "She is learning Dutch at university."]}, {"w": "Holland", "ipa": "/ˈhɒlənd/", "pos": "n. 名词", "zh": "荷兰", "lesson": 16, "native": {"pat": "in Holland", "eg": "She studied art in Holland.", "zh": "她在荷兰学的艺术。", "note": "正式名称是 the Netherlands。"}, "egs": ["Holland is famous for its beautiful flowers.", "My aunt has lived in Holland for years.", "We spent a week in Holland last spring."]}, {"w": "these", "ipa": "/ðiːz/", "pos": "pron. 代词", "zh": "这些", "lesson": 16, "native": {"pat": "these days / one of these", "eg": "These days everyone uses a phone.", "zh": "如今人人都用手机。"}, "egs": ["These books belong to my brother.", "Are these your shoes under the bed?", "These flowers came from our own garden."]}, {"w": "red", "ipa": "/red/", "pos": "adj. 形容词", "zh": "红色的", "lesson": 16, "native": {"pat": "bright red / go red", "eg": "Her face went red with embarrassment.", "zh": "她尴尬得脸都红了。"}, "egs": ["She bought a red handbag yesterday.", "There is a red car outside our house.", "My favourite colour has always been red."]}, {"w": "grey", "ipa": "/ɡreɪ/", "pos": "adj. 形容词", "zh": "灰色的（美式拼作 gray）", "lesson": 16, "native": {"pat": "grey hair / a grey day", "eg": "My grandfather has thick grey hair.", "zh": "我爷爷一头浓密的白发。", "note": "英式 grey，美式 gray。"}, "egs": ["My grandfather has short grey hair.", "The sky was grey all morning.", "He wore a grey suit to the meeting."]}, {"w": "yellow", "ipa": "/ˈjeləʊ/", "pos": "adj. 形容词", "zh": "黄色的", "lesson": 16, "native": {"pat": "bright yellow", "eg": "The garden is full of bright yellow flowers.", "zh": "花园里开满了明黄色的花。"}, "egs": ["There are yellow flowers in the garden.", "She painted the wall a bright yellow.", "That yellow taxi stopped near us."]}, {"w": "black", "ipa": "/blæk/", "pos": "adj. 形容词", "zh": "黑色的", "lesson": 16, "native": {"pat": "black coffee / in black", "eg": "He always drinks black coffee.", "zh": "他总是喝黑咖啡。", "note": "不加奶的咖啡叫 black coffee。"}, "egs": ["He was carrying a black leather case.", "Our cat is black with white feet.", "She wrote the answer in black ink."]}, {"w": "orange", "ipa": "/ˈɒrɪndʒ/", "pos": "adj./n. 形容词/名词", "zh": "橙色的；橙子", "lesson": 16, "native": {"pat": "orange juice / an orange", "eg": "A glass of orange juice, please.", "zh": "请来一杯橙汁。"}, "egs": ["I eat an orange after lunch every day.", "She was wearing an orange dress.", "The orange juice tastes very fresh."]}]}, {"id": "w-u1-s9", "title": "Lesson 17-18　How do you do?　你好（初次见面）", "words": [{"w": "employee", "ipa": "/ɪmˈplɔɪiː/", "pos": "n. 名词", "zh": "雇员，员工", "lesson": 17, "native": {"pat": "a full-time employee", "eg": "She is a full-time employee here.", "zh": "她是这里的全职员工。"}, "egs": ["Every employee in this office works hard.", "The company has about fifty employees.", "He has been an employee here for years."]}, {"w": "hard-working", "ipa": "/ˌhɑːdˈwɜːkɪŋ/", "pos": "adj. 形容词", "zh": "工作努力的", "lesson": 17, "native": {"pat": "a hard-working student", "eg": "He is a quiet, hard-working student.", "zh": "他是个安静又用功的学生。"}, "egs": ["My sister is a hard-working student.", "They are hard-working people in this village.", "Our teacher says I am hard-working."]}, {"w": "man", "ipa": "/mæn/", "pos": "n. 名词", "zh": "男人（复数 men）", "lesson": 17, "native": {"pat": "a young man / men (复数)", "eg": "A young man offered her his seat.", "zh": "一位年轻男子给她让了座。"}, "egs": ["That man in the grey suit is my uncle.", "An old man was sitting near the window.", "The young man helped us carry the case."]}, {"w": "office", "ipa": "/ˈɒfɪs/", "pos": "n. 名词", "zh": "办公室", "lesson": 18, "native": {"pat": "at the office / an office job", "eg": "He is still at the office.", "zh": "他还在办公室。"}, "egs": ["My father works in a big office.", "The office is on the second floor.", "She left her bag in the office."]}, {"w": "assistant", "ipa": "/əˈsɪstənt/", "pos": "n. 名词", "zh": "助手，助理", "lesson": 18, "native": {"pat": "a shop / personal assistant", "eg": "The shop assistant was very patient.", "zh": "那位店员很有耐心。"}, "egs": ["My cousin works as a shop assistant.", "The assistant showed us some new shoes.", "He needs an assistant in his office."]}, {"w": "sales reps", "ipa": "/seɪlz reps/", "pos": "n. 名词", "zh": "销售代表", "lesson": 18, "native": {"pat": "meet the sales reps", "eg": "The sales reps meet every Monday.", "zh": "销售代表们每周一开会。", "note": "reps 是 representatives 的口语缩写。"}, "egs": ["Our sales reps travel to many cities.", "The sales reps meet every Monday morning.", "Two sales reps came to our office today."]}]}, {"id": "w-u1-s10", "title": "Lesson 19-20　Tired and thirsty　又累又渴", "words": [{"w": "matter", "ipa": "/ˈmætə/", "pos": "n. 名词", "zh": "事情，问题", "lesson": 19, "native": {"pat": "What's the matter? / It doesn't matter.", "eg": "What is the matter with your brother?", "zh": "你弟弟怎么了？", "note": "问「怎么了」就用 What's the matter?"}, "egs": ["What is the matter with your brother?", "It does not matter if you are late.", "This is a very serious matter indeed."]}, {"w": "children", "ipa": "/ˈtʃɪldrən/", "pos": "n. 名词", "zh": "孩子们（child 的复数）", "lesson": 19, "native": {"pat": "young children", "eg": "Young children need a lot of sleep.", "zh": "小孩子需要充足的睡眠。"}, "egs": ["The children come home from school at four.", "All the children are playing in the garden.", "These children study at the same school."]}, {"w": "child", "ipa": "/tʃaɪld/", "pos": "n. 名词", "zh": "孩子（单数）", "lesson": 19, "native": {"pat": "an only child", "eg": "She is an only child in her family.", "zh": "她是家里的独生女。"}, "egs": ["Every child in this class works hard.", "That child is only three years old.", "A little child was crying near the gate."]}, {"w": "tired", "ipa": "/ˈtaɪəd/", "pos": "adj. 形容词", "zh": "累的", "lesson": 19, "native": {"pat": "tired out / get tired", "eg": "I was tired out after the long walk.", "zh": "走了那么久我累坏了。"}, "egs": ["The children are tired and thirsty now.", "I felt very tired after the long walk.", "She looked tired when she came home."]}, {"w": "boy", "ipa": "/bɔɪ/", "pos": "n. 名词", "zh": "男孩", "lesson": 19, "native": {"pat": "a little boy", "eg": "A little boy was crying in the street.", "zh": "一个小男孩在街上哭。"}, "egs": ["That boy in the red shirt is my cousin.", "Every boy in our class plays football.", "A small boy was waiting at the door."]}, {"w": "thirsty", "ipa": "/ˈθɜːsti/", "pos": "adj. 形容词", "zh": "渴的", "lesson": 19, "native": {"pat": "feel thirsty", "eg": "I always feel thirsty after running.", "zh": "我跑完步总是口渴。"}, "egs": ["I am very thirsty after the game.", "The thirsty children asked for some water.", "He was hot and thirsty this afternoon."]}, {"w": "mum", "ipa": "/mʌm/", "pos": "n. 名词", "zh": "妈妈（口语）", "lesson": 19, "native": {"pat": "Mum, can I …?", "eg": "Mum, can I go out with my friends?", "zh": "妈，我能和朋友出去吗？", "note": "英式 mum，美式 mom。"}, "egs": ["My mum cooks dinner every evening.", "Mum, may I have some ice cream?", "Her mum works in a big hospital."]}, {"w": "sit down", "ipa": "/sɪt daʊn/", "pos": "phr. 词组", "zh": "坐下", "lesson": 19, "native": {"pat": "Have a seat. / Please sit down.", "eg": "Please sit down and make yourself comfortable.", "zh": "请坐，别客气。", "note": "请人坐更自然的说法是 Have a seat。"}, "egs": ["Please sit down and have some tea.", "The children sit down when the bell rings.", "He asked me to sit down beside him."]}, {"w": "ice cream", "ipa": "/ˈaɪs kriːm/", "pos": "n. 名词", "zh": "冰淇淋", "lesson": 19, "native": {"pat": "an ice cream cone", "eg": "The children each had an ice cream cone.", "zh": "孩子们一人一个冰淇淋甜筒。"}, "egs": ["The children want some ice cream now.", "I bought an ice cream for my sister.", "This ice cream tastes really good."]}, {"w": "big", "ipa": "/bɪɡ/", "pos": "adj. 形容词", "zh": "大的", "lesson": 20, "native": {"pat": "a big difference / grow big", "eg": "There is a big difference between them.", "zh": "他们之间差别很大。"}, "egs": ["They live in a big white house.", "This box is too big for my bag.", "He has a big garden behind the house."]}, {"w": "small", "ipa": "/smɔːl/", "pos": "adj. 形容词", "zh": "小的", "lesson": 20, "native": {"pat": "a small amount of", "eg": "She only needs a small amount of sugar.", "zh": "她只需要一点点糖。"}, "egs": ["My uncle bought a small red car.", "This shirt is too small for me.", "They live in a small village near here."]}, {"w": "open", "ipa": "/ˈəʊpən/", "pos": "adj./v. 形容词/动词", "zh": "开着的；打开", "lesson": 20, "native": {"pat": "open up / be open (营业)", "eg": "The shop is open until nine tonight.", "zh": "这家店今晚营业到九点。"}, "egs": ["Please open the window for a minute.", "The shop is open every day until six.", "She opened the door and walked in."]}, {"w": "shut", "ipa": "/ʃʌt/", "pos": "adj./v. 形容词/动词", "zh": "关着的；关上", "lesson": 20, "native": {"pat": "shut the door / be shut", "eg": "Please shut the door quietly.", "zh": "请轻轻把门关上。", "note": "日常口语更常用 close。"}, "egs": ["Please shut the door behind you.", "All the windows were shut last night.", "The shop is shut on Sunday afternoon."]}, {"w": "light", "ipa": "/laɪt/", "pos": "adj. 形容词", "zh": "轻的；浅色的", "lesson": 20, "native": {"pat": "light rain / a light meal", "eg": "We had a light meal before the film.", "zh": "看电影前我们简单吃了点。"}, "egs": ["This case is very light to carry.", "She was wearing a light blue dress.", "The blanket is warm but quite light."]}, {"w": "heavy", "ipa": "/ˈhevi/", "pos": "adj. 形容词", "zh": "重的", "lesson": 20, "native": {"pat": "heavy rain / heavy traffic", "eg": "There was heavy traffic this morning.", "zh": "今天早上堵得厉害。", "note": "「大雨」是 heavy rain，不是 big rain。"}, "egs": ["My schoolbag is too heavy today.", "He carried the heavy box upstairs.", "There was heavy rain all afternoon."]}, {"w": "long", "ipa": "/lɒŋ/", "pos": "adj. 形容词", "zh": "长的", "lesson": 20, "native": {"pat": "How long …? / all day long", "eg": "How long have you lived in this city?", "zh": "你在这座城市住了多久了？"}, "egs": ["My sister has very long black hair.", "We had a long walk in the park.", "This is a long story about a dog."]}, {"w": "shoe", "ipa": "/ʃuː/", "pos": "n. 名词", "zh": "鞋（常用复数 shoes）", "lesson": 20, "native": {"pat": "a pair of shoes", "eg": "I bought a new pair of shoes yesterday.", "zh": "我昨天买了双新鞋。", "note": "鞋永远成双说 a pair of shoes。"}, "egs": ["I bought a new pair of shoes.", "His shoes are under the bed.", "These black shoes are too small."]}, {"w": "grandfather", "ipa": "/ˈɡrænfɑːðə/", "pos": "n. 名词", "zh": "祖父，外祖父", "lesson": 20, "native": {"pat": "my grandfather / grandpa (口语)", "eg": "My grandfather tells wonderful stories.", "zh": "我爷爷讲的故事很精彩。"}, "egs": ["My grandfather is eighty years old.", "Her grandfather tells us funny stories.", "We visit my grandfather every Sunday."]}, {"w": "grandmother", "ipa": "/ˈɡrænmʌðə/", "pos": "n. 名词", "zh": "祖母，外祖母", "lesson": 20, "native": {"pat": "my grandmother / grandma (口语)", "eg": "My grandmother lives in the country.", "zh": "我奶奶住在乡下。"}, "egs": ["My grandmother makes very good soup.", "She misses her grandmother very much.", "Our grandmother lives in a small town."]}]}, {"id": "w-u1-s11", "title": "Lesson 21-24　Which book?　哪一本书？", "words": [{"w": "give", "ipa": "/ɡɪv/", "pos": "v. 动词", "zh": "给", "lesson": 21, "native": {"pat": "give sb a hand / give up", "eg": "Could you give me a hand with this?", "zh": "你能帮我一下吗？", "note": "「帮个忙」是 give me a hand。"}, "egs": ["Please give me that red pencil.", "My uncle gave me a new watch.", "She gives her sister a book every year."]}, {"w": "one", "ipa": "/wʌn/", "pos": "num./pron. 数词/代词", "zh": "一；一个（代替前面提过的东西）", "lesson": 21, "native": {"pat": "this one / the one over there", "eg": "I like this one better than that one.", "zh": "我更喜欢这个，不是那个。"}, "egs": ["I lost my pen and bought a new one.", "One of these books belongs to me.", "There is only one apple on the plate."]}, {"w": "which", "ipa": "/wɪtʃ/", "pos": "pron. 代词", "zh": "哪一个", "lesson": 21, "native": {"pat": "Which one …? / which of", "eg": "Which one do you like better?", "zh": "你更喜欢哪一个？"}, "egs": ["Which book do you want to read?", "I do not know which coat is mine.", "Which of these two skirts is nicer?"]}, {"w": "empty", "ipa": "/ˈempti/", "pos": "adj. 形容词", "zh": "空的", "lesson": 21, "native": {"pat": "an empty seat", "eg": "Is that an empty seat over there?", "zh": "那边那个座位空着吗？"}, "egs": ["This bottle is completely empty now.", "The classroom was empty after four.", "Please put the empty box outside."]}, {"w": "full", "ipa": "/fʊl/", "pos": "adj. 形容词", "zh": "满的", "lesson": 21, "native": {"pat": "be full of / full up", "eg": "The room was full of people.", "zh": "房间里满是人。"}, "egs": ["The glass is full of cold water.", "My schoolbag is full of heavy books.", "The bus was full this morning."]}, {"w": "large", "ipa": "/lɑːdʒ/", "pos": "adj. 形容词", "zh": "大的", "lesson": 21, "native": {"pat": "a large number of", "eg": "A large number of people came today.", "zh": "今天来了很多人。", "note": "修饰数量用 large，不用 big。"}, "egs": ["A large number of students came here.", "They live in a large old house.", "This shirt is a little too large."]}, {"w": "little", "ipa": "/ˈlɪtl/", "pos": "adj. 形容词", "zh": "小的；少的", "lesson": 21, "native": {"pat": "a little bit / a little while", "eg": "Wait a little while, please.", "zh": "请稍等一会儿。"}, "egs": ["My little brother is only five.", "There is a little water in the glass.", "She lives in a little house near here."]}, {"w": "sharp", "ipa": "/ʃɑːp/", "pos": "adj. 形容词", "zh": "锋利的", "lesson": 22, "native": {"pat": "a sharp knife", "eg": "Be careful, that knife is very sharp.", "zh": "小心，那把刀很快。"}, "egs": ["Be careful, this knife is very sharp.", "I need a sharp pencil for drawing.", "The sharp stone cut my finger."]}, {"w": "blunt", "ipa": "/blʌnt/", "pos": "adj. 形容词", "zh": "钝的", "lesson": 22, "native": {"pat": "a blunt knife", "eg": "This blunt knife will not cut anything.", "zh": "这把钝刀什么都切不动。"}, "egs": ["This blunt knife cannot cut the bread.", "My pencil is blunt, may I borrow yours?", "The blunt scissors are on the desk."]}, {"w": "box", "ipa": "/bɒks/", "pos": "n. 名词", "zh": "盒子（复数 boxes）", "lesson": 23, "native": {"pat": "a cardboard box", "eg": "Put the books in that cardboard box.", "zh": "把书放进那个纸箱里。"}, "egs": ["There is a small box on the table.", "Please put these books into the box.", "He carried two heavy boxes upstairs."]}, {"w": "glass", "ipa": "/ɡlɑːs/", "pos": "n. 名词", "zh": "玻璃杯（复数 glasses 也指眼镜）", "lesson": 23, "native": {"pat": "a glass of water / glasses (眼镜)", "eg": "Could I have a glass of water?", "zh": "能给我一杯水吗？", "note": "复数 glasses 还指眼镜。"}, "egs": ["Please give me a glass of water.", "The glass fell down and broke.", "My grandfather wears thick glasses."]}, {"w": "cup", "ipa": "/kʌp/", "pos": "n. 名词", "zh": "杯子（有把的）", "lesson": 23, "native": {"pat": "a cup of tea", "eg": "Would you like a cup of tea?", "zh": "你想来杯茶吗？", "note": "茶咖啡用 cup，冷饮用 glass。"}, "egs": ["I drink a cup of tea every morning.", "This cup belongs to my mother.", "She put the cup on the small table."]}, {"w": "bottle", "ipa": "/ˈbɒtl/", "pos": "n. 名词", "zh": "瓶子", "lesson": 23, "native": {"pat": "a bottle of water", "eg": "She always carries a bottle of water.", "zh": "她总是带着一瓶水。"}, "egs": ["There is a bottle of milk in the fridge.", "Please pass me that green bottle.", "He drank the whole bottle of water."]}, {"w": "tin", "ipa": "/tɪn/", "pos": "n. 名词", "zh": "罐头", "lesson": 23, "native": {"pat": "a tin of soup", "eg": "We opened a tin of soup for lunch.", "zh": "午饭我们开了一罐汤。", "note": "英式 tin，美式 can。"}, "egs": ["We bought a tin of fish yesterday.", "There is an empty tin on the shelf.", "Please open this tin for me."]}, {"w": "knife", "ipa": "/naɪf/", "pos": "n. 名词", "zh": "刀（复数 knives）", "lesson": 23, "native": {"pat": "a sharp knife / knives (复数)", "eg": "He cut the bread with a sharp knife.", "zh": "他用快刀切了面包。"}, "egs": ["This knife is very sharp indeed.", "Please put the knife beside the plate.", "He cut the bread with a big knife."]}, {"w": "fork", "ipa": "/fɔːk/", "pos": "n. 名词", "zh": "叉子", "lesson": 23, "native": {"pat": "a knife and fork", "eg": "Europeans eat with a knife and fork.", "zh": "欧美人用刀叉吃饭。"}, "egs": ["We eat this food with a fork.", "The fork is on the left of the plate.", "She dropped her fork on the floor."]}, {"w": "chopsticks", "ipa": "/ˈtʃɒpstɪks/", "pos": "n. 名词", "zh": "筷子", "lesson": 23, "native": {"pat": "eat with chopsticks", "eg": "Can you eat with chopsticks?", "zh": "你会用筷子吃饭吗？", "note": "筷子永远用复数。"}, "egs": ["Chinese people eat with chopsticks every day.", "He is learning to use chopsticks.", "These wooden chopsticks are very light."]}, {"w": "shelf", "ipa": "/ʃelf/", "pos": "n. 名词", "zh": "架子（复数 shelves）", "lesson": 24, "native": {"pat": "on the top shelf", "eg": "The cups are on the top shelf.", "zh": "杯子在最上层架子上。"}, "egs": ["There are five books on the shelf.", "Please put the tin back on the shelf.", "The top shelf is too high for me."]}, {"w": "desk", "ipa": "/desk/", "pos": "n. 名词", "zh": "书桌", "lesson": 24, "native": {"pat": "sit at a desk", "eg": "She sits at her desk all day.", "zh": "她整天坐在桌前。", "note": "「在桌前」用 at the desk。"}, "egs": ["My pencil fell down under the desk.", "She does her homework at this desk.", "There is a lamp on the desk."]}, {"w": "table", "ipa": "/ˈteɪbl/", "pos": "n. 名词", "zh": "桌子", "lesson": 24, "native": {"pat": "lay the table / at the table", "eg": "Could you lay the table, please?", "zh": "你能摆一下餐具吗？"}, "egs": ["Is this your handbag on the table?", "We have dinner at this round table.", "Please put the plates on the table."]}, {"w": "plate", "ipa": "/pleɪt/", "pos": "n. 名词", "zh": "盘子", "lesson": 24, "native": {"pat": "a plate of / clear the plates", "eg": "He ate a whole plate of chips.", "zh": "他吃了满满一盘薯条。"}, "egs": ["There is some bread on the plate.", "She washed every plate after dinner.", "Please pass me a clean plate."]}, {"w": "dish", "ipa": "/dɪʃ/", "pos": "n. 名词", "zh": "碟子；菜肴（复数 dishes）", "lesson": 24, "native": {"pat": "do the dishes / a main dish", "eg": "I will do the dishes after dinner.", "zh": "晚饭后我来洗碗。", "note": "「洗碗」是 do the dishes。"}, "egs": ["My mother washes the dishes after lunch.", "This dish is my favourite Chinese food.", "Please put the dish in the cupboard."]}, {"w": "cupboard", "ipa": "/ˈkʌbəd/", "pos": "n. 名词", "zh": "碗柜，橱柜", "lesson": 24, "native": {"pat": "in the kitchen cupboard", "eg": "The plates are in the kitchen cupboard.", "zh": "盘子在厨房柜子里。"}, "egs": ["The cups are in the kitchen cupboard.", "Please shut the cupboard door.", "There is nothing in that old cupboard."]}, {"w": "television", "ipa": "/ˈtelɪvɪʒn/", "pos": "n. 名词", "zh": "电视", "lesson": 24, "native": {"pat": "watch television / on TV", "eg": "We watch television after dinner.", "zh": "我们晚饭后看电视。", "note": "口语更常说 watch TV。"}, "egs": ["My father watches television every evening.", "The television is in the living room.", "We saw a good film on television."]}, {"w": "floor", "ipa": "/flɔː/", "pos": "n. 名词", "zh": "地板；楼层", "lesson": 24, "native": {"pat": "on the floor / the first floor", "eg": "The cat is lying on the floor.", "zh": "猫躺在地板上。", "note": "英式一楼是 ground floor。"}, "egs": ["The cat is sleeping on the floor.", "Our office is on the third floor.", "Please clean the floor before dinner."]}, {"w": "magazine", "ipa": "/ˌmæɡəˈziːn/", "pos": "n. 名词", "zh": "杂志", "lesson": 24, "native": {"pat": "a fashion magazine", "eg": "She reads a fashion magazine every month.", "zh": "她每个月看一本时尚杂志。"}, "egs": ["She reads a magazine every Sunday morning.", "This magazine has many beautiful pictures.", "I bought a magazine at the station."]}, {"w": "bed", "ipa": "/bed/", "pos": "n. 名词", "zh": "床", "lesson": 24, "native": {"pat": "go to bed / make the bed", "eg": "I always make my bed in the morning.", "zh": "我早上总是整理床铺。", "note": "「铺床」是 make the bed。"}, "egs": ["His shoes are under the bed.", "I go to bed at nine every night.", "There are two beds in this room."]}, {"w": "newspaper", "ipa": "/ˈnjuːzpeɪpə/", "pos": "n. 名词", "zh": "报纸", "lesson": 24, "native": {"pat": "read the newspaper", "eg": "He reads the newspaper over breakfast.", "zh": "他边吃早饭边看报。"}, "egs": ["My grandfather reads the newspaper every morning.", "There is a newspaper on the desk.", "He found the news in an old newspaper."]}, {"w": "radio", "ipa": "/ˈreɪdiəʊ/", "pos": "n. 名词", "zh": "收音机", "lesson": 24, "native": {"pat": "listen to the radio / on the radio", "eg": "I heard that song on the radio.", "zh": "我在广播里听到那首歌。", "note": "radio 前面要加 the。"}, "egs": ["We listen to the radio every evening.", "The radio is on the kitchen shelf.", "My uncle bought a small radio."]}]}]}, {"id": "w-u2", "title": "第二单元　Lesson 25-48", "sections": [{"id": "w-u2-s1", "title": "Lesson 25-28　厨房与客厅", "words": [{"w": "refrigerator", "ipa": "/rɪˈfrɪdʒəreɪtə/", "pos": "n. 名词", "zh": "冰箱", "lesson": 25, "egs": ["Put the milk into the refrigerator, please.", "Our refrigerator is very old but useful.", "There is some cheese in the refrigerator."]}, {"w": "electric", "ipa": "/ɪˈlektrɪk/", "pos": "adj. 形容词", "zh": "用电的", "lesson": 25, "egs": ["We bought a new electric cooker.", "This electric light does not work.", "My father repaired the electric fan."]}, {"w": "cooker", "ipa": "/ˈkʊkə/", "pos": "n. 名词", "zh": "炉子，炊具", "lesson": 25, "egs": ["The cooker is next to the window.", "She cleaned the cooker after dinner.", "This cooker is too old to use."]}, {"w": "right", "ipa": "/raɪt/", "pos": "n./adj. 名词/形容词", "zh": "右边；对的", "lesson": 25, "egs": ["The door is on your right side.", "You gave me the right answer.", "Please turn right at the corner."]}, {"w": "left", "ipa": "/left/", "pos": "n./adj. 名词/形容词", "zh": "左边", "lesson": 25, "egs": ["The cupboard is on the left side.", "He writes with his left hand.", "Turn left and you will see it."]}, {"w": "room", "ipa": "/ruːm/", "pos": "n. 名词", "zh": "房间", "lesson": 25, "egs": ["There are four rooms in our house.", "My room is small but very tidy.", "Please clean your room before lunch."]}, {"w": "where", "ipa": "/weə/", "pos": "adv. 副词", "zh": "在哪里", "lesson": 25, "egs": ["Where is my umbrella this morning?", "I do not know where he lives.", "Where did you buy that hat?"]}, {"w": "living room", "ipa": "/ˈlɪvɪŋ ruːm/", "pos": "n. 名词", "zh": "客厅", "lesson": 27, "egs": ["The television is in the living room.", "We watch films in the living room.", "Their living room is very large."]}, {"w": "near", "ipa": "/nɪə/", "pos": "prep. 介词", "zh": "靠近", "lesson": 27, "egs": ["The armchair is near the window.", "Our school is near a small park.", "He sat near the door all evening."]}, {"w": "armchair", "ipa": "/ˈɑːmtʃeə/", "pos": "n. 名词", "zh": "扶手椅", "lesson": 27, "egs": ["My grandfather sleeps in that armchair.", "The armchair is beside ": 29, "egs": ["Please put the books on the shelf.", "She put her keys into the handbag.", "Put your coat in the cloakroom."]}, {"w": "clothes", "ipa": "/kləʊðz/", "pos": "n. 名词", "zh": "衣服（永远用复数）", "lesson": 29, "egs": ["Put your clothes in the wardrobe.", "These clothes are too small now.", "She washed the clothes this morning."]}, {"w": "wardrobe", "ipa": "/ˈwɔːdrəʊb/", "pos": "n. 名词", "zh": "衣柜", "lesson": 29, "egs": ["Your coat is in the wardrobe.", "This wardrobe is made of dark wood.", "There is nothing in that old wardrobe."]}, {"w": "dust", "ipa": "/dʌst/", "pos": "v./n. 动词/名词", "zh": "掸灰；灰尘", "lesson": 30, "egs": ["Please dust the table and the shelf.", "There is a lot of dust on the piano.", "She dusted every room this morning."]}, {"w": "sweep", "ipa": "/swiːp/", "pos": "v. 动词", "zh": "扫", "lesson": 30, "egs": ["Please sweep the floor after lunch.", "He sweeps the yard every Saturday.", "She swept the room very carefully."]}, {"w": "sharpen", "ipa": "/ˈʃɑːpən/", "pos": "v. 动词", "zh": "削尖", "lesson": 30, "egs": ["Please sharpen this pencil for me.", "He sharpened the knife before cooking.", "I must sharpen my pencil again."]}, {"w": "put on", "ipa": "/pʊt ɒn/", "pos": "phr. 词组", "zh": "穿上", "lesson": 30, "egs": ["Put on your coat before going out.", "She put on a beautiful red dress.", "He put on his shoes very quickly."]}, {"w": "take off", "ipa": "/teɪk ɒf/", "pos": "phr. 词组", "zh": "脱下", "lesson": 30, "egs": ["Please take off your wet shoes.", "He took off his hat and smiled.", "Take off your coat, the room is warm."]}, {"w": "turn on", "ipa": "/tɜːn ɒn/", "pos": "phr. 词组", "zh": "打开（电器、水龙头）", "lesson": 30, "egs": ["Please turn on the light for me.", "She turned on the radio this morning.", "Turn on the tap and wash your hands."]}, {"w": "turn off", "ipa": "/tɜːn ɒf/", "pos": "phr. 词组", "zh": "关掉", "lesson": 30, "egs": ["Please turn off the television now.", "He turned off the light and went out.", "Turn off the tap when you finish."]}, {"w": "garden", /* ========== 基础 ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const PROG_KEY = 'mathquiz_words_prog_v1';
function getProg() { try { return JSON.parse(localStorage.getItem(PROG_KEY) || '{}'); } catch (e) { return {}; } }
function setProg(sid, mode, done, total, score) {
  const p = getProg(); p[sid] = p[sid] || {};
  p[sid][mode] = Math.max((p[sid][mode] || 0), done);
  p[sid][mode + '_n'] = total;
  if (score != null) p[sid][mode + '_s'] = Math.max((p[sid][mode + '_s'] || 0), score);
  try { localStorage.setItem(PROG_KEY, JSON.stringify(p)); } catch (e) {}
}
function secDone(sid, mode) { const p = getProg()[sid] || {}; return p[mode] || 0; }
function secScore(sid, mode) { const p = getProg()[sid] || {}; return p[mode + '_s'] || 0; }
/* ⭐ 续做定位：做一半退出，回来要接着做。
   不做这件事会出两个问题：① 孩子每次回来都从第 1 个重做
   ② 进度存档是「只增不减」(Math.max)，重做前面几个不会让进度前进，看起来像卡死。 */
function modeResume(sid, mode, n) {
  const d = Math.min(secDone(sid, mode), n);
  return d >= n ? 0 : d;                 /* 已经全做完 → 开新的一轮 */
}

/* 错题本：与其他科目共用，subject 用 engword */
/* 写进错题本。⭐ 必须记下孩子当时实际写了什么——只写「未过」的话，
   复习时他看不到自己错在哪，等于白记一笔。 */
const MODE_LABEL = { card: '记忆卡拼写', recall: '背诵', make: '造句' };
function addWrong(word, sec, unit, mode, userAnswer) {
  const KEY = 'mathquiz_wrongbook_v1';
  let book = []; try { book = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
  const now = new Date().toISOString();
  const key = 'engword|' + word.w + '|' + word.zh;      /* 一个词一条，三种练法都错就累计次数 */
  /* 同一个词在三种练法里都可能错。合并成一条（一个词一条，复习时不用翻三遍），
     但要把每种练法各自写错的内容都留下——只留最后一次的话，
     孩子看不到自己在拼写上也栽过跟头。 */
  const label = MODE_LABEL[mode] || '练习';
  const said = String(userAnswer || '').trim() || '（空）';
  const render = at => Object.keys(at).map(k => MODE_LABEL[k] + '写成「' + at[k] + '」').join('　｜　');
  const ex = book.find(b => b.key === key);
  if (ex) {
    ex.wrongCount += 1; ex.lastWrongAt = now;
    ex.attempts = ex.attempts || {}; ex.attempts[mode] = said;
    ex.userAnswer = render(ex.attempts);
  }
  else book.push({ key, subject: 'engword', chapterTitle: unit.title, sectionTitle: sec.title,
    point: word.w, stem: word.pos + ' ' + word.zh,
    attempts: { [mode]: said }, userAnswer: label + '写成「' + said + '」',
    correctAnswer: word.w + '　' + word.ipa, explain: '例句：' + word.egs[0],
    wrongCount: 1, firstWrongAt: now, lastWrongAt: now });
  try { localStorage.setItem(KEY, JSON.stringify(book)); } catch (e) {}
}

/* 发音（浏览器 TTS，没有就静默） */
function speak(t) {
  try { const u = new SpeechSynthesisUtterance(String(t)); u.lang = 'en-US'; u.rate = .9;
    speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}

  const a = [];
  try { DATA.units.forEach(u => u.sections.forEach(x => x.words.forEach(w => a.push({ w: w.w, pos: w.pos })))); }
  catch (e) {}
  return a;
})();

   英语造句判分引擎（规则式，完全不依赖 AI）—— 两个站共用的单一事实源
   ------------------------------------------------------------------------
   ⭐ 为什么要有它：这是给孩子用的产品，孩子没有判断能力。
      「你自己核对一下对不对」等于没判分，所以对错必须由**测过的确定性规则**给结论。
      三层挡住：① 程序清洗（生成／外部内容先过这里，不过就丢）
                ② 聚焦二次核对（关键事实脱离情境逐条核对）
                ③ 程序化保底（判分一律以本引擎为准，绝不让孩子裁决 AI 说得对不对）

   ⚠️ 单一事实源在 math_quiz_deploy/build/grammar_en.js。
      精读站那份由 build/sync_grammar.py 生成，**不要手改**，改了会被 parity 测试挡下。

   使用方需要在载入本文件之前提供词表（用来判「you book」这类中文直译错误）：
      const GRAMMAR_WORDS = [{ w: 'book', pos: 'n. 名词' }, …];   // 没有就给 []

function normalize(t) {
  if (t === null || t === undefined) return '';
  /* ⚠️ 撇号归一：iPad 打 don’t、答案存的是 don't，不归一就会把「拼对了」判成错。
     目前词表里还没有带撇号的词（所以没触发过），但加 o'clock / don't 这类词的那天就会踩。 */
  return String(t).trim().replace(/[\u2018\u2019\u02BC\u00B4\u0060]/g, "'")
    .replace(/\s+/g, '').replace(/　/g, '').toLowerCase();
}
/* 造句用：保留词边界的归一 */
function normSent(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
}
function wordCount(s) { return String(s || '').trim().split(/\s+/).filter(Boolean).length; }
