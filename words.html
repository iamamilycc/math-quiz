/* ========== 基础 ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalize(t) {
  if (t === null || t === undefined) return '';
  return String(t).trim().replace(/\s+/g, '').replace(/　/g, '').toLowerCase();
}
/* 造句用：保留词边界的归一 */
function normSent(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
}
function wordCount(s) { return String(s || '').trim().split(/\s+/).filter(Boolean).length; }

const PROG_KEY = 'mathquiz_words_prog_v1';
function getProg() { try { return JSON.parse(localStorage.getItem(PROG_KEY) || '{}'); } catch (e) { return {}; } }
function setProg(sid, mode, done, total) {
  const p = getProg(); p[sid] = p[sid] || {};
  p[sid][mode] = Math.max((p[sid][mode] || 0), done);
  p[sid][mode + '_n'] = total;
  try { localStorage.setItem(PROG_KEY, JSON.stringify(p)); } catch (e) {}
}
function secDone(sid, mode) { const p = getProg()[sid] || {}; return p[mode] || 0; }

/* 错题本：与其他科目共用，subject 用 engword */
function addWrong(word, sec, unit) {
  const KEY = 'mathquiz_wrongbook_v1';
  let book = []; try { book = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
  const now = new Date().toISOString();
  const key = 'engword|' + word.w + '|' + word.zh;
  const ex = book.find(b => b.key === key);
  if (ex) { ex.wrongCount += 1; ex.lastWrongAt = now; }
  else book.push({ key, subject: 'engword', chapterTitle: unit.title, sectionTitle: sec.title,
    point: word.w, stem: word.pos + ' ' + word.zh, userAnswer: '（拼写/背诵未过）',
    correctAnswer: word.w, explain: '例句：' + word.egs[0], wrongCount: 1, firstWrongAt: now, lastWrongAt: now });
  try { localStorage.setItem(KEY, JSON.stringify(book)); } catch (e) {}
}

/* 发音（浏览器 TTS，没有就静默） */
function speak(t) {
  try { const u = new SpeechSynthesisUtterance(String(t)); u.lang = 'en-US'; u.rate = .9;
    speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}

/* ========== 造句检查（不依赖任何 AI；规则与精读站一致） ========== */
const MK_PER_WORD = 3, MK_MIN_WORDS = 5;
/* 孩子写 caught 来练 catch、写 tallest 来练 tall，都该算「用上了这个词」。
   规则和 build_words.py 的 _has_word 保持一致（两边不一致会出现
   「建置说合格、孩子写同样的形式却被判没用上」这种最难查的问题）。 */
function hasWord(s, w) {
  const base = normSent(w); if (!base) return true;
  const S = ' ' + normSent(s) + ' ';
  if (base.indexOf(' ') >= 0) return S.indexOf(' ' + base + ' ') >= 0;
  const se = base.replace(/e$/, ''), sy = base.replace(/y$/, ''), dbl = base + base.slice(-1);
  const forms = [base, base+'s', base+'es', base+'d', base+'ed', base+'ing', base+'er', base+'est',
                 se+'ing', se+'ed', se+'er', se+'est', sy+'ies', sy+'ied', sy+'ier', sy+'iest',
                 dbl+'er', dbl+'est', dbl+'ing', dbl+'ed'];

       ⚠️ 这条最容易误报——分不清名词和动词就会把 your watch / the long walk 判成错。
       四道保险：① 主语必须是词表里「确定是名词、不兼动词」的词（PURE_NOUNS）
                ② 不能是复数（结尾 s / children 这类）
                ③ 动词不能是原形与过去式同形的（the hairdresser cut… 判不出时态）
                ④ 动词后面那个词不能是动词（The school work is hard 里 work 是名词） */
    const nx3 = t[i + 3];
    if (!governed && !pastCtx && DET.has(w) && nx && nx2 &&
        PURE_NOUNS.has(nx) && !/s$/.test(nx) && !IRREG_PLURAL.has(nx) && !SINGULAR_S.has(nx) &&
        BASE_VERBS.has(nx2) && !SAME_BASE_PAST.has(nx2) && !ALSO_ADJ.has(nx2) &&
        !BE_ALL.has(nx2) && !MODALS.has(nx2) && !AUX_DO.has(nx2) &&
        nx3 && !isVerbTok(nx3) && !pf[i] && !pf[i + 1])
      add('error', '<b>' + nx + '</b> 是单数，后面的动词 <b>' + nx2 + '</b> 少了 s',
          '主语是一个人／一样东西时，一般现在时的动词要加 s：<b>' +
          ((VERB_FORMS[nx2] && VERB_FORMS[nx2][0]) || nx2 + 's') + '</b>');

    /* R17 不规则动词写成「原形+ed」：goed / buyed / teached */
    if (w.length > 3 && /ed$/.test(w)) {
      const b1 = w.slice(0, -2), b2 = w.slice(0, -1);
      const base = IRREG_BASES.has(b1) ? b1 : (IRREG_BASES.has(b2) ? b2 : null);
      if (base && VERB_FORMS[base])
        add('error', '<b>' + w + '</b> 不是英语单词',
            '<b>' + base + '</b> 是不规则动词，过去式不能加 ed，要写成 <b>' + VERB_FORMS[base][1] + '</b>');
    }

    /* R18 There is + 复数：There is many books… → There are */
    if (w === 'there' && (nx === 'is' || nx === 'was') && nx2 && PLURAL_MARK.has(nx2))
      add('error', 'There ' + nx + ' 后面跟的是复数（' + nx2 + '…）',
          '后面是复数就要用 <b>There ' + (nx === 'is' ? 'are' : 'were') + '</b>');

    /* R19 like / want 后面直接跟动词原形：I like play football → like playing / like to play */
    if (NEED_TO_OR_ING.has(w) && nx && BASE_VERBS.has(nx) && !BE_ALL.has(nx) &&
        !ALSO_ADJ.has(nx) && !AUX_DO.has(nx) && !MODALS.has(nx) && nx2 && !PREPS.has(nx2) && !pf[i])
      add('error', '<b>' + w + '</b> 后面不能直接跟动词原形 <b>' + nx + '</b>',
          '要么加 to：' + w + ' <b>to ' + nx + '</b>，要么用 ing：' + w + ' <b>' + nx.replace(/e$/, '') + 'ing</b>');

    /* R15b be 动词 + 代词 + 名词：这个句型里名词不可能是动词，可以放心判
       （Where is you book? → your book） */
    if (BE_ALL.has(w) && nx && PRON_NEEDS_POSS[nx] && nx2 && ALL_NOUNS.has(nx2) && !pf[i + 1])
      add('error', '<b>' + nx + ' ' + nx2 + '</b> 不对，这里要用「谁的」',
          '表示「' + nx + ' 的 ' + nx2 + '」要用物主代词：<b>' + PRON_NEEDS_POSS[nx] + ' ' + nx2 + '</b>');

    /* R15 代词后面直接跟名词 → 该用物主代词（中文「你书」直译成 you book） */
    if (PRON_NEEDS_POSS[w] && nx && PURE_NOUNS.has(nx) && !pf[i])
      add('error', '<b>' + w + ' ' + nx + '</b> 不对，这里要用「谁的」',
          '表示「' + w + ' 的 ' + nx + '」要用物主代词：<b>' + PRON_NEEDS_POSS[w] + ' ' + nx + '</b>');

    /* R13 to + 动词ing（want to / like to 后面要原形） */
    if (w === 'to' && nx && /ing$/.test(nx) && nx.length > 4 && !['nothing','something','anything','morning','evening'].includes(nx))
      add('warn', '<b>to</b> 后面通常跟动词原形', 'to 是不定式符号，后面用原形：to <b>' + nx.replace(/ing$/, '') + '</b>');
  }

  /* R14 缺 be 动词：只在把握很大的句型下报——「主语代词 + 限定词 + 名词」中间没有动词
     （I a student. / My father a doctor.）。
     ⚠️ 不能用「整句找不到动词就报」这种写法：动词表不可能穷尽，
        I share a room with my sister. 会被误判成没有动词。 */
  /* ⚠️ 只有「整句一个动词都找不到」时才可能是漏了 be。
     两个反例都是实测撞出来的：
       Is this your handbag?              be 在句首（疑问句）
       He cannot find his tie this morning. 动词是 find，cannot 也不在情态词表里
     所以保险条件要放到最宽：句中出现任何动词形式，这条规则就不启动。 */
  const hasAnyVerb = t.some(x => isVerbTok0(x));
  for (let i = 0; !hasAnyVerb && i < t.length - 2; i++) {
    const subjOK = SUBJ_I.has(t[i]) || SUBJ_3S.has(t[i]) || SUBJ_PL.has(t[i]) ||
                   (DET.has(t[i]) && t[i + 1] && !isVerbTok(t[i + 1]));
    if (!subjOK) continue;
    /* 从主语后往后看两个词：都不是动词，而且出现了「限定词 + 名词」→ 多半漏了 be */
    const a = t[i + 1], b = t[i + 2];
    if (a && b && DET.has(a) && !isVerbTok(a) && !isVerbTok(b) && !pf[i] && !pf[i + 1]) {
      add('error', '「' + t[i] + ' ' + a + ' ' + b + '」中间少了 be 动词',
          '英语句子一定要有动词，这里要补上 <b>am / is / are</b>：' +
          t[i] + ' <b>' + (SUBJ_I.has(t[i]) ? 'am' : (SUBJ_PL.has(t[i]) ? 'are' : 'is')) + '</b> ' + a + ' ' + b);
      break;
    }
    /* 另一种常见写法：「我的爸爸 一个医生」——限定词+名词 后面又跟 限定词+名词，中间没动词
       （My father a doctor.）*/
    if (DET.has(t[i]) && a && b && t[i + 3] && !isVerbTok(a) && DET.has(b) && !isVerbTok(t[i + 3]) &&
        !pf[i] && !pf[i + 1] && !pf[i + 2]) {
      add('error', '「' + a + ' ' + b + ' ' + t[i + 3] + '」中间少了 be 动词',
          '英语句子一定要有动词，这里要补上 <b>is</b>：' + t[i] + ' ' + a + ' <b>is</b> ' + b + ' ' + t[i + 3]);
      break;
    }
  }

  /* 去重（同一条只报一次） */
  const seen = new Set();
  return out.filter(o => { const k = o.level + o.why; if (seen.has(k)) return false; seen.add(k); return true; });
}

/* ========== 路由 ========== */
let cur = { unit: null, sec: null, mode: null };
function goBack() {
  if (cur.mode) { cur.mode = null; renderSec(); }
  else if (cur.sec) { cur.sec = null; renderUnit(); }
  else if (cur.unit) { cur.unit = null; renderHome(); }
}
function setHead(t, s, showBack) {
  $('#hTitle').textContent = t; $('#hSub').textContent = s;
  $('#backBtn').style.display = showBack ? 'inline-block' : 'none';
}

function renderHome() {
  cur = { unit: null, sec: null, mode: null };
  setHead('新概念英语第一册 · 单词', '按课次分单元 · 记忆、背诵、造句三步走', false);
  $('#view').innerHTML = '<div class="card-list">' + DATA.units.map((u, i) => {
    const nw = u.sections.reduce((a, s) => a + s.words.length, 0);
    const dn = u.sections.reduce((a, s) => a + Math.min(secDone(s.id, 'card'), s.words.length), 0);
    return '<button class="big-card" onclick="openUnit(' + i + ')">' +
      '<span><span class="big-card-title">' + esc(u.title) + '</span>' +
      '<span class="big-card-desc">' + u.sections.length + ' 节 · ' + nw + ' 个单词</span></span>' +
      '<span class="prog">' + Math.round(dn * 100 / (nw || 1)) + '%</span></button>';
  }).join('') + '</div>';
}
function openUnit(i) { cur.unit = DATA.units[i]; renderUnit(); }
function renderUnit() {
  cur.sec = null; cur.mode = null;
  const u = cur.unit;
  setHead(u.title, '选一节开始', true);
  $('#view').innerHTML = '<div class="card-list">' + u.sections.map((s, i) => {
    const c = Math.min(secDone(s.id, 'card'), s.words.length),
          r = Math.min(secDone(s.id, 'recall'), s.words.length),
          m = Math.min(secDone(s.id, 'make'), s.words.length * MK_PER_WORD);
    return '<button class="big-card" onclick="openSec(' + i + ')">' +
      '<span><span class="big-card-title">' + esc(s.title) + '</span>' +
      '<span class="big-card-desc">' + s.words.length + ' 个单词 · 记忆 ' + c + '/' + s.words.length +
      ' · 背诵 ' + r + '/' + s.words.length + ' · 造句 ' + m + '/' + (s.words.length * MK_PER_WORD) +
      '</span></span><span class="arrow">›</span></button>';
  }).join('') + '</div>';
}
function openSec(i) { cur.sec = cur.unit.sections[i]; renderSec(); }
function renderSec() {
  cur.mode = null;
  const s = cur.sec;
  setHead(s.title, s.words.length + ' 个单词 · 选一种练法', true);
  $('#view').innerHTML =
    '<div class="card-list">' +
    modeCard('card',   '🃏 记忆卡',  '看英文记拼写 → 翻面默写出来', s.words.length) +
    modeCard('recall', '🧠 背诵',    '只看中文，把英文写出来',       s.words.length) +
    modeCard('make',   '🖊️ 造句',    '先看 3 个例句，再自己造 3 句', s.words.length * MK_PER_WORD) +
    '</div>' +
    '<div class="hint-box" style="margin-top:16px">📋 <b>本节单词表</b>（先扫一眼，心里有底再开练）<br>' +
    s.words.map(w => esc(w.w) + '　<span style="color:#8a7fa8">' + esc(w.zh) + '</span>').join('<br>') + '</div>';
}
function modeCard(mode, title, desc, total) {
  const d = Math.min(secDone(cur.sec.id, mode), total);
  return '<button class="big-card" onclick="openMode(\'' + mode + '\')">' +
    '<span><span class="big-card-title">' + title + '</span>' +
    '<span class="big-card-desc">' + desc + '</span></span>' +
    '<span class="prog">' + d + '/' + total + '</span></button>';
}
function openMode(m) {
  cur.mode = m;
  if (m === 'card') startCard();
  else if (m === 'recall') startRecall();
  else startMake();
}

/* ========== ① 记忆卡：正面英文 → 翻面默写 ========== */
let cd = { i: 0, flipped: false, ok: 0 };
function startCard() {
  cd = { i: 0, flipped: false, ok: 0 };
  setHead('🃏 记忆卡 · ' + cur.sec.title, '正面记住样子，翻面凭记忆拼出来', true);
  cardRender();
}
function cardRender() {
  const ws = cur.sec.words;
  if (cd.i >= ws.length) {
    setProg(cur.sec.id, 'card', ws.length, ws.length);
    $('#view').innerHTML = '<div class="stage done-big"><div class="done-emoji">' + (cd.ok === ws.length ? '🏆' : '🃏') +
      '</div><div style="font-size:17px;margin-top:8px">这一节 ' + ws.length + ' 个单词过完了，拼对 ' + cd.ok + ' 个</div>' +
      '<div style="margin-top:14px"><button class="btn btn-main" onclick="startCard()">再来一轮</button>' +
      '<button class="btn btn-ghost" onclick="openMode(\'recall\')">去背诵 →</button></div></div>';
    return;
  }
  const w = ws[cd.i];
  if (!cd.flipped) {
    $('#view').innerHTML = '<div class="stage">' + pills(cd.i, ws.length) +
      '<div class="counter">第 ' + (cd.i + 1) + ' / ' + ws.length + ' 个</div>' +
      '<div class="word-big">' + esc(w.w) + ' <button class="btn-mini" onclick="speak(' + JSON.stringify(w.w) + ')">🔊</button></div>' +
      '<div class="ipa">' + esc(w.ipa) + '</div>' +
      '<div class="hint-box">先记住它的样子和读音，翻面要凭记忆把它拼出来。</div>' +
      '<button class="btn btn-main" onclick="cardFlip()">记住了，翻面 →</button></div>';
  } else {
    $('#view').innerHTML = '<div class="stage">' + pills(cd.i, ws.length) +
      '<div class="counter">第 ' + (cd.i + 1) + ' / ' + ws.length + ' 个</div>' +
      '<div class="pos-line">' + esc(w.pos) + '</div>' +
      '<div class="zh-big">' + esc(w.zh) + '</div>' +
      '<div class="eg">' + esc(maskWord(w.egs[0], w.w)) + '</div>' +
      '<div style="margin-top:12px"><input class="inp" id="cdIn" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="把这个单词拼出来"></div>' +
      '<button class="btn btn-main" onclick="cardCheck()">检查</button>' +
      '<div id="cdFb"></div></div>';
    const el = $('#cdIn'); if (el) { el.focus(); el.onkeydown = e => { if (e.key === 'Enter') cardCheck(); }; }
  }
}
function maskWord(sent, w) {
  const re = new RegExp('\\b' + String(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'ig');
  return String(sent).replace(re, '____');
}
function cardFlip() { cd.flipped = true; cardRender(); }
function cardCheck() {
  const w = cur.sec.words[cd.i], v = ($('#cdIn') || {}).value || '';
  const ok = normalize(v) === normalize(w.w);
  if (ok) cd.ok++; else addWrong(w, cur.sec, cur.unit);
  $('#cdFb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'bad') + '">' +
    (ok ? '🎉 拼对了！' : '💪 正确拼写是 <b>' + esc(w.w) + '</b>　（你写的是「' + esc(v || '（空）') + '」）<br>这个词已经放进错题本，等下可以再练一次。') +
    '</div><button class="btn btn-main" onclick="cardNext()">下一个 →</button>';
  setProg(cur.sec.id, 'card', cd.i + 1, cur.sec.words.length);
}
function cardNext() { cd.i++; cd.flipped = false; cardRender(); }
function pills(i, n) {
  let h = '<div class="pills">';
  for (let k = 0; k < n; k++) h += '<span class="pill ' + (k === i ? 'now' : (k < i ? 'ok' : '')) + '"></span>';
  return h + '</div>';
}

/* ========== ② 背诵：只看中文写英文 ==========
   ⚠️ 页首不能出现英文：节标题「Lesson 1-2　Excuse me!」里的课名本身就是答案
   （背 excuse 时抬头就看到 Excuse me），所以这一关只用「Lesson X-Y」这段。 */
function shortTitle(t) { return String(t).split('\u3000')[0].trim(); }

let rc = { i: 0, ok: 0 };
function startRecall() {
  rc = { i: 0, ok: 0 };
  setHead('🧠 背诵 · ' + shortTitle(cur.sec.title), '只看中文，把英文写出来', true);
  recallRender();
}
function recallRender() {
  const ws = cur.sec.words;
  if (rc.i >= ws.length) {
    setProg(cur.sec.id, 'recall', ws.length, ws.length);
    $('#view').innerHTML = '<div class="stage done-big"><div class="done-emoji">' + (rc.ok === ws.length ? '🏆' : '🧠') +
      '</div><div style="font-size:17px;margin-top:8px">背完 ' + ws.length + ' 个，写对 ' + rc.ok + ' 个</div>' +
      '<div style="margin-top:14px"><button class="btn btn-main" onclick="startRecall()">再来一轮</button>' +
      '<button class="btn btn-ghost" onclick="openMode(\'make\')">去造句 →</button></div></div>';
    return;
  }
  const w = ws[rc.i];
  $('#view').innerHTML = '<div class="stage">' + pills(rc.i, ws.length) +
    '<div class="counter">第 ' + (rc.i + 1) + ' / ' + ws.length + ' 个</div>' +
    '<div class="pos-line">' + esc(w.pos) + '</div>' +
    '<div class="zh-big">' + esc(maskWord(w.zh, w.w)) + '</div>' +
    '<div style="margin-top:14px"><input class="inp" id="rcIn" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="写出对应的英文单词"></div>' +
    '<button class="btn btn-main" onclick="recallCheck()">检查</button>' +
    '<button class="btn btn-ghost" onclick="recallHint()">给点提示</button>' +
    '<div id="rcFb"></div></div>';
  const el = $('#rcIn'); if (el) { el.focus(); el.onkeydown = e => { if (e.key === 'Enter') recallCheck(); }; }
}
function recallHint() {
  const w = cur.sec.words[rc.i];
  const head = w.w.slice(0, Math.max(1, Math.ceil(w.w.length / 3)));
  $('#rcFb').innerHTML = '<div class="fb tip">💡 开头是 <b>' + esc(head) + '</b>…，一共 ' + w.w.replace(/\s/g, '').length +
    ' 个字母<br>例句：' + esc(maskWord(w.egs[0], w.w)) + '</div>';
}
function recallCheck() {
  const w = cur.sec.words[rc.i], v = ($('#rcIn') || {}).value || '';
  const ok = normalize(v) === normalize(w.w);
  if (ok) rc.ok++; else addWrong(w, cur.sec, cur.unit);
  $('#rcFb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'bad') + '">' +
    (ok ? '🎉 写对了！<br><span style="font-size:13.5px">' + esc(w.egs[0]) + '</span>'
        : '💪 应该是 <b>' + esc(w.w) + '</b> ' + esc(w.ipa) + '<br>（你写的是「' + esc(v || '（空）') + '」）<br>' +
          '<span style="font-size:13.5px">看一遍例句再记：' + esc(w.egs[0]) + '</span>') +
    '</div><button class="btn btn-main" onclick="recallNext()">下一个 →</button>';
  setProg(cur.sec.id, 'recall', rc.i + 1, cur.sec.words.length);
}
function recallNext() { rc.i++; recallRender(); }

/* ========== ③ 造句：先看 3 例句，再自己造 3 句 ========== */
let mk = { i: 0, j: 0, sents: [], ok: 0 };
function startMake() {
  mk = { i: 0, j: 0, sents: [], ok: 0 };
  setHead('🖊️ 造句 · ' + cur.sec.title, '每个词造 3 句不一样的话，每句至少 5 个单词', true);
  makeRender();
}
function makeRender() {
  const ws = cur.sec.words, total = ws.length * MK_PER_WORD;
  if (mk.i >= ws.length) {
    setProg(cur.sec.id, 'make', total, total);
    $('#view').innerHTML = '<div class="stage done-big"><div class="done-emoji">' + (mk.ok === total ? '🏆' : '🖊️') +
      '</div><div style="font-size:17px;margin-top:8px">' + ws.length + ' 个词、每个 3 句，一共造了 ' + mk.ok + ' / ' + total + ' 句</div>' +
      '<div style="margin-top:14px"><button class="btn btn-main" onclick="startMake()">再来一轮</button></div></div>';
    return;
  }
  const w = ws[mk.i], mine = (mk.sents[mk.i] || []).filter(Boolean);
  $('#view').innerHTML = '<div class="stage">' +
    '<div class="counter">第 ' + (mk.i + 1) + ' / ' + ws.length + ' 个词　·　第 ' + (mk.j + 1) + ' / ' + MK_PER_WORD + ' 句</div>' +
    '<div class="word-big" style="font-size:24px">' + esc(w.w) +
      ' <button class="btn-mini" onclick="speak(' + JSON.stringify(w.w) + ')">🔊</button></div>' +
    '<div class="pos-line" style="margin-top:4px">' + esc(w.pos) + '　' + esc(w.zh) + '</div>' +
    '<div style="margin-top:12px;font-weight:600;font-size:14px">📖 先看看别人怎么用</div>' +
    w.egs.map((e, k) => '<div class="eg">' + (k + 1) + '. ' + esc(e) +
      ' <button class="btn-mini" onclick="speak(' + JSON.stringify(e) + ')">🔊</button></div>').join('') +
    (mine.length ? '<div style="margin-top:12px;font-weight:600;font-size:14px">✍️ 你已经造的</div>' +
      mine.map((s, k) => '<div class="mine">' + (k + 1) + '. ' + esc(s) + '</div>').join('') : '') +
    '<div class="hint-box">✏️ 这句要<b>至少 5 个单词</b>、要用上「<b>' + esc(w.w) + '</b>」，而且<b>不能和自己前面那几句重复</b>。<br>写完按「检查」，系统会<b>直接告诉你哪里错了、要怎么改</b>。</div>' +
    '<textarea class="inp" id="mkIn" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="用这个词造第 ' + (mk.j + 1) + ' 句你自己的话…"></textarea>' +
    '<button class="btn btn-main" onclick="makeCheck()">✨ 检查我的句子</button>' +
    (mk.i + mk.j > 0 ? '<button class="btn btn-ghost" onclick="makePrev()">← 上一句</button>' : '') +
    '<div id="mkFb"></div></div>';
}
function makeCheck() {
  const w = cur.sec.words[mk.i], s = (($('#mkIn') || {}).value || '').trim();
  const bad = h => { $('#mkFb').innerHTML = '<div class="fb bad">' + h + '</div>'; };
  if (!s) { bad('先写一句话再检查 🙂'); return; }
  const nw = wordCount(s);
  if (nw < MK_MIN_WORDS) {
    bad('句子要有<b>至少 ' + MK_MIN_WORDS + ' 个单词</b>，现在只有 ' + nw + ' 个。<br>' +
        '试试加上「什么时候」「在哪里」「和谁」，句子就长了：<br>' +
        '<span style="font-size:13px">例：I read. → I read a book <b>at home every evening</b>.</span>'); return;
  }
  if (!hasWord(s, w.w)) {
    bad('这句话里没有用上「<b>' + esc(w.w) + '</b>」，这一关就是要练这个词。<br>' +
        '<span style="font-size:13px">（复数 ' + esc(w.w) + 's、过去式、加 ing 这些变形都算数）</span>'); return;
  }
  const prev = (mk.sents[mk.i] || []).filter((x, k) => x && k !== mk.j);
  const dup = prev.find(p => tooSimilar(p, s));
  if (dup) {
    bad('这句和你前面造的「' + esc(dup) + '」太像了。<br>换个<b>角度</b>再想一句：换人（I→My brother）、换时间（今天→昨天）、换地方，或改成问句/否定句 💡'); return;
  }
  /* 三道硬检查都过了 → 真正做语法判分（孩子没有判断能力，必须由系统给结论） */
  window.__mkS = s;
  const issues = checkGrammar(s);
  const errs = issues.filter(x => x.level === 'error');
  const warns = issues.filter(x => x.level === 'warn');
  const list = arr => '<ul class="chk">' + arr.map(x =>
      '<li>' + (x.level === 'error' ? '❌ ' : '💡 ') + x.why +
      '<br><span style="color:#c0392b;font-size:13.5px">→ ' + x.fix + '</span></li>').join('') + '</ul>';

  if (errs.length) {
    $('#mkFb').innerHTML =
      '<div class="fb bad">这句有 <b>' + errs.length + '</b> 个地方要改：' +
        '<div class="eg" style="margin:8px 0;background:#fff">' + esc(s) + '</div>' +
        list(errs) + (warns.length ? list(warns) : '') +
        '<div style="margin-top:8px;font-size:13.5px">📖 改完再按一次「检查」。也可以看看上面 3 个例句是怎么写的。</div>' +
      '</div>' +
      '<button class="btn btn-main" onclick="makeCheck()">改好了，再检查一次</button>' +
      '<button class="btn btn-ghost" onclick="makeGiveUp()">这句先跳过（记进错题本）</button>';
    return;
  }
  $('#mkFb').innerHTML =
    '<div class="fb ok">🎉 <b>检查通过！</b>这句在拼写、大小写、标点、主谓一致、时态标记、冠词这些地方都没问题。' +
      (warns.length ? '<div style="margin-top:8px">还有一点小提醒（不算错）：</div>' + list(warns) : '') +
    '</div>' +
    '<button class="btn btn-main" onclick="makeAccept()">收下这一句，写下一句 →</button>';
}
function makePass(ok) {
  const w = cur.sec.words[mk.i], s = window.__mkS || '';
  (mk.sents[mk.i] = mk.sents[mk.i] || [])[mk.j] = s;
  if (ok) mk.ok++; else addWrong(w, cur.sec, cur.unit);
  const total = cur.sec.words.length * MK_PER_WORD;
  const doneN = mk.i * MK_PER_WORD + mk.j + 1;
  setProg(cur.sec.id, 'make', doneN, total);
  /* 导航交给调用者（makeAccept / makeGiveUp），这里只记账 */
}
/* 一次点击就前进——「收下」之后还要再点一次「下一句」是多余操作 */
function makeAccept()  { makePass(true);  makeNext(); }
function makeGiveUp()  { makePass(false); makeNext(); }
function makeNext() { if (mk.j < MK_PER_WORD - 1) mk.j++; else { mk.j = 0; mk.i++; } makeRender(); }
function makePrev() { if (mk.j > 0) mk.j--; else if (mk.i > 0) { mk.i--; mk.j = MK_PER_WORD - 1; } makeRender(); }

renderHome();
</script>
<script src="assets/sync.js"></script>
