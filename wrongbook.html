<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>错题本</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    color: #222;
}
.page { max-width: 680px; margin: 0 auto; padding: 20px 16px 60px; }
.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.back-link { color: #666; text-decoration: none; font-size: 14px; }
h1 { font-size: 20px; margin: 6px 0 4px; }
.subtitle { color: #777; font-size: 13px; margin: 0 0 18px; }
.toolbar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.btn {
    border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px;
    cursor: pointer; background: #3a6df0; color: white;
}
.btn.secondary { background: #eee; color: #444; }
.btn.danger { background: #fdeaea; color: #d13a3a; }
.empty-box {
    background: white; border-radius: 14px; padding: 40px 20px; text-align: center;
    color: #999; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.subject-group { margin-bottom: 22px; }
.subject-header {
    font-size: 15px; font-weight: 700; margin: 0 0 10px 2px;
    display: flex; align-items: center; gap: 6px;
}
.subject-header .count { font-weight: 400; color: #888; font-size: 13px; }
.wrong-card {
    background: white; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.wrong-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.wrong-point { font-size: 12px; color: #3a6df0; background: #eef2fe; padding: 2px 8px; border-radius: 6px; }
.wrong-count { font-size: 12px; color: #d13a3a; }
.wrong-stem { font-size: 14.5px; line-height: 1.5; margin-bottom: 8px; }
.wrong-answers { font-size: 13px; line-height: 1.6; }
.wrong-answers .wrong { color: #d13a3a; }
.wrong-answers .correct { color: #1a9c4a; }
.wrong-explain { font-size: 13px; color: #555; margin-top: 6px; padding-top: 6px; border-top: 1px dashed #eee; line-height: 1.6; }
.remove-btn {
    border: none; background: none; color: #bbb; font-size: 18px; cursor: pointer; padding: 0 4px;
}
.chapter-tag { font-size: 12px; color: #999; margin-left: 6px; }
.toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.8); color: white; padding: 10px 18px; border-radius: 8px;
    font-size: 14px; display: none;
}
</style>
</head>
<body>
<div class="page">
<div class="top-bar">
    <a class="back-link" href="index.html">‹ 返回科目选择</a>
</div>
<h1>📓 错题本</h1>
<p class="subtitle">做题交卷后自动收集，只保存在这台设备的浏览器里；反复做错的题会一直保留提醒复习</p>

<div id="mqSyncCard"></div>

<div class="toolbar">
    <button class="btn" id="copy-btn">📋 复制错题清单</button>
    <button class="btn secondary" id="sort-btn">按错误次数排序</button>
    <button class="btn danger" id="clear-btn">🗑 清空错题本</button>
</div>

<div id="content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY = 'mathquiz_wrongbook_v1';
const SUBJECT_LABEL = { math: '🔢 数学', geo: '🌍 地理', bio: '🧬 生物' };
let sortByCount = false;

function loadBook() {
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; }
}

function saveBook(book) {
    localStorage.setItem(KEY, JSON.stringify(book));
    localStorage.setItem('mathquiz_updatedAt', String(Date.now()));
    if (window.MQSYNC) window.MQSYNC.schedule();
}

function render() {
    const book = loadBook();
    const content = document.getElementById('content');
    content.innerHTML = '';

    if (!book.length) {
        content.innerHTML = '<div class="empty-box">还没有错题记录<br>做完练习交卷后，答错的题会自动出现在这里</div>';
        return;
    }

    const bySubject = {};
    book.forEach(item => {
        if (!bySubject[item.subject]) bySubject[item.subject] = [];
        bySubject[item.subject].push(item);
    });

    ['math', 'geo', 'bio'].forEach(subject => {
        const items = bySubject[subject];
        if (!items || !items.length) return;

        if (sortByCount) {
            items.sort((a, b) => b.wrongCount - a.wrongCount);
        } else {
            items.sort((a, b) => (b.lastWrongAt || '').localeCompare(a.lastWrongAt || ''));
        }

        const group = document.createElement('div');
        group.className = 'subject-group';
        group.innerHTML = `<div class="subject-header">${SUBJECT_LABEL[subject] || subject}<span class="count">共 ${items.length} 道错题</span></div>`;

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'wrong-card';
            const chapterInfo = [item.chapterTitle, item.sectionTitle].filter(Boolean).join(' · ');
            card.innerHTML = `
                <div class="wrong-meta">
                    <span><span class="wrong-point">${item.point}</span><span class="chapter-tag">${chapterInfo}</span></span>
                    <span>
                        <span class="wrong-count">错了${item.wrongCount}次</span>
                        <button class="remove-btn" data-key="${encodeURIComponent(item.key)}" title="移除这道错题">✕</button>
                    </span>
                </div>
                <div class="wrong-stem">${item.stem}</div>
                <div class="wrong-answers">
                    <span class="wrong">你的答案：${item.userAnswer}</span> ｜
                    <span class="correct">正确答案：${item.correctAnswer}</span>
                </div>
                <div class="wrong-explain">${item.explain}</div>
            `;
            group.appendChild(card);
        });

        content.appendChild(group);
    });

    content.querySelectorAll('.remove-btn').forEach(btn => {
        btn.onclick = () => {
            const key = decodeURIComponent(btn.getAttribute('data-key'));
            const book = loadBook().filter(b => b.key !== key);
            saveBook(book);
            render();
        };
    });
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 1800);
}

document.getElementById('sort-btn').onclick = () => {
    sortByCount = !sortByCount;
    document.getElementById('sort-btn').textContent = sortByCount ? '按最近错误排序' : '按错误次数排序';
    render();
};

document.getElementById('clear-btn').onclick = () => {
    if (!confirm('确定要清空全部错题记录吗？此操作无法恢复。')) return;
    localStorage.removeItem(KEY);
    localStorage.setItem('mathquiz_updatedAt', String(Date.now()));
    if (window.MQSYNC) window.MQSYNC.schedule();
    render();
};

document.getElementById('copy-btn').onclick = () => {
    const book = loadBook();
    if (!book.length) { showToast('还没有错题可复制'); return; }
    let text = '【错题清单】\n';
    ['math', 'geo', 'bio'].forEach(subject => {
        const items = book.filter(b => b.subject === subject);
        if (!items.length) return;
        text += `\n== ${SUBJECT_LABEL[subject] || subject} ==\n`;
        items.forEach(item => {
            text += `\n[${item.point}]（错了${item.wrongCount}次）\n${item.stem}\n你的答案：${item.userAnswer}　正确答案：${item.correctAnswer}\n解析：${item.explain}\n`;
        });
    });
    navigator.clipboard.writeText(text).then(() => {
        showToast('已复制到剪贴板');
    }).catch(() => {
        showToast('复制失败，请手动截图保存');
    });
};

render();
window.MQSYNC_ONRESTORE = function () { render(); };
</script>
<script src="assets/sync.js"></script>
</body>
</html>
